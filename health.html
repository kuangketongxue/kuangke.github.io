<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日健康评分 - 狂客·银河</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00c9ff 0%, #92fe9d 100%);
            --warning-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.75);
            --shadow-md: 0 8px 25px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2d3561 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 12px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.6em;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .health-container {
            max-width: 1000px;
            margin: 100px auto 50px;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title h1 {
            font-size: 3em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .page-title p {
            font-size: 1.2em;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* ===== 主评分卡片 ===== */
        .score-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 50px;
            margin-bottom: 40px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .score-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .score-display {
            position: relative;
            z-index: 1;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-circle svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .score-circle-bg {
            fill: none;
            stroke: var(--glass-border);
            stroke-width: 8;
        }

        .score-circle-progress {
            fill: none;
            stroke: url(#scoreGradient);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .score-text {
            position: absolute;
            font-size: 3.5em;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            font-size: 1.5em;
            color: var(--text-secondary);
            margin-top: 30px;
            font-weight: 500;
        }

        .score-date {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        /* ===== 指标网格 ===== */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: var(--shadow-md);
        }

        .metric-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .metric-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1em;
        }

        .metric-icon {
            font-size: 1.5em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metric-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-good {
            background: rgba(0, 201, 255, 0.2);
            color: #00c9ff;
        }

        .status-warning {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-danger {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .metric-bar {
            width: 100%;
            height: 8px;
            background: var(--glass-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .metric-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .metric-value {
            font-size: 0.95em;
            color: var(--text-secondary);
            text-align: right;
        }

        /* ===== 建议区域 ===== */
        .suggestions-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-md);
        }

        .suggestions-title {
            font-size: 1.8em;
            margin-bottom: 25px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .suggestion-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .suggestion-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }

        .suggestion-item.priority {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }

        .suggestion-item.tip {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }

        .suggestion-text {
            font-size: 1.05em;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .suggestion-detail {
            font-size: 0.95em;
            color: var(--text-secondary);
        }

        /* ===== 分类标签 ===== */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            border: 2px solid var(--glass-border);
            background: transparent;
            color: var(--text-primary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95em;
        }

        .tab.active {
            background: var(--primary-gradient);
            border-color: var(--primary-gradient);
            color: white;
        }

        .tab:hover {
            border-color: #667eea;
        }

        /* ===== 响应式设计 ===== */
        @media (max-width: 768px) {
            .health-container {
                padding: 20px 15px;
                margin: 80px auto 30px;
            }

            .page-title h1 {
                font-size: 2.2em;
            }

            .score-card {
                padding: 30px 20px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .suggestions-panel {
                padding: 20px;
            }

            .score-circle {
                width: 150px;
                height: 150px;
            }

            .score-text {
                font-size: 2.5em;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: var(--text-secondary);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--glass-border);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>

    <header class="header">
        <div class="container">
            <h1 class="logo">📊 每日健康评分</h1>
        </div>
    </header>

    <div class="health-container">
        <div class="page-title">
            <h1>健康状况评估</h1>
            <p>基于医疗数据的智能健康管理系统</p>
        </div>

        <div id="mainContent">
            <div class="loading">
                <div class="spinner"></div>
                正在加载健康数据...
            </div>
        </div>
    </div>

    <script>
        // ===== Canvas 星空背景 =====
        class Starfield {
            constructor() {
                this.canvas = document.getElementById('starfield');
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.resize();
                this.init();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                const starCount = Math.floor((this.canvas.width * this.canvas.height) / 3000);
                for (let i = 0; i < starCount; i++) {
                    this.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: Math.random() * 2,
                        opacity: Math.random(),
                        twinkleSpeed: Math.random() * 0.05
                    });
                }
                this.animate();
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.stars.forEach(star => {
                    star.opacity += star.twinkleSpeed;
                    if (star.opacity > 1 || star.opacity < 0) {
                        star.twinkleSpeed = -star.twinkleSpeed;
                    }
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        // ===== 健康评分引擎 =====
        class HealthScoreEngine {
            constructor(data) {
                this.data = data;
                this.scores = {};
                this.suggestions = [];
                this.calculate();
            }

            calculate() {
                // 计算各维度评分
                this.scores.blood = this.calculateBloodWorkScore();
                this.scores.nutrition = this.calculateNutritionScore();
                this.scores.lifestyle = this.calculateLifestyleScore();
                this.scores.vision = this.calculateVisionScore();
                this.scores.overall = this.calculateOverallScore();
                this.generateSuggestions();
            }

            calculateBloodWorkScore() {
                let score = 100;
                const today = this.data.today;

                // 血糖检查
                if (today.glucose > 100 || today.glucose < 70) score -= 10;
                // 血压检查
                if (today.bloodPressure > 130 || today.diastolic > 85) score -= 15;
                // 血脂检查
                if (today.cholesterol > 200) score -= 8;
                if (today.ldl > 130) score -= 8;
                if (today.hdl < 40) score -= 10;
                if (today.triglycerides > 150) score -= 8;
                // 肝功能
                if (today.alt > 56 || today.ast > 40) score -= 10;
                // 肾功能
                if (today.creatinine > 1.3) score -= 10;

                return Math.max(0, score);
            }

            calculateNutritionScore() {
                let score = 100;
                const today = this.data.today;

                // 蛋白质（成人：0.8g/kg体重，约需50-60g）
                if (today.protein < 45 || today.protein > 100) score -= 10;
                // 纤维素（建议25-35g）
                if (today.fiber < 20 || today.fiber > 40) score -= 8;
                // 水摄入（建议2000ml）
                if (today.waterIntake < 1500 || today.waterIntake > 3000) score -= 10;
                // 维生素C
                if (today.vitamin_c < 75) score -= 8;
                // 铁摄入
                if (today.iron < 8) score -= 8;
                // 钙摄入（建议800-1000mg）
                if (today.calcium < 700) score -= 10;
                // 钠摄入（建议<2300mg）
                if (today.sodium > 2500) score -= 8;

                return Math.max(0, score);
            }

            calculateLifestyleScore() {
                let score = 100;
                const today = this.data.today;

                // 睡眠（建议7-9小时）
                if (today.sleepHours < 6 || today.sleepHours > 10) score -= 15;
                // 运动（建议150分钟/周）
                if (today.exerciseMinutes < 30) score -= 20;
                else if (today.exerciseMinutes > 90) score -= 5;
                // 步数（建议8000-10000）
                if (today.steps < 5000) score -= 15;
                else if (today.steps > 15000) score -= 5;
                // 热量（根据个人）
                if (today.calories < 1500 || today.calories > 2500) score -= 10;
                // 吸烟和酒精
                if (today.smoking) score -= 25;
                if (today.alcohol > 25) score -= 15; // 男性：25g/天，女性：15g/天

                return Math.max(0, score);
            }

            calculateVisionScore() {
                let score = 100;
                const today = this.data.today;

                // 视力（正常为1.0）
                if (today.vision_left < 0.8 || today.vision_right < 0.8) score -= 15;
                // 眼压（正常10-21 mmHg）
                if (today.intraocular_pressure > 21) score -= 10;

                return Math.max(0, score);
            }

            calculateOverallScore() {
                const weights = {
                    blood: 0.35,
                    nutrition: 0.25,
                    lifestyle: 0.25,
                    vision: 0.15
                };

                return Math.round(
                    this.scores.blood * weights.blood +
                    this.scores.nutrition * weights.nutrition +
                    this.scores.lifestyle * weights.lifestyle +
                    this.scores.vision * weights.vision
                );
            }

            generateSuggestions() {
                const today = this.data.today;

                // 血糖建议
                if (today.glucose > 100) {
                    this.suggestions.push({
                        category: '血糖',
                        priority: 'high',
                        text: '血糖水平偏高',
                        detail: '建议减少精制糖和高GI食物的摄入，增加运动量，定期检查血糖'
                    });
                }

                // 血压建议
                if (today.bloodPressure > 130) {
                    this.suggestions.push({
                        category: '血压',
                        priority: 'high',
                        text: '血压水平偏高',
                        detail: '建议减少钠摄入，增加有氧运动，保持心态平和，定期监测血压'
                    });
                }

                // 血脂建议
                if (today.cholesterol > 200 || today.ldl > 130) {
                    this.suggestions.push({
                        category: '血脂',
                        priority: 'medium',
                        text: '血脂水平偏高',
                        detail: '建议减少饱和脂肪摄入，增加纤维素，多吃鱼类和坚果，增加运动量'
                    });
                }

                // 睡眠建议
                if (today.sleepHours < 7) {
                    this.suggestions.push({
                        category: '睡眠',
                        priority: 'high',
                        text: '睡眠时间不足',
                        detail: '建议保证7-9小时睡眠，建立规律的作息，睡前30分钟避免使用电子设备'
                    });
                }

                // 运动建议
                if (today.exerciseMinutes < 30 || today.steps < 8000) {
                    this.suggestions.push({
                        category: '运动',
                        priority: 'high',
                        text: '活动量不足',
                        detail: '建议每天至少30分钟中等强度运动，目标8000-10000步/天，选择适合的运动方式'
                    });
                }

                // 饮水建议
                if (today.waterIntake < 1500) {
                    this.suggestions.push({
                        category: '饮水',
                        priority: 'medium',
                        text: '饮水量不足',
                        detail: '建议每天喝1.5-2L白水，分次饮用，早上、运动前后和睡前注意补水'
                    });
                }

                // 营养建议
                if (today.fiber < 20) {
                    this.suggestions.push({
                        category: '饮食',
                        priority: 'medium',
                        text: '膳食纤维不足',
                        detail: '建议增加全谷物、蔬菜和水果的摄入，目标25-35g纤维/天'
                    });
                }

                // 正面建议
                if (this.scores.overall >= 80) {
                    this.suggestions.unshift({
                        category: '表现',
                        priority: 'tip',
                        text: '💪 今日表现优异',
                        detail: '保持当前的健康习惯，继续努力！'
                    });
                }

                // 按优先级排序
                this.suggestions.sort((a, b) => {
                    const priorityOrder = { high: 0, medium: 1, tip: 2, low: 3 };
                    return priorityOrder[a.priority] - priorityOrder[b.priority];
                });
            }

            getGrade() {
                const score = this.scores.overall;
                if (score >= 90) return 'S';
                if (score >= 80) return 'A';
                if (score >= 70) return 'B';
                if (score >= 60) return 'C';
                return 'D';
            }
        }

        // ===== 渲染引擎 =====
        class HealthDashboardRenderer {
            constructor(data, engine) {
                this.data = data;
                this.engine = engine;
            }

            render() {
                const html = `
                    <!-- 主评分卡片 -->
                    <div class="score-card">
                        <div class="score-display">
                            <div class="score-circle">
                                <svg>
                                    <defs>
                                        <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                                        </linearGradient>
                                    </defs>
                                    <circle class="score-circle-bg" cx="100" cy="100" r="90"></circle>
                                    <circle class="score-circle-progress" cx="100" cy="100" r="90"
                                            stroke-dasharray="565.48" stroke-dashoffset="0"></circle>
                                </svg>
                                <div class="score-text">${this.engine.getGrade()}</div>
                            </div>
                            <div style="position: relative; z-index: 1;">
                                <div style="font-size: 2.5em; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                                    ${this.engine.scores.overall}/100
                                </div>
                                <div class="score-label">今日健康评分</div>
                                <div class="score-date">更新于：${this.data.today.date}</div>
                            </div>
                        </div>
                    </div>

                    <!-- 维度指标 -->
                    <div class="metrics-grid">
                        ${this.renderMetricCard('血液指标', 'fas fa-tint', this.engine.scores.blood, '基于血糖、血压、血脂等')}
                        ${this.renderMetricCard('营养摄入', 'fas fa-apple-alt', this.engine.scores.nutrition, '蛋白质、纤维素、矿物质')}
                        ${this.renderMetricCard('生活方式', 'fas fa-heartbeat', this.engine.scores.lifestyle, '睡眠、运动、饮水')}
                        ${this.renderMetricCard('视力健康', 'fas fa-eye', this.engine.scores.vision, '视力和眼压监测')}
                    </div>

                    <!-- 建议区域 -->
                    <div class="suggestions-panel">
                        <h2 class="suggestions-title">
                            <i class="fas fa-lightbulb"></i>
                            <span>个性化健康建议</span>
                        </h2>
                        ${this.renderSuggestions()}
                    </div>

                    <!-- 详细指标 -->
                    <div style="background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 35px; margin-bottom: 40px;">
                        <h2 style="font-size: 1.6em; margin-bottom: 25px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700;">
                            <i class="fas fa-chart-bar"></i> 详细指标概览
                        </h2>
                        ${this.renderDetailedMetrics()}
                    </div>
                `;

                document.getElementById('mainContent').innerHTML = html;
                this.animateScoreCircle();
            }

            renderMetricCard(title, icon, score, description) {
                const status = score >= 80 ? 'good' : score >= 60 ? 'warning' : 'danger';
                const statusText = score >= 80 ? '优秀' : score >= 60 ? '中等' : '需改进';

                return `
                    <div class="metric-card">
                        <div class="metric-header">
                            <div class="metric-title">
                                <i class="metric-icon ${icon}"></i>
                                <span>${title}</span>
                            </div>
                            <div class="metric-status status-${status}">${statusText}</div>
                        </div>
                        <div class="metric-bar">
                            <div class="metric-bar-fill" style="width: ${score}%"></div>
                        </div>
                        <div style="text-align: center; margin-bottom: 10px;">
                            <span style="font-size: 1.8em; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                                ${Math.round(score)}
                            </span>
                        </div>
                        <div class="metric-value">${description}</div>
                    </div>
                `;
            }

            renderSuggestions() {
                return this.engine.suggestions.map(s => `
                    <div class="suggestion-item ${s.priority}">
                        <div class="suggestion-text">${s.text}</div>
                        <div class="suggestion-detail">${s.detail}</div>
                    </div>
                `).join('');
            }

            renderDetailedMetrics() {
                const today = this.data.today;
                const metrics = [
                    { label: '血糖', value: `${today.glucose} mg/dL`, normal: '70-100' },
                    { label: '总胆固醇', value: `${today.cholesterol} mg/dL`, normal: '<200' },
                    { label: 'LDL', value: `${today.ldl} mg/dL`, normal: '<130' },
                    { label: 'HDL', value: `${today.hdl} mg/dL`, normal: '>40' },
                    { label: '甘油三酯', value: `${today.triglycerides} mg/dL`, normal: '<150' },
                    { label: '血压', value: `${today.bloodPressure}`, normal: '120/80' },
                    { label: '睡眠', value: `${today.sleepHours}小时`, normal: '7-9小时' },
                    { label: '运动', value: `${today.exerciseMinutes}分钟`, normal: '30+分钟' },
                    { label: '步数', value: `${today.steps}步`, normal: '8000-10000' },
                    { label: '蛋白质', value: `${today.protein}g`, normal: '45-60g' },
                    { label: '纤维素', value: `${today.fiber}g`, normal: '25-35g' },
                    { label: '饮水量', value: `${today.waterIntake}ml`, normal: '1500-2000' }
                ];

                return `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${metrics.map(m => `
                            <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border-left: 3px solid #667eea;">
                                <div style="font-size: 0.9em; color: var(--text-secondary); margin-bottom: 5px;">${m.label}</div>
                                <div style="font-size: 1.3em; font-weight: 700; margin-bottom: 5px;">${m.value}</div>
                                <div style="font-size: 0.85em; color: #999;">正常: ${m.normal}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            animateScoreCircle() {
                const circle = document.querySelector('.score-circle-progress');
                const circumference = 2 * Math.PI * 90;
                const offset = circumference - (this.engine.scores.overall / 100) * circumference;

                setTimeout(() => {
                    circle.style.strokeDashoffset = offset;
                }, 100);
            }
        }

        // ===== 主程序 =====
        async function init() {
            try {
                // 从 GitHub Pages 读取数据
                const response = await fetch('_data/health-data.json');
                if (!response.ok) throw new Error('无法加载数据文件');

                const data = await response.json();
                const engine = new HealthScoreEngine(data);
                const renderer = new HealthDashboardRenderer(data, engine);

                renderer.render();
            } catch (error) {
                console.error('错误:', error);
                document.getElementById('mainContent').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ff6b6b;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3em; margin-bottom: 20px;"></i>
                        <p>无法加载健康数据</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">请确保 _data/health-data.json 文件存在于 GitHub Pages 仓库</p>
                        <p style="font-size: 0.85em; color: #999; margin-top: 20px;">${error.message}</p>
                    </div>
                `;
            }
        }

        new Starfield();
        window.addEventListener('load', init);
    </script>
</body>
</html>
