<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日健康自检 - 狂客·银河</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00c9ff 0%, #92fe9d 100%);
            --warning-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.75);
            --shadow-md: 0 8px 25px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.2);
        }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2d3561 100%);
            color: var(--text-primary);
        }
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 15px 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.6em;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            padding: 10px 20px;
            background: transparent;
            border: 2px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9em;
        }
        .nav-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
        }
        .nav-btn:hover {
            border-color: #667eea;
        }
        .health-container {
            max-width: 1100px;
            margin: 100px auto 50px;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-title h1 {
            font-size: 2.8em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-weight: 800;
        }
        
        /* 数据录入表单样式 */
        .input-form {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
        }
        .form-section {
            margin-bottom: 35px;
        }
        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--glass-border);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-label {
            font-size: 0.95em;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-label .hint {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 5px;
        }
        .form-input, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
        }
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .form-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .form-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .form-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            border: none;
        }
        .slider-value {
            min-width: 40px;
            text-align: center;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1em;
        }
        .submit-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            width: 100%;
            margin-top: 20px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        
        /* 原有样式保持不变 */
        .score-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .score-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .score-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .score-value {
            font-size: 2.5em;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
        }
        .score-label {
            font-size: 1em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .content-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
        }
        .panel-title {
            font-size: 1.6em;
            margin-bottom: 25px;
            color: var(--text-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .metric-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .metric-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            border-left: 3px solid #667eea;
            transition: all 0.3s ease;
        }
        .metric-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .metric-label {
            font-size: 0.95em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .metric-value {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text-primary);
        }
        .suggestions-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px;
            box-shadow: var(--shadow-md);
        }
        .suggestions-title {
            font-size: 1.8em;
            margin-bottom: 25px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .suggestion-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .suggestion-item.priority {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }
        .suggestion-item.tip {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }
        .suggestion-text {
            font-size: 1.05em;
            line-height: 1.6;
            color: var(--text-primary);
        }
        .hidden {
            display: none !important;
        }
        
        .alert {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .health-container {
                padding: 20px 15px;
                margin: 80px auto 30px;
            }
            .page-title h1 {
                font-size: 2em;
            }
            .score-section {
                grid-template-columns: 1fr;
            }
            .metric-row {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">📋 每日健康自检</h1>
                <div class="nav-buttons">
                    <button class="nav-btn active" onclick="switchView('input')">
                        <i class="fas fa-edit"></i> 数据录入
                    </button>
                    <button class="nav-btn" onclick="switchView('report')">
                        <i class="fas fa-chart-line"></i> 健康报告
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <div class="health-container">
        <!-- 数据录入视图 -->
        <div id="inputView">
            <div class="page-title">
                <h1>健康数据录入</h1>
                <p>请输入今日的健康数据，系统将自动生成健康评估报告</p>
            </div>
            
            <form id="healthForm" class="input-form">
                <!-- 基础信息 -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-user"></i> 基础信息
                    </h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">日期</label>
                            <input type="date" class="form-input" id="date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">年龄</label>
                            <input type="number" class="form-input" id="age" placeholder="例如: 25" min="1" max="120">
                        </div>
                        <div class="form-group">
                            <label class="form-label">性别</label>
                            <select class="form-select" id="gender">
                                <option value="M">男</option>
                                <option value="F">女</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 睡眠 -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-bed"></i> 睡眠质量
                    </h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">睡眠时长 <span class="hint">(建议7-9小时)</span></label>
                            <input type="number" class="form-input" id="sleepHours" placeholder="例如: 7.5" step="0.5" min="0" max="24">
                        </div>
                        <div class="form-group">
                            <label class="form-label">入睡时间</label>
                            <input type="time" class="form-input" id="fallAsleepTime">
                        </div>
                        <div class="form-group">
                            <label class="form-label">起床时间</label>
                            <input type="time" class="form-input" id="wakeUpTime">
                        </div>
                        <div class="form-group">
                            <label class="form-label">夜间醒来次数</label>
                            <input type="number" class="form-input" id="nightWakeups" placeholder="例如: 1" min="0">
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">睡眠质量评分 <span class="hint">(0=很差, 10=很好)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="sleepQuality" min="0" max="10" value="7" oninput="updateSliderValue(this, 'sleepQualityValue')">
                            <span class="slider-value" id="sleepQualityValue">7</span>
                        </div>
                    </div>
                </div>

                <!-- 运动 -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-running"></i> 运动情况
                    </h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">运动时长 <span class="hint">(分钟，建议30-60)</span></label>
                            <input type="number" class="form-input" id="exerciseMinutes" placeholder="例如: 45" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">步数 <span class="hint">(建议8000-10000)</span></label>
                            <input type="number" class="form-input" id="steps" placeholder="例如: 8500" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">运动强度</label>
                            <select class="form-select" id="exerciseIntensity">
                                <option value="light">轻度（散步）</option>
                                <option value="moderate" selected>中等（慢跑、快走）</option>
                                <option value="intense">高强度（跑步、游泳）</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">运动类型</label>
                            <input type="text" class="form-input" id="exerciseType" placeholder="例如: 跑步、瑜伽">
                        </div>
                    </div>
                </div>

                <!-- 饮食 -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-utensils"></i> 饮食营养
                    </h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">饮水量 <span class="hint">(ml，建议1500-2000)</span></label>
                            <input type="number" class="form-input" id="waterIntake" placeholder="例如: 2000" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">蔬菜摄入 <span class="hint">(克，建议300+)</span></label>
                            <input type="number" class="form-input" id="vegetables" placeholder="例如: 300" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">水果摄入 <span class="hint">(克，建议200+)</span></label>
                            <input type="number" class="form-input" id="fruits" placeholder="例如: 200" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">主食摄入 <span class="hint">(克)</span></label>
                            <input type="number" class="form-input" id="mainCereals" placeholder="例如: 250" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">垃圾食品次数</label>
                            <input type="number" class="form-input" id="junkFood" placeholder="例如: 0" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">咖啡因摄入 <span class="hint">(杯数)</span></label>
                            <input type="number" class="form-input" id="caffeine" placeholder="例如: 2" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">酒精摄入 <span class="hint">(杯数)</span></label>
                            <input type="number" class="form-input" id="alcohol" placeholder="例如: 0" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">蛋白质来源</label>
                            <input type="text" class="form-input" id="protein" placeholder="例如: 鸡蛋、鱼、豆制品">
                        </div>
                    </div>
                </div>

                <!-- 心理状态 -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-brain"></i> 心理状态
                    </h3>
                    <div class="slider-container">
                        <label class="form-label">心情评分 <span class="hint">(0=很差, 10=很好)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="moodScore" min="0" max="10" value="7" oninput="updateSliderValue(this, 'moodScoreValue')">
                            <span class="slider-value" id="moodScoreValue">7</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">压力程度 <span class="hint">(0=无压力, 10=极大压力)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="stress" min="0" max="10" value="4" oninput="updateSliderValue(this, 'stressValue')">
                            <span class="slider-value" id="stressValue">4</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">焦虑程度 <span class="hint">(0=不焦虑, 10=极度焦虑)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="anxiety" min="0" max="10" value="3" oninput="updateSliderValue(this, 'anxietyValue')">
                            <span class="slider-value" id="anxietyValue">3</span>
                        </div>
                    </div>
                </div>

                <!-- 身体状况 -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-heartbeat"></i> 身体状况
                    </h3>
                    <div class="slider-container">
                        <label class="form-label">精力充沛度 <span class="hint">(0=完全疲惫, 10=精力充沛)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="energy" min="0" max="10" value="7" oninput="updateSliderValue(this, 'energyValue')">
                            <span class="slider-value" id="energyValue">7</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">疲劳程度 <span class="hint">(0=不疲劳, 10=极度疲劳)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="fatigue" min="0" max="10" value="3" oninput="updateSliderValue(this, 'fatigueValue')">
                            <span class="slider-value" id="fatigueValue">3</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">头痛程度 <span class="hint">(0=无, 10=剧烈)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="headache" min="0" max="10" value="0" oninput="updateSliderValue(this, 'headacheValue')">
                            <span class="slider-value" id="headacheValue">0</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">颈部疼痛 <span class="hint">(0=无, 10=剧烈)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="neckPain" min="0" max="10" value="2" oninput="updateSliderValue(this, 'neckPainValue')">
                            <span class="slider-value" id="neckPainValue">2</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">腰背疼痛 <span class="hint">(0=无, 10=剧烈)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="backPain" min="0" max="10" value="1" oninput="updateSliderValue(this, 'backPainValue')">
                            <span class="slider-value" id="backPainValue">1</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">关节疼痛 <span class="hint">(0=无, 10=剧烈)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="jointPain" min="0" max="10" value="0" oninput="updateSliderValue(this, 'jointPainValue')">
                            <span class="slider-value" id="jointPainValue">0</span>
                        </div>
                    </div>
                </div>

                <!-- 消化系统 -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-stomach"></i> 消化系统
                    </h3>
                    <div class="slider-container">
                        <label class="form-label">食欲评分 <span class="hint">(0=无食欲, 10=食欲很好)</span></label>
                        <div class="slider-wrapper">
                            <input type="range" class="form-slider" id="appetite" min="0" max="10" value="8" oninput="updateSliderValue(this, 'appetiteValue')">
                            <span class="slider-value" id="appetiteValue">8</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label class="form-label">腹胀程度 <span class="hint">(0=无, 10=严重)</span></label>
                        <div class="slider-wrapper">

        <!-- 健康报告视图 -->
        <div id="reportView" class="hidden">
            <div class="page-title">
                <h1>健康评估报告</h1>
                <p>基于您的数据生成的个性化健康分析</p>
            </div>
            <div id="reportContent"></div>
        </div>

    <script>
        // ===== Canvas 星空 =====
        class Starfield {
            constructor() {
                this.canvas = document.getElementById('starfield');
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.resize();
                this.init();
                window.addEventListener('resize', () => this.resize());
            }
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            init() {
                const starCount = Math.floor((this.canvas.width * this.canvas.height) / 3000);
                for (let i = 0; i < starCount; i++) {
                    this.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: Math.random() * 2,
                        opacity: Math.random(),
                        twinkleSpeed: Math.random() * 0.05
                    });
                }
                this.animate();
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.stars.forEach(star => {
                    star.opacity += star.twinkleSpeed;
                    if (star.opacity > 1 || star.opacity < 0) {
                        star.twinkleSpeed = -star.twinkleSpeed;
                    }
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        // ===== 健康评分引擎 =====
        class HealthSelfAssessment {
            constructor(data) {
                this.data = data.today;
                this.categories = {
                    sleep: this.assessSleep(),
                    exercise: this.assessExercise(),
                    diet: this.assessDiet(),
                    mood: this.assessMood(),
                    physical: this.assessPhysical(),
                    digestion: this.assessDigestion(),
                    vision: this.assessVision(),
                    oral: this.assessOral(),
                    skin: this.assessSkin(),
                    overall: 0
                };
                this.calculateOverall();
                this.generateSuggestions();
            }
            assessSleep() {
                let score = 100;
                const { hours, quality, nightWakeups } = this.data.sleep;
                if (hours < 6 || hours > 10) score -= 20;
                else if (hours < 7 || hours > 9) score -= 10;
                if (quality < 6) score -= 15;
                else if (quality < 8) score -= 5;
                if (nightWakeups > 3) score -= 15;
                else if (nightWakeups > 1) score -= 5;
                return Math.max(0, score);
            }
            assessExercise() {
                let score = 100;
                const { minutes, intensity, steps } = this.data.exercise;
                if (minutes < 15) score -= 20;
                else if (minutes < 30) score -= 10;
                else if (minutes > 120) score -= 5;
                if (steps < 5000) score -= 15;
                else if (steps < 8000) score -= 8;
                else if (steps > 15000) score -= 5;
                if (intensity === 'light') score -= 10;
                else if (intensity === 'intense') score -= 5;
                return Math.max(0, score);
            }
            assessDiet() {
                let score = 100;
                const { waterIntake, vegetables, fruits, junkFood, caffeine, alcohol } = this.data.diet;
                if (waterIntake < 1000 || waterIntake > 3000) score -= 15;
                if (vegetables < 200) score -= 15;
                else if (vegetables < 300) score -= 8;
                if (fruits < 100) score -= 10;
                else if (fruits < 200) score -= 5;
                if (junkFood > 2) score -= 20;
                else if (junkFood > 0) score -= 10;
                if (caffeine > 5) score -= 15;
                else if (caffeine > 3) score -= 10;
                if (alcohol > 0) score -= (alcohol > 2 ? 20 : 10);
                return Math.max(0, score);
            }
            assessMood() {
                let score = 100;
                const { score: moodScore, stress, anxiety } = this.data.mood;
                if (moodScore < 5) score -= 20;
                else if (moodScore < 7) score -= 10;
                if (stress > 7) score -= 20;
                else if (stress > 5) score -= 10;
                if (anxiety > 7) score -= 20;
                else if (anxiety > 5) score -= 10;
                return Math.max(0, score);
            }
            assessPhysical() {
                let score = 100;
                const { energy, fatigue, headache, neckPain, backPain, jointPain } = this.data.physical;
                if (energy < 5) score -= 15;
                else if (energy < 7) score -= 8;
                if (fatigue > 7) score -= 15;
                else if (fatigue > 5) score -= 8;
                if (headache > 5) score -= 15;
                else if (headache > 0) score -= 5;
                if (neckPain > 5) score -= 12;
                else if (neckPain > 0) score -= 3;
                if (backPain > 5) score -= 12;
                else if (backPain > 0) score -= 3;
                if (jointPain > 0) score -= 8;
                return Math.max(0, score);
            }
            assessDigestion() {
                let score = 100;
                const { appetite, bloating, bowelMovements } = this.data.digestion;
                if (appetite < 6) score -= 15;
                else if (appetite < 8) score -= 5;
                if (bloating > 5) score -= 15;
                else if (bloating > 2) score -= 8;
                if (bowelMovements < 1 || bowelMovements > 3) score -= 10;
                return Math.max(0, score);
            }
            assessVision() {
                let score = 100;
                const { eyeFatigue, dryEyes, screenTime, eyeBreaks } = this.data.vision;
                if (eyeFatigue > 7) score -= 20;
                else if (eyeFatigue > 5) score -= 12;
                else if (eyeFatigue > 3) score -= 8;
                if (dryEyes > 5) score -= 15;
                else if (dryEyes > 2) score -= 8;
                if (screenTime > 480) score -= 20;
                else if (screenTime > 360) score -= 10;
                if (eyeBreaks < 4) score -= 15;
                return Math.max(0, score);
            }
            assessOral() {
                let score = 100;
                const { teethBrushing, gumBleeding } = this.data.oral;
                if (teethBrushing < 2) score -= 20;
                if (gumBleeding > 0) score -= 15;
                return Math.max(0, score);
            }
            assessSkin() {
                let score = 100;
                const { acne, dryness, oiliness } = this.data.skin;
                if (acne > 5) score -= 20;
                else if (acne > 2) score -= 10;
                if (dryness > 7) score -= 15;
                else if (dryness > 5) score -= 8;
                if (oiliness < 3 || oiliness > 7) score -= 10;
                return Math.max(0, score);
            }
            calculateOverall() {
                const weights = {
                    sleep: 0.15, exercise: 0.15, diet: 0.15, mood: 0.15,
                    physical: 0.15, digestion: 0.10, vision: 0.10,
                    oral: 0.05, skin: 0.05
                };
                let overall = 0;
                for (let [key, weight] of Object.entries(weights)) {
                    overall += this.categories[key] * weight;
                }
                this.categories.overall = Math.round(overall);
            }
            generateSuggestions() {
                this.suggestions = [];
                if (this.categories.sleep < 70) {
                    this.suggestions.push({
                        priority: 'priority', icon: '😴', title: '改善睡眠质量',
                        tips: ['保持固定的作息时间', '睡前1小时避免使用电子设备',
                               '卧室保持黑暗、安静、凉爽', '适度运动（但不在睡前）']
                    });
                }
                if (this.categories.exercise < 70) {
                    this.suggestions.push({
                        priority: 'priority', icon: '🏃', title: '增加运动量',
                        tips: ['每天至少运动30分钟', '目标步数8000-10000步',
                               '选择喜欢的运动方式', '循序渐进，避免过度运动']
                    });
                }
                if (this.categories.diet < 70) {
                    this.suggestions.push({
                        priority: 'priority', icon: '🥗', title: '优化饮食结构',
                        tips: ['每天喝1.5-2L水', '增加蔬菜摄入（300g+）',
                               '减少垃圾食品和高糖饮料', '控制咖啡因摄入']
                    });
                }
                if (this.categories.mood < 70) {
                    this.suggestions.push({
                        priority: 'priority', icon: '🧘', title: '缓解压力焦虑',
                        tips: ['尝试冥想或深呼吸', '与朋友家人保持联系',
                               '参加兴趣活动', '必要时寻求专业帮助']
                    });
                }
                if (this.categories.vision < 70) {
                    this.suggestions.push({
                        priority: 'tip', icon: '👁️', title: '保护眼睛健康',
                        tips: ['每30分钟休息5分钟', '每天做4-6次眼保健操',
                               '保持良好用眼距离', '多看远处']
                    });
                }
                if (this.categories.overall >= 80) {
                    this.suggestions.unshift({
                        priority: 'tip', icon: '⭐', title: '健康状况优异',
                        tips: ['继续保持当前的健康习惯', '定期自检，持之以恒']
                    });
                }
            }
        }

        // ===== 报告渲染器 =====
        class ReportRenderer {
            constructor(assessment) {
                this.assessment = assessment;
            }
            render() {
                const html = `
                    <div class="score-section">
                        ${this.renderScoreCards()}
                    </div>
                    <div class="content-panel">
                        <h2 class="panel-title"><i class="fas fa-chart-pie"></i> 详细数据</h2>
                        ${this.renderDetails()}
                    </div>
                    <div class="suggestions-panel">
                        <h2 class="suggestions-title">
                            <i class="fas fa-lightbulb"></i>
                            <span>个性化建议</span>
                        </h2>
                        ${this.renderSuggestions()}
                    </div>
                `;
                document.getElementById('reportContent').innerHTML = html;
            }
            renderScoreCards() {
                const { categories } = this.assessment;
                const cards = [
                    { label: '整体评分', value: categories.overall, icon: '⭐' },
                    { label: '睡眠', value: categories.sleep, icon: '😴' },
                    { label: '运动', value: categories.exercise, icon: '🏃' },
                    { label: '饮食', value: categories.diet, icon: '🥗' },
                    { label: '心理', value: categories.mood, icon: '🧠' },
                    { label: '身体', value: categories.physical, icon: '💪' },
                    { label: '眼睛', value: categories.vision, icon: '👁️' }
                ];
                return cards.map(card => `
                    <div class="score-card">
                        <div style="font-size: 2.5em; margin-bottom: 10px;">${card.icon}</div>
                        <div class="score-value">${card.value}</div>
                        <div class="score-label">${card.label}</div>
                    </div>
                `).join('');
            }
            renderDetails() {
                const data = this.assessment.data;
                return `
                    <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">睡眠</h3>
                    <div class="metric-row">
                        <div class="metric-item">
                            <div class="metric-label">睡眠时长</div>
                            <div class="metric-value">${data.sleep.hours}h</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">睡眠质量</div>
                            <div class="metric-value">${data.sleep.quality}/10</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">夜间醒来</div>
                            <div class="metric-value">${data.sleep.nightWakeups}次</div>
                        </div>
                    </div>
                    <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">运动</h3>
                    <div class="metric-row">
                        <div class="metric-item">
                            <div class="metric-label">运动时长</div>
                            <div class="metric-value">${data.exercise.minutes}分钟</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">步数</div>
                            <div class="metric-value">${data.exercise.steps}步</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">运动强度</div>
                            <div class="metric-value">${this.translateIntensity(data.exercise.intensity)}</div>
                        </div>
                    </div>
                    <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">饮食</h3>
                    <div class="metric-row">
                        <div class="metric-item">
                            <div class="metric-label">饮水量</div>
                            <div class="metric-value">${data.diet.waterIntake}ml</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">蔬菜</div>
                            <div class="metric-value">${data.diet.vegetables}g</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">水果</div>
                            <div class="metric-value">${data.diet.fruits}g</div>
                        </div>
                    </div>
                    <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">心理</h3>
                    <div class="metric-row">
                        <div class="metric-item">
                            <div class="metric-label">心情评分</div>
                            <div class="metric-value">${data.mood.score}/10</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">压力程度</div>
                            <div class="metric-value">${data.mood.stress}/10</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">焦虑程度</div>
                            <div class="metric-value">${data.mood.anxiety}/10</div>
                        </div>
                    </div>
                `;
            }
            renderSuggestions() {
                return this.assessment.suggestions.map(s => `
                    <div class="suggestion-item ${s.priority}">
                        <div style="font-size: 1.1em; margin-bottom: 12px;">
                            <span style="font-size: 1.3em; margin-right: 10px;">${s.icon}</span>
                            <span style="font-weight: 700;">${s.title}</span>
                        </div>
                        <ul style="margin-left: 20px; line-height: 1.8; color: var(--text-secondary);">
                            ${s.tips.map(tip => `<li>${tip}</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
            }
            translateIntensity(intensity) {
                const map = { 'light': '轻度', 'moderate': '中等', 'intense': '高强度' };
                return map[intensity] || intensity;
            }
        }

        // ===== 工具函数 =====
        function updateSliderValue(slider, valueId) {
            document.getElementById(valueId).textContent = slider.value;
        }

        function switchView(view) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (view === 'input') {
                document.getElementById('inputView').classList.remove('hidden');
                document.getElementById('reportView').classList.add('hidden');
            } else {
                document.getElementById('inputView').classList.add('hidden');
                document.getElementById('reportView').classList.remove('hidden');
                loadReport();
            }
        }

        function getFormData() {
            return {
                metadata: {
                    lastUpdate: document.getElementById('date').value,
                    age: parseInt(document.getElementById('age').value) || 25,
                    gender: document.getElementById('gender').value
                },
                today: {
                    date: document.getElementById('date').value,
                    sleep: {
                        hours: parseFloat(document.getElementById('sleepHours').value) || 7,
                        quality: parseInt(document.getElementById('sleepQuality').value),

                    },
                    exercise: {

                        intensity: document.getElementById('exerciseIntensity').value,
                        type: document.getElementById('exerciseType').value,
                        steps: parseInt(document.getElementById('steps').value) || 0
                    },
                    diet: {
                        waterIntake: parseInt(document.getElementById('waterIntake').value) || 0,
                        vegetables: parseInt(document.getElementById('vegetables').value) || 0,
                        fruits: parseInt(document.getElementById('fruits').value) || 0,
                        mainCereals: parseInt(document.getElementById('mainCereals').value) || 0,
                        junkFood: parseInt(document.getElementById('junkFood').value) || 0,
                        caffeine: parseInt(document.getElementById('caffeine').value) || 0,
                        alcohol: parseInt(document.getElementById('alcohol').value) || 0,
                        protein: document.getElementById('protein').value
                    },
                    mood: {
                        score: parseInt(document.getElementById('moodScore').value),
                        stress: parseInt(document.getElementById('stress').value),
                        anxiety: parseInt(document.getElementById('anxiety').value)
                    },
                    physical: {
                        energy: parseInt(document.getElementById('energy').value),
                        fatigue: parseInt(document.getElementById('fatigue').value),
                        headache: parseInt(document.getElementById('headache').value),
                        neckPain: parseInt(document.getElementById('neckPain').value),
                        backPain: parseInt(document.getElementById('backPain').value),
                        jointPain: parseInt(document.getElementById('jointPain').value)
                    },
                    digestion: {
                        appetite: parseInt(document.getElementById('appetite').value),
                        bloating: parseInt(document.getElementById('bloating').value),
                        bowelMovements: parseInt(document.getElementById('bowelMovements').value) || 1
                    },
                    vision: {
                        eyeFatigue: parseInt(document.getElementById('eyeFatigue').value),
                        dryEyes: parseInt(document.getElementById('dryEyes').value),
                        screenTime: parseInt(document.getElementById('screenTime').value) || 0,
                        eyeBreaks: parseInt(document.getElementById('eyeBreaks').value) || 0
                    },
                    oral: {
                        teethBrushing: parseInt(document.getElementById('teethBrushing').value) || 2,
                        gumBleeding: parseInt(document.getElementById('gumBleeding').value)
                    },
                    skin: {
                        acne: parseInt(document.getElementById('acne').value),
                        dryness: parseInt(document.getElementById('dryness').value),
                        oiliness: parseInt(document.getElementById('oiliness').value)
                    }
                }
            };
        }

        function loadReport() {
            const data = localStorage.getItem('healthData');
            if (!data) {
                document.getElementById('reportContent').innerHTML = `
                    <div class="alert" style="background: rgba(255, 107, 107, 0.2); border-color: rgba(255, 107, 107, 0.5);">
                        <i class="fas fa-exclamation-circle" style="font-size: 1.5em;"></i>
                        <span>暂无数据，请先录入健康数据</span>
                    </div>
                `;
                return;
            }
            
            try {
                const healthData = JSON.parse(data);
                const assessment = new HealthSelfAssessment(healthData);
                const renderer = new ReportRenderer(assessment);
                renderer.render();
            } catch (error) {
                document.getElementById('reportContent').innerHTML = `
                    <div class="alert" style="background: rgba(255, 107, 107, 0.2); border-color: rgba(255, 107, 107, 0.5);">
                        <i class="fas fa-exclamation-circle" style="font-size: 1.5em;"></i>
                        <span>数据加载失败：${error.message}</span>
                    </div>
                `;
            }
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            document.getElementById('date').valueAsDate = new Date();
            
            // 表单提交
            document.getElementById('healthForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const data = getFormData();
                localStorage.setItem('healthData', JSON.stringify(data));
                
                // 显示成功提示
                const form = this;
                const successAlert = document.createElement('div');
                successAlert.className = 'alert';
                successAlert.innerHTML = `
                    <i class="fas fa-check-circle" style="font-size: 1.5em;"></i>
                    <span>数据保存成功！正在生成报告...</span>
                `;
                form.insertAdjacentElement('beforebegin', successAlert);
                
                setTimeout(() => {
                    successAlert.remove();
                    switchView('report');
                    document.querySelectorAll('.nav-btn')[1].click();
                }, 1500);
            });
            
            // 尝试加载之前的数据
            const savedData = localStorage.getItem('healthData');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    // 可以在这里填充表单
                } catch (e) {
                    console.error('数据加载失败', e);
                }
            }
        });

        new Starfield();
    </script>
</body>
</html>
