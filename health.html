<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日健康自检 - 狂客·银河</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00c9ff 0%, #92fe9d 100%);
            --warning-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.75);
            --shadow-md: 0 8px 25px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.2);
        }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2d3561 100%);
            color: var(--text-primary);
        }
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 15px 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .logo {
            font-size: 1.6em;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .health-container {
            max-width: 1100px;
            margin: 100px auto 50px;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-title h1 {
            font-size: 2.8em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-weight: 800;
        }
        .score-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .score-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .score-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .score-value {
            font-size: 2.5em;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
        }
        .score-label {
            font-size: 1em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab {
            padding: 10px 20px;
            border: 2px solid var(--glass-border);
            background: transparent;
            color: var(--text-primary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95em;
        }
        .tab.active {
            background: var(--primary-gradient);
            border-color: var(--primary-gradient);
        }
        .tab:hover {
            border-color: #667eea;
        }
        .content-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
        }
        .panel-title {
            font-size: 1.6em;
            margin-bottom: 25px;
            color: var(--text-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .metric-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .metric-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            border-left: 3px solid #667eea;
            transition: all 0.3s ease;
        }
        .metric-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .metric-label {
            font-size: 0.95em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .metric-value {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text-primary);
        }
        .suggestions-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px;
            box-shadow: var(--shadow-md);
        }
        .suggestions-title {
            font-size: 1.8em;
            margin-bottom: 25px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .suggestion-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .suggestion-item.priority {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }
        .suggestion-item.tip {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }
        .suggestion-text {
            font-size: 1.05em;
            line-height: 1.6;
            color: var(--text-primary);
        }
        @media (max-width: 768px) {
            .health-container {
                padding: 20px 15px;
                margin: 80px auto 30px;
            }
            .page-title h1 {
                font-size: 2em;
            }
            .score-section {
                grid-template-columns: 1fr;
            }
            .metric-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <header class="header">
        <div class="container">
            <h1 class="logo">📋 每日健康自检</h1>
        </div>
    </header>
    <div class="health-container">
        <div class="page-title">
            <h1>健康自检报告</h1>
            <p>无需任何仪器，在家就能自我评估健康状况</p>
        </div>
        <div id="mainContent"></div>
    </div>

    <script>
        // ===== 内嵌健康数据 =====
        const HEALTH_DATA = {
            "metadata": {
                "lastUpdate": "2024-01-15",
                "age": 25,
                "gender": "M"
            },
            "today": {
                "date": "2024-01-15",
                "sleep": {
                    "hours": 7.5,
                    "quality": 8,
                    "fallAsleepTime": "23:30",
                    "wakeUpTime": "07:00",
                    "nightWakeups": 1,
                    "notes": "睡眠较好"
                },
                "exercise": {
                    "minutes": 45,
                    "intensity": "moderate",
                    "type": "跑步、瑜伽",
                    "steps": 8500
                },
                "diet": {
                    "meals": 3,
                    "waterIntake": 2000,
                    "vegetables": 300,
                    "fruits": 200,
                    "mainCereals": 250,
                    "protein": "鸡蛋、鱼、豆制品",
                    "junkFood": 0,
                    "caffeine": 2,
                    "alcohol": 0
                },
                "mood": {
                    "score": 8,
                    "stress": 4,
                    "anxiety": 3,
                    "mood": "放松"
                },
                "physical": {
                    "energy": 8,
                    "fatigue": 3,
                    "headache": 0,
                    "neckPain": 2,
                    "backPain": 1,
                    "jointPain": 0
                },
                "digestion": {
                    "appetite": 8,
                    "bloating": 1,
                    "constipation": 0,
                    "diarrhea": 0,
                    "bowelMovements": 1,
                    "bowelColor": "brown",
                    "bowelTexture": "normal"
                },
                "vision": {
                    "eyeFatigue": 5,
                    "dryEyes": 3,
                    "blurredVision": 0,
                    "screenTime": 480,
                    "eyeBreaks": 8
                },
                "oral": {
                    "teethBrushing": 2,
                    "gumBleeding": 0,
                    "mouthUlcer": 0,
                    "toothache": 0
                },
                "skin": {
                    "acne": 2,
                    "dryness": 3,
                    "oiliness": 2,
                    "rash": 0
                }
            }
        };

        // ===== Canvas 星空 =====
        class Starfield {
            constructor() {
                this.canvas = document.getElementById('starfield');
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.resize();
                this.init();
                window.addEventListener('resize', () => this.resize());
            }
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            init() {
                const starCount = Math.floor((this.canvas.width * this.canvas.height) / 3000);
                for (let i = 0; i < starCount; i++) {
                    this.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: Math.random() * 2,
                        opacity: Math.random(),
                        twinkleSpeed: Math.random() * 0.05
                    });
                }
                this.animate();
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.stars.forEach(star => {
                    star.opacity += star.twinkleSpeed;
                    if (star.opacity > 1 || star.opacity < 0) {
                        star.twinkleSpeed = -star.twinkleSpeed;
                    }
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        // ===== 健康评分引擎 =====
        class HealthSelfAssessment {
            constructor(data) {
                this.data = data.today;
                this.categories = {
                    sleep: this.assessSleep(),
                    exercise: this.assessExercise(),
                    diet: this.assessDiet(),
                    mood: this.assessMood(),
                    physical: this.assessPhysical(),
                    digestion: this.assessDigestion(),
                    vision: this.assessVision(),
                    oral: this.assessOral(),
                    skin: this.assessSkin(),
                    overall: 0
                };
                this.calculateOverall();
                this.generateSuggestions();
            }

            assessSleep() {
                let score = 100;
                const { hours, quality, nightWakeups } = this.data.sleep;
                if (hours < 6 || hours > 10) score -= 20;
                else if (hours < 7 || hours > 9) score -= 10;
                if (quality < 6) score -= 15;
                else if (quality < 8) score -= 5;
                if (nightWakeups > 3) score -= 15;
                else if (nightWakeups > 1) score -= 5;
                return Math.max(0, score);
            }

            assessExercise() {
                let score = 100;
                const { minutes, intensity, steps } = this.data.exercise;
                if (minutes < 15) score -= 20;
                else if (minutes < 30) score -= 10;
                else if (minutes > 120) score -= 5;
                if (steps < 5000) score -= 15;
                else if (steps < 8000) score -= 8;
                else if (steps > 15000) score -= 5;
                if (intensity === 'light') score -= 10;
                else if (intensity === 'intense') score -= 5;
                return Math.max(0, score);
            }

            assessDiet() {
                let score = 100;
                const { waterIntake, vegetables, fruits, junkFood, caffeine, alcohol } = this.data.diet;
                if (waterIntake < 1000 || waterIntake > 3000) score -= 15;
                if (vegetables < 200) score -= 15;
                else if (vegetables < 300) score -= 8;
                if (fruits < 100) score -= 10;
                else if (fruits < 200) score -= 5;
                if (junkFood > 2) score -= 20;
                else if (junkFood > 0) score -= 10;
                if (caffeine > 5) score -= 15;
                else if (caffeine > 3) score -= 10;
                if (alcohol > 0) score -= (alcohol > 2 ? 20 : 10);
                return Math.max(0, score);
            }

            assessMood() {
                let score = 100;
                const { score: moodScore, stress, anxiety } = this.data.mood;
                if (moodScore < 5) score -= 20;
                else if (moodScore < 7) score -= 10;
                if (stress > 7) score -= 20;
                else if (stress > 5) score -= 10;
                if (anxiety > 7) score -= 20;
                else if (anxiety > 5) score -= 10;
                return Math.max(0, score);
            }

            assessPhysical() {
                let score = 100;
                const { energy, fatigue, headache, neckPain, backPain, jointPain } = this.data.physical;
                if (energy < 5) score -= 15;
                else if (energy < 7) score -= 8;
                if (fatigue > 7) score -= 15;
                else if (fatigue > 5) score -= 8;
                if (headache > 5) score -= 15;
                else if (headache > 0) score -= 5;
                if (neckPain > 5) score -= 12;
                else if (neckPain > 0) score -= 3;
                if (backPain > 5) score -= 12;
                else if (backPain > 0) score -= 3;
                if (jointPain > 0) score -= 8;
                return Math.max(0, score);
            }

            assessDigestion() {
                let score = 100;
                const { appetite, bloating, constipation, diarrhea, bowelMovements } = this.data.digestion;
                if (appetite < 6) score -= 15;
                else if (appetite < 8) score -= 5;
                if (bloating > 5) score -= 15;
                else if (bloating > 2) score -= 8;
                if (constipation > 5) score -= 15;
                else if (constipation > 0) score -= 10;
                if (diarrhea > 5) score -= 15;
                else if (diarrhea > 0) score -= 10;
                if (bowelMovements < 1 || bowelMovements > 3) score -= 10;
                return Math.max(0, score);
            }

            assessVision() {
                let score = 100;
                const { eyeFatigue, dryEyes, screenTime, eyeBreaks } = this.data.vision;
                if (eyeFatigue > 7) score -= 20;
                else if (eyeFatigue > 5) score -= 12;
                else if (eyeFatigue > 3) score -= 8;
                if (dryEyes > 5) score -= 15;
                else if (dryEyes > 2) score -= 8;
                if (screenTime > 480) score -= 20;
                else if (screenTime > 360) score -= 10;
                if (eyeBreaks < 4) score -= 15;
                return Math.max(0, score);
            }

            assessOral() {
                let score = 100;
                const { teethBrushing, gumBleeding, mouthUlcer, toothache } = this.data.oral;
                if (teethBrushing < 2) score -= 20;
                if (gumBleeding > 0) score -= 15;
                if (mouthUlcer > 0) score -= 10;
                if (toothache > 0) score -= 15;
                return Math.max(0, score);
            }

            assessSkin() {
                let score = 100;
                const { acne, dryness, oiliness, rash } = this.data.skin;
                if (acne > 5) score -= 20;
                else if (acne > 2) score -= 10;
                if (dryness > 7) score -= 15;
                else if (dryness > 5) score -= 8;
                if (oiliness < 3 || oiliness > 7) score -= 10;
                if (rash > 0) score -= 20;
                return Math.max(0, score);
            }

            calculateOverall() {
                const weights = {
                    sleep: 0.15, exercise: 0.15, diet: 0.15, mood: 0.15,
                    physical: 0.15, digestion: 0.10, vision: 0.10,
                    oral: 0.05, skin: 0.05
                };
                let overall = 0;
                for (let [key, weight] of Object.entries(weights)) {
                    overall += this.categories[key] * weight;
                }
                this.categories.overall = Math.round(overall);
            }

            generateSuggestions() {
                this.suggestions = [];
                if (this.categories.sleep < 70) {
                    this.suggestions.push({
                        priority: 'high', icon: '😴', title: '改善睡眠质量',
                        tips: ['保持固定的作息时间', '睡前1小时避免使用电子设备',
                               '卧室保持黑暗、安静、凉爽', '适度运动（但不在睡前）']
                    });
                }
                if (this.categories.exercise < 70) {
                    this.suggestions.push({
                        priority: 'high', icon: '🏃', title: '增加运动量',
                        tips: ['每天至少运动30分钟', '目标步数8000-10000步',
                               '选择喜欢的运动方式', '循序渐进，避免过度运动']
                    });
                }
                if (this.categories.diet < 70) {
                    this.suggestions.push({
                        priority: 'high', icon: '🥗', title: '优化饮食结构',
                        tips: ['每天喝1.5-2L水', '增加蔬菜摄入（300g+）',
                               '减少垃圾食品和高糖饮料', '控制咖啡因摄入']
                    });
                }
                if (this.categories.mood < 70) {
                    this.suggestions.push({
                        priority: 'high', icon: '🧘', title: '缓解压力焦虑',
                        tips: ['尝试冥想或深呼吸', '与朋友家人保持联系',
                               '参加兴趣活动', '必要时寻求专业帮助']
                    });
                }
                if (this.categories.vision < 70) {
                    this.suggestions.push({
                        priority: 'medium', icon: '👁️', title: '保护眼睛健康',
                        tips: ['每30分钟休息5分钟', '每天做4-6次眼保健操',
                               '保持良好用眼距离', '多看远处']
                    });
                }
                if (this.categories.overall >= 80) {
                    this.suggestions.unshift({
                        priority: 'tip', icon: '⭐', title: '健康状况优异',
                        tips: ['继续保持当前的健康习惯', '定期自检，持之以恒']
                    });
                }
            }
        }

        // ===== 渲染器 =====
        class DashboardRenderer {
            constructor(assessment) {
                this.assessment = assessment;
            }

            render() {
                const html = `
                    <div class="score-section">
                        ${this.renderScoreCards()}
                    </div>
                    <div class="category-tabs">
                        <button class="tab active" onclick="switchTab('overview')">总体概览</button>
                        <button class="tab" onclick="switchTab('sleep')">睡眠</button>
                        <button class="tab" onclick="switchTab('exercise')">运动</button>
                        <button class="tab" onclick="switchTab('diet')">饮食</button>
                        <button class="tab" onclick="switchTab('mood')">心理</button>
                    </div>
                    <div id="tabContent">
                        ${this.renderOverview()}
                    </div>
                    <div class="suggestions-panel">
                        <h2 class="suggestions-title">
                            <i class="fas fa-lightbulb"></i>
                            <span>个性化建议</span>
                        </h2>
                        ${this.renderSuggestions()}
                    </div>
                `;
                document.getElementById('mainContent').innerHTML = html;
            }

            renderScoreCards() {
                const { categories } = this.assessment;
                const cards = [
                    { label: '整体评分', value: categories.overall, icon: '⭐' },
                    { label: '睡眠', value: categories.sleep, icon: '😴' },
                    { label: '运动', value: categories.exercise, icon: '🏃' },
                    { label: '饮食', value: categories.diet, icon: '🥗' },
                    { label: '心理', value: categories.mood, icon: '🧠' },
                    { label: '身体', value: categories.physical, icon: '💪' },
                    { label: '眼睛', value: categories.vision, icon: '👁️' }
                ];
                return cards.map(card => `
                    <div class="score-card">
                        <div style="font-size: 2.5em; margin-bottom: 10px;">${card.icon}</div>
                        <div class="score-value">${card.value}</div>
                        <div class="score-label">${card.label}</div>
                    </div>
                `).join('');
            }

            renderOverview() {
                const data = this.assessment.data;
                return `
                    <div class="content-panel">
                        <h2 class="panel-title"><i class="fas fa-chart-pie"></i> 今日概览</h2>
                        <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">睡眠</h3>
                        <div class="metric-row">
                            <div class="metric-item">
                                <div class="metric-label">睡眠时长</div>
                                <div class="metric-value">${data.sleep.hours}h</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">睡眠质量</div>
                                <div class="metric-value">${data.sleep.quality}/10</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">夜间醒来</div>
                                <div class="metric-value">${data.sleep.nightWakeups}次</div>
                            </div>
                        </div>
                        <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">运动</h3>
                        <div class="metric-row">
                            <div class="metric-item">
                                <div class="metric-label">运动时长</div>
                                <div class="metric-value">${data.exercise.minutes}分钟</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">步数</div>
                                <div class="metric-value">${data.exercise.steps}步</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">运动强度</div>
                                <div class="metric-value">${this.translateIntensity(data.exercise.intensity)}</div>
                            </div>
                        </div>
                        <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">饮食</h3>
                        <div class="metric-row">
                            <div class="metric-item">
                                <div class="metric-label">饮水量</div>
                                <div class="metric-value">${data.diet.waterIntake}ml</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">蔬菜</div>
                                <div class="metric-value">${data.diet.vegetables}g</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">水果</div>
                                <div class="metric-value">${data.diet.fruits}g</div>
                            </div>
                        </div>
                        <h3 style="margin-top: 30px; margin-bottom: 15px; color: var(--text-primary);">心理</h3>
                        <div class="metric-row">
                            <div class="metric-item">
                                <div class="metric-label">心情评分</div>
                                <div class="metric-value">${data.mood.score}/10</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">压力程度</div>
                                <div class="metric-value">${data.mood.stress}/10</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">焦虑程度</div>
                                <div class="metric-value">${data.mood.anxiety}/10</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderSuggestions() {
                return this.assessment.suggestions.map(s => `
                    <div class="suggestion-item ${s.priority}">
                        <div style="font-size: 1.1em; margin-bottom: 12px;">
                            <span style="font-size: 1.3em; margin-right: 10px;">${s.icon}</span>
                            <span style="font-weight: 700;">${s.title}</span>
                        </div>
                        <ul style="margin-left: 20px; line-height: 1.8; color: var(--text-secondary);">
                            ${s.tips.map(tip => `<li>${tip}</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
            }

            translateIntensity(intensity) {
                const map = { 'light': '轻度', 'moderate': '中等', 'intense': '高强度' };
                return map[intensity] || intensity;
            }
        }

        // ===== 主程序 =====
        function init() {
            try {
                const assessment = new HealthSelfAssessment(HEALTH_DATA);
                const renderer = new DashboardRenderer(assessment);
                renderer.render();
            } catch (error) {
                document.getElementById('mainContent').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ff6b6b;">
                        <p>⚠️ 加载失败：${error.message}</p>
                    </div>
                `;
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        new Starfield();
        window.addEventListener('load', init);
    </script>
</body>
</html>
