<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: url('') center center/cover no-repeat fixed;
            /* 在此处填入您的背景图片URL */
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 左上角头像和标题区域 */
        .header {
            position: absolute;
            top: 50px;
            left: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            background: url('') center center/cover;
            /* 在此处填入您的头像URL */
            background-color: #ff9500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .site-title {
            color: white;
            font-size: 48px;
            font-weight: bold;
            font-style: italic;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* 左下角引言区域 */
        .quote-section {
            position: absolute;
            bottom: 120px;
            left: 50px;
            max-width: 500px;
        }

        .quote-title {
            color: white;
            font-size: 36px;
            font-style: italic;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        .quote-text {
            color: white;
            font-size: 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        }

        /* 社交图标 */
        .social-icons {
            position: absolute;
            bottom: 40px;
            left: 50px;
            display: flex;
            gap: 30px;
        }

        .social-icons a {
            color: white;
            font-size: 32px;
            transition: transform 0.3s, opacity 0.3s;
            text-decoration: none;
            opacity: 0.9;
        }

        .social-icons a:hover {
            transform: translateY(-5px);
            opacity: 1;
        }

        /* 右上角日期时间天气 */
        .datetime-weather {
            position: absolute;
            top: 50px;
            right: 50px;
            text-align: right;
            color: white;
        }

        .date {
            font-size: 18px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        }

        .time {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            font-family: 'Courier New', monospace;
        }

        .weather {
            font-size: 16px;
            opacity: 0.9;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        }

        /* 中间引言 */
        .center-quote {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            max-width: 800px;
        }

        .center-quote-text {
            font-size: 24px;
            line-height: 1.8;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .center-quote-author {
            font-size: 18px;
            font-style: italic;
            opacity: 0.9;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
        }

        /* 网站列表标题 */
        .sites-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }

        /* 网站卡片容器 */
        .sites-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        .site-card {
            width: 280px;
            height: 180px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .site-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .site-icon {
            font-size: 48px;
            color: white;
        }

        .site-name {
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        }

        /* 底部备案信息 */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .beian-icon {
            width: 16px;
            height: 16px;
        }

        /* 右下角悬浮头像 */
        .float-avatar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: url('') center center/cover;
            /* 在此处填入您的悬浮头像URL */
            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 1000;
        }

        .float-avatar:hover {
            transform: scale(1.1);
        }

        /* 图标字体 */
        .icon {
            display: inline-block;
            width: 32px;
            height: 32px;
        }

        /* SVG 图标样式 */
        svg {
            fill: currentColor;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左上角头像和标题 -->

        <!-- 左下角引言 -->
        <div class="quote-section">
            <div class="quote-title">"Hello World!"</div>
            <div class="quote-text">无限进步</div>
        </div>

        <!-- 社交图标 -->
        <div class="social-icons">
            <a href="#" title="GitHub">
                <svg viewBox="0 0 24 24" width="32" height="32">

        </div>

        <!-- 右上角日期时间天气 -->
        <div class="datetime-weather">
            <div class="date" id="date">2025年11月05日 星期三</div>
            <div class="time" id="time">17:55:44</div>
            <div class="weather">天气数据获取失败</div>
        </div>

        <!-- 中间引言 -->
        <div class="center-quote">
            <div class="center-quote-text">奇怪的是，当他死去，所有人<br>才开始爱他。</div>
            <div class="center-quote-author">-「哲学」</div>
        </div>

        <!-- 网站列表标题 -->
        <div class="sites-title">
            <span>🔗</span>
            <span>网站列表</span>
        </div>

        <!-- 网站卡片 -->
        <div class="sites-container">
            <a href="https://kuangketongxue.github.io/kuangke.github.io/reading.html" style="text-decoration: none;">
                <div class="site-card">
                    <div class="site-icon">📡</div>
                    <div class="site-name">星空</div>
                </div>
            </a>
            <a href="https://kuangketongxue.github.io/kuangke.github.io/success.html" style="text-decoration: none;">
                <div class="site-card">
                    <div class="site-icon">📡</div>
                    <div class="site-name">成功日记</div>
                </div>
            </a>
        </div>

        <!-- 底部备案信息 -->
        <div class="footer">
            <span>浙ICP备2025155286号-1</span>

            <span>浙公网安备32060202002665号</span>
        </div>

        <!-- 右下角悬浮头像 -->
        <div class="float-avatar"></div>
    </div>

    <script>
        // 更新日期和时间
        function updateDateTime() {
            const now = new Date();
            
            // 日期
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];
            
            document.getElementById('date').textContent = `${year}年${month}月${day}日 ${weekday}`;
            
            // 时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // 初始化
        updateDateTime();
        // 每秒更新时间
        setInterval(updateDateTime, 1000);

        // 网站卡片点击事件（示例）
        document.querySelectorAll('.site-card').forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('点击了网站卡片');
                // 在这里添加跳转逻辑
            });
        });
    </script>
</body>
</html>
