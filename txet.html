<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D手势圣诞树 - 视觉特效</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .controls { background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #d4af37; }
        #video-container {
            position: absolute; bottom: 20px; right: 20px; width: 240px; height: 180px;
            border: 2px solid #d4af37; border-radius: 8px; overflow: hidden; transform: scaleX(-1);
        }
        #hand-video { width: 100%; height: 100%; object-fit: cover; }
        input[type="file"] { display: none; }
        .btn {
            background: #d4af37; color: #1a1a1a; border: none; padding: 8px 15px;
            cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 4px;
        }
        .status { margin-top: 10px; font-size: 14px; color: #ff4d4d; }
    </style>
</head>
<body>

<div id="ui">
    <div class="controls">
        <h2>🎄 手势互动圣诞树</h2>
        <p>1. 上传几张照片构建照片云</p>
        <button class="btn" onclick="document.getElementById('upload').click()">上传照片</button>
        <input type="file" id="upload" multiple accept="image/*">
        <div class="status" id="gesture-hint">正在初始化摄像头...</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 10px;">
            🖐️ 张开: 散开 | ✊ 握拳: 合拢 <br>
            👌 捏合: 放大照片 | 🖐️ 移动: 旋转视角
        </div>
    </div>
</div>

<div id="video-container">
    <video id="hand-video" playsinline></video>
</div>

<!-- 依赖库 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/**
 * 配置与全局变量
 */
let scene, camera, renderer, composer, clock;
let particles = [], photoPlanes = [];
let treeGroup, instancedMesh;
const PARTICLE_COUNT = 1200;
let currentState = 'TREE'; // 'TREE', 'SCATTER', 'FOCUS'
let targetRotation = { x: 0, y: 0 };
let focusedPhoto = null;

// 颜色定义
const COLORS = {
    gold: new THREE.Color(0xd4af37),
    green: new THREE.Color(0x1a472a),
    red: new THREE.Color(0xaf0000)
};

/**
 * 初始化场景
 */
function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.05);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    // 辉光后期处理
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.5;

    composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    clock = new THREE.Clock();

    createEnvironment();
    createInstancedTree();
    setupHandTracking();
    animate();
}

/**
 * 创建粒子圣诞树基础
 */
function createInstancedTree() {
    const geometries = [
        new THREE.SphereGeometry(0.1, 8, 8),
        new THREE.BoxGeometry(0.15, 0.15, 0.15),
        new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8)
    ];

    treeGroup = new THREE.Group();
    scene.add(treeGroup);

    // 使用 InstancedMesh 提高性能
    const material = new THREE.MeshStandardMaterial({ 
        metalness: 0.9, 
        roughness: 0.1,
        emissiveIntensity: 0.5 
    });

    instancedMesh = new THREE.InstancedMesh(geometries[0], material, PARTICLE_COUNT);
    
    const dummy = new THREE.Object3D();
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        // 计算圣诞树圆锥位置
        const h = Math.random() * 10;
        const radius = (10 - h) * 0.4;
        const theta = Math.random() * Math.PI * 2;
        
        const x = Math.cos(theta) * radius;
        const y = h - 5;
        const z = Math.sin(theta) * radius;

        dummy.position.set(x, y, z);
        dummy.scale.setScalar(Math.random() * 0.5 + 0.5);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);
        
        // 存储初始位置和随机散开位置
        particles.push({
            id: i,
            treePos: new THREE.Vector3(x, y, z),
            scatterPos: new THREE.Vector3(
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 30
            ),
            color: i % 3 === 0 ? COLORS.gold : (i % 3 === 1 ? COLORS.green : COLORS.red)
        });
        
        instancedMesh.setColorAt(i, particles[i].color);
    }
    treeGroup.add(instancedMesh);
}

/**
 * 环境装饰
 */
function createEnvironment() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xd4af37, 2, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);
}

/**
 * 处理照片上传
 */
document.getElementById('upload').addEventListener('change', function(e) {
    const files = e.target.files;
    const loader = new THREE.TextureLoader();

    for(let i=0; i<files.length; i++) {
        const url = URL.createObjectURL(files[i]);
        loader.load(url, (texture) => {
            const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const geo = new THREE.PlaneGeometry(1.5, 1.5);
            const mesh = new THREE.Mesh(geo, mat);
            
            // 初始在树上的位置
            const angle = Math.random() * Math.PI * 2;
            mesh.position.set(Math.cos(angle)*2, Math.random()*8-4, Math.sin(angle)*2);
            mesh.userData.treePos = mesh.position.clone();
            mesh.userData.scatterPos = new THREE.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20);
            
            photoPlanes.push(mesh);
            treeGroup.add(mesh);
        });
    }
});

/**
 * 手势识别与逻辑处理
 */
function setupHandTracking() {
    const videoElement = document.getElementById('hand-video');
    const hint = document.getElementById('gesture-hint');

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            hint.innerText = "手势控制中...";
            const landmarks = results.multiHandLandmarks[0];
            
            // 简单的手势判定
            const isFist = detectFist(landmarks);
            const isOpen = detectOpen(landmarks);
            const isPinching = detectPinch(landmarks);

            // 状态机切换
            if (isFist) currentState = 'TREE';
            else if (isPinching) currentState = 'FOCUS';
            else if (isOpen) currentState = 'SCATTER';

            // 旋转逻辑 (基于食指坐标)
            const indexFinger = landmarks[8];
            targetRotation.y = (indexFinger.x - 0.5) * Math.PI * 2;
            targetRotation.x = (indexFinger.y - 0.5) * Math.PI;
        } else {
            hint.innerText = "未检测到手部";
        }
    });

    const cameraInput = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 640, height: 480
    });
    cameraInput.start();
}

function detectFist(lm) {
    // 指尖到手掌距离小于阈值
    const d1 = Math.hypot(lm[8].x - lm[5].x, lm[8].y - lm[5].y);
    return d1 < 0.08;
}

function detectOpen(lm) {
    const d1 = Math.hypot(lm[8].x - lm[5].x, lm[8].y - lm[5].y);
    return d1 > 0.2;
}

function detectPinch(lm) {
    // 拇指与食指距离
    const d = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
    return d < 0.04;
}

/**
 * 动画渲染循环
 */
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const time = clock.getElapsedTime();

    // 平滑相机与旋转
    treeGroup.rotation.y += (targetRotation.y - treeGroup.rotation.y) * 0.05;
    treeGroup.rotation.x += (targetRotation.x - treeGroup.rotation.x) * 0.05;

    const dummy = new THREE.Object3D();
    
    // 更新粒子
    particles.forEach((p, i) => {
        instancedMesh.getMatrixAt(i, dummy.matrix);
        dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);

        let target = (currentState === 'TREE') ? p.treePos : p.scatterPos;
        
        // 插值动画
        dummy.position.lerp(target, 0.05);
        
        // 散开态加入微小漂浮
        if(currentState !== 'TREE') {
            dummy.position.x += Math.sin(time + i) * 0.01;
            dummy.position.y += Math.cos(time + i) * 0.01;
        }

        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);
    });
    instancedMesh.instanceMatrix.needsUpdate = true;

    // 更新照片云
    photoPlanes.forEach((mesh, i) => {
        let targetPos;
        if (currentState === 'FOCUS' && i === 0) { // 简单起见，聚焦第一张
            targetPos = new THREE.Vector3(0, 0, 8).applyQuaternion(camera.quaternion);
            mesh.lookAt(camera.position);
            mesh.scale.lerp(new THREE.Vector3(3, 3, 3), 0.1);
        } else {
            targetPos = (currentState === 'TREE') ? mesh.userData.treePos : mesh.userData.scatterPos;
            mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            if (currentState === 'SCATTER') mesh.rotation.y += 0.01;
        }
        mesh.position.lerp(targetPos, 0.05);
    });

    composer.render();
}

// 响应缩放
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

// 启动
init();
</script>
</body>
</html>
