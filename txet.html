<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gesture Christmas Tree - 3D Particle Cloud</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050a05; font-family: 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        /* UI 层 */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .controls { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #d4af37; }
        input[type="file"] { display: none; }
        .btn {
            background: #d4af37; color: #050a05; padding: 8px 16px; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        
        /* 状态指示器 */
        #status { position: absolute; bottom: 20px; right: 20px; color: #ff0000; font-weight: bold; }
        
        /* 视频预览（隐藏，仅供MediaPipe使用） */
        #video-input { position: fixed; bottom: 10px; left: 10px; width: 160px; height: 120px; 
                       border: 2px solid #d4af37; transform: scaleX(-1); border-radius: 8px; z-index: 5; }
        
        #loading {
            position: fixed; inset: 0; background: #050a05; display: flex;
            justify-content: center; align-items: center; color: #d4af37; z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading">资源加载中，请稍候...</div>

<div id="ui-layer">
    <div class="controls">
        <h2>🎄 幻影圣诞树</h2>
        <p>手势指令：<br>✊ 握拳：聚合 | 🖐️ 张开：散开<br>🤏 捏合：放大照片 | 🖐️ 移动：旋转</p>
        <label class="btn" for="image-upload">上传你的照片</label>
        <input type="file" id="image-upload" multiple accept="image/*">
    </div>
</div>

<div id="status">正在初始化摄像头...</div>
<video id="video-input"></video>
<div id="container"></div>

<!-- 依赖库 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.0/tween.umd.js"></script>

<script>
/**
 * 核心配置
 */
const CONFIG = {
    particleCount: 2000,
    treeHeight: 15,
    treeRadius: 7,
    colors: {
        green: new THREE.Color(0x1a472a),
        gold: new THREE.Color(0xd4af37),
        red: new THREE.Color(0xaf0000)
    }
};

let scene, camera, renderer, composer, hands, particles, photoMeshes = [];
let currentState = 'CLOSE'; // 'CLOSE', 'OPEN', 'ZOOM'
let targetRotation = { x: 0, y: 0 };
const textureLoader = new THREE.TextureLoader();

// 初始化 Three.js
function initThree() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050a05, 0.02);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;
    camera.position.y = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('container').appendChild(renderer.domElement);

    // 后期处理：辉光
    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.5;

    composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    createParticles();
    addLights();
    
    window.addEventListener('resize', onWindowResize);
    document.getElementById('loading').style.display = 'none';
}

function addLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xd4af37, 2, 50);
    pointLight.position.set(5, 10, 5);
    scene.add(pointLight);
}

/**
 * 创建粒子系统 (圣诞树逻辑)
 */
function createParticles() {
    const geometry = new THREE.SphereGeometry(0.1, 8, 8);
    const material = new THREE.MeshStandardMaterial({ 
        metalness: 0.8, 
        roughness: 0.2,
        emissiveIntensity: 0.5
    });

    particles = new THREE.InstancedMesh(geometry, material, CONFIG.particleCount);
    
    const dummy = new THREE.Object3D();
    const positions = [];

    for (let i = 0; i < CONFIG.particleCount; i++) {
        // 计算圣诞树圆锥位置
        const ratio = i / CONFIG.particleCount;
        const angle = ratio * Math.PI * 40; 
        const height = ratio * CONFIG.treeHeight;
        const radius = (1 - ratio) * CONFIG.treeRadius;

        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = height - CONFIG.treeHeight / 2;

        dummy.position.set(x, y, z);
        
        // 随机颜色 (金、绿、红)
        const rand = Math.random();
        let color = CONFIG.colors.green;
        if (rand > 0.7) color = CONFIG.colors.gold;
        if (rand > 0.9) color = CONFIG.colors.red;
        
        particles.setColorAt(i, color);
        dummy.updateMatrix();
        particles.setMatrixAt(i, dummy.matrix);
        
        // 记录目标位置和随机散开位置
        positions.push({
            tree: new THREE.Vector3(x, y, z),
            scatter: new THREE.Vector3(
                (Math.random() - 0.5) * 40,
                (Math.random() - 0.5) * 40,
                (Math.random() - 0.5) * 40
            )
        });
    }

    particles.userData.posData = positions;
    scene.add(particles);
}

/**
 * 处理照片上传
 */
document.getElementById('image-upload').addEventListener('change', (e) => {
    const files = e.target.files;
    for (let file of files) {
        const url = URL.createObjectURL(file);
        textureLoader.load(url, (tex) => {
            const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
            const geo = new THREE.PlaneGeometry(3, 4);
            const mesh = new THREE.Mesh(geo, mat);
            
            // 初始随机位置
            mesh.position.set(
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20
            );
            mesh.scale.set(0.1, 0.1, 0.1); // 初始很小
            scene.add(mesh);
            photoMeshes.push(mesh);
        });
    }
});

/**
 * 状态切换动画
 */
function transitionTo(state) {
    if (currentState === state) return;
    currentState = state;
    const duration = 1500;

    photoMeshes.forEach((mesh, index) => {
        let targetPos, targetScale;
        if (state === 'CLOSE') {
            targetPos = new THREE.Vector3(0, 0, 0);
            targetScale = new THREE.Vector3(0.01, 0.01, 0.01);
        } else if (state === 'OPEN') {
            targetPos = new THREE.Vector3((Math.random()-0.5)*25, (Math.random()-0.5)*20, (Math.random()-0.5)*20);
            targetScale = new THREE.Vector3(1, 1, 1);
        }
        
        if (targetPos) {
            new TWEEN.Tween(mesh.position).to(targetPos, duration).easing(TWEEN.Easing.Quadratic.Out).start();
            new TWEEN.Tween(mesh.scale).to(targetScale, duration).easing(TWEEN.Easing.Back.Out).start();
        }
    });

    // 粒子动画由 animate 函数根据状态实时插值
}

/**
 * MediaPipe 手势识别
 */
function initMediaPipe() {
    const videoElement = document.getElementById('video-input');
    const statusLabel = document.getElementById('status');

    hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(onHandResults);

    const cameraInput = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640, height: 480
    });
    cameraInput.start();
}

function onHandResults(results) {
    const statusLabel = document.getElementById('status');
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        // 1. 判断手势：握拳还是张开
        // 计算食指、中指、无名指尖与掌心的距离
        const wrist = landmarks[0];
        const tip = landmarks[8];
        const dist = Math.sqrt(Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2));
        
        if (dist < 0.15) {
            statusLabel.innerText = "状态：握拳 (聚合)";
            transitionTo('CLOSE');
        } else {
            statusLabel.innerText = "状态：张开 (散开)";
            transitionTo('OPEN');
            
            // 2. 旋转控制 (根据手部中心位置)
            const centerX = landmarks[9].x; 
            const centerY = landmarks[9].y;
            targetRotation.y = (centerX - 0.5) * Math.PI;
            targetRotation.x = (centerY - 0.5) * Math.PI * 0.5;

            // 3. 抓取动作判断 (食指和拇指捏合)
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const pinchDist = Math.sqrt(Math.pow(thumbTip.x - indexTip.x, 2) + Math.pow(thumbTip.y - indexTip.y, 2));
            
            if (pinchDist < 0.05 && photoMeshes.length > 0) {
                statusLabel.innerText = "状态：抓取 (查看照片)";
                zoomPhoto(photoMeshes[0]); // 演示放大第一张
            }
        }
    } else {
        statusLabel.innerText = "未检测到手势";
    }
}

function zoomPhoto(mesh) {
    new TWEEN.Tween(mesh.position).to({ x: 0, y: 0, z: 12 }, 800).easing(TWEEN.Easing.Quadratic.Out).start();
    new TWEEN.Tween(mesh.scale).to({ x: 2.5, y: 2.5, z: 2.5 }, 800).easing(TWEEN.Easing.Quadratic.Out).start();
}

/**
 * 渲染循环
 */
const dummy = new THREE.Object3D();
let lerpFactor = 0;

function animate(time) {
    requestAnimationFrame(animate);
    TWEEN.update(time);

    // 平滑相机旋转
    camera.position.x += (Math.sin(targetRotation.y) * 25 - camera.position.x) * 0.05;
    camera.position.z += (Math.cos(targetRotation.y) * 25 - camera.position.z) * 0.05;
    camera.lookAt(0, 0, 0);

    // 粒子插值动画
    if (currentState === 'CLOSE') {
        lerpFactor = THREE.MathUtils.lerp(lerpFactor, 0, 0.05);
    } else {
        lerpFactor = THREE.MathUtils.lerp(lerpFactor, 1, 0.05);
    }

    const posData = particles.userData.posData;
    for (let i = 0; i < CONFIG.particleCount; i++) {
        const p = posData[i];
        // 在树形态和散开形态间线性插值
        dummy.position.lerpVectors(p.tree, p.scatter, lerpFactor);
        
        // 增加一点微动感
        if (lerpFactor > 0.1) {
            dummy.position.x += Math.sin(time * 0.001 + i) * 0.02;
            dummy.position.y += Math.cos(time * 0.001 + i) * 0.02;
        }

        dummy.updateMatrix();
        particles.setMatrixAt(i, dummy.matrix);
    }
    particles.instanceMatrix.needsUpdate = true;
    
    // 自转
    particles.rotation.y += 0.002;

    composer.render();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
}

// 启动
initThree();
initMediaPipe();
animate();

</script>
</body>
</html>
