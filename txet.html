<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 手势交互圣诞树 - Creative Tech</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 240px; height: 180px; border-radius: 12px; border: 2px solid rgba(212, 175, 55, 0.5); overflow: hidden; transform: scaleX(-1); }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        #ui-layer { position: absolute; top: 20px; left: 20px; color: #D4AF37; pointer-events: none; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        #upload-btn { pointer-events: auto; background: #8B0000; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 10px; transition: 0.3s; }
        #upload-btn:hover { background: #B22222; box-shadow: 0 0 15px #FFD700; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: gold; font-size: 24px; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h1>Golden Christmas Tree</h1>
    <p>状态: <span id="status">初始化中...</span></p>
    <p>手势说明: 握拳(合拢) | 五指张开(散开) | 捏合(抓取照片) | 移动(旋转)</p>
    <input type="file" id="image-upload" multiple accept="image/*" style="display:none">
    <button id="upload-btn">上传照片到照片云</button>
</div>

<div id="video-container">
    <video id="webcam" autoplay playsinline></video>
</div>

<div id="canvas-container"></div>

<!-- 引入依赖 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/**
 * 配置与变量
 */
const CONFIG = {
    particleCount: 800,
    treeHeight: 15,
    treeRadius: 6,
    colors: [0xD4AF37, 0x8B0000, 0x228B22, 0xFFD700], // 金、红、绿、明金
    states: { CLOSED: 'CLOSED', SCATTER: 'SCATTER', FOCUS: 'FOCUS' }
};

let currentState = CONFIG.states.CLOSED;
let scene, camera, renderer, hands, instancedMesh, photoGroup;
let particles = [];
let textures = [];
let raycaster = new THREE.Raycaster();
let targetRotation = { x: 0, y: 0 };

/**
 * 初始化场景
 */
function initScene() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;
    camera.position.y = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 光效
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xD4AF37, 2, 50);
    pointLight.position.set(0, 10, 5);
    scene.add(pointLight);

    createParticles();
    initMediaPipe();
    animate();
}

/**
 * 创建粒子圣诞树 (InstancedMesh)
 */
function createParticles() {
    // 混合几何体：球、立方体
    const geometries = [
        new THREE.SphereGeometry(0.15, 8, 8),
        new THREE.BoxGeometry(0.2, 0.2, 0.2)
    ];
    
    const combinedGeom = geometries[0]; // 简化演示使用球体
    const material = new THREE.MeshStandardMaterial({ 
        metalness: 0.9, 
        roughness: 0.1,
        emissiveIntensity: 0.5
    });

    instancedMesh = new THREE.InstancedMesh(combinedGeom, material, CONFIG.particleCount);
    
    const dummy = new THREE.Object3D();
    for (let i = 0; i < CONFIG.particleCount; i++) {
        // 计算圣诞树圆锥分布
        const ratio = i / CONFIG.particleCount;
        const angle = ratio * Math.PI * 20;
        const radius = (1 - ratio) * CONFIG.treeRadius;
        const y = ratio * CONFIG.treeHeight - CONFIG.treeHeight / 2;
        
        const targetPos = new THREE.Vector3(
            Math.cos(angle) * radius,
            y,
            Math.sin(angle) * radius
        );

        const scatterPos = new THREE.Vector3(
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 40
        );

        particles.push({
            closed: targetPos.clone(),
            scatter: scatterPos.clone(),
            color: new THREE.Color(CONFIG.colors[i % CONFIG.colors.length])
        });

        dummy.position.copy(targetPos);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);
        instancedMesh.setColorAt(i, particles[i].color);
    }

    scene.add(instancedMesh);

    // 照片云容器
    photoGroup = new THREE.Group();
    scene.add(photoGroup);
}

/**
 * 手势识别与逻辑
 */
function initMediaPipe() {
    const videoElement = document.getElementById('webcam');
    hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(onHandResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640, height: 480
    });
    cameraUtils.start();
}

function onHandResults(results) {
    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

    const landmarks = results.multiHandLandmarks[0];
    
    // 1. 判断手势
    // 计算食指尖和掌心的距离作为伸展程度参考
    const isFist = detectFist(landmarks);
    const isOpen = detectOpenHand(landmarks);
    const isPinching = detectPinch(landmarks);

    // 2. 状态切换
    if (isFist && currentState !== CONFIG.states.CLOSED) {
        switchState(CONFIG.states.CLOSED);
    } else if (isOpen && currentState === CONFIG.states.CLOSED) {
        switchState(CONFIG.states.SCATTER);
    }

    // 3. 旋转控制 (基于食指坐标)
    const indexFinger = landmarks[8];
    targetRotation.y = (indexFinger.x - 0.5) * 2;
    targetRotation.x = (indexFinger.y - 0.5) * 1;

    // 4. 抓取逻辑
    if (isPinching && currentState === CONFIG.states.SCATTER) {
        checkPhotoFocus(indexFinger);
    }
    
    document.getElementById('status').innerText = currentState;
}

function detectFist(lm) {
    // 简易逻辑：指尖到手腕距离小于阈值
    return Math.abs(lm[8].y - lm[0].y) < 0.2;
}

function detectOpenHand(lm) {
    return Math.abs(lm[8].y - lm[0].y) > 0.5;
}

function detectPinch(lm) {
    // 拇指和食指距离
    const dist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
    return dist < 0.05;
}

/**
 * 动画过渡
 */
function switchState(newState) {
    if (newState === currentState) return;
    currentState = newState;
    
    const dummy = new THREE.Object3D();
    
    for (let i = 0; i < CONFIG.particleCount; i++) {
        const target = (newState === CONFIG.states.CLOSED) ? particles[i].closed : particles[i].scatter;
        
        gsap.to(dummy.position, {
            x: target.x,
            y: target.y,
            z: target.z,
            duration: 1.5,
            ease: "power2.inOut",
            onUpdate: () => {
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
                instancedMesh.instanceMatrix.needsUpdate = true;
            }
        });
    }

    // 照片云动画
    gsap.to(photoGroup.scale, {
        x: newState === CONFIG.states.CLOSED ? 0.1 : 1,
        y: newState === CONFIG.states.CLOSED ? 0.1 : 1,
        z: newState === CONFIG.states.CLOSED ? 0.1 : 1,
        duration: 1
    });
}

/**
 * 照片上传逻辑
 */
document.getElementById('upload-btn').onclick = () => document.getElementById('image-upload').click();
document.getElementById('image-upload').onchange = (e) => {
    const files = e.target.files;
    const loader = new THREE.TextureLoader();

    for (let i = 0; i < files.length; i++) {
        const url = URL.createObjectURL(files[i]);
        loader.load(url, (tex) => {
            const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
            const geom = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(geom, mat);
            
            mesh.position.set(
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20
            );
            mesh.userData.originalPos = mesh.position.clone();
            photoGroup.add(mesh);
        });
    }
};

function checkPhotoFocus(handPos) {
    // 将手部坐标映射到归一化设备坐标 (NDC)
    const x = (handPos.x - 0.5) * -2; // 镜像处理
    const y = (0.5 - handPos.y) * 2;
    
    raycaster.setFromCamera({ x, y }, camera);
    const intersects = raycaster.intersectObjects(photoGroup.children);

    if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (currentState !== CONFIG.states.FOCUS) {
            currentState = CONFIG.states.FOCUS;
            gsap.to(obj.position, { x: 0, y: 0, z: 15, duration: 1 });
            gsap.to(obj.scale, { x: 3, y: 3, duration: 1 });
            
            // 3秒后自动返回
            setTimeout(() => {
                gsap.to(obj.position, { x: obj.userData.originalPos.x, y: obj.userData.originalPos.y, z: obj.userData.originalPos.z, duration: 1 });
                gsap.to(obj.scale, { x: 1, y: 1, duration: 1 });
                currentState = CONFIG.states.SCATTER;
            }, 3000);
        }
    }
}

/**
 * 渲染循环
 */
function animate() {
    requestAnimationFrame(animate);

    // 平滑旋转
    scene.rotation.y += (targetRotation.y - scene.rotation.y) * 0.05;
    scene.rotation.x += (targetRotation.x - scene.rotation.x) * 0.05;

    // 粒子自转和微动
    if (instancedMesh) {
        instancedMesh.rotation.y += 0.002;
    }

    renderer.render(scene, camera);
}

// 窗口自适应
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动
window.onload = initScene;
</script>
</body>
</html>
