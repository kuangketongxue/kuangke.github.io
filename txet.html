<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Morning Intelligence Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --dark-bg: #0a0c10;
        }
        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(55, 120, 212, 0.05) 0%, transparent 50%);
            color: #e0e0e0;
            font-family: 'Noto Serif SC', serif;
            min-height: 100vh;
        }
        .luxury-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 2px; /* 更加硬朗的奢侈品设计风格 */
        }
        .gold-text { color: var(--gold); font-family: 'Cinzel', serif; }
        .gold-border { border-color: var(--gold); }
        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: black;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        .input-luxury {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s;
        }
        .input-luxury:focus {
            border-color: var(--gold);
            outline: none;
            background: rgba(255,255,255,0.05);
        }
        /* 自定义 Markdown 样式 */
        .briefing-content h2 { color: var(--gold); font-size: 1.5rem; margin-top: 2rem; border-left: 3px solid var(--gold); padding-left: 1rem; }
        .briefing-content strong { color: #fff; border-bottom: 1px solid var(--gold); }
        .briefing-content li { list-style: none; padding-left: 1.5rem; position: relative; margin-bottom: 1rem; }
        .briefing-content li::before { content: "◆"; position: absolute; left: 0; color: var(--gold); font-size: 0.8rem; top: 0.2rem; }
    </style>
</head>
<body class="p-4 md:p-12">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl gold-text font-bold tracking-widest mb-4">INTELLIGENCE BRIEFING</h1>
            <div class="h-px w-32 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent mx-auto"></div>
            <p class="mt-4 text-gray-500 uppercase tracking-widest text-xs">Crypto · AI Performance · RWA Strategy</p>
        </header>

        <!-- Config Panel -->
        <div class="luxury-card p-8 mb-12 shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div>
                    <label class="block text-xs uppercase tracking-tighter text-gray-500 mb-2">DeepSeek Master Key</label>
                    <input type="password" id="deepseekKey" class="input-luxury w-full p-3 text-sm" placeholder="sk-...">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-tighter text-gray-500 mb-2">Tavily Intelligence Key</label>
                    <input type="password" id="tavilyKey" class="input-luxury w-full p-3 text-sm" placeholder="tvly-...">
                </div>
            </div>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="query" 
                    value="加密货币市场趋势，大模型(Claude/GPT/DeepSeek)性能突破，RWA现实资产代币化最新进展" 
                    class="input-luxury flex-1 p-3 text-sm font-light">
                <button onclick="fetchBriefing()" id="runBtn" class="btn-gold px-10 py-3 text-sm uppercase">开启高净值简报</button>
            </div>
        </div>

        <!-- Status -->
        <div id="status" class="hidden text-center mb-12">
            <div class="inline-block animate-pulse text-gold text-sm tracking-widest">正在连接全球情报网络...</div>
        </div>

        <!-- Main Content -->
        <div id="report" class="hidden animate-in slide-in-from-bottom duration-1000">
            <div class="luxury-card p-10 relative shadow-2xl">
                <div class="absolute top-4 right-4 flex gap-4">
                    <button onclick="copyContent()" class="text-xs text-gray-500 hover:text-[#D4AF37] transition uppercase tracking-widest">[ 复制全文 ]</button>
                    <button onclick="speakContent()" class="text-xs text-gray-500 hover:text-[#D4AF37] transition uppercase tracking-widest">[ 语音播报 ]</button>
                </div>
                
                <div id="content" class="briefing-content text-gray-300 leading-relaxed font-light text-lg">
                    <!-- 内容加载 -->
                </div>

                <div class="mt-12 pt-8 border-t border-white/5 flex justify-between items-center text-[10px] text-gray-600 uppercase tracking-[0.3em]">
                    <span>Confidential Intelligence</span>
                    <span>© 2024 AI Morning Suite</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Key
        document.getElementById('deepseekKey').value = localStorage.getItem('luxury_ds_key') || '';
        document.getElementById('tavilyKey').value = localStorage.getItem('luxury_tv_key') || '';

        async function fetchBriefing() {
            const dsKey = document.getElementById('deepseekKey').value.trim();
            const tvKey = document.getElementById('tavilyKey').value.trim();
            const query = document.getElementById('query').value.trim();

            if (!dsKey || !tvKey) return alert("请在控制台输入您的 API 密钥。");

            localStorage.setItem('luxury_ds_key', dsKey);
            localStorage.setItem('luxury_tv_key', tvKey);

            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            const report = document.getElementById('report');
            const content = document.getElementById('content');

            btn.disabled = true;
            status.classList.remove('hidden');
            report.classList.add('hidden');

            try {
                // 1. Tavily Intelligence Search
                const searchRes = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: tvKey,
                        query: query + " 深度资讯 性能评测 行业报告",
                        search_depth: "advanced",
                        max_results: 8
                    })
                });
                const searchData = await searchRes.json();
                const context = searchData.results.map(r => `Source: ${r.title}\nContent: ${r.content}`).join('\n\n');

                // 2. DeepSeek Logic
                const dsRes = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${dsKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { 
                                role: "system", 
                                content: `你是一位服务于顶级投资机构的首席分析师。请根据搜索结果撰写一份简报。
                                重点关注：
                                1. 加密货币：不仅是价格，还有协议层面的创新。
                                2. AI 性能：DeepSeek、OpenAI、Anthropic 等模型的功能边界、推理能力变化。
                                3. RWA：传统资产上链的最新合规进展与流动性变化。
                                格式要求：
                                - 使用 Markdown。
                                - 语言要“奢侈、克制、精准”，去掉废话。
                                - 分为【核心洞察】、【技术演进】、【策略建议】。` 
                            },
                            { role: "user", content: `情报来源：\n${context}` }
                        ]
                    })
                });

                if (!dsRes.ok) throw new Error(dsRes.status === 402 ? "资金账户空盈，请注资。" : "情报获取中断。");
                
                const dsData = await dsRes.json();
                content.innerHTML = formatMarkdown(dsData.choices[0].message.content);
                report.classList.remove('hidden');
                
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                status.classList.add('hidden');
            }
        }

        function formatMarkdown(text) {
            return text
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^### (.*$)/gim, '<h3 class="text-white font-bold mt-4">$1</h3>')
                .replace(/^\* (.*$)/gim, '<li>$1</li>')
                .replace(/^- (.*$)/gim, '<li>$1</li>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function copyContent() {
            const text = document.getElementById('content').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("情报已存入剪贴板。");
            });
        }

        function speakContent() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(document.getElementById('content').innerText);
            msg.lang = 'zh-CN';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
