<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Morning Assistant | 尊享版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #0a0a0a; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: 'Noto Sans SC', sans-serif; }
        .luxury-border { border: 1px solid rgba(212, 175, 55, 0.3); }
        .gold-gradient { background: linear-gradient(135deg, #CFB53B 0%, #F7EF8A 50%, #AA771C 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gold { background: linear-gradient(135deg, #D4AF37 0%, #8A6D3B 100%); color: black; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }
        .premium-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.2); color: white; }
        .premium-input:focus { border-color: var(--gold); outline: none; background: rgba(255,255,255,0.1); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-5xl mx-auto px-6 py-12">
        <!-- Header -->
        <header class="text-center mb-16 animate-in fade-in slide-in-from-top duration-1000">
            <h1 class="font-['Cinzel'] text-5xl tracking-widest mb-2 gold-gradient">ELITE INTELLIGENCE</h1>
            <p class="text-gray-500 tracking-widest uppercase text-xs">尊崇您的每秒价值 | 每日简报</p>
        </header>

        <!-- Config Section -->
        <section class="glass-panel p-8 rounded-3xl mb-12 shadow-2xl relative overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <input type="password" id="dsKey" placeholder="DeepSeek Private Key" class="premium-input p-4 rounded-xl text-sm">
                <input type="password" id="tvKey" placeholder="Tavily Secret Key" class="premium-input p-4 rounded-xl text-sm">
            </div>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="query" value="全球AI突破、顶级商业机会、YouTube流量爆炸新趋势(近7天)" class="flex-1 premium-input p-4 rounded-xl font-light">
                <button onclick="executeRoutine()" id="runBtn" class="btn-gold px-10 py-4 rounded-xl font-bold uppercase tracking-tighter">开启战略简报</button>
            </div>
        </section>

        <!-- Loading State -->
        <div id="status" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-[#D4AF37] mb-4"></div>
            <p class="text-gray-400 italic font-extralight tracking-widest" id="statusText">正在筛选顶级情报...</p>
        </div>

        <!-- Content Area -->
        <main id="report" class="hidden animate-in fade-in zoom-in duration-700">
            <div class="glass-panel p-10 rounded-[2rem] shadow-2xl border-t border-l border-white/10">
                <div class="flex justify-between items-center mb-10">
                    <span class="text-xs tracking-[0.3em] text-gray-500 uppercase font-bold">Today's Strategic Insight</span>
                    <div class="flex gap-4">
                        <button onclick="copyContent()" class="text-[#D4AF37] border border-[#D4AF37]/30 px-4 py-1 rounded-full text-xs hover:bg-[#D4AF37]/10 transition">复制全文</button>
                        <button onclick="speak()" class="bg-white/10 px-4 py-1 rounded-full text-xs hover:bg-white/20 transition">🔊 语音播放</button>
                    </div>
                </div>
                
                <article id="content" class="text-gray-300 space-y-6 leading-relaxed font-light text-lg">
                    <!-- AI Content -->
                </article>
            </div>
            <footer class="mt-8 text-center text-gray-600 text-[10px] tracking-widest">
                EXCLUSIVE ACCESS FOR MILLION-SUBSCRIBER CREATORS
            </footer>
        </main>
    </div>

    <script>
        // 初始化
        document.getElementById('dsKey').value = localStorage.getItem('ds_key_lux') || '';
        document.getElementById('tvKey').value = localStorage.getItem('tv_key_lux') || '';

        async function executeRoutine() {
            const dsKey = document.getElementById('dsKey').value.trim();
            const tvKey = document.getElementById('tvKey').value.trim();
            const query = document.getElementById('query').value.trim();

            if (!dsKey || !tvKey) return alert("请授权 API Key 开启简报");
            
            localStorage.setItem('ds_key_lux', dsKey);
            localStorage.setItem('tv_key_lux', tvKey);

            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            const reportDiv = document.getElementById('report');
            const contentDiv = document.getElementById('content');

            btn.disabled = true;
            status.classList.remove('hidden');
            reportDiv.classList.add('hidden');

            try {
                // 1. Tavily 搜索 - 强化“时间窗”和“广度”
                const searchRes = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: tvKey,
                        query: query,
                        search_depth: "advanced",
                        time_range: "week", // 强制近7天
                        max_results: 8
                    })
                });
                
                const searchData = await searchRes.json();
                const context = searchData.results.map(r => `[${r.title}]: ${r.content}`).join('\n\n');

                // 2. DeepSeek - 角色设定升级
                const dsRes = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${dsKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [{
                            role: "system", 
                            content: `你是一位顶级私人助理，服务于日入百万的商业领袖兼百万粉YouTube博主。
                            你的任务是：
                            1. 信息脱水：只保留近7天最震撼、最有商业潜力的信息，剔除废话。
                            2. 战略眼光：分析这些信息对内容创作或资产增值有什么价值。
                            3. 风格：冷峻、高效、极其专业。
                            请使用Markdown排版，必须包含：【核心情报】、【商业/内容机会点】、【今日决策建议】。`
                        }, {
                            role: "user", 
                            content: `素材来源：\n${context}`
                        }]
                    })
                });

                if (dsRes.status === 402) throw new Error("余额已罄，请速充值。");
                const dsData = await dsRes.json();
                const rawContent = dsData.choices[0].message.content;

                contentDiv.innerHTML = formatMarkdown(rawContent);
                reportDiv.classList.remove('hidden');
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                status.classList.add('hidden');
            }
        }

        function formatMarkdown(text) {
            return text
                .replace(/^# (.*$)/gim, '<h1 class="text-3xl font-bold gold-gradient mt-8 mb-4 tracking-tighter">$1</h1>')
                .replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold text-white mt-8 mb-4 border-l-2 border-[#D4AF37] pl-4">$1</h2>')
                .replace(/^【(.*)】/gim, '<span class="text-[#D4AF37] font-bold text-lg">【$1】</span>')
                .replace(/\*\*(.*)\*\*/gim, '<strong class="text-white font-medium">$1</strong>')
                .replace(/^\* (.*$)/gim, '<p class="ml-4 mb-2">• $1</p>')
                .split('\n').join('<br>');
        }

        async function copyContent() {
            const text = document.getElementById('content').innerText;
            await navigator.clipboard.writeText(text);
            alert("已复制到剪贴板，尊驾请审阅。");
        }

        function speak() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(document.getElementById('content').innerText);
            msg.lang = 'zh-CN';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
