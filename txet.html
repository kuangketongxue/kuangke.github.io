<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D圣诞树手势交互系统 - Creative Tech</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        /* UI 层 */
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); z-index: 10;
        }
        .status-panel { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #d4af37; }
        .controls { margin-top: 10px; font-size: 12px; color: #fff; }
        
        /* 隐藏的视频预览 */
        #video-input { position: absolute; bottom: 20px; right: 20px; width: 240px; height: 180px; 
                       border: 2px solid #d4af37; border-radius: 10px; transform: scaleX(-1); }
        
        /* 上传按钮 */
        #upload-btn {
            background: #b22222; color: white; border: none; padding: 10px 20px;
            cursor: pointer; border-radius: 5px; transition: 0.3s; margin-top: 10px;
        }
        #upload-btn:hover { background: #ff4500; box-shadow: 0 0 15px #ff4500; }
        
        canvas { display: block; }
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #d4af37; font-size: 24px; text-align: center;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div class="status-panel">
        <h2>🎄 魔法手势圣诞树</h2>
        <div id="gesture-hint">正在初始化摄像头...</div>
        <button id="upload-btn" onclick="document.getElementById('file-input').click()">上传照片云 (可多选)</button>
        <input type="file" id="file-input" multiple accept="image/*" style="display:none">
        <div class="controls">
            ✊ 握拳：合拢圣诞树 | 🖐️ 张手：元素散开<br>
            🔄 移动：旋转视角 | 👌 抓取：放大照片
        </div>
    </div>
</div>

<div id="loader">资源加载中...</div>
<video id="video-input" autoplay playsinline></video>
<div id="container"></div>

<!-- 引入依赖 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/**
 * 核心配置
 */
const CONFIG = {
    count: 600, // 粒子总数
    states: { CLOSED: 'closed', DISPERSED: 'dispersed', ZOOM: 'zoom' },
    colors: {
        green: new THREE.Color(0x1a472a),  // 哑光绿
        gold: new THREE.Color(0xd4af37),   // 金属金
        red: new THREE.Color(0xb22222)     // 圣诞红
    }
};

let scene, camera, renderer, composer, hands, cameraEntity;
let currentState = CONFIG.states.CLOSED;
let elements = []; // 存储所有实例的数据
let instancedMeshSphere, instancedMeshBox, instancedMeshCone;
let photoMeshes = []; // 照片云
let targetRotation = { x: 0, y: 0 };
let currentRotation = { x: 0, y: 0 };

/**
 * 初始化应用
 */
async function init() {
    // 场景基础
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.getElementById('container').appendChild(renderer.domElement);

    // 后处理：辉光效果
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.1;
    composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // 灯光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xd4af37, 2, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    createTreeElements();
    initMediaPipe();
    animate();
    
    document.getElementById('loader').style.display = 'none';
    setupPhotoUpload();
}

/**
 * 创建圣诞树元素 (InstancedMesh)
 */
function createTreeElements() {
    const sphereGeom = new THREE.SphereGeometry(0.15, 16, 16);
    const boxGeom = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    
    // 材质
    const goldMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 0.9, roughness: 0.1 });
    const greenMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.green, roughness: 0.8 });
    const redMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.red, emissive: 0x330000 });

    instancedMeshSphere = new THREE.InstancedMesh(sphereGeom, goldMat, CONFIG.count / 2);
    instancedMeshBox = new THREE.InstancedMesh(boxGeom, redMat, CONFIG.count / 2);
    
    scene.add(instancedMeshSphere);
    scene.add(instancedMeshBox);

    // 初始化位置数据
    for (let i = 0; i < CONFIG.count; i++) {
        const data = {
            id: i,
            phase: Math.random() * Math.PI * 2,
            speed: 0.02 + Math.random() * 0.05,
            randomDir: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
            closedPos: getTreePosition(i),
            dispersedPos: new THREE.Vector3((Math.random()-0.5)*30, (Math.random()-0.5)*30, (Math.random()-0.5)*30),
            currentPos: new THREE.Vector3()
        };
        data.currentPos.copy(data.closedPos);
        elements.push(data);
    }
}

// 圣诞树圆锥算法
function getTreePosition(i) {
    const layer = Math.floor(Math.sqrt(i));
    const angle = i * 0.5;
    const radius = layer * 0.2;
    const y = -layer * 0.5 + 5;
    return new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
}

/**
 * 手势处理
 */
function initMediaPipe() {
    const videoElement = document.getElementById('video-input');
    hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(onHandResults);

    const cameraControl = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 640, height: 480
    });
    cameraControl.start();
}

function onHandResults(results) {
    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;
    
    const landmarks = results.multiHandLandmarks[0];
    const hint = document.getElementById('gesture-hint');

    // 1. 判断握拳 (Fist) vs 张手 (Open)
    // 简单的逻辑：指尖到掌心的距离
    const thumbTip = landmarks[4];
    const indexTip = landmarks[8];
    const middleTip = landmarks[12];
    const ringTip = landmarks[16];
    const pinkyTip = landmarks[20];
    const wrist = landmarks[0];

    const dist = (p1, p2) => Math.sqrt((p1.x-p2.x)**2 + (p1.y-p2.y)**2);
    const avgDist = (dist(indexTip, wrist) + dist(middleTip, wrist) + dist(ringTip, wrist) + dist(pinkyTip, wrist)) / 4;

    if (avgDist < 0.3) {
        currentState = CONFIG.states.CLOSED;
        hint.innerText = "状态：合拢 (握拳)";
    } else {
        if (currentState === CONFIG.states.CLOSED) currentState = CONFIG.states.DISPERSED;
        hint.innerText = "状态：散开 (张手)";
        
        // 旋转逻辑：根据手掌中心位置
        targetRotation.y = (landmarks[9].x - 0.5) * 4;
        targetRotation.x = (landmarks[9].y - 0.5) * 2;
    }

    // 2. 抓取动作 (Pinch) -> 放大照片
    const pinchDist = dist(thumbTip, indexTip);
    if (pinchDist < 0.05 && photoMeshes.length > 0) {
        currentState = CONFIG.states.ZOOM;
        hint.innerText = "状态：抓取放大照片";
    }
}

/**
 * 动画循环
 */
function animate() {
    requestAnimationFrame(animate);

    const dummy = new THREE.Object3D();
    const time = Date.now() * 0.001;

    // 平滑相机旋转
    currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
    currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;
    scene.rotation.set(currentRotation.x, currentRotation.y, 0);

    elements.forEach((el, i) => {
        let target = new THREE.Vector3();
        
        if (currentState === CONFIG.states.CLOSED) {
            target.copy(el.closedPos);
        } else {
            // 散开态：带一点浮动动画
            target.x = el.dispersedPos.x + Math.sin(time + el.phase) * 0.5;
            target.y = el.dispersedPos.y + Math.cos(time + el.phase) * 0.5;
            target.z = el.dispersedPos.z;
        }

        el.currentPos.lerp(target, 0.08);
        dummy.position.copy(el.currentPos);
        dummy.rotation.y = time * el.speed;
        dummy.updateMatrix();

        if (i < CONFIG.count / 2) {
            instancedMeshSphere.setMatrixAt(i, dummy.matrix);
        } else {
            instancedMeshBox.setMatrixAt(i - CONFIG.count / 2, dummy.matrix);
        }
    });

    instancedMeshSphere.instanceMatrix.needsUpdate = true;
    instancedMeshBox.instanceMatrix.needsUpdate = true;

    // 照片云逻辑
    photoMeshes.forEach((mesh, idx) => {
        if (currentState === CONFIG.states.ZOOM && idx === 0) { // 抓取第一张为例
            const targetPos = new THREE.Vector3(0, 0, 10);
            mesh.position.lerp(targetPos, 0.1);
            mesh.scale.lerp(new THREE.Vector3(2, 2, 2), 0.1);
        } else if (currentState === CONFIG.states.CLOSED) {
            mesh.position.lerp(new THREE.Vector3(0,0,0), 0.1);
            mesh.scale.lerp(new THREE.Vector3(0.1, 0.1, 0.1), 0.1);
        } else {
            // 散落在树周围
            const angle = (idx / photoMeshes.length) * Math.PI * 2;
            const targetPos = new THREE.Vector3(Math.cos(angle)*6, Math.sin(time*0.5 + idx)*2, Math.sin(angle)*6);
            mesh.position.lerp(targetPos, 0.05);
            mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            mesh.lookAt(camera.position);
        }
    });

    composer.render();
}

/**
 * 照片上传逻辑
 */
function setupPhotoUpload() {
    const fileInput = document.getElementById('file-input');
    fileInput.onchange = (e) => {
        const files = e.target.files;
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const loader = new THREE.TextureLoader();
                const texture = loader.load(event.target.result);
                const geometry = new THREE.PlaneGeometry(2, 2);
                const material = new THREE.MeshStandardMaterial({ 
                    map: texture, 
                    side: THREE.DoubleSide,
                    emissive: 0xffffff,
                    emissiveIntensity: 0.2
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                scene.add(mesh);
                photoMeshes.push(mesh);
            };
            reader.readAsDataURL(file);
        }
    };
}

// 窗口自适应
window.onresize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
};

init();
</script>
</body>
</html>
