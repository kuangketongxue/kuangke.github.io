<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 晨间数字助理 - 简报</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- 配置栏 -->
        <div class="glass p-6 rounded-2xl shadow-lg mb-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">☀️ AI 晨间数字助理</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="password" id="deepseekKey" placeholder="DeepSeek API Key" class="border p-2 rounded-lg text-sm">
                <input type="password" id="tavilyKey" placeholder="Tavily API Key" class="border p-2 rounded-lg text-sm">
            </div>
            <div class="mt-4 flex gap-2">
                <input type="text" id="query" value="过去24小时AI、大模型及科技圈重大新闻" class="flex-1 border p-2 rounded-lg">
                <button onclick="startMorningRoutine()" id="runBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">生成今日简报</button>
            </div>
        </div>

        <!-- 状态显示 -->
        <div id="status" class="text-center text-gray-600 mb-4 hidden">正在检索并分析中，请稍候...</div>

        <!-- 简报内容 -->
        <div id="report" class="glass p-8 rounded-2xl shadow-xl hidden">
            <div id="content" class="prose prose-blue max-w-none text-gray-700 leading-relaxed">
                <!-- AI 生成内容将在此处展示 -->
            </div>
            <hr class="my-6">
            <div class="flex justify-between items-center">
                <button onclick="speakContent()" class="text-blue-600 flex items-center gap-2">
                    <span>🔊 语音朗读简报</span>
                </button>
                <div class="text-xs text-gray-400">Powered by DeepSeek & Tavily</div>
            </div>
        </div>
    </div>

    <script>
        // 从本地存储加载 Key
        document.getElementById('deepseekKey').value = localStorage.getItem('ds_key') || '';
        document.getElementById('tavilyKey').value = localStorage.getItem('tv_key') || '';

        async function startMorningRoutine() {
            const dsKey = document.getElementById('deepseekKey').value;
            const tvKey = document.getElementById('tavilyKey').value;
            const query = document.getElementById('query').value;

            if (!dsKey || !tvKey) return alert("请先输入 API Keys");

            // 保存 Key
            localStorage.setItem('ds_key', dsKey);
            localStorage.setItem('tv_key', tvKey);

            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            const reportDiv = document.getElementById('report');
            const contentDiv = document.getElementById('content');

            btn.disabled = true;
            status.classList.remove('hidden');
            reportDiv.classList.add('hidden');

            try {
                // 1. 调用 Tavily 联网搜索
                const searchRes = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: tvKey,
                        query: query,
                        search_depth: "advanced",
                        max_results: 5
                    })
                });
                const searchData = await searchRes.json();
                const context = searchData.results.map(r => `标题: ${r.title}\n内容: ${r.content}`).join('\n\n');

                // 2. 调用 DeepSeek 进行脱水总结
                const dsRes = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${dsKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一个高效的晨间助理。请根据提供的搜索结果，进行'信息脱水'，总结出最值得关注的3-5条要点，并为用户提供1条今日行动建议。使用Markdown格式，语言简洁有力。" },
                            { role: "user", content: `搜索结果：\n${context}` }
                        ],
                        stream: false
                    })
                });
                const dsData = await dsRes.json();
                const finalReport = dsData.choices[0].message.content;

                // 3. 渲染结果
                contentDiv.innerHTML = formatMarkdown(finalReport);
                reportDiv.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert("生成失败，请检查 API Key 或网络连接");
            } finally {
                btn.disabled = false;
                status.classList.add('hidden');
            }
        }

        // 简单的 Markdown 处理 (替代复杂库)
        function formatMarkdown(text) {
            return text
                .replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-4 mb-2">$1</h3>')
                .replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-6 mb-3">$1</h2>')
                .replace(/^\* (.*$)/gim, '<li class="ml-4 mb-1 text-gray-700">$1</li>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        // 语音朗读
        function speakContent() {
            const text = document.getElementById('content').innerText;
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN';
            msg.rate = 1.1;
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
