<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 手势控制 - 奢华圣诞树粒子系统</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        #ui-overlay { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        .status-tag { background: rgba(255, 215, 0, 0.2); padding: 8px 15px; border: 1px solid #ffd700; border-radius: 20px; font-size: 14px; margin-bottom: 10px; }
        #upload-btn { pointer-events: auto; background: #c41e3a; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        #upload-btn:hover { background: #ff4d4d; box-shadow: 0 0 15px #c41e3a; }
        canvas { display: block; }
        video { position: absolute; bottom: 10px; right: 10px; width: 200px; height: 150px; border-radius: 10px; border: 2px solid #ffd700; transform: scaleX(-1); }
        .loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: #ffd700; }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div class="status-tag">状态: <span id="current-state">初始化相机...</span></div>
    <div class="status-tag">手势: <span id="gesture-hint">正在加载模型...</span></div>
    <button id="upload-btn">上传照片 (JPG/PNG)</button>
    <input type="file" id="file-input" multiple style="display: none;">
</div>

<video id="video" playsinline></video>
<div id="container"></div>

<!-- 依赖库 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<!-- 后期处理 -->
<script type="module">
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    // --- 配置 ---
    const CONFIG = {
        treeHeight: 12,
        radius: 6,
        instanceCount: 800, // 粒子+几何体总数
        colors: {
            matteGreen: 0x1a472a,
            metallicGold: 0xffd700,
            xmasRed: 0xc41e3a
        }
    };

    let scene, camera, renderer, composer, hands, videoElement;
    let instancedMesh, photoGroup;
    let currentState = 'CLOSED'; // CLOSED, OPEN, ZOOMED
    let items = []; // 存储每个实例的目标位置
    let textureLoader = new THREE.TextureLoader();
    let photoTextures = [];

    // --- 初始化场景 ---
    function initScene() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.getElementById('container').appendChild(renderer.domElement);

        // 灯光 - 营造电影感
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffd700, 2, 50);
        pointLight.position.set(5, 10, 5);
        scene.add(pointLight);

        // 后期处理：辉光
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2;
        
        composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        createTreeElements();
    }

    // --- 创建圣诞树元素 ---
    function createTreeElements() {
        // 使用 InstancedMesh 提升性能
        const geometries = [
            new THREE.SphereGeometry(0.15, 16, 16),
            new THREE.BoxGeometry(0.2, 0.2, 0.2),
            new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8) // 糖果棍简化版
        ];

        const material = new THREE.MeshStandardMaterial({
            metalness: 0.8,
            roughness: 0.2,
            vertexColors: true
        });

        instancedMesh = new THREE.InstancedMesh(geometries[0], material, CONFIG.instanceCount);
        
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        for (let i = 0; i < CONFIG.instanceCount; i++) {
            // 初始分布：圆锥体（合拢态）
            const y = Math.random() * CONFIG.treeHeight;
            const ratio = (CONFIG.treeHeight - y) / CONFIG.treeHeight;
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * CONFIG.radius * ratio;

            const targetPos = new THREE.Vector3(
                Math.cos(angle) * r,
                y - 5,
                Math.sin(angle) * r
            );

            const scatterPos = new THREE.Vector3(
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 30
            );

            // 随机颜色
            const rand = Math.random();
            if (rand < 0.6) color.set(CONFIG.colors.matteGreen);
            else if (rand < 0.8) color.set(CONFIG.colors.metallicGold);
            else color.set(CONFIG.colors.xmasRed);

            items.push({
                closed: targetPos.clone(),
                open: scatterPos.clone(),
                current: targetPos.clone(),
                rot: new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, 0)
            });

            dummy.position.copy(targetPos);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
            instancedMesh.setColorAt(i, color);
        }
        
        scene.add(instancedMesh);
        
        // 照片云容器
        photoGroup = new THREE.Group();
        scene.add(photoGroup);
    }

    // --- 处理上传照片 ---
    document.getElementById('upload-btn').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = (e) => {
        const files = e.target.files;
        for (let file of files) {
            const url = URL.createObjectURL(file);
            textureLoader.load(url, (tex) => {
                const geometry = new THREE.PlaneGeometry(1.5, 1.5);
                const material = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geometry, material);
                
                // 初始位置在树中
                const y = Math.random() * CONFIG.treeHeight - 5;
                mesh.position.set(Math.random()-0.5, y, Math.random()-0.5);
                mesh.userData.originalPos = mesh.position.clone();
                mesh.userData.scatterPos = new THREE.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*15);
                
                photoGroup.add(mesh);
            });
        }
    };

    // --- 手势识别逻辑 ---
    async function initMediaPipe() {
        videoElement = document.getElementById('video');
        hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onHandResults);

        const cameraPipe = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        cameraPipe.start();
        document.getElementById('gesture-hint').innerText = "等待手势...";
    }

    function onHandResults(results) {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

        const landmarks = results.multiHandLandmarks[0];
        
        // 1. 判断握拳 (Fist) -> 合拢态
        // 判断标准：除大拇指外四指指尖距离掌心比指关节近
        const isFist = landmarks[8].y > landmarks[6].y && landmarks[12].y > landmarks[10].y && landmarks[16].y > landmarks[14].y;
        
        // 2. 判断张开 (Open) -> 散开态
        const isOpen = landmarks[8].y < landmarks[6].y && landmarks[12].y < landmarks[10].y && landmarks[20].y < landmarks[18].y;

        // 3. 判断抓取 (Pinch) -> 照片放大
        const dist = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);
        const isPinch = dist < 0.05;

        // 状态切换动画
        if (isFist && currentState !== 'CLOSED') {
            transitionTo('CLOSED');
        } else if (isOpen && !isPinch && currentState !== 'OPEN') {
            transitionTo('OPEN');
        } else if (isPinch && currentState === 'OPEN') {
            transitionTo('ZOOMED');
        }

        // 4. 手部移动控制相机旋转
        const handX = (landmarks[9].x - 0.5) * 2; // 掌心位置
        const handY = (landmarks[9].y - 0.5) * 2;
        
        if (currentState === 'OPEN') {
            gsap.to(camera.position, {
                x: handX * 15,
                y: -handY * 15 + 5,
                duration: 1
            });
            camera.lookAt(0, 0, 0);
        }
    }

    function transitionTo(state) {
        currentState = state;
        document.getElementById('current-state').innerText = state;
        const dummy = new THREE.Object3D();

        items.forEach((item, i) => {
            const target = state === 'CLOSED' ? item.closed : item.open;
            gsap.to(item.current, {
                x: target.x,
                y: target.y,
                z: target.z,
                duration: 1.5,
                ease: "power2.inOut",
                onUpdate: () => {
                    dummy.position.copy(item.current);
                    dummy.rotation.copy(item.rot);
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(i, dummy.matrix);
                },
                onComplete: () => { instancedMesh.instanceMatrix.needsUpdate = true; }
            });
        });

        // 照片动画
        photoGroup.children.forEach((mesh, i) => {
            let target;
            if (state === 'CLOSED') target = mesh.userData.originalPos;
            else if (state === 'OPEN') target = mesh.userData.scatterPos;
            else if (state === 'ZOOMED' && i === 0) { // 简单逻辑：放大第一张
                target = new THREE.Vector3(0, 0, 10);
                gsap.to(mesh.scale, { x: 3, y: 3, z: 3, duration: 1 });
            }

            if (target) {
                gsap.to(mesh.position, {
                    x: target.x, y: target.y, z: target.z,
                    duration: 1.5, ease: "expo.out"
                });
            }
            if (state !== 'ZOOMED') gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 1 });
        });
    }

    // --- 渲染循环 ---
    function animate() {
        requestAnimationFrame(animate);
        
        const time = Date.now() * 0.001;
        
        // 自动微旋
        if (currentState === 'CLOSED') {
            instancedMesh.rotation.y += 0.005;
            photoGroup.rotation.y += 0.005;
        }

        // 让粒子有呼吸感
        instancedMesh.instanceMatrix.needsUpdate = true;
        
        composer.render();
    }

    // 响应式
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    // 启动
    initScene();
    initMediaPipe();
    animate();

</script>
</body>
</html>
