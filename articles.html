<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投资相关文章 - CryptoVision Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入优雅的字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        :root {
            /* 主色系 - 奢华紫金 */
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-gold: #d4af37;
            --accent-silver: #c0c0c0;
            --accent-bronze: #cd7f32;
            
            /* 状态色 */
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            
            /* 背景色 */
            --dark-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-hover-bg: rgba(30, 41, 59, 0.95);
            
            /* 文字色 */
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            
            /* 边框色 */
            --border-color: rgba(148, 163, 184, 0.2);
            --border-highlight: rgba(212, 175, 55, 0.3);
            
            /* 阴影 */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.25);
            --shadow-glow: 0 0 20px rgba(212, 175, 55, 0.3);
            
            /* 字体 */
            --font-serif: 'Noto Serif SC', 'Source Han Serif SC', serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            font-family: var(--font-sans);
            background: 
                linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.85)),
                url('images/1b2f1ee2a9dba66e20cd0e210ba09e28.png') no-repeat center center fixed;
            background-size: cover;
            background-blend-mode: overlay;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.7;
            letter-spacing: 0.3px;
        }
        
        /* ========== Header 样式 ========== */
        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-highlight);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }
        
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-family: var(--font-serif);
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-silver), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        
        .reading-return {
            color: var(--text-secondary);
            text-decoration: none;
            margin-right: 1rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .reading-return:hover {
            color: var(--accent-gold);
            transform: translateX(-3px);
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 1px solid var(--border-highlight);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        
        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
            border-color: var(--accent-gold);
        }
        
        /* ========== 主容器 ========== */
        .main-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
        }
        
        .page-title {
            text-align: center;
            margin-bottom: 3rem;
            font-family: var(--font-serif);
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-silver) 50%, var(--primary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: var(--shadow-lg);
            position: relative;
            padding-bottom: 1.5rem;
        }
        
        .page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            border-radius: 2px;
        }
        
        .page-title i {
            color: var(--accent-gold);
            margin-right: 1rem;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
        }
        
        /* ========== 筛选栏 ========== */
        .filter-bar {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        
        .filter-bar select {
            border: 1px solid var(--border-highlight);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            cursor: pointer;
            font-family: var(--font-sans);
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            letter-spacing: 0.5px;
        }
        
        .filter-bar select:hover {
            border-color: var(--accent-gold);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }
        
        .filter-bar select:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        
        /* ========== 文章网格 ========== */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .article-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            position: relative;
        }
        
        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        
        .article-card:hover {
            transform: translateY(-12px);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            border-color: var(--border-highlight);
            background: var(--card-hover-bg);
        }
        
        .article-card:hover::before {
            opacity: 1;
        }
        
        .article-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }
        
        .article-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { transform: translateX(-100%) rotate(45deg); }
            50% { transform: translateX(100%) rotate(45deg); }
        }
        
        .article-content {
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .article-date {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .article-date i {
            color: var(--accent-gold);
        }
        
        .article-title {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.5;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        
        .article-category {
            display: inline-block;
            padding: 0.4rem 0.9rem;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(102, 126, 234, 0.2));
            border: 1px solid var(--border-highlight);
            border-radius: 20px;
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: var(--shadow-sm);
        }
        
        .article-description {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            flex: 1;
            letter-spacing: 0.3px;
        }
        
        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
        
        .article-stats {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            color: var(--text-tertiary);
        }
        
        .article-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }
        
        .article-stat i {
            color: var(--accent-silver);
        }
        
        .read-btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-bronze));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: var(--shadow-sm);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        
        .read-btn:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-glow);
            background: linear-gradient(135deg, var(--accent-bronze), var(--accent-gold));
        }
        
        .read-btn i {
            transition: transform 0.3s ease;
        }
        
        .read-btn:hover i {
            transform: translateX(3px);
        }
        
        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 5rem 1rem;
            color: var(--text-tertiary);
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
            color: var(--accent-silver);
        }
        
        .empty-state h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }
        
        .empty-state p {
            font-size: 1.1rem;
        }
        
        /* ========== Toast通知 ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1001;
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border-left: 4px solid var(--primary-color);
            border: 1px solid var(--border-highlight);
            color: var(--text-primary);
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            transform: translateX(400px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: var(--shadow-lg);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.success {
            border-left-color: var(--success-color);
        }
        
        .toast.warning {
            border-left-color: var(--warning-color);
        }
        
        .toast i {
            font-size: 1.25rem;
        }
        
        /* ========== Footer ========== */
        .social-footer {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid var(--border-highlight);
            padding: 3rem 0;
            margin-top: 5rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            text-align: center;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }
        
        .social-link:hover {
            color: var(--accent-gold);
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: var(--shadow-glow);
        }
        
        .copyright {
            color: var(--text-tertiary);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        
        /* ========== 响应式设计 ========== */
        @media (max-width: 768px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }
            
            .page-title {
                font-size: 2.5rem;
            }
            
            .filter-bar {
                justify-content: flex-start;
            }
            
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }
            
            .logo {
                font-size: 1.5rem;
            }
        }
        
        /* ========== 滚动条美化 ========== */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-gold), var(--accent-bronze));
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--accent-bronze), var(--accent-gold));
        }
    </style>
</head>

    <main class="main-container">

        <!-- 筛选栏 -->
        <div class="filter-bar">

        <section class="articles-grid" id="articlesContainer"></section>

        <div id="emptyState" class="empty-state" style="display:none;">

    <!-- Toast通知 -->

        <i class="fas fa-check-circle"></i>

    <!-- Footer -->
    <footer class="social-footer" role="contentinfo">
        <div class="container">
            <nav class="social-links" aria-label="社交媒体">

    <script>
        // ========== 示例文章数据 ==========
        const articlesData = [
            {
                id: 1,
                title: "比特币白皮书",
                category: "技术分析",
                date: "2025-11-02",
                description: "比特币白皮书",
                readTime: 0,
                views: 0,
                icon: "📊",
                link: "https://wvwp6ekrk9f.feishu.cn/share/base/view/shrcn7mhhSgSppuEeXbTMCGudwc"
            },
            {
                id: 2,
                title: "aidog使用方法",
                category: "技术分析",
                date: "2025-11-02",
                description: "aidog使用视频教程",
                readTime: 0,
                views: 0,
                icon: "🔮",
                link: "https://mp.weixin.qq.com/s/qFMt1kPTQCRwTzsZRfOgeg"
            },
            {
                id: 3,
                title: "《精通比特币》",
                category: "技术分析",
                date: "2025-01-02",
                description: "学习如何使用aidog投资",
                readTime: 0,
                views: 0,
                icon: "⛓️",
                link: "https://wvwp6ekrk9f.feishu.cn/share/base/view/shrcn7mhhSgSppuEeXbTMCGudwc"
            }
        ];
        
        // ========== 工具函数 ==========
        function showToast(msg, type = 'success') {
            const el = document.getElementById('toast');
            const txt = document.getElementById('toastMsg');
            txt.textContent = msg;
            el.className = 'toast ' + type + ' show';
            setTimeout(() => el.classList.remove('show'), 2800);
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
        
        // ========== 渲染文章 ==========
        function renderArticles(articles) {
            const container = document.getElementById('articlesContainer');
            const emptyState = document.getElementById('emptyState');
            
            if (articles.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            container.innerHTML = articles.map(article => `
                <article class="article-card">
                    <div class="article-header">
                        ${article.icon}
                    </div>
                    <div class="article-content">
                        <div class="article-date">
                            <i class="fas fa-calendar-days"></i>
                            ${formatDate(article.date)}
                        </div>
                        <h2 class="article-title">${article.title}</h2>
                        <span class="article-category">${article.category}</span>
                        <p class="article-description">${article.description}</p>
                        <div class="article-footer">
                            <div class="article-stats">
                                <div class="article-stat">
                                    <i class="fas fa-clock"></i>
                                    ${article.readTime} 分钟
                                </div>
                                <div class="article-stat">
                                    <i class="fas fa-eye"></i>
                                    ${article.views} 浏览
                                </div>
                            </div>
                            <a href="${article.link || '#'}"
                               ${article.link ? 'target="_blank" rel="noopener noreferrer"' : ''}
                               onclick="openArticle(${article.id}); return false;"
                               class="read-btn">
                                阅读文章
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </article>
            `).join('');
        }
        
        function filterArticles() {
            const category = document.getElementById('categoryFilter').value;
            const filtered = category
                ? articlesData.filter(a => a.category === category)
                : articlesData;
            renderArticles(filtered);
        }
        
        function openArticle(id) {
            const article = articlesData.find(a => a.id === id);
            if (article) {
                if (article.link && article.link.trim() !== '') {
                    window.open(article.link, '_blank', 'noopener,noreferrer');
                    showToast(`正在打开: ${article.title}`, 'success');
                } else {
                    showToast('文章链接暂未配置', 'warning');
                }
            }
        }
        
        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderArticles(articlesData);
            document.getElementById('categoryFilter').addEventListener('change', filterArticles);
        });
    </script>
</body>
</html>
