<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【狂客】极客周刊 - 狂客·银河</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 周刊容器样式 */
        .weekly-container {
            max-width: 1200px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }
        .weekly-title {
            text-align: center;
            margin-bottom: 50px;
        }
        .weekly-title h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .weekly-title p {
            font-size: 1.1em;
            color: #666;
            opacity: 0.8;
        }
        body.dark-mode .weekly-title p {
            color: #aaa;
        }
        
        /* 分类标签样式 */
        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 50px 0 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
        }
        .section-icon {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
        }
        body.dark-mode .section-title {
            color: #fff;
        }
        .section-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        /* 周刊列表 */
        .weekly-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .weekly-item {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        body.dark-mode .weekly-item {
            background: #2d3748;
        }
        .weekly-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        
        /* 本周标签 */
        .current-week-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .weekly-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
        }
        .weekly-item-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            max-width: 70%;
        }
        body.dark-mode .weekly-item-title {
            color: #fff;
        }
        .weekly-item-date {
            font-size: 1em;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark-mode .weekly-item-date {
            color: #aaa;
        }
        .weekly-item-content {
            margin-bottom: 25px;
        }
        .weekly-item-text {
            font-size: 1.1em;
            line-height: 1.8;
            color: #555;
            white-space: pre-wrap;
        }
        body.dark-mode .weekly-item-text {
            color: #ccc;
        }
        .weekly-item-video {
            margin-top: 20px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
            text-align: center;
        }
        .video-placeholder i {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .video-placeholder p {
            font-size: 1.2em;
            margin: 0;
        }
        
        /* 空状态 */
        .empty-weekly {
            text-align: center;
            padding: 80px 20px;
        }
        .empty-weekly-icon {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }
        .empty-weekly h2 {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }
        body.dark-mode .empty-weekly h2 {
            color: #fff;
        }
        .empty-weekly p {
            font-size: 1.1em;
            color: #666;
        }
        body.dark-mode .empty-weekly p {
            color: #aaa;
        }
        
        /* 加载状态 */
        .loading-container {
            text-align: center;
            padding: 100px 20px;
        }
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            font-size: 1.2em;
            color: #666;
        }
        body.dark-mode .loading-text {
            color: #aaa;
        }
        
        /* 返回按钮 */
        .back-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
        }
        .back-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .weekly-title h1 {
                font-size: 2em;
            }
            .weekly-item {
                padding: 25px;
            }
            .weekly-item-title {
                font-size: 1.5em;
                max-width: 100%;
            }
            .weekly-item-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .current-week-badge {
                top: 10px;
                right: 10px;
                font-size: 0.8em;
                padding: 6px 12px;
            }
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        /* 导航按钮样式 */
        .breakthrough-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .breakthrough-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .breakthrough-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .breakthrough-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .game-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border-radius: 6px;
            padding: 8px 16px;
            margin: 0 8px;
            border: 3px solid #fff;
            box-shadow: 0 4px 0 #c44569, 0 4px 10px rgba(0,0,0,0.2);
        }
        .game-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }
        .game-text {
            color: white;
            font-weight: 700;
            font-size: 14px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .game-link:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c44569, 0 2px 6px rgba(0,0,0,0.2);
        }
        .game-link:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        body.dark-mode .game-link {
            border-color: #2d3748;
            box-shadow: 0 4px 0 #ff4757, 0 4px 10px rgba(0,0,0,0.4);
        }
        body.dark-mode .game-link:hover {
            box-shadow: 0 2px 0 #ff4757, 0 2px 6px rgba(0,0,0,0.4);
        }
        .weekly-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .weekly-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .weekly-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .weekly-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body data-page="weekly">
    <header class="header">
        <div class="container">
            <div class="header-left">
                <h1 class="logo">狂客·银河</h1>

    <div class="weekly-container">
        <div class="weekly-title">
            <h1>📰 【狂客】极客周刊</h1>
            <p>每周分享最新AI资讯、技术趋势与深度思考</p>
        </div>

        <!-- 加载动画 -->
        <div class="loading-container" id="loadingContainer">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在加载周刊内容...</p>
        </div>

        <!-- 本周周刊区域 -->
        <div id="currentWeekSection" style="display: none;">
            <div class="section-header">
                <i class="fas fa-fire section-icon"></i>
                <h2 class="section-title">本周周刊</h2>
                <span class="section-badge">NEW</span>
            </div>
            <div class="weekly-list" id="currentWeekList"></div>
        </div>

        <!-- 往期周刊区域 -->
        <div id="pastWeekSection" style="display: none;">
            <div class="section-header">
                <i class="fas fa-archive section-icon"></i>
                <h2 class="section-title">往期回顾</h2>
            </div>
            <div class="weekly-list" id="pastWeekList"></div>
        </div>

        <!-- 空状态 -->
        <div class="empty-weekly" id="emptyState" style="display: none;">
            <div class="empty-weekly-icon">
                <i class="fas fa-newspaper"></i>
            </div>
            <h2>敬请期待</h2>
            <p>【狂客】极客周刊即将上线，每周为您带来精彩的AI内容分享</p>
        </div>
    </div>

    <!-- 返回按钮 -->
    <a href="https://kuangketongxue.github.io/kuangke.github.io/ai.html" class="back-button" title="返回首页">
        <i class="fas fa-home"></i>
    </a>

    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';
        
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
        
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // 获取当前周的周一和周日
        function getCurrentWeekRange() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek; // 周日为0，需要调整
            
            const monday = new Date(now);
            monday.setDate(now.getDate() + diff);
            monday.setHours(0, 0, 0, 0);
            
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);
            
            return { monday, sunday };
        }

        // 判断日期是否在本周
        function isCurrentWeek(dateString) {
            const date = new Date(dateString);
            const { monday, sunday } = getCurrentWeekRange();
            return date >= monday && date <= sunday;
        }

        // 创建周刊项HTML
        function createWeeklyItem(weekly, isCurrent = false) {
            const videoHTML = weekly.videoUrl 
                ? `<iframe src="${weekly.videoUrl}" frameborder="0" allowfullscreen></iframe>`
                : `<div class="video-placeholder">
                    <i class="fas fa-video"></i>
                    <p>视频内容待添加</p>
                   </div>`;

            const currentBadge = isCurrent 
                ? `<div class="current-week-badge">
                    <i class="fas fa-fire"></i>
                    <span>本周</span>
                   </div>`
                : '';

            return `
                <div class="weekly-item">
                    ${currentBadge}
                    <div class="weekly-item-header">
                        <h2 class="weekly-item-title">${weekly.title}</h2>
                        <div class="weekly-item-date">
                            <i class="fas fa-calendar-alt"></i>
                            <span>${weekly.date}</span>
                        </div>
                    </div>
                    <div class="weekly-item-content">
                        <div class="weekly-item-text">${weekly.content}</div>
                    </div>
                    <div class="weekly-item-video">
                        <div class="video-container">
                            ${videoHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        // 加载周刊数据
        async function loadWeeklyData() {
            try {
                const response = await fetch('weekly-data.json');
                const data = await response.json();
                
                const currentWeekList = [];
                const pastWeekList = [];

                // 按日期排序（最新的在前）
                data.weeklies.sort((a, b) => new Date(b.date) - new Date(a.date));

                // 分类周刊
                data.weeklies.forEach(weekly => {
                    if (isCurrentWeek(weekly.date)) {
                        currentWeekList.push(weekly);
                    } else {
                        pastWeekList.push(weekly);
                    }
                });

                // 隐藏加载动画
                document.getElementById('loadingContainer').style.display = 'none';

                // 显示内容
                if (currentWeekList.length === 0 && pastWeekList.length === 0) {
                    // 显示空状态
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    // 显示本周周刊
                    if (currentWeekList.length > 0) {
                        const currentSection = document.getElementById('currentWeekSection');
                        const currentListDiv = document.getElementById('currentWeekList');
                        currentListDiv.innerHTML = currentWeekList
                            .map(weekly => createWeeklyItem(weekly, true))
                            .join('');
                        currentSection.style.display = 'block';
                    }

                    // 显示往期周刊
                    if (pastWeekList.length > 0) {
                        const pastSection = document.getElementById('pastWeekSection');
                        const pastListDiv = document.getElementById('pastWeekList');
                        pastListDiv.innerHTML = pastWeekList
                            .map(weekly => createWeeklyItem(weekly, false))
                            .join('');
                        pastSection.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('加载周刊数据失败:', error);
                document.getElementById('loadingContainer').innerHTML = `
                    <div class="empty-weekly">
                        <div class="empty-weekly-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <h2>加载失败</h2>
                        <p>无法加载周刊内容，请稍后重试</p>
                    </div>
                `;
            }
        }

        // 页面加载时执行
        window.addEventListener('DOMContentLoaded', loadWeeklyData);
    </script>
