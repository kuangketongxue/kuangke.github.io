<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【狂客】每周复盘 - 狂客·银河</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 复盘容器样式 */
        .review-container {
            max-width: 1200px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }
        .review-title {
            text-align: center;
            margin-bottom: 50px;
        }
        .review-title h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .review-title p {
            font-size: 1.1em;
            color: #666;
            opacity: 0.8;
        }
        body.dark-mode .review-title p {
            color: #aaa;
        }
        /* 统计按钮样式 */
        .stats-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        .stats-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        /* 统计弹窗样式 */
        .stats-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .stats-modal.active {
            display: flex;
        }
        .stats-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        body.dark-mode .stats-content {
            background: #2d3748;
        }
        .stats-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
        }
        .stats-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        body.dark-mode .stats-title {
            color: #fff;
        }
        .stats-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .stats-close:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        body.dark-mode .stats-close {
            color: #aaa;
        }
        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            text-align: center;
        }
        .stats-card-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .stats-card-label {
            font-size: 1em;
            opacity: 0.9;
        }
        .stats-card.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .stats-card.incomplete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .stats-card.rate {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        /* 图表区域 */
        .stats-chart {
            margin-top: 30px;
            padding: 25px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 15px;
        }
        body.dark-mode .stats-chart {
            background: rgba(102, 126, 234, 0.1);
        }
        .chart-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        body.dark-mode .chart-title {
            color: #fff;
        }
        .chart-bar {
            margin-bottom: 15px;
        }
        .chart-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #555;
        }
        body.dark-mode .chart-bar-label {
            color: #ccc;
        }
        .chart-bar-bg {
            height: 30px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            overflow: hidden;
        }
        .chart-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 15px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }
        /* 分类标签样式 */
        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 50px 0 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
        }
        .section-icon {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
        }
        body.dark-mode .section-title {
            color: #fff;
        }
        .section-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        /* 折叠按钮样式 */
        .collapse-button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            margin: 20px 0;
            width: 100%;
            justify-content: center;
        }
        .collapse-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        .collapse-button i {
            transition: transform 0.3s ease;
        }
        .collapse-button.expanded i {
            transform: rotate(180deg);
        }
        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        .collapsible-content.expanded {
            max-height: 10000px;
        }
        /* 复盘列表 */
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .review-item {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        body.dark-mode .review-item {
            background: #2d3748;
        }
        .review-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        /* 本周标签 */
        .current-week-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .review-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
        }
        .review-item-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            max-width: 70%;
        }
        body.dark-mode .review-item-title {
            color: #fff;
        }
        .review-item-date {
            font-size: 1em;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark-mode .review-item-date {
            color: #aaa;
        }
        /* 完成率环 */
        .completion-ring {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }
        .ring-container {
            position: relative;
            width: 150px;
            height: 150px;
        }
        .ring-svg {
            transform: rotate(-90deg);
        }
        .ring-background {
            fill: none;
            stroke: rgba(102, 126, 234, 0.1);
            stroke-width: 12;
        }
        .ring-progress {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }
        .ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .ring-percentage {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }
        .ring-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        body.dark-mode .ring-label {
            color: #aaa;
        }
        /* 目标列表 */
        .goals-list {
            margin-top: 25px;
        }
        .goal-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        body.dark-mode .goal-item {
            background: rgba(102, 126, 234, 0.1);
        }
        .goal-item:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        body.dark-mode .goal-item:hover {
            background: rgba(102, 126, 234, 0.15);
        }
        .goal-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .goal-icon.completed {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .goal-icon.incomplete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .goal-content {
            flex: 1;
        }
        .goal-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        body.dark-mode .goal-title {
            color: #fff;
        }
        .goal-description {
            font-size: 0.95em;
            color: #666;
            line-height: 1.6;
        }
        body.dark-mode .goal-description {
            color: #aaa;
        }
        /* 总结区域 */
        .summary-section {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        body.dark-mode .summary-section {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }
        .summary-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        body.dark-mode .summary-title {
            color: #fff;
        }
        .summary-text {
            font-size: 1em;
            line-height: 1.8;
            color: #555;
            white-space: pre-wrap;
        }
        body.dark-mode .summary-text {
            color: #ccc;
        }
        /* 空状态 */
        .empty-review {
            text-align: center;
            padding: 80px 20px;
        }
        .empty-review-icon {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }
        .empty-review h2 {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }
        body.dark-mode .empty-review h2 {
            color: #fff;
        }
        .empty-review p {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
        }
        body.dark-mode .empty-review p {
            color: #aaa;
        }
        /* 加载状态 */
        .loading-container {
            text-align: center;
            padding: 100px 20px;
        }
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            font-size: 1.2em;
            color: #666;
        }
        body.dark-mode .loading-text {
            color: #aaa;
        }
        /* 返回按钮 */
        .back-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
        }
        .back-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        /* 响应式设计 */
        @media (max-width: 768px) {
            .review-title h1 {
                font-size: 2em;
            }
            .review-item {
                padding: 25px;
            }
            .review-item-title {
                font-size: 1.5em;
                max-width: 100%;
            }
            .review-item-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .current-week-badge {
                top: 10px;
                right: 10px;
                font-size: 0.8em;
                padding: 6px 12px;
            }
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .stats-content {
                padding: 25px;
            }
            .stats-title {
                font-size: 1.5em;
            }
            .stats-cards {
                grid-template-columns: 1fr;
            }
        }
        /* 导航按钮样式 */
        .breakthrough-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .breakthrough-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .breakthrough-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .breakthrough-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .game-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border-radius: 6px;
            padding: 8px 16px;
            margin: 0 8px;
            border: 3px solid #fff;
            box-shadow: 0 4px 0 #c44569, 0 4px 10px rgba(0,0,0,0.2);
        }
        .game-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }
        .game-text {
            color: white;
            font-weight: 700;
            font-size: 14px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .game-link:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c44569, 0 2px 6px rgba(0,0,0,0.2);
        }
        .game-link:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        body.dark-mode .game-link {
            border-color: #2d3748;
            box-shadow: 0 4px 0 #ff4757, 0 4px 10px rgba(0,0,0,0.4);
        }
        body.dark-mode .game-link:hover {
            box-shadow: 0 2px 0 #ff4757, 0 2px 6px rgba(0,0,0,0.4);
        }
        .weekly-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .weekly-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .weekly-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .weekly-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body data-page="review">
    <header class="header">
        <div class="container">
            <div class="header-left">
                <h1 class="logo">狂客·银河</h1>
                <a class="success-link" href="success.html">
                    <span class="success-icon">
                        <i class="fas fa-meteor"></i>
                    </span>
                    <span class="success-text">成功日记</span>
                </a>
                <a class="breakthrough-link" href="https://kuangketongxue.github.io/kuangke.github.io/ai.html">
                    <span class="breakthrough-icon">
                        <i class="fas fa-book-open"></i>
                    </span>
                    <span class="breakthrough-text">《自学突围》</span>
                </a>
                <a class="sky-link" href="reading.html">
                    <span class="sky-icon">
                        <i class="fas fa-star"></i>
                    </span>
                    <span class="sky-text">星空</span>
                </a>
                <a class="exam-link" href="https://kuangketongxue.github.io/tongxuekuangke/">
                    <span class="exam-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </span>
                    <span class="exam-text">冬之街小店</span>
                </a>
                <a class="video-link" href="video.html">
                    <span class="video-icon">
                        <i class="fas fa-video"></i>
                    </span>
                    <span class="video-text">视频矩阵</span>
                </a>
                <a class="game-link" href="games.html">
                    <span class="game-icon">
                        <i class="fas fa-gamepad"></i>
                    </span>
                    <span class="game-text">自制游戏</span>
                </a>
                <a class="weekly-link" href="weekly.html">
                    <span class="weekly-icon">
                        <i class="fas fa-tasks"></i>
                    </span>
                    <span class="weekly-text">每周复盘</span>
                </a>
            </div>
            <div class="controls">
                <button id="themeToggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>
    <div class="review-container">
        <div class="review-title">
            <h1>📊 【狂客】每周复盘</h1>
            <p>记录每周目标完成情况，持续改进与成长</p>
            <button class="stats-button" id="statsButton">
                <i class="fas fa-chart-bar"></i>
                <span>查看整体统计</span>
            </button>
        </div>
        <!-- 加载动画 -->
        <div class="loading-container" id="loadingContainer">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在加载复盘数据...</p>
        </div>
        <!-- 本周复盘区域 -->
        <div id="currentWeekSection" style="display: none;">
            <div class="section-header">
                <i class="fas fa-fire section-icon"></i>
                <h2 class="section-title">本周复盘</h2>
                <span class="section-badge">NEW</span>
            </div>
            <div class="review-list" id="currentWeekList"></div>
        </div>
        <!-- 往期复盘区域 -->
        <div id="pastWeekSection" style="display: none;">
            <div class="section-header">
                <i class="fas fa-archive section-icon"></i>
                <h2 class="section-title">往期回顾</h2>
            </div>
            <button class="collapse-button" id="collapseButton">
                <span>展开往期复盘</span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="collapsible-content" id="collapsibleContent">
                <div class="review-list" id="pastWeekList"></div>
            </div>
        </div>
        <!-- 空状态 -->
        <div class="empty-review" id="emptyState" style="display: none;">
            <div class="empty-review-icon">
                <i class="fas fa-tasks"></i>
            </div>
            <h2>开始记录</h2>
            <p>还没有复盘记录，开始您的第一周目标吧！</p>
        </div>
    </div>
    <!-- 统计弹窗 -->
    <div class="stats-modal" id="statsModal">
        <div class="stats-content">
            <div class="stats-header">
                <h2 class="stats-title">
                    <i class="fas fa-chart-bar"></i>
                    整体统计
                </h2>
                <button class="stats-close" id="statsClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="stats-cards" id="statsCards">
                <!-- 动态生成统计卡片 -->
            </div>
            <div class="stats-chart" id="statsChart">
                <!-- 动态生成图表 -->
            </div>
        </div>
    </div>
    <!-- 返回按钮 -->
    <a href="https://kuangketongxue.github.io/kuangke.github.io/ai.html" class="back-button" title="返回首页">
        <i class="fas fa-home"></i>
    </a>
    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // 折叠按钮功能
        const collapseButton = document.getElementById('collapseButton');
        const collapsibleContent = document.getElementById('collapsibleContent');
        collapseButton.addEventListener('click', () => {
            collapsibleContent.classList.toggle('expanded');
            collapseButton.classList.toggle('expanded');
            const buttonText = collapseButton.querySelector('span');
            if (collapsibleContent.classList.contains('expanded')) {
                buttonText.textContent = '收起往期复盘';
            } else {
                buttonText.textContent = '展开往期复盘';
            }
        });

        // 统计弹窗功能
        const statsButton = document.getElementById('statsButton');
        const statsModal = document.getElementById('statsModal');
        const statsClose = document.getElementById('statsClose');
        statsButton.addEventListener('click', () => {
            statsModal.classList.add('active');
        });
        statsClose.addEventListener('click', () => {
            statsModal.classList.remove('active');
        });
        statsModal.addEventListener('click', (e) => {
            if (e.target === statsModal) {
                statsModal.classList.remove('active');
            }
        });

        // 获取当前周的周一和周日
        function getCurrentWeekRange() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(now);
            monday.setDate(now.getDate() + diff);
            monday.setHours(0, 0, 0, 0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);
            return { monday, sunday };
        }

        // 判断日期是否在本周
        function isCurrentWeek(dateString) {
            const date = new Date(dateString);
            const { monday, sunday } = getCurrentWeekRange();
            return date >= monday && date <= sunday;
        }

        // 生成完成率环形图
        function createCompletionRing(percentage) {
            const radius = 60;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percentage / 100) * circumference;
            
            return `
                <div class="completion-ring">
                    <div class="ring-container">
                        <svg class="ring-svg" width="150" height="150">
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <circle class="ring-background" cx="75" cy="75" r="${radius}"></circle>
                            <circle class="ring-progress" cx="75" cy="75" r="${radius}"
                                style="stroke-dasharray: ${circumference}; stroke-dashoffset: ${offset};"></circle>
                        </svg>
                        <div class="ring-text">
                            <div class="ring-percentage">${percentage}%</div>
                            <div class="ring-label">完成率</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 创建复盘项HTML
        function createReviewItem(review, isCurrent = false) {
            const completedGoals = review.goals.filter(g => g.completed).length;
            const totalGoals = review.goals.length;
            const completionRate = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;

            const currentBadge = isCurrent
                ? `<div class="current-week-badge">
                    <i class="fas fa-fire"></i>
                    <span>本周</span>
                   </div>`
                : '';

            const goalsHTML = review.goals.map(goal => `
                <div class="goal-item">
                    <div class="goal-icon ${goal.completed ? 'completed' : 'incomplete'}">
                        <i class="fas fa-${goal.completed ? 'check' : 'times'}"></i>
                    </div>
                    <div class="goal-content">
                        <div class="goal-title">${goal.title}</div>
                        ${goal.description ? `<div class="goal-description">${goal.description}</div>` : ''}
                    </div>
                </div>
            `).join('');

            return `
                <div class="review-item">
                    ${currentBadge}
                    <div class="review-item-header">
                        <h2 class="review-item-title">${review.weekTitle}</h2>
                        <div class="review-item-date">
                            <i class="fas fa-calendar-alt"></i>
                            <span>${review.weekRange}</span>
                        </div>
                    </div>
                    ${createCompletionRing(completionRate)}
                    <div class="goals-list">
                        ${goalsHTML}
                    </div>
                    ${review.summary ? `
                        <div class="summary-section">
                            <div class="summary-title">
                                <i class="fas fa-lightbulb"></i>
                                本周总结
                            </div>
                            <div class="summary-text">${review.summary}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 生成整体统计
        function generateOverallStats(data) {
            const totalWeeks = data.reviews.length;
            let totalGoals = 0;
            let completedGoals = 0;
            const weeklyRates = [];

            data.reviews.forEach(review => {
                totalGoals += review.goals.length;
                const completed = review.goals.filter(g => g.completed).length;
                completedGoals += completed;
                const rate = review.goals.length > 0 ? Math.round((completed / review.goals.length) * 100) : 0;
                weeklyRates.push({
                    week: review.weekTitle,
                    rate: rate
                });
            });

            const overallRate = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;
            const incompleteGoals = totalGoals - completedGoals;

            // 生成统计卡片
            document.getElementById('statsCards').innerHTML = `
                <div class="stats-card">
                    <div class="stats-card-value">${totalWeeks}</div>
                    <div class="stats-card-label">总周数</div>
                </div>
                <div class="stats-card success">
                    <div class="stats-card-value">${completedGoals}</div>
                    <div class="stats-card-label">已完成目标</div>
                </div>
                <div class="stats-card incomplete">
                    <div class="stats-card-value">${incompleteGoals}</div>
                    <div class="stats-card-label">未完成目标</div>
                </div>
                <div class="stats-card rate">
                    <div class="stats-card-value">${overallRate}%</div>
                    <div class="stats-card-label">总完成率</div>
                </div>
            `;

            // 生成图表（最近8周）
            const recentWeeks = weeklyRates.slice(-8).reverse();
            const chartHTML = recentWeeks.map(item => `
                <div class="chart-bar">
                    <div class="chart-bar-label">
                        <span>${item.week}</span>
                        <span><strong>${item.rate}%</strong></span>
                    </div>
                    <div class="chart-bar-bg">
                        <div class="chart-bar-fill" style="width: ${item.rate}%;">
                            ${item.rate > 15 ? item.rate + '%' : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('statsChart').innerHTML = `
                <h3 class="chart-title">📈 最近完成率趋势</h3>
                ${chartHTML}
            `;
        }

        // 加载复盘数据（改进版，增加错误处理）
        async function loadReviewData() {
            try {
                const response = await fetch('weekly-data.json');
                
                // 检查响应状态
                if (!response.ok) {
                    throw new Error(`HTTP 错误! 状态: ${response.status}`);
                }
                
                const data = await response.json();
                
                // 检查数据结构
                if (!data || !data.reviews || !Array.isArray(data.reviews)) {
                    console.error('数据格式错误:', data);
                    throw new Error('JSON数据格式不正确，缺少reviews数组');
                }
                
                // 如果没有数据，显示空状态
                if (data.reviews.length === 0) {
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                const currentWeekList = [];
                const pastWeekList = [];

                // 按日期排序（最新的在前）
                data.reviews.sort((a, b) => {
                    const dateA = new Date(a.weekRange.split(' - ')[0]);
                    const dateB = new Date(b.weekRange.split(' - ')[0]);
                    return dateB - dateA;
                });

                // 分类复盘
                data.reviews.forEach(review => {
                    const weekStart = review.weekRange.split(' - ')[0];
                    if (isCurrentWeek(weekStart)) {
                        currentWeekList.push(review);
                    } else {
                        pastWeekList.push(review);
                    }
                });

                // 生成整体统计
                if (data.reviews.length > 0) {
                    generateOverallStats(data);
                }

                // 隐藏加载动画
                document.getElementById('loadingContainer').style.display = 'none';

                // 显示内容
                if (currentWeekList.length === 0 && pastWeekList.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    // 显示本周复盘
                    if (currentWeekList.length > 0) {
                        const currentSection = document.getElementById('currentWeekSection');
                        const currentListDiv = document.getElementById('currentWeekList');
                        currentListDiv.innerHTML = currentWeekList
                            .map(review => createReviewItem(review, true))
                            .join('');
                        currentSection.style.display = 'block';
                    }

                    // 显示往期复盘
                    if (pastWeekList.length > 0) {
                        const pastSection = document.getElementById('pastWeekSection');
                        const pastListDiv = document.getElementById('pastWeekList');
                        pastListDiv.innerHTML = pastWeekList
                            .map(review => createReviewItem(review, false))
                            .join('');
                        pastSection.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('加载复盘数据失败:', error);
                document.getElementById('loadingContainer').style.display = 'none';
                
                // 显示详细错误信息
                const errorHTML = `
                    <div class="empty-review">
                        <div class="empty-review-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <h2>加载失败</h2>
                        <p style="color: #ef4444; margin-bottom: 20px;"><strong>错误信息:</strong> ${error.message}</p>
                        <p style="color: #666; font-size: 0.95em; line-height: 1.8; max-width: 600px; margin: 0 auto;">
                            <strong>可能的原因：</strong><br>
                            1. weekly-data.json 文件不存在或路径错误<br>
                            2. JSON 格式不正确（缺少逗号、括号等）<br>
                            3. 文件编码问题<br>
                            4. 浏览器安全策略限制（需使用本地服务器）<br><br>
                            <strong>建议：</strong><br>
                            • 检查文件是否与HTML在同一目录<br>
                            • 使用JSON验证工具检查格式<br>
                            • 使用本地服务器运行（如Live Server）<br>
                            • 查看浏览器控制台获取详细信息
                        </p>
                    </div>
                `;
                
                document.getElementById('loadingContainer').innerHTML = errorHTML;
            }
        }

        // 页面加载时执行
        window.addEventListener('DOMContentLoaded', loadReviewData);
    </script>
</body>
</html>
