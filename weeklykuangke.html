<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【狂客】每周复盘 - 狂客·银河</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 复盘容器样式 */
        .review-container {
            max-width: 1200px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }
        .review-title {
            text-align: center;
            margin-bottom: 50px;
        }
        .review-title h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .review-title p {
            font-size: 1.1em;
            color: #666;
            opacity: 0.8;
        }
        body.dark-mode .review-title p {
            color: #aaa;
        }
        /* 按钮组容器 */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        /* 统计按钮样式 */
        .stats-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
        }
        .stats-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        /* 每日任务按钮样式 */
        .daily-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
        }
        .daily-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }
        /* 每天优化按钮样式 */
        .optimize-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }
        .optimize-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }
        /* 统计弹窗样式 */
        .stats-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .stats-modal.active {
            display: flex;
        }
        .stats-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        body.dark-mode .stats-content {
            background: #2d3748;
        }
        .stats-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
        }
        .stats-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        body.dark-mode .stats-title {
            color: #fff;
        }
        .stats-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .stats-close:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        body.dark-mode .stats-close {
            color: #aaa;
        }
        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            text-align: center;
        }
        .stats-card-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .stats-card-label {
            font-size: 1em;
            opacity: 0.9;
        }
        .stats-card.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .stats-card.incomplete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .stats-card.rate {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        /* 图表区域 */
        .stats-chart {
            margin-top: 30px;
            padding: 25px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 15px;
        }
        body.dark-mode .stats-chart {
            background: rgba(102, 126, 234, 0.1);
        }
        .chart-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        body.dark-mode .chart-title {
            color: #fff;
        }
        .chart-bar {
            margin-bottom: 15px;
        }
        .chart-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #555;
        }
        body.dark-mode .chart-bar-label {
            color: #ccc;
        }
        .chart-bar-bg {
            height: 30px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            overflow: hidden;
        }
        .chart-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 15px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }
        /* 每日任务弹窗特殊样式 */
        .daily-modal .stats-content {
            max-width: 900px;
        }
        /* 优化弹窗特殊样式 */
        .optimize-modal .stats-content {
            max-width: 850px;
        }
        /* 日期选择器 */
        .date-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
        }
        body.dark-mode .date-selector {
            background: rgba(102, 126, 234, 0.1);
        }
        .date-nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .date-nav-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .current-date {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            min-width: 200px;
            text-align: center;
        }
        body.dark-mode .current-date {
            color: #fff;
        }
        /* 任务卡片 */
        .daily-tasks {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .task-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }
        body.dark-mode .task-card {
            background: #1a202c;
        }
        .task-card:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .task-card.completed {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.03);
        }
        body.dark-mode .task-card.completed {
            background: rgba(16, 185, 129, 0.08);
        }
        .task-card.incomplete {
            border-left-color: #ef4444;
        }
        .task-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .task-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.1em;
        }
        .task-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .task-status.completed {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .task-status.incomplete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .task-name {
            font-size: 1.4em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }
        body.dark-mode .task-name {
            color: #fff;
        }
        .task-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        .task-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 10px;
        }
        body.dark-mode .task-info-item {
            background: rgba(102, 126, 234, 0.1);
        }
        .task-info-label {
            font-size: 0.9em;
            color: #666;
            font-weight: 600;
        }
        body.dark-mode .task-info-label {
            color: #aaa;
        }
        .task-info-value {
            font-size: 0.95em;
            color: #333;
            font-weight: 600;
        }
        body.dark-mode .task-info-value {
            color: #fff;
        }
        /* 重要性等级 */
        .importance-high {
            color: #ef4444;
        }
        .importance-medium {
            color: #f59e0b;
        }
        .importance-low {
            color: #10b981;
        }
        /* 熟练度星级 */
        .proficiency-stars {
            color: #f59e0b;
        }
        .task-description {
            font-size: 1em;
            line-height: 1.7;
            color: #555;
            padding: 15px;
            background: rgba(102, 126, 234, 0.03);
            border-radius: 10px;
            margin-top: 12px;
        }
        body.dark-mode .task-description {
            color: #ccc;
            background: rgba(102, 126, 234, 0.08);
        }
        /* 优化内容卡片 */
        .optimize-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #8b5cf6;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        body.dark-mode .optimize-card {
            background: #1a202c;
        }
        .optimize-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .optimize-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(139, 92, 246, 0.2);
        }
        .optimize-icon-circle {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            flex-shrink: 0;
        }
        .optimize-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
        }
        body.dark-mode .optimize-title {
            color: #fff;
        }
        .optimize-content {
            font-size: 1.05em;
            line-height: 1.8;
            color: #555;
        }
        body.dark-mode .optimize-content {
            color: #ccc;
        }
        .optimize-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .optimize-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }
        /* 空状态 */
        .empty-tasks {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-tasks-icon {
            font-size: 64px;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .empty-tasks h3 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }
        body.dark-mode .empty-tasks h3 {
            color: #fff;
        }
        .empty-tasks p {
            font-size: 1em;
            color: #666;
            line-height: 1.6;
        }
        body.dark-mode .empty-tasks p {
            color: #aaa;
        }
        /* 分类标签样式 */
        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 50px 0 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
        }
        .section-icon {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
        }
        body.dark-mode .section-title {
            color: #fff;
        }
        .section-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        /* 折叠按钮样式 */
        .collapse-button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            margin: 20px 0;
            width: 100%;
            justify-content: center;
        }
        .collapse-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        .collapse-button i {
            transition: transform 0.3s ease;
        }
        .collapse-button.expanded i {
            transform: rotate(180deg);
        }
        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        .collapsible-content.expanded {
            max-height: 10000px;
        }
        /* 复盘列表 */
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .review-item {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        body.dark-mode .review-item {
            background: #2d3748;
        }
        .review-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        /* 本周标签 */
        .current-week-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .review-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
        }
        .review-item-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            max-width: 70%;
        }
        body.dark-mode .review-item-title {
            color: #fff;
        }
        .review-item-date {
            font-size: 1em;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.dark-mode .review-item-date {
            color: #aaa;
        }
        /* 完成率环 */
        .completion-ring {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }
        .ring-container {
            position: relative;
            width: 150px;
            height: 150px;
        }
        .ring-svg {
            transform: rotate(-90deg);
        }
        .ring-background {
            fill: none;
            stroke: rgba(102, 126, 234, 0.1);
            stroke-width: 12;
        }
        .ring-progress {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }
        .ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .ring-percentage {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }
        .ring-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        body.dark-mode .ring-label {
            color: #aaa;
        }
        /* 目标列表 */
        .goals-list {
            margin-top: 25px;
        }
        .goal-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        body.dark-mode .goal-item {
            background: rgba(102, 126, 234, 0.1);
        }
        .goal-item:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        body.dark-mode .goal-item:hover {
            background: rgba(102, 126, 234, 0.15);
        }
        .goal-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .goal-icon.completed {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .goal-icon.incomplete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .goal-content {
            flex: 1;
        }
        .goal-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        body.dark-mode .goal-title {
            color: #fff;
        }
        .goal-description {
            font-size: 0.95em;
            color: #666;
            line-height: 1.6;
        }
        body.dark-mode .goal-description {
            color: #aaa;
        }
        /* 总结区域 */
        .summary-section {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        body.dark-mode .summary-section {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }
        .summary-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        body.dark-mode .summary-title {
            color: #fff;
        }
        .summary-text {
            font-size: 1em;
            line-height: 1.8;
            color: #555;
            white-space: pre-wrap;
        }
        body.dark-mode .summary-text {
            color: #ccc;
        }
        /* 空状态 */
        .empty-review {
            text-align: center;

        // ==================== 日期工具函数 ====================

            const now = new Date();
            const dayOfWeek = now.getDay();
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(now);
            monday.setDate(now.getDate() + diff);
            monday.setHours(0, 0, 0, 0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);
            return { monday, sunday };
        }
        function isCurrentWeek(dateString) {
            if (!dateString) return false;
            const date = new Date(dateString);
            const { monday, sunday } = getCurrentWeekRange();
            return date >= monday && date <= sunday;
        }

            const year = date.getFullYear();

            const year = date.getFullYear();

            return `${year}-${month}-${day}`;

                            <circle class="ring-progress" cx="75" cy="75" r="${radius}"
                                style="stroke-dasharray: ${circumference}; stroke-dashoffset: ${offset};"></circle>
                        </svg>

                const timeMatch = weekContent.match(/\*\*时间范围:\*\*\s*(.+)/);
                const weekRange = timeMatch ? timeMatch[1].trim() : '';
                const goals = [];
                const goalRegex = /####\s+\d+\.\s+(.+?)\n-\s+\[([ x])\].*?\n-\s+\*\*说明:\*\*\s*(.*?)(?=\n####|\n###|$)/gs;
                let goalMatch;
                while ((goalMatch = goalRegex.exec(weekContent)) !== null) {
                    goals.push({
                        title: goalMatch[1].trim(),
                        description: goalMatch[3].trim(),
                        completed: goalMatch[2] === 'x'
                    });
                }
                const summaryMatch = weekContent.match(/### 本周总结\s+([\s\S]*?)(?=\n---|\n## |$)/);
                let summary = '';
                if (summaryMatch) {
                    summary = summaryMatch[1].trim()
                        .replace(/####\s+/g, '')
                        .replace(/\n\n+/g, '\n\n');
                }
                reviews.push({
                    weekTitle: `第${weekNum}周`,
                    weekRange: weekRange,
                    goals: goals,
                    summary: summary
                });
            }
            return { reviews };
        }
        // ==================== 解析每日任务Markdown ====================
        function parseDailyTasksMarkdown(markdown) {
            const dailyTasks = {};
            const dateSections = markdown.split(/^## (\d{4}-\d{2}-\d{2})$/gm);
            for (let i = 1; i < dateSections.length; i += 2) {
                const dateKey = dateSections[i];
                const dateContent = dateSections[i + 1];
                if (!dateContent) continue;
                const tasks = [];
                const taskRegex = /### (\d+)\.\s+(.+?)\n-\s+\*\*重要性:\*\*\s+(.+?)\n-\s+\*\*熟练度:\*\*\s+(.+?)\n-\s+\*\*完成情况:\*\*\s+\[([ x])\]\s*(已完成|未完成)\n-\s+\*\*说明:\*\*\s*(.*?)(?=\n###|\n##|$)/gs;
                let taskMatch;
                while ((taskMatch = taskRegex.exec(dateContent)) !== null) {
                    tasks.push({
                        number: taskMatch[1].trim(),
                        name: taskMatch[2].trim(),
                        importance: taskMatch[3].trim(),
                        proficiency: taskMatch[4].trim(),
                        completed: taskMatch[5] === 'x',
                        description: taskMatch[7].trim()
                    });
                }
                dailyTasks[dateKey] = tasks;
            }
            return dailyTasks;
        }
        // ==================== 创建复盘项HTML ====================
        function createReviewItem(review, isCurrent = false) {
            const completedGoals = review.goals.filter(g => g.completed).length;
            const totalGoals = review.goals.length;
            const completionRate = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;
            const currentBadge = isCurrent
                ? `<div class="current-week-badge">
                    <i class="fas fa-fire"></i>
                    <span>本周</span>
                   </div>`
                : '';
            const goalsHTML = review.goals.map(goal => `
                <div class="goal-item">
                    <div class="goal-icon ${goal.completed ? 'completed' : 'incomplete'}">
                        <i class="fas fa-${goal.completed ? 'check' : 'times'}"></i>
                    </div>
                    <div class="goal-content">
                        <div class="goal-title">${goal.title}</div>
                        ${goal.description ? `<div class="goal-description">${goal.description}</div>` : ''}
                    </div>
                </div>
            `).join('');
            return `
                <div class="review-item">
                    ${currentBadge}
                    <div class="review-item-header">
                        <h2 class="review-item-title">${review.weekTitle}</h2>
                        <div class="review-item-date">
                            <i class="fas fa-calendar-alt"></i>
                            <span>${review.weekRange || '待填写'}</span>
                        </div>
                    </div>
                    ${createCompletionRing(completionRate)}
                    <div class="goals-list">
                        ${goalsHTML}
                    </div>
                    ${review.summary ? `
                        <div class="summary-section">
                            <div class="summary-title">
                                <i class="fas fa-lightbulb"></i>
                                本周总结
                            </div>
                            <div class="summary-text">${review.summary}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        // ==================== 创建任务卡片HTML ====================
        function createTaskCard(task) {
            const importanceClass = task.importance === '高' ? 'importance-high' :
                                   task.importance === '中' ? 'importance-medium' : 'importance-low';
            const stars = '★'.repeat(parseInt(task.proficiency)) + '☆'.repeat(5 - parseInt(task.proficiency));
            return `
                <div class="task-card ${task.completed ? 'completed' : 'incomplete'}">
                    <div class="task-header">
                        <div class="task-number">${task.number}</div>
                        <div class="task-status ${task.completed ? 'completed' : 'incomplete'}">
                            <i class="fas fa-${task.completed ? 'check-circle' : 'times-circle'}"></i>
                            <span>${task.completed ? '已完成' : '未完成'}</span>
                        </div>
                    </div>
                    <div class="task-name">${task.name}</div>
                    <div class="task-info">
                        <div class="task-info-item">
                            <span class="task-info-label">重要性:</span>
                            <span class="task-info-value ${importanceClass}">
                                <i class="fas fa-${task.importance === '高' ? 'exclamation-circle' : task.importance === '中' ? 'minus-circle' : 'info-circle'}"></i>
                                ${task.importance}
                            </span>
                        </div>
                        <div class="task-info-item">
                            <span class="task-info-label">熟练度:</span>
                            <span class="task-info-value proficiency-stars">${stars}</span>
                        </div>
                    </div>
                    ${task.description ? `
                        <div class="task-description">
                            <strong>说明:</strong> ${task.description}
                        </div>
                    ` : ''}
                </div>
            `;
        }
        // ==================== 生成整体统计 ====================
        function generateOverallStats(data) {
            const totalWeeks = data.reviews.length;
            let totalGoals = 0;
            let completedGoals = 0;
            const weeklyRates = [];
            data.reviews.forEach(review => {
                totalGoals += review.goals.length;
                const completed = review.goals.filter(g => g.completed).length;
                completedGoals += completed;
                const rate = review.goals.length > 0 ? Math.round((completed / review.goals.length) * 100) : 0;
                weeklyRates.push({
                    week: review.weekTitle,
                    rate: rate
                });
            });
            const overallRate = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;
            const incompleteGoals = totalGoals - completedGoals;
            document.getElementById('statsCards').innerHTML = `
                <div class="stats-card">
                    <div class="stats-card-value">${totalWeeks}</div>
                    <div class="stats-card-label">总周数</div>
                </div>
                <div class="stats-card success">
                    <div class="stats-card-value">${completedGoals}</div>
                    <div class="stats-card-label">已完成目标</div>
                </div>
                <div class="stats-card incomplete">
                    <div class="stats-card-value">${incompleteGoals}</div>
                    <div class="stats-card-label">未完成目标</div>
                </div>
                <div class="stats-card rate">
                    <div class="stats-card-value">${overallRate}%</div>
                    <div class="stats-card-label">总完成率</div>
                </div>
            `;
            const recentWeeks = weeklyRates.slice(-8).reverse();
            const chartHTML = recentWeeks.map(item => `
                <div class="chart-bar">
                    <div class="chart-bar-label">
                        <span>${item.week}</span>
                        <span><strong>${item.rate}%</strong></span>
                    </div>
                    <div class="chart-bar-bg">
                        <div class="chart-bar-fill" style="width: ${item.rate}%;">
                            ${item.rate > 15 ? item.rate + '%' : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('statsChart').innerHTML = `
                <h3 class="chart-title">📈 最近完成率趋势</h3>
                ${chartHTML}
            `;
        }
        // ==================== 加载每日任务 ====================
        async function loadDailyTasks(date) {
            try {
                const response = await fetch('daily-tasks.md');
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }
                const markdown = await response.text();
                const dailyTasks = parseDailyTasksMarkdown(markdown);
                const dateKey = formatDateKey(date);
                document.getElementById('currentDate').textContent = formatDate(date);
                const tasks = dailyTasks[dateKey] || [];
                const tasksList = document.getElementById('dailyTasksList');
                if (tasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="empty-tasks">
                            <div class="empty-tasks-icon">
                                <i class="fas fa-calendar-times"></i>
                            </div>
                            <h3>暂无任务记录</h3>
                            <p>该日期还没有任务记录<br>请在GitHub中编辑 daily-tasks.md 文件添加任务</p>
                        </div>
                    `;
                } else {
                    tasksList.innerHTML = tasks.map(task => createTaskCard(task)).join('');
                }
            } catch (error) {
                console.error('加载每日任务失败:', error);
                document.getElementById('dailyTasksList').innerHTML = `
                    <div class="empty-tasks">
                        <div class="empty-tasks-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <h3>加载失败</h3>
                        <p style="color: #ef4444; margin-bottom: 15px;"><strong>错误:</strong> ${error.message}</p>
                        <p style="color: #666; font-size: 0.9em;">
                            请确保 daily-tasks.md 文件存在且格式正确<br>
                            需要在同一目录下创建该文件
                        </p>
                    </div>
                `;
            }
        }
        // ==================== 加载复盘数据 ====================
        async function loadReviewData() {
            try {
                const response = await fetch('weekly-data.md');
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }
                const markdown = await response.text();
                const data = parseMarkdownToJSON(markdown);
                if (!data || !data.reviews || !Array.isArray(data.reviews)) {
                    console.error('数据格式错误:', data);
                    throw new Error('Markdown数据格式不正确');
                }
                if (data.reviews.length === 0) {
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }
                const currentWeekList = [];
                const pastWeekList = [];
                data.reviews.sort((a, b) => {
                    if (!a.weekRange || !b.weekRange) return 0;
                    const dateA = new Date(a.weekRange.split(' - ')[0]);
                    const dateB = new Date(b.weekRange.split(' - ')[0]);
                    return dateB - dateA;
                });
                data.reviews.forEach(review => {
                    if (!review.weekRange) {
                        pastWeekList.push(review);
                        return;
                    }
                    const weekStart = review.weekRange.split(' - ')[0];
                    if (isCurrentWeek(weekStart)) {
                        currentWeekList.push(review);
                    } else {
                        pastWeekList.push(review);
                    }
                });
                if (data.reviews.length > 0) {
                    generateOverallStats(data);
                }
                document.getElementById('loadingContainer').style.display = 'none';
                if (currentWeekList.length === 0 && pastWeekList.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    if (currentWeekList.length > 0) {
                        const currentSection = document.getElementById('currentWeekSection');
                        const currentListDiv = document.getElementById('currentWeekList');
                        currentListDiv.innerHTML = currentWeekList
                            .map(review => createReviewItem(review, true))
                            .join('');
                        currentSection.style.display = 'block';
                    }
                    if (pastWeekList.length > 0) {
                        const pastSection = document.getElementById('pastWeekSection');
                        const pastListDiv = document.getElementById('pastWeekList');
                        pastListDiv.innerHTML = pastWeekList
                            .map(review => createReviewItem(review, false))
                            .join('');
                        pastSection.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('加载复盘数据失败:', error);
                document.getElementById('loadingContainer').style.display = 'none';
                const errorHTML = `
                    <div class="empty-review">
                        <div class="empty-review-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <h2>加载失败</h2>
                        <p style="color: #ef4444; margin-bottom: 20px;"><strong>错误信息:</strong> ${error.message}</p>
                        <p style="color: #666; font-size: 0.95em; line-height: 1.8; max-width: 600px; margin: 0 auto;">
                            <strong>可能的原因:</strong><br>
                            1. weekly-data.md 文件不存在或路径错误<br>
                            2. Markdown 格式不正确<br>
                            3. 文件编码问题(请使用UTF-8)<br>
                            4. 浏览器安全策略限制(需使用本地服务器)<br><br>
                            <strong>建议:</strong><br>
                            • 检查文件是否与HTML在同一目录<br>
                            • 使用本地服务器运行(如Live Server)<br>
                            • 查看浏览器控制台获取详细信息
                        </p>
                    </div>
                `;
                document.getElementById('loadingContainer').innerHTML = errorHTML;
            }
        }
        // ==================== 页面加载 ====================
        window.addEventListener('DOMContentLoaded', loadReviewData);
    </script>
</body>
