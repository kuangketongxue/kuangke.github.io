<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成功日记 | 狂客·银河</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ==================== 强制背景一致性（最高优先级） ==================== */
        /* 确保背景装饰显示 */
        .bg-decoration {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            pointer-events: none !important;
            z-index: 0 !important;
        }
        .bg-decoration .circle {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        /* 确保 body::before 背景图片显示 */
        body::before {
            content: "" !important;
            position: fixed !important;
            inset: 0 !important;
            z-index: -2 !important;
            pointer-events: none !important;
            background: url("images/sky.jpg") center center / cover no-repeat !important;
            background-attachment: fixed !important;
            opacity: 1 !important;
            filter: none !important;
        }
        /* 确保 body::after 层完全透明 */
        body::after {
            content: "" !important;
            position: fixed !important;
            inset: 0 !important;
            pointer-events: none !important;
            z-index: -1 !important;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        /* 白天/黑夜模式都保持背景图片完全可见 */
        body:not(.dark-theme)::before,
        body.light-mode::before,
        body.dark-theme::before {
            opacity: 1 !important;
            filter: none !important;
        }
        body:not(.dark-theme)::after,
        body.light-mode::after,
        body.dark-theme::after {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        /* ==================== 白天模式 - 顶部标题栏保持透明 ==================== */
        body:not(.dark-theme) .header {
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1) !important;
        }
        body:not(.dark-theme) .logo {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3),
                         0 0 20px rgba(255, 255, 255, 0.5) !important;
            color: #ffffff !important;
        }
        body:not(.dark-theme) .success-subtitle {
            color: rgba(255, 255, 255, 0.95) !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4) !important;
        }
        body:not(.dark-theme) .search-box {
            background: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
        }
        body:not(.dark-theme) .search-box input {
            color: #ffffff !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        body:not(.dark-theme) .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.7) !important;
        }
        body:not(.dark-theme) .search-box .icon {
            color: rgba(255, 255, 255, 0.8) !important;
        }
        body:not(.dark-theme) .back-link {
            background: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #ffffff !important;
            backdrop-filter: blur(8px) !important;
        }
        body:not(.dark-theme) .language-toggle,
        body:not(.dark-theme) .theme-toggle {
            background: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #ffffff !important;
            backdrop-filter: blur(8px) !important;
        }
        /* ==================== 暗色模式 - 深色半透明背景 + 白色文字 ==================== */
        body.dark-theme .header {
            background: rgba(30, 41, 59, 0.75) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(100, 116, 139, 0.3) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3) !important;
        }
        body.dark-theme .logo {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5),
                         0 0 20px rgba(255, 255, 255, 0.3) !important;
            color: #f8fafc !important;
        }
        body.dark-theme .success-subtitle {
            color: rgba(226, 232, 240, 0.95) !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5) !important;
        }
        body.dark-theme .search-box {
            background: rgba(30, 41, 59, 0.6) !important;
            border: 1px solid rgba(100, 116, 139, 0.4) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
        }
        body.dark-theme .search-box input {
            color: #f1f5f9 !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        body.dark-theme .search-box input::placeholder {
            color: rgba(203, 213, 225, 0.7) !important;
        }
        body.dark-theme .search-box .icon {
            color: rgba(226, 232, 240, 0.8) !important;
        }
        body.dark-theme .back-link {
            background: rgba(30, 41, 59, 0.6) !important;
            border: 1px solid rgba(100, 116, 139, 0.4) !important;
            color: #f1f5f9 !important;
            backdrop-filter: blur(10px) !important;
        }
        body.dark-theme .language-toggle,
        body.dark-theme .theme-toggle {
            background: rgba(30, 41, 59, 0.6) !important;
            border: 1px solid rgba(100, 116, 139, 0.4) !important;
            color: #f1f5f9 !important;
            backdrop-filter: blur(10px) !important;
        }
        /* ==================== 统计面板 ==================== */
        body:not(.dark-theme) .stats-panel {
            background: rgba(255, 255, 255, 0.1) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(8px);
        }
        body.dark-theme .stats-panel {
            background: rgba(30, 41, 59, 0.6) !important;
            border-bottom: 1px solid rgba(100, 116, 139, 0.3) !important;
            backdrop-filter: blur(12px);
        }
        /* 白天模式统计卡片 */
        body:not(.dark-theme) .stat-card {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        body:not(.dark-theme) .stat-card:hover {
            background: rgba(255, 255, 255, 0.98) !important;
        }
        /* 暗色模式统计卡片 - 深色背景 + 白色文字 */
        body.dark-theme .stat-card {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 116, 139, 0.25);
        }
        body.dark-theme .stat-card:hover {
            background: rgba(30, 41, 59, 0.95) !important;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }
        body.dark-theme .stat-label {
            color: #cbd5e1 !important;
        }
        body.dark-theme .stat-value {
            color: #f8fafc !important;
        }
        body.dark-theme .stat-description {
            color: #cbd5e1 !important;
        }
        /* ==================== 工具栏样式 ==================== */
        body:not(.dark-theme) .diary-toolbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px) !important;
        }
        body.dark-theme .diary-toolbar {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(100, 116, 139, 0.3);
        }
        body.dark-theme .diary-toolbar-inner {
            border: 1px solid rgba(100, 116, 139, 0.3);
        }
        body.dark-theme .filter-title,
        body.dark-theme .filter-label {
            color: #cbd5e1 !important;
        }
        body.dark-theme .filter-chip {
            background: rgba(99, 102, 241, 0.2) !important;
            border: 1px solid rgba(139, 92, 246, 0.4) !important;
            color: #c4b5fd !important;
        }
        body.dark-theme .filter-chip:hover {
            background: rgba(99, 102, 241, 0.3) !important;
        }
        body.dark-theme .filter-chip.active {
            background: linear-gradient(135deg, #6366f1, #7c3aed) !important;
            color: #ffffff !important;
        }
        body.dark-theme .filter-select {
            background: rgba(30, 41, 59, 0.7) !important;
            color: #f1f5f9 !important;
            border: 1px solid rgba(100, 116, 139, 0.4) !important;
        }
        body.dark-theme .ghost-btn {
            background: rgba(99, 102, 241, 0.2) !important;
            border: 1px solid rgba(139, 92, 246, 0.4) !important;
            color: #c4b5fd !important;
        }
        body.dark-theme .ghost-btn:hover {
            background: rgba(99, 102, 241, 0.3) !important;
        }
        /* ==================== 主内容区域 ==================== */
        body.dark-theme .diary-counter {
            color: #cbd5e1 !important;
        }
        body.dark-theme .view-toggle {
            background: rgba(30, 41, 59, 0.7) !important;
            border: 1px solid rgba(100, 116, 139, 0.3) !important;
        }
        body.dark-theme .view-btn {
            color: #94a3b8 !important;
        }
        body.dark-theme .view-btn:hover {
            background: rgba(99, 102, 241, 0.2) !important;
            color: #c4b5fd !important;
        }
        body.dark-theme .view-btn.active {
            color: #ffffff !important;
        }
        /* ==================== 时间轴样式 ==================== */
        body.dark-theme .timeline {
            border-left-color: rgba(139, 92, 246, 0.4);
        }
        /* 白天模式日记卡片 */
        body:not(.dark-theme) .timeline-card,
        body:not(.dark-theme) .diary-card-body {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px) !important;
        }
        /* 暗色模式日记卡片 - 深色背景 + 白色文字 */
        body.dark-theme .timeline-card,
        body.dark-theme .diary-card-body {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(100, 116, 139, 0.3) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        body.dark-theme .diary-title {
            color: #f8fafc !important;
        }
        body.dark-theme .diary-alt,
        body.dark-theme .diary-text {
            color: #e2e8f0 !important;
        }
        body.dark-theme .diary-highlight {
            background: rgba(99, 102, 241, 0.2) !important;
            border: 1px solid rgba(139, 92, 246, 0.4) !important;
        }
        body.dark-theme .meta-title {
            color: #f1f5f9 !important;
        }
        body.dark-theme .diary-meta {
            color: #cbd5e1 !important;
        }
        body.dark-theme .tag-pill {
            background: rgba(99, 102, 241, 0.25) !important;
            color: #c4b5fd !important;
        }
        body.dark-theme .mood-badge {
            border-color: currentColor !important;
        }
        body.dark-theme .diary-attachment-link {
            background: rgba(99, 102, 241, 0.2) !important;
            color: #c4b5fd !important;
            border: 1px solid rgba(139, 92, 246, 0.4) !important;
        }
        body.dark-theme .empty-state {
            color: #94a3b8 !important;
        }
        body.dark-theme .empty-state h3 {
            color: #cbd5e1 !important;
        }
        /* 确保内容在背景之上 */
        .header,
        .stats-panel,
        .diary-toolbar,
        .main-content,
        .container {
            position: relative !important;
            z-index: 1 !important;
        }
        /* SVG图标样式 */
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            fill: currentColor;
            vertical-align: middle;
        }
        /* 标题图标 */
        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .title-icon {
            width: 1.5em;
            height: 1.5em;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        .quote-icon {
            width: 1em;
            height: 1em;
            opacity: 0.8;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
        }
        .search-clear {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .search-clear:hover {
            transform: scale(1.1);
        }
        .back-link:hover,
        .language-toggle:hover,
        .theme-toggle:hover {
            transform: translateY(-2px);
        }
        .theme-icon,
        .language-toggle .icon,
        .back-link .icon {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
        }
        .language-toggle span {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        /* 回到顶部按钮 */
        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color, #6366f1), var(--accent-hover, #7c3aed));
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            z-index: 10000;
            transform: translateY(100px);
            will-change: transform, opacity;
        }
        #backToTop.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        #backToTop:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
        }
        #backToTop:active {
            transform: translateY(-1px);
        }
        /* 性能优化 */
        .timeline-item,
        .diary-card,
        .filter-chip {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }
        /* 统计面板布局 */
        .stats-panel {
            padding: 2rem 0;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .stat-card {
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-color, #6366f1), var(--accent-hover, #7c3aed));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px);
        }
        .stat-card:hover::before {
            opacity: 1;
        }
        .stat-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: linear-gradient(135deg, var(--accent-color, #6366f1), var(--accent-hover, #7c3aed));
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .stat-label {
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-color, #6366f1), var(--accent-hover, #7c3aed));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-description {
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-color, #6366f1);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        /* 工具栏布局 */
        .diary-toolbar {
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }
        .diary-toolbar-inner {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.6rem;
            border-radius: 16px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .filter-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .filter-title {
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
        }
        .filter-chip {
            border-radius: 999px;
            padding: 0.45rem 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .filter-chip:hover {
            transform: translateY(-2px);
        }
        .filter-chip.active {
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .filter-label {
            font-size: 0.9rem;
        }
        .filter-select {
            border-radius: 12px;
            padding: 0.55rem 0.9rem;
            min-width: 170px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-select:hover,
        .filter-select:focus {
            outline: none;
        }
        .ghost-btn {
            border-radius: 14px;
            padding: 0.65rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }
        .ghost-btn:hover {
            transform: translateY(-2px);
        }
        .reset-btn {
            margin-left: auto;
        }
        /* 主内容区域 */
        .success-main {
            padding: 2.5rem 0 5rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .diary-counter {
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .view-toggle {
            display: flex;
            gap: 0.5rem;
            padding: 0.25rem;
            border-radius: 12px;
        }
        .view-btn {
            background: transparent;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .view-btn.active {
            background: linear-gradient(135deg, var(--accent-color, #6366f1), var(--accent-hover, #7c3aed));
            color: white;
        }
        /* 时间轴布局 */
        .timeline {
            position: relative;
            padding-left: 2.5rem;
            border-left: 2px solid;
            display: flex;
            flex-direction: column;
            gap: 2.2rem;
        }
        .timeline-item {
            position: relative;
            display: flex;
            gap: 1.2rem;
        }
        .timeline-marker {
            position: absolute;
            left: -32px;
            top: 12px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color, #6366f1), var(--accent-hover, #7c3aed));
            box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.18);
        }
        .timeline-card {
            flex: 1;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            animation: slideInLeft 0.45s ease-out;
        }
        @keyframes slideInLeft {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .diary-card-body {
            padding: 1.6rem;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1.1rem;
        }
        .diary-cover {
            width: 100%;
            border-radius: 16px;
            object-fit: cover;
            max-height: 220px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }
        .diary-card-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .diary-card-header {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }
        .diary-title {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.45;
        }
        .diary-alt {
            font-size: 0.92rem;
            line-height: 1.55;
            white-space: pre-wrap;
        }
        .diary-text {
            line-height: 1.7;
        }
        .diary-text p {
            margin-bottom: 0.75rem;
            white-space: pre-wrap;
        }
        .diary-highlight {
            border-radius: 16px;
            padding: 1rem;
            box-shadow: inset 0 0 15px rgba(139, 92, 246, 0.08);
        }
        .diary-highlight span {
            white-space: pre-wrap;
            display: block;
        }
        .diary-meta {
            display: grid;
            gap: 0.55rem;
            font-size: 0.9rem;
        }
        .meta-title {
            font-weight: 600;
            margin-right: 0.4rem;
        }
        .meta-content {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
        }
        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
        }
        .mood-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            border: 1px solid currentColor;
            font-size: 0.88rem;
        }
        .achievement-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.75rem;
            border-radius: 12px;
            background: rgba(250, 204, 21, 0.12);
            color: #facc15;
            font-weight: 600;
        }
        .diary-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
            font-size: 0.9rem;
        }
        .diary-attachment {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }
        .diary-attachment-link {
            padding: 0.45rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .diary-attachment-link:hover {
            transform: translateY(-2px);
        }
        .diary-actions-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }
        .empty-state.hidden {
            display: none;
        }
        .empty-icon {
            width: 4rem;
            height: 4rem;
            opacity: 0.5;
            margin-bottom: 1rem;
        }
        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        
        /* ==================== 新增：本周复盘按钮与模态框样式 ==================== */
        .review-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            transition: all 0.3s ease;
            margin-right: 1rem;
        }
        .review-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(225, 29, 72, 0.4);
        }
        
        /* 模态框背景 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* 模态框内容 */
        .modal-content {
            background: white;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        
        /* 暗色模式模态框 */
        body.dark-theme .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: #f1f5f9;
        }
        
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.dark-theme .modal-header {
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .modal-close {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: inherit;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .modal-close:hover {
            opacity: 1;
        }
        
        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
        }
        
        .review-section {
            margin-bottom: 1.5rem;
        }
        .review-section h4 {
            font-size: 1rem;
            margin-bottom: 0.8rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .review-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .review-stat-item {
            background: rgba(99, 102, 241, 0.05);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }
        body.dark-theme .review-stat-item {
            background: rgba(255,255,255,0.05);
        }
        .review-stat-val {
            font-size: 1.8rem;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 0.2rem;
        }
        body.dark-theme .review-stat-val {
            color: #818cf8;
        }
        
        .review-highlight {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.1));
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 1rem;
            border-radius: 12px;
        }
        .review-advice {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.6;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .stats-panel {
                padding: 1.5rem 0;
                margin-bottom: 1.5rem;
            }
            .stats-container {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 0 1rem;
            }
            .stat-card {
                padding: 1.25rem;
            }
            .stat-value {
                font-size: 1.75rem;
            }
            .stat-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }
            #backToTop {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
            .header .container {
                flex-direction: column;
                gap: 1rem;
            }
            .header-left {
                width: 100%;
            }
            .controls {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
            .review-btn {
                width: 100%;
                justify-content: center;
                margin-right: 0;
                margin-bottom: 0.5rem;
            }
        }
        @media (max-width: 480px) {
            .stat-value {
                font-size: 1.5rem;
            }
            .stat-description {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
            }
            #backToTop {
                bottom: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .success-subtitle {
                font-size: 0.85rem;
                line-height: 1.5;
            }
        }
        /* 加载动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        /* 骨架屏 */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
