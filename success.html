<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成功日记 | 狂客·银河</title>
    <link rel="stylesheet" href="style.css">
    <!-- 内联SVG图标定义 -->
    <style>
        /* SVG图标样式 */
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            fill: currentColor;
            vertical-align: middle;
        }
        
        /* 回到顶部按钮 - 优化版 */
        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color, #6366f1), var(--accent-hover, #7c3aed));
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            z-index: 10000;
            transform: translateY(100px);
            will-change: transform, opacity;
            contain: layout style paint;
        }
        
        #backToTop.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        #backToTop:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
        }
        
        #backToTop:active {
            transform: translateY(-1px);
        }
        
        /* 性能优化：使用GPU加速 */
        .timeline-item,
        .diary-card,
        .filter-chip {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            #backToTop {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            #backToTop {
                bottom: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }
        
        /* 加载动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* 骨架屏加载 */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body data-page="success">

    <!-- 返回顶部按钮 -->
    <button id="backToTop" class="back-to-top" aria-label="返回顶部">
        <svg class="icon"><use href="#icon-arrow-up"></use></svg>
    </button>
    
    <script src="data.js" ></script>
    <script src="script.js" ></script>
    <script>
        // ==================== 回到顶部功能 - 性能优化版 ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 初始化回到顶部功能...');
            const backToTopBtn = document.getElementById('backToTop');
            
            if (!backToTopBtn) {
                console.error('❌ 错误：找不到回到顶部按钮！');
                return;
            }
            console.log('✅ 找到回到顶部按钮');
            
            // 使用 requestAnimationFrame 优化滚动监听
            let ticking = false;
            let lastKnownScrollPosition = 0;
            
            function updateBackToTopButton(scrollPos) {
                if (scrollPos > 300) {
                    backToTopBtn.classList.add('show');
                } else {
                    backToTopBtn.classList.remove('show');
                }
            }
            
            // 节流滚动事件
            function onScroll() {
                lastKnownScrollPosition = window.scrollY || document.documentElement.scrollTop;
                
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        updateBackToTopButton(lastKnownScrollPosition);
                        ticking = false;
                    });
                    ticking = true;
                }
            }
            
            // 优化的滚动监听器
            window.addEventListener('scroll', onScroll, { passive: true });
            
            // 点击回到顶部 - 优化版
            backToTopBtn.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('🎯 点击回到顶部');
                
                // 检查是否支持 smooth behavior
                const supportsNativeSmooth = 'scrollBehavior' in document.documentElement.style;
                
                if (supportsNativeSmooth) {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                } else {
                    // 兼容性回退
                    const startScroll = window.pageYOffset;
                    const startTime = performance.now();
                    const duration = 500; // 500ms 动画时长
                    
                    function easeInOutCubic(t) {
                        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                    }
                    
                    function animateScroll(currentTime) {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const easeProgress = easeInOutCubic(progress);
                        const scrollPosition = startScroll * (1 - easeProgress);
                        
                        window.scrollTo(0, scrollPosition);
                        
                        if (progress < 1) {
                            window.requestAnimationFrame(animateScroll);
                        }
                    }
                    
                    window.requestAnimationFrame(animateScroll);
                }
            });
            
            // 初始检查
            updateBackToTopButton(window.scrollY || document.documentElement.scrollTop);
            
            // 键盘导航支持
            backToTopBtn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    backToTopBtn.click();
                }
            });
            
            // 移除测试代码（生产环境）
            console.log('✅ 回到顶部功能初始化完成');
        });
        
        // ==================== 性能优化工具 ====================
        
        // 懒加载观察器
        const lazyLoadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('fade-in');
                    lazyLoadObserver.unobserve(entry.target);
                }
            });
        }, {
            rootMargin: '50px'
        });
        
        // 监听需要懒加载的元素
        function observeLazyElements() {
            const lazyElements = document.querySelectorAll('.timeline-item, .diary-card');
            lazyElements.forEach(el => lazyLoadObserver.observe(el));
        }
        
        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // 节流函数
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }
        
        // 监听DOM变化以初始化懒加载
        const mutationObserver = new MutationObserver(debounce(() => {
            observeLazyElements();
        }, 100));
        
        mutationObserver.observe(document.getElementById('diaryTimeline'), {
            childList: true,
            subtree: true
        });
        
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('.theme-icon');
        
        // 检查本地存储的主题设置
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeIcon.querySelector('use').setAttribute('href', '#icon-sun');
        }
        
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            
            // 更新图标
            if (isDark) {
                themeIcon.querySelector('use').setAttribute('href', '#icon-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.querySelector('use').setAttribute('href', '#icon-moon');
                localStorage.setItem('theme', 'light');
            }
        });
        
        // 语言切换功能
        const languageToggle = document.getElementById('languageToggle');
        const currentLang = localStorage.getItem('language') || 'zh';
        
        function updateLanguage(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                // 这里需要根据实际的翻译数据来更新内容
                // 假设有一个 translations 对象
                if (window.translations && window.translations[lang] && window.translations[lang][key]) {
                    el.textContent = window.translations[lang][key];
                }
            });
            
            // 更新按钮文本
            const span = languageToggle.querySelector('span');
            span.textContent = lang === 'zh' ? '中 → EN' : 'EN → 中';
            
            localStorage.setItem('language', lang);
        }
        
        languageToggle.addEventListener('click', function() {
            const newLang = currentLang === 'zh' ? 'en' : 'zh';
            updateLanguage(newLang);
        });
        
        // 初始化语言
        updateLanguage(currentLang);
        
        // 页面卸载时清理
        window.addEventListener('beforeunload', function() {
            lazyLoadObserver.disconnect();
            mutationObserver.disconnect();
        });
    </script>
</body>
