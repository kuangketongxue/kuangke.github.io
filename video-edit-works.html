<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频剪辑作业 - 狂客·银河</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 继承主页面样式 */
        .video-edit-container {
            max-width: 1200px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }
        
        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .page-title h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        
        .page-title p {
            font-size: 1.1em;
            color: #666;
            opacity: 0.8;
        }
        
        body.dark-mode .page-title p {
            color: #aaa;
        }
        
        /* 统计信息卡片 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        body.dark-mode .stat-card {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        
        .stat-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        body.dark-mode .stat-value {
            color: #fff;
        }
        
        .stat-label {
            font-size: 1em;
            color: #666;
            font-weight: 600;
        }
        
        body.dark-mode .stat-label {
            color: #aaa;
        }
        
        /* 作品列表 */
        .works-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        body.dark-mode .works-section {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(240, 147, 251, 0.3);
        }
        
        .section-header h2 {
            font-size: 1.8em;
            color: #333;
        }
        
        body.dark-mode .section-header h2 {
            color: #fff;
        }
        
        .github-notice {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .works-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .work-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        
        body.dark-mode .work-card {
            background: #1a202c;
        }
        
        .work-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .work-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .work-date {
            font-size: 0.95em;
            color: #666;
            font-weight: 600;
        }
        
        body.dark-mode .work-date {
            color: #aaa;
        }
        
        .work-score {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3em;
            font-weight: 700;
            color: #f5576c;
        }
        
        .work-link {
            display: block;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            word-break: break-all;
        }
        
        body.dark-mode .work-link {
            background: #2d3748;
            color: #fff;
        }
        
        .work-link:hover {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: translateX(5px);
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        /* 返回按钮 */
        .back-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
        }
        
        .back-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.5);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .stats-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .works-list {
                grid-template-columns: 1fr;
            }
            
            .page-title h1 {
                font-size: 2em;
            }
            
            .section-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
        
        /* 导航按钮样式（与主页面一致）*/
        .video-edit-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .video-edit-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .video-edit-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .video-edit-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }
        .breakthrough-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .breakthrough-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .breakthrough-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .breakthrough-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .game-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border-radius: 6px;
            padding: 8px 16px;
            margin: 0 8px;
            border: 3px solid #fff;
            box-shadow: 0 4px 0 #c44569, 0 4px 10px rgba(0,0,0,0.2);
        }
        .game-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }
        .game-text {
            color: white;
            font-weight: 700;
            font-size: 14px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .game-link:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c44569, 0 2px 6px rgba(0,0,0,0.2);
        }
        .game-link:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        body.dark-mode .game-link {
            border-color: #2d3748;
            box-shadow: 0 4px 0 #ff4757, 0 4px 10px rgba(0,0,0,0.4);
        }
        body.dark-mode .game-link:hover {
            box-shadow: 0 2px 0 #ff4757, 0 2px 6px rgba(0,0,0,0.4);
        }
        .weekly-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .weekly-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .weekly-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .weekly-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body data-page="video-edit">
    <header class="header">
        <div class="container">
            <div class="header-left">
                <h1 class="logo">狂客·银河</h1>
                <a class="success-link" href="success.html">
                    <span class="success-icon">
                        <i class="fas fa-meteor"></i>
                    </span>
                    <span class="success-text">成功日记</span>
                </a>
                <a class="breakthrough-link" href="https://kuangketongxue.github.io/kuangke.github.io/ai.html">
                    <span class="breakthrough-icon">
                        <i class="fas fa-book-open"></i>
                    </span>
                    <span class="breakthrough-text">《自学突围》</span>
                </a>
                <a class="sky-link" href="reading.html">
                    <span class="sky-icon">
                        <i class="fas fa-star"></i>
                    </span>
                    <span class="sky-text">星空</span>
                </a>
                <a class="exam-link" href="https://kuangketongxue.github.io/tongxuekuangke/">
                    <span class="exam-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </span>
                    <span class="exam-text">冬之街小店</span>
                </a>
                <a class="video-link" href="video.html">
                    <span class="video-icon">
                        <i class="fas fa-video"></i>
                    </span>
                    <span class="video-text">视频矩阵</span>
                </a>
                <a class="game-link" href="games.html">
                    <span class="game-icon">
                        <i class="fas fa-gamepad"></i>
                    </span>
                    <span class="game-text">自制游戏</span>
                </a>
                <a class="weekly-link" href="weeklykuangke.html">
                    <span class="weekly-icon">
                        <i class="fas fa-newspaper"></i>
                    </span>
                    <span class="weekly-text">【狂客】极客周刊</span>
                </a>
                <a class="video-edit-link" href="video-edit-works.html">
                    <span class="video-edit-icon">
                        <i class="fas fa-film"></i>
                    </span>
                    <span class="video-edit-text">视频剪辑作业</span>
                </a>
            </div>
            <div class="controls">
                <button id="themeToggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="video-edit-container">
        <div class="page-title">
            <h1>🎬 视频剪辑作业</h1>
            <p>记录每一次创作，见证成长的轨迹</p>
        </div>

        <!-- 统计信息 -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalWorks">0</div>
                <div class="stat-label">提交次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="lastSubmit">--</div>
                <div class="stat-label">最近提交</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value" id="avgScore">0</div>
                <div class="stat-label">平均评分</div>
            </div>
        </div>

        <!-- 作品列表 -->
        <div class="works-section">
            <div class="section-header">
                <h2>📽️ 我的作品</h2>
                <div class="github-notice">
                    <i class="fab fa-github"></i>
                    作品需在GitHub提交
                </div>
            </div>
            <div class="works-list" id="worksList">
                <!-- 动态加载作品 -->
            </div>
        </div>
    </div>

    <!-- 返回按钮 -->
    <a href="ai.html" class="back-button" title="返回上一页">
        <i class="fas fa-arrow-left"></i>
    </a>

    <script>
        // ========================================
        // 作品数据（在GitHub中修改此数组）
        // ========================================
        const works = [
            // 示例格式：
            // {
            //     url: "作品链接URL",
            //     score: 85,  // 评分 0-100
            //     date: "2024-01-15"  // 日期格式 YYYY-MM-DD
            // },
            
            // 在下方添加你的作品：
            
        ];
        // ========================================

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadWorks();
            updateStats();
            initTheme();
        });

        // 加载作品列表
        function loadWorks() {
            const worksList = document.getElementById('worksList');
            
            if (works.length === 0) {
                worksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎥</div>
                        <p>还没有提交作品</p>
                        <p style="font-size: 0.9em; color: #999;">请在GitHub上编辑此页面，在works数组中添加你的作品信息</p>
                    </div>
                `;
                return;
            }

            // 按日期降序排列
            const sortedWorks = [...works].sort((a, b) => new Date(b.date) - new Date(a.date));

            worksList.innerHTML = sortedWorks.map((work, index) => `
                <div class="work-card">
                    <div class="work-header">
                        <div class="work-date">
                            <i class="fas fa-calendar"></i> ${formatDate(work.date)}
                        </div>
                        <div class="work-score">
                            <i class="fas fa-star"></i> ${work.score}分
                        </div>
                    </div>
                    <a href="${work.url}" target="_blank" class="work-link">
                        <i class="fas fa-external-link-alt"></i> 查看作品
                    </a>
                </div>
            `).join('');
        }

        // 更新统计信息
        function updateStats() {
            const totalWorks = works.length;
            const lastSubmit = totalWorks > 0 ? formatDate(works.reduce((latest, work) => {
                return new Date(work.date) > new Date(latest.date) ? work : latest;
            }).date) : '--';
            const avgScore = totalWorks > 0 ? 
                (works.reduce((sum, work) => sum + parseFloat(work.score), 0) / totalWorks).toFixed(1) : '0';

            document.getElementById('totalWorks').textContent = totalWorks;
            document.getElementById('lastSubmit').textContent = lastSubmit;
            document.getElementById('avgScore').textContent = avgScore + '分';
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 主题切换
        function initTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const icon = themeToggle.querySelector('i');
            const currentTheme = localStorage.getItem('theme') || 'light';
            
            if (currentTheme === 'dark') {
                body.classList.add('dark-mode');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
            
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                if (body.classList.contains('dark-mode')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                    localStorage.setItem('theme', 'dark');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    </script>
</body>
</html>
