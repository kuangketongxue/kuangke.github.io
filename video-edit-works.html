<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频剪辑作业 - 狂客·银河</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 继承主页面样式 */
        .video-edit-container {
            max-width: 1200px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }
        
        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .page-title h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        
        .page-title p {
            font-size: 1.1em;
            color: #666;
            opacity: 0.8;
        }
        
        body.dark-mode .page-title p {
            color: #aaa;
        }
        
        /* 统计信息卡片 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        body.dark-mode .stat-card {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        
        .stat-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        body.dark-mode .stat-value {
            color: #fff;
        }
        
        .stat-label {
            font-size: 1em;
            color: #666;
            font-weight: 600;
        }
        
        body.dark-mode .stat-label {
            color: #aaa;
        }
        
        /* 作品列表 */
        .works-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        body.dark-mode .works-section {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(240, 147, 251, 0.3);
        }
        
        .section-header h2 {
            font-size: 1.8em;
            color: #333;
        }
        
        body.dark-mode .section-header h2 {
            color: #fff;
        }
        
        .add-work-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }
        
        .add-work-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.5);
        }
        
        .works-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .work-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        
        body.dark-mode .work-card {
            background: #1a202c;
        }
        
        .work-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .work-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .work-date {
            font-size: 0.95em;
            color: #666;
            font-weight: 600;
        }
        
        body.dark-mode .work-date {
            color: #aaa;
        }
        
        .work-score {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3em;
            font-weight: 700;
            color: #f5576c;
        }
        
        .work-link {
            display: block;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            word-break: break-all;
        }
        
        body.dark-mode .work-link {
            background: #2d3748;
            color: #fff;
        }
        
        .work-link:hover {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: translateX(5px);
        }
        
        .work-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .edit-btn {
            background: #4facfe;
            color: white;
        }
        
        .edit-btn:hover {
            background: #00f2fe;
            transform: translateY(-2px);
        }
        
        .delete-btn {
            background: #ff6b6b;
            color: white;
        }
        
        .delete-btn:hover {
            background: #ee5a24;
            transform: translateY(-2px);
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            position: relative;
            animation: slideUp 0.3s ease;
        }
        
        body.dark-mode .modal-content {
            background: #2d3748;
            color: #fff;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 30px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-modal:hover {
            color: #f5576c;
        }
        
        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .modal-header h2 {
            font-size: 2em;
            color: #333;
        }
        
        body.dark-mode .modal-header h2 {
            color: #fff;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        
        body.dark-mode .form-group label {
            color: #fff;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        body.dark-mode .form-group input,
        body.dark-mode .form-group textarea {
            background: #1a202c;
            border-color: #4a5568;
            color: #fff;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }
        
        .score-input-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .score-input-group input {
            flex: 1;
        }
        
        .score-display {
            font-size: 1.5em;
            font-weight: 700;
            color: #f5576c;
            min-width: 80px;
            text-align: center;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        /* 返回按钮 */
        .back-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
        }
        
        .back-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.5);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .stats-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .works-list {
                grid-template-columns: 1fr;
            }
            
            .page-title h1 {
                font-size: 2em;
            }
            
            .section-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .add-work-btn {
                width: 100%;
            }
        }
        
        /* 导航按钮样式（与主页面一致）*/
        .video-edit-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            padding: 8px 16px;
            margin: 0 8px;
        }
        .video-edit-icon {
            color: white;
            font-size: 20px;
            margin-right: 8px;
        }
        .video-edit-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .video-edit-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }
    </style>
</head>
<body data-page="video-edit">
    <header class="header">
        <div class="container">
            <div class="header-left">
                <h1 class="logo">狂客·银河</h1>
                <a class="success-link" href="success.html">

                    </span>
                    <span class="breakthrough-text">《自学突围》</span>

                    </span>

                </a>
                <a class="exam-link" href="https://kuangketongxue.github.io/tongxuekuangke/">
                    <span class="exam-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </span>

                </a>
                <a class="video-link" href="video.html">

                </a>
                <a class="game-link" href="games.html">
                    <span class="game-icon">

                    </span>
                    <span class="game-text">自制游戏</span>
                </a>
                <a class="weekly-link" href="weeklykuangke.html">
                    <span class="weekly-icon">
                        <i class="fas fa-newspaper"></i>
                    </span>
                    <span class="weekly-text">【狂客】极客周刊</span>
                </a>
                <a class="video-edit-link" href="video-edit-works.html">
                    <span class="video-edit-icon">

                </a>
            </div>
            <div class="controls">

                </button>
            </div>
        </div>
    </header>

    <div class="video-edit-container">
        <div class="page-title">
            <h1>🎬 视频剪辑作业</h1>
            <p>记录每一次创作，见证成长的轨迹</p>
        </div>

        <!-- 统计信息 -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalWorks">0</div>
                <div class="stat-label">提交次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="lastSubmit">--</div>
                <div class="stat-label">最近提交</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value" id="avgScore">0</div>
                <div class="stat-label">平均评分</div>
            </div>
        </div>

        <!-- 作品列表 -->
        <div class="works-section">
            <div class="section-header">
                <h2>📽️ 我的作品</h2>
                <button class="add-work-btn" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> 添加作品
                </button>
            </div>
            <div class="works-list" id="worksList">
                <!-- 动态加载作品 -->
            </div>
        </div>
    </div>

    <!-- 添加/编辑作品模态框 -->
    <div id="workModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h2 id="modalTitle">添加新作品</h2>
            </div>
            <form id="workForm">
                <input type="hidden" id="editIndex" value="">
                <div class="form-group">
                    <label for="workUrl">
                        <i class="fas fa-link"></i> 作品链接
                    </label>
                    <input type="url" id="workUrl" placeholder="请输入作品URL" required>
                </div>
                <div class="form-group">
                    <label for="workScore">
                        <i class="fas fa-star"></i> 作品评分
                    </label>
                    <div class="score-input-group">
                        <input type="range" id="workScore" min="0" max="100" value="0" step="1" oninput="updateScoreDisplay()">
                        <div class="score-display" id="scoreDisplay">0分</div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="workDate">
                        <i class="fas fa-calendar"></i> 提交日期
                    </label>
                    <input type="date" id="workDate" required>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-check"></i> 保存作品
                </button>
            </form>
        </div>
    </div>

    <!-- 返回按钮 -->
    <a href="ai.html" class="back-button" title="返回上一页">
        <i class="fas fa-arrow-left"></i>
    </a>

    <script>
        // 数据存储
        let works = JSON.parse(localStorage.getItem('videoEditWorks')) || [];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadWorks();
            updateStats();
            initTheme();
            
            // 设置今天的日期为默认值
            document.getElementById('workDate').valueAsDate = new Date();
        });

        // 加载作品列表
        function loadWorks() {
            const worksList = document.getElementById('worksList');
            
            if (works.length === 0) {
                worksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎥</div>
                        <p>还没有提交作品</p>
                        <p style="font-size: 0.9em; color: #999;">点击"添加作品"按钮开始记录你的创作之旅吧！</p>
                    </div>
                `;
                return;
            }

            // 按日期降序排列
            works.sort((a, b) => new Date(b.date) - new Date(a.date));

            worksList.innerHTML = works.map((work, index) => `
                <div class="work-card">
                    <div class="work-header">
                        <div class="work-date">
                            <i class="fas fa-calendar"></i> ${formatDate(work.date)}
                        </div>
                        <div class="work-score">
                            <i class="fas fa-star"></i> ${work.score}分
                        </div>
                    </div>
                    <a href="${work.url}" target="_blank" class="work-link">
                        <i class="fas fa-external-link-alt"></i> 查看作品
                    </a>
                    <div class="work-actions">
                        <button class="action-btn edit-btn" onclick="editWork(${index})">
                            <i class="fas fa-edit"></i> 编辑
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteWork(${index})">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 更新统计信息
        function updateStats() {
            const totalWorks = works.length;
            const lastSubmit = totalWorks > 0 ? formatDate(works.reduce((latest, work) => {
                return new Date(work.date) > new Date(latest.date) ? work : latest;
            }).date) : '--';
            const avgScore = totalWorks > 0 ? 
                (works.reduce((sum, work) => sum + parseFloat(work.score), 0) / totalWorks).toFixed(1) : '0';

            document.getElementById('totalWorks').textContent = totalWorks;
            document.getElementById('lastSubmit').textContent = lastSubmit;
            document.getElementById('avgScore').textContent = avgScore + '分';
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 打开添加模态框
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加新作品';
            document.getElementById('workForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('workDate').valueAsDate = new Date();
            document.getElementById('workScore').value = 0;
            updateScoreDisplay();
            document.getElementById('workModal').style.display = 'block';
        }

        // 编辑作品
        function editWork(index) {
            const work = works[index];
            document.getElementById('modalTitle').textContent = '编辑作品';
            document.getElementById('editIndex').value = index;
            document.getElementById('workUrl').value = work.url;
            document.getElementById('workScore').value = work.score;
            document.getElementById('workDate').value = work.date;
            updateScoreDisplay();
            document.getElementById('workModal').style.display = 'block';
        }

        // 删除作品
        function deleteWork(index) {
            if (confirm('确定要删除这个作品吗？')) {
                works.splice(index, 1);
                saveWorks();
                loadWorks();
                updateStats();
            }
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('workModal').style.display = 'none';
        }

        // 更新评分显示
        function updateScoreDisplay() {
            const score = document.getElementById('workScore').value;
            document.getElementById('scoreDisplay').textContent = score + '分';
        }

        // 表单提交
        document.getElementById('workForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const editIndex = document.getElementById('editIndex').value;
            const work = {
                url: document.getElementById('workUrl').value,
                score: document.getElementById('workScore').value,
                date: document.getElementById('workDate').value
            };

            if (editIndex === '') {
                // 添加新作品
                works.push(work);
            } else {
                // 更新现有作品
                works[editIndex] = work;
            }

            saveWorks();
            loadWorks();
            updateStats();
            closeModal();
        });

        // 保存到本地存储
        function saveWorks() {
            localStorage.setItem('videoEditWorks', JSON.stringify(works));
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('workModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // 主题切换
        function initTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const icon = themeToggle.querySelector('i');
            const currentTheme = localStorage.getItem('theme') || 'light';
            
            if (currentTheme === 'dark') {
                body.classList.add('dark-mode');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
            
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                if (body.classList.contains('dark-mode')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                    localStorage.setItem('theme', 'dark');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    </script>
