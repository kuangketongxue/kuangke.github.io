<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广州珠江新城 3D 探索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        #loadingScreen.hidden {
            display: none;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            min-width: 250px;
        }
        .ui-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4fc3f7;
        }
        .ui-item {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        .ui-label {
            color: #b0bec5;
        }
        .ui-value {
            color: #ffffff;
            font-weight: bold;
        }
        #buildingInfo {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 300px;
            display: none;
        }
        #buildingInfo.show {
            display: block;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .key {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            margin: 0 5px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="spinner"></div>
        <h2>正在加载广州珠江新城...</h2>
        <p id="loadingText">初始化场景</p>
    </div>

    <div id="ui">
        <div class="ui-title">🏙️ 珠江新城</div>
        <div class="ui-item">
            <span class="ui-label">位置:</span>
            <span class="ui-value" id="position">X: 0, Z: 0</span>
        </div>
        <div class="ui-item">
            <span class="ui-label">高度:</span>
            <span class="ui-value" id="height">0 m</span>
        </div>
        <div class="ui-item">
            <span class="ui-label">速度:</span>
            <span class="ui-value" id="speed">0 km/h</span>
        </div>
        <div class="ui-item">
            <span class="ui-label">时间:</span>
            <span class="ui-value" id="time">14:00</span>
        </div>
    </div>

    <div id="buildingInfo">
        <h3 id="buildingName">建筑名称</h3>
        <p id="buildingDesc">建筑描述</p>
        <p><strong>高度:</strong> <span id="buildingHeight">0</span> 米</p>
    </div>

    <div id="instructions">
        <div style="font-size: 18px; margin-bottom: 10px;">🎮 控制说明</div>
        <div style="margin-top: 10px;">
            <span class="key">W</span> 前进
            <span class="key">S</span> 后退
            <span class="key">A</span> 左移
            <span class="key">D</span> 右移
        </div>
        <div style="margin-top: 5px;">
            <span class="key">Shift</span> 加速跑
            <span class="key">Space</span> 上升
            <span class="key">C</span> 下降
        </div>
        <div style="margin-top: 5px;">
            <span class="key">鼠标</span> 视角旋转
            <span class="key">鼠标滚轮</span> 缩放
        </div>
    </div>

    <canvas id="minimap"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>

            {

                position: { x: -150, z: -50 },

                windows: true,
                landmark: false,
                desc: "商务办公楼"
            },
            {
                name: "珠江新城写字楼B",
                position: { x: 200, z: 50 },
                width: 45,

                depth: 45,
                color: 0x78909c,
                windows: true,
                landmark: false,
                desc: "商务办公楼"
            },
            {
                name: "珠江新城写字楼C",
                position: { x: -50, z: -200 },
                width: 35,
                height: 150,
                depth: 35,
                color: 0xb0bec5,
                windows: true,
                landmark: false,
                desc: "商务办公楼"
            },
            {
                name: "富力盈凯广场",
                position: { x: 250, z: 150 },
                width: 50,
                height: 170,
                depth: 50,
                color: 0x64b5f6,
                windows: true,
                landmark: false,
                desc: "综合商务楼"
            },
            {
                name: "侨鑫国际金融中心",
                position: { x: -250, z: 100 },
                width: 48,
                height: 190,
                depth: 48,
                color: 0x81c784,
                windows: true,
                landmark: false,
                desc: "商务办公"
            }
        ];

        // ==================== 游戏配置 ====================
        const config = {
            moveSpeed: 0.5,
            sprintSpeed: 1.5,
            verticalSpeed: 0.3,
            rotationSpeed: 0.002,
            citySize: 500,
            minHeight: 1.6,
            maxHeight: 700
        };

        // ==================== 全局变量 ====================
        let scene, camera, renderer;
        let player, playerVelocity = new THREE.Vector3();
        let buildings = [];
        let ground, river;
        let time = 14; // 14:00

        // 控制状态
        const keys = {};
        const mouse = { x: 0, y: 0, locked: false };
        let yaw = 0, pitch = 0;

        // 选中的建筑
        let selectedBuilding = null;
        const raycaster = new THREE.Raycaster();
        const mouseVector = new THREE.Vector2();

        // ==================== 初始化 ====================
        function init() {
            updateLoadingText("创建场景...");
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 100, 1000);

            // 创建相机
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                2000
            );
            camera.position.set(0, 50, 200);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            updateLoadingText("创建玩家...");
            createPlayer();

            updateLoadingText("创建地面和珠江...");
            createGround();
            createRiver();

            updateLoadingText("建造珠江新城建筑...");
            createZhujiangNewTownBuildings();

            updateLoadingText("添加光照...");
            createLights();

            updateLoadingText("添加天空和环境...");
            createSkybox();
            createTrees();

            updateLoadingText("初始化控制系统...");
            setupEventListeners();

            // 隐藏加载画面
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 1000);

            // 开始动画循环
            animate();
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        // ==================== 创建玩家 ====================
        function createPlayer() {
            const geometry = new THREE.CylinderGeometry(0.3, 0.3, 1.6, 8);
            const material = new THREE.MeshPhongMaterial({
                color: 0xff0000,
                transparent: true,
                opacity: 0
            });
            player = new THREE.Mesh(geometry, material);
            player.position.set(0, 50, 200);
            scene.add(player);
        }

        // ==================== 创建地面 ====================
        function createGround() {
            // 主地面
            const geometry = new THREE.PlaneGeometry(config.citySize * 3, config.citySize * 3);
            
            // 创建地面纹理
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // 绘制道路网格
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.strokeStyle = '#444444';
            ctx.lineWidth = 2;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 51.2, 0);
                ctx.lineTo(i * 51.2, 512);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * 51.2);
                ctx.lineTo(512, i * 51.2);
                ctx.stroke();
            }
            
            // 添加车道线
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 1;
            ctx.setLineDash([10, 10]);
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 51.2 + 25.6, 0);
                ctx.lineTo(i * 51.2 + 25.6, 512);
                ctx.stroke();
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(20, 20);
            
            const material = new THREE.MeshLambertMaterial({
                map: texture
            });
            
            ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        // ==================== 创建珠江 ====================
        function createRiver() {
            const riverGeometry = new THREE.PlaneGeometry(800, 200);
            
            // 水面材质
            const riverMaterial = new THREE.MeshPhongMaterial({
                color: 0x1e88e5,
                transparent: true,
                opacity: 0.6,
                shininess: 100
            });
            
            river = new THREE.Mesh(riverGeometry, riverMaterial);
            river.rotation.x = -Math.PI / 2;
            river.position.y = 0.1;
            river.position.z = 300;
            river.receiveShadow = true;
            scene.add(river);
        }

        // ==================== 创建珠江新城建筑 ====================
        function createZhujiangNewTownBuildings() {
            ZhujiangNewTownBuildings.forEach(buildingData => {
                createBuilding(buildingData);
            });
        }

        function createBuilding(data) {
            const geometry = new THREE.BoxGeometry(data.width, data.height, data.depth);
            
            // 创建建筑材质
            const materials = [];
            
            // 为每个面创建不同的材质
            for (let i = 0; i < 6; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // 基础颜色
                ctx.fillStyle = '#' + data.color.toString(16).padStart(6, '0');
                ctx.fillRect(0, 0, 512, 512);
                
                // 如果有窗户
                if (data.windows && i < 4) { // 只在侧面添加窗户
                    const floors = Math.floor(data.height / 4);
                    const windowsPerRow = i < 2 ? Math.floor(data.width / 3) : Math.floor(data.depth / 3);
                    
                    for (let floor = 0; floor < floors; floor++) {
                        for (let col = 0; col < windowsPerRow; col++) {
                            if (Math.random() > 0.1) {
                                const isLit = Math.random() > 0.3;
                                ctx.fillStyle = isLit ? '#ffffaa' : '#334455';
                                const x = (col + 0.5) * (512 / windowsPerRow) - 15;
                                const y = (floor + 0.5) * (512 / floors) - 20;
                                ctx.fillRect(x, y, 30, 40);
                            }
                        }
                    }
                }
                
                // 添加建筑细节
                if (data.landmark) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    for (let j = 0; j < 5; j++) {
                        ctx.beginPath();
                        ctx.moveTo(0, j * 102.4);
                        ctx.lineTo(512, j * 102.4);
                        ctx.stroke();
                    }
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                materials.push(new THREE.MeshLambertMaterial({ map: texture }));
            }
            
            const building = new THREE.Mesh(geometry, materials);
            building.position.set(data.position.x, data.height / 2, data.position.z);
            building.castShadow = true;
            building.receiveShadow = true;
            
            // 存储建筑数据
            building.userData = {
                name: data.name,
                height: data.height,
                desc: data.desc,
                landmark: data.landmark
            };
            
            scene.add(building);
            buildings.push(building);

            // 为地标建筑添加顶部灯光
            if (data.landmark) {
                const topLight = new THREE.PointLight(0xffffff, 2, 100);
                topLight.position.set(data.position.x, data.height + 10, data.position.z);
                scene.add(topLight);
            }
        }

        // ==================== 创建光照 ====================
        function createLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // 太阳光
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(500, 600, 500);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -500;
            sunLight.shadow.camera.right = 500;
            sunLight.shadow.camera.top = 500;
            sunLight.shadow.camera.bottom = -500;
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.far = 2000;
            scene.add(sunLight);

            // 添加城市夜景灯光
            for (let i = 0; i < 50; i++) {
                const light = new THREE.PointLight(0xffaa00, 0.5, 50);
                light.position.set(
                    (Math.random() - 0.5) * config.citySize * 2,
                    5,
                    (Math.random() - 0.5) * config.citySize * 2
                );
                scene.add(light);
            }
        }

        // ==================== 创建天空盒 ====================
        function createSkybox() {
            const skyGeometry = new THREE.SphereGeometry(1500, 32, 32);
            const skyMaterial = new THREE.MeshBasicMaterial({
                color: 0x87CEEB,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);

            // 添加云朵
            for (let i = 0; i < 20; i++) {
                const cloudGeometry = new THREE.SphereGeometry(Math.random() * 30 + 20, 8, 8);
                const cloudMaterial = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.6
                });
                const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
                cloud.position.set(
                    (Math.random() - 0.5) * 1000,
                    Math.random() * 200 + 400,
                    (Math.random() - 0.5) * 1000
                );
                scene.add(cloud);
            }
        }

        // ==================== 创建树木 ====================
        function createTrees() {
            for (let i = 0; i < 100; i++) {
                const treeGroup = new THREE.Group();
                
                // 树干
                const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.8, 8, 8);
                const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 4;
                treeGroup.add(trunk);
                
                // 树冠
                const foliageGeometry = new THREE.SphereGeometry(4, 8, 8);
                const foliageMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
                const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
                foliage.position.y = 10;
                treeGroup.add(foliage);
                
                // 随机位置（避开建筑区域）
                let x, z;
                let validPosition = false;
                while (!validPosition) {
                    x = (Math.random() - 0.5) * config.citySize * 2;
                    z = (Math.random() - 0.5) * config.citySize * 2;
                    
                    validPosition = true;
                    for (let building of ZhujiangNewTownBuildings) {
                        const dx = x - building.position.x;
                        const dz = z - building.position.z;
                        const distance = Math.sqrt(dx * dx + dz * dz);
                        if (distance < 80) {
                            validPosition = false;
                            break;
                        }
                    }
                }
                
                treeGroup.position.set(x, 0, z);
                scene.add(treeGroup);
            }
        }

        // ==================== 事件监听 ====================
        function setupEventListeners() {
            // 键盘事件
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
            });
            
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            // 鼠标锁定
            renderer.domElement.addEventListener('click', () => {
                renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                mouse.locked = document.pointerLockElement === renderer.domElement;
            });

            // 鼠标移动
            document.addEventListener('mousemove', (e) => {
                if (mouse.locked) {
                    yaw -= e.movementX * config.rotationSpeed;
                    pitch -= e.movementY * config.rotationSpeed;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                }
                
                // 更新鼠标位置用于射线检测
                mouseVector.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouseVector.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            // 鼠标滚轮缩放
            window.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 5;
                player.position.y += e.deltaY > 0 ? -zoomSpeed : zoomSpeed;
                player.position.y = Math.max(config.minHeight, Math.min(config.maxHeight, player.position.y));
            }, { passive: false });

            // 窗口大小调整
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ==================== 更新玩家 ====================
        function updatePlayer() {
            // 获取移动速度
            const speed = keys['shift'] ? config.sprintSpeed : config.moveSpeed;

            // 计算移动方向
            const moveDirection = new THREE.Vector3();
            if (keys['w']) moveDirection.z -= 1;
            if (keys['s']) moveDirection.z += 1;
            if (keys['a']) moveDirection.x -= 1;
            if (keys['d']) moveDirection.x += 1;

            // 垂直移动
            if (keys[' ']) player.position.y += config.verticalSpeed;
            if (keys['c']) player.position.y -= config.verticalSpeed;

            // 限制高度
            player.position.y = Math.max(config.minHeight, Math.min(config.maxHeight, player.position.y));

            // 标准化方向向量
            if (moveDirection.length() > 0) {
                moveDirection.normalize();
                moveDirection.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                player.position.x += moveDirection.x * speed;
                player.position.z += moveDirection.z * speed;
            }

            // 限制在城市范围内
            const boundary = config.citySize * 1.5;
            player.position.x = Math.max(-boundary, Math.min(boundary, player.position.x));
            player.position.z = Math.max(-boundary, Math.min(boundary, player.position.z));

            // 更新相机
            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // 检测建筑物
            detectBuildings();

            // 更新UI
            updateUI(moveDirection.length() * speed);
        }

        // ==================== 检测建筑物 ====================
        function detectBuildings() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(buildings);

            if (intersects.length > 0) {
                const building = intersects[0].object;
                if (selectedBuilding !== building) {
                    selectedBuilding = building;
                    showBuildingInfo(building.userData);
                }
            } else {
                if (selectedBuilding) {
                    selectedBuilding = null;
                    hideBuildingInfo();
                }
            }
        }

        // ==================== 显示建筑信息 ====================
        function showBuildingInfo(data) {
            const infoDiv = document.getElementById('buildingInfo');
            document.getElementById('buildingName').textContent = data.name;
            document.getElementById('buildingDesc').textContent = data.desc;
            document.getElementById('buildingHeight').textContent = data.height;
            infoDiv.classList.add('show');
        }

        function hideBuildingInfo() {
            document.getElementById('buildingInfo').classList.remove('show');
        }

        // ==================== 更新UI ====================
        function updateUI(moveSpeed) {
            document.getElementById('position').textContent =
                `X: ${player.position.x.toFixed(0)}, Z: ${player.position.z.toFixed(0)}`;
            document.getElementById('height').textContent =
                `${player.position.y.toFixed(0)} m`;
            document.getElementById('speed').textContent =
                `${(moveSpeed * 3.6).toFixed(1)} km/h`;
            
            // 更新时间
            const hours = Math.floor(time);
            const minutes = Math.floor((time % 1) * 60);
            document.getElementById('time').textContent =
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
        }

        // ==================== 动画循环 ====================
        let lastTime = Date.now();
        function animate() {
            requestAnimationFrame(animate);
            
            const currentTime = Date.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // 更新时间（慢速）
            time += deltaTime * 0.01;
            if (time >= 24) time = 0;

            // 更新天空颜色（根据时间）
            updateSkyColor();

            // 更新玩家
            updatePlayer();

            // 渲染场景
            renderer.render(scene, camera);
        }

        // ==================== 更新天空颜色 ====================
        function updateSkyColor() {
            let skyColor;
            if (time >= 6 && time < 8) {
                // 日出
                skyColor = new THREE.Color(0xff9966);
            } else if (time >= 8 && time < 18) {
                // 白天
                skyColor = new THREE.Color(0x87CEEB);
            } else if (time >= 18 && time < 20) {
                // 日落
                skyColor = new THREE.Color(0xff6644);
            } else {
                // 夜晚
                skyColor = new THREE.Color(0x1a1a2e);
            }
            
            scene.background.lerp(skyColor, 0.01);
            scene.fog.color.lerp(skyColor, 0.01);
        }

        // ==================== 启动游戏 ====================
        init();
    </script>
</body>
</html>
