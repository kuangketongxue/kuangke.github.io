<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识收集系统 - 狂客·银河</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #43e97b;
            --warning-color: #fbbf24;
            --danger-color: #f56565;
            --info-color: #4299e1;
            --dark-bg: #1a202c;
            --dark-card: #2d3748;
            --line-color: #e0e0e0;
            --line-color-dark: #4a5568;
            --highlight-color: #ffd700;
            --highlight-text: #000;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body.dark-mode {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #2d3748 100%);
            color: #e2e8f0;
        }
        /* ========== 容器 ========== */
        .knowledge-page {
            max-width: 1400px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }
        /* ========== 页面头部 ========== */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-header h1 {
            font-size: 3em;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: titleGlow 3s ease-in-out infinite;
        }
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        .page-header p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
        }
        body.dark-mode .page-header p {
            color: #aaa;
        }
        .page-header .subtitle {
            font-size: 0.95em;
            color: #999;
            font-style: italic;
        }
        /* ========== 统计面板 ========== */
        .stats-dashboard {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease;
        }
        body.dark-mode .stats-dashboard {
            background: var(--dark-card);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        body.dark-mode .stat-card {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 8s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-card:hover::before {
            opacity: 1;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }
        .stat-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        body.dark-mode .stat-label {
            color: #aaa;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
            position: relative;
            z-index: 1;
        }
        .last-update {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #fff9e6 0%, #ffe5a0 100%);
            border-radius: 12px;
            color: #d97706;
            font-weight: 600;
            border: 2px solid #fbbf24;
        }
        body.dark-mode .last-update {
            background: linear-gradient(135deg, #3a3520 0%, #4a4228 100%);
            color: #fbbf24;
        }
        .last-update i {
            margin-right: 8px;
        }
        /* ========== 工具栏 ========== */
        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }
        body.dark-mode .toolbar {
            background: var(--dark-card);
        }
        .tool-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .tool-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .tool-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        .tool-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        .tool-btn i, .tool-btn span {
            position: relative;
            z-index: 1;
        }
        .tool-btn.success {
            background: linear-gradient(135deg, var(--success-color) 0%, #38f9d7 100%);
        }
        .tool-btn.warning {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }
        .tool-btn.info {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
        }
        .tool-btn.danger {
            background: linear-gradient(135deg, var(--danger-color) 0%, #e53e3e 100%);
        }
        .tool-btn.active {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
            transform: scale(1.05);
        }
        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 500px;
        }
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            border-color: var(--secondary-color);
        }
        body.dark-mode .search-input {
            background: var(--dark-bg);
            color: #fff;
            border-color: var(--primary-color);
        }
        /* ========== 高亮样式 ========== */
        .highlight {
            background: var(--highlight-color);
            color: var(--highlight-text);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
            animation: highlightPulse 1.5s ease-in-out infinite;
        }
        @keyframes highlightPulse {
            0%, 100% { background: var(--highlight-color); }
            50% { background: #ffed4e; }
        }
        body.dark-mode .highlight {
            background: #fbbf24;
            color: #1a202c;
        }
        /* ========== 知识列表 ========== */
        .knowledge-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            min-height: 600px;
        }
        body.dark-mode .knowledge-container {
            background: var(--dark-card);
        }
        .knowledge-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .knowledge-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid var(--primary-color);
            transition: all 0.3s ease;
            cursor: pointer;
            animation: slideIn 0.5s ease;
        }
        body.dark-mode .knowledge-item {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .knowledge-item:hover {
            transform: translateX(10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .knowledge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .knowledge-number {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
        }
        .knowledge-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .badge.difficulty {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
        }
        .badge.importance {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            color: white;
        }
        .badge.inspiration {
            background: linear-gradient(135deg, var(--success-color) 0%, #38f9d7 100%);
            color: white;
        }
        /* 日期徽章 */
        .badge.date {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
        }
        .knowledge-content {
            color: #333;
            line-height: 1.8;
            font-size: 1.05em;
        }
        body.dark-mode .knowledge-content {
            color: #e2e8f0;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }
        .empty-state i {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        .empty-state p {
            font-size: 1.1em;
        }
        /* ========== 排序指示器 ========== */
        .sort-indicator {
            display: inline-block;
            margin-left: 5px;
            font-size: 0.8em;
        }
        /* ========== 固定按钮 ========== */
        .fixed-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }
        .back-button, .back-to-top {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }
        .back-button::before, .back-to-top::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .back-button:hover::before, .back-to-top:hover::before {
            width: 150px;
            height: 150px;
        }
        .back-to-top {
            background: linear-gradient(135deg, var(--success-color) 0%, #38f9d7 100%);
            display: none;
        }
        .back-button:hover, .back-to-top:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }
        .back-button i, .back-to-top i {
            position: relative;
            z-index: 1;
        }
        /* ========== 加载动画 ========== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }
        body.dark-mode .loading-overlay {
            background: rgba(26, 32, 44, 0.95);
        }
        .loading-content {
            text-align: center;
        }
        .loading-content i {
            font-size: 4em;
            color: var(--primary-color);
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading-content p {
            margin-top: 20px;
            font-size: 1.3em;
            color: var(--primary-color);
            font-weight: 600;
        }
        /* ========== 进度条 ========== */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            z-index: 10000;
            transition: width 0.2s ease;
            width: 0%;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        /* ========== 响应式设计 ========== */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2.2em;
            }
            .knowledge-page {
                padding: 30px 15px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .toolbar {
                flex-direction: column;
                padding: 15px;
            }
            .search-box {
                max-width: 100%;
                width: 100%;
            }
            .tool-btn {
                width: 100%;
                justify-content: center;
            }
            .knowledge-container {
                padding: 20px;
            }
            .knowledge-item {
                padding: 20px;
            }
            .knowledge-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .knowledge-badges {
                flex-wrap: wrap;
            }
            .fixed-buttons {
                bottom: 20px;
                right: 20px;
            }
            .back-button, .back-to-top {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 阅读进度条 -->
    <div class="reading-progress"></div>
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <i class="fas fa-book-reader"></i>
            <p>正在加载知识数据...</p>
        </div>
    </div>
    <!-- 头部导航 -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <h1 class="logo">狂客·银河</h1>
                <a class="success-link" href="success.html">
                    <span class="success-icon"><i class="fas fa-meteor"></i></span>
                    <span class="success-text">成功日记</span>
                </a>
                <a class="breakthrough-link" href="https://kuangketongxue.github.io/kuangke.github.io/ai.html">

                </a>
                <a class="sky-link" href="reading.html">
                    <span class="sky-icon"><i class="fas fa-star"></i></span>

                    <span class="exam-icon"><i class="fas fa-graduation-cap"></i></span>
                    <span class="exam-text">冬之街小店</span>
                </a>
                <a class="video-link" href="video.html">
                    <span class="video-icon"><i class="fas fa-video"></i></span>
                    <span class="video-text">视频矩阵</span>
                </a>
                <a class="game-link" href="games.html">
                    <span class="game-icon"><i class="fas fa-gamepad"></i></span>

                </a>
            </div>
            <div class="controls">
                <button id="themeToggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>

    </header>
    <!-- 主体内容 -->
    <div class="knowledge-page">
        <!-- 页面头部 -->
        <div class="page-header">
            <h1>📚 知识收集系统</h1>
            <p>记录每一次学习的内容与感悟</p>
            <p class="subtitle">从 GitHub map.md 自动同步</p>
        </div>
        <!-- 统计面板 -->
        <div class="stats-dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-label">总收集数</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-label">平均难度</div>
                    <div class="stat-value" id="avgDifficulty">0.0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-label">平均重要性</div>
                    <div class="stat-value" id="avgImportance">0.0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💡</div>
                    <div class="stat-label">平均启发值</div>
                    <div class="stat-value" id="avgInspiration">0.0</div>
                </div>
            </div>
            <div class="last-update">
                <i class="fas fa-clock"></i>
                <span id="lastUpdate">暂无更新记录</span>
            </div>
        </div>
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索知识内容...">
                <button class="tool-btn" onclick="search()">
                    <i class="fas fa-search"></i> <span>搜索</span>
                </button>
            </div>
            <button class="tool-btn success" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> <span>刷新数据</span>
            </button>
            <button class="tool-btn warning" id="sortDifficultyBtn" onclick="toggleSort('difficulty')">
                <i class="fas fa-chart-line"></i>
                <span>难度排序<span class="sort-indicator" id="difficultyIndicator"></span></span>
            </button>
            <button class="tool-btn info" id="sortImportanceBtn" onclick="toggleSort('importance')">
                <i class="fas fa-star"></i>
                <span>重要性<span class="sort-indicator" id="importanceIndicator"></span></span>
            </button>
            <button class="tool-btn danger" id="sortInspirationBtn" onclick="toggleSort('inspiration')">
                <i class="fas fa-lightbulb"></i>
                <span>启发值<span class="sort-indicator" id="inspirationIndicator"></span></span>
            </button>
        </div>
        <!-- 知识列表容器 -->
        <div class="knowledge-container">
            <div class="knowledge-list" id="knowledgeList">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>
    <!-- 固定按钮 -->
    <div class="fixed-buttons">
        <button class="back-to-top" id="backToTopBtn">
            <i class="fas fa-arrow-up"></i>
        </button>
        <a href="ai.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
        </a>
    </div>
    <script>
        // ========== 配置 ==========
        const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/kuangketongxue/kuangke.github.io/main/map.md';
        let knowledgeData = [];
        let filteredData = [];
        let currentSearchTerm = '';
        // 排序状态管理
        let sortState = {
            difficulty: null,  // null: 未排序, 'asc': 升序, 'desc': 降序
            importance: null,
            inspiration: null
        };

        // ========== 主函数 ==========
        async function loadKnowledgeData() {
            try {
                const response = await fetch(GITHUB_RAW_URL);
                if (!response.ok) {
                    throw new Error('无法加载数据文件,请检查 GitHub 仓库设置');
                }
                const text = await response.text();
                knowledgeData = parseMarkdown(text);
                filteredData = [...knowledgeData];
                renderKnowledgeList();
                updateStatistics();
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (error) {
                console.error('加载失败:', error);
                showEmptyState(error.message);
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // ========== 解析 Markdown ==========
        // 支持格式:
        // ## 12. 某一条内容
        // **难度**: 8
        // **重要性**: 9
        // **启发值**: 10
        // **日期**: 2024-12-06 13:20 (或 2024/12/06, 2024.12.06 13:20:45)
        function parseMarkdown(text) {
            const lines = text.split('\n');
            const data = [];
            let currentItem = null;

            lines.forEach(line => {
                line = line.trim();

                // 标题行: ## 编号. 内容
                const headerMatch = line.match(/^##\s*(\d+)\.\s*(.+)$/);
                if (headerMatch) {
                    if (currentItem) {
                        data.push(currentItem);
                    }
                    currentItem = {
                        number: parseInt(headerMatch[1]),
                        content: headerMatch[2],
                        difficulty: 0,
                        importance: 0,
                        inspiration: 0,
                        date: null,                 // 原始日期文本或标准化文本
                        timestamp: new Date().toISOString() // 加载时间作为回退值
                    };
                    return;
                }

                if (currentItem) {
                    // 难度
                    const diffMatch = line.match(/\*\*?难度\*\*?[:：]\s*(\d+(?:\.\d+)?)/);
                    if (diffMatch) currentItem.difficulty = parseFloat(diffMatch[1]);

                    // 重要性
                    const impMatch = line.match(/\*\*?重要性\*\*?[:：]\s*(\d+(?:\.\d+)?)/);
                    if (impMatch) currentItem.importance = parseFloat(impMatch[1]);

                    // 启发值
                    const inspMatch = line.match(/\*\*?启发值\*\*?[:：]\s*(\d+(?:\.\d+)?)/);
                    if (inspMatch) currentItem.inspiration = parseFloat(inspMatch[1]);

                    // 日期/时间
                    const dateMatch = line.match(/\*\*?(?:日期|时间|Date)\*\*?[:：]\s*([0-9]{4}[./-][0-9]{1,2}[./-][0-9]{1,2}(?:\s+[0-9]{1,2}:[0-9]{2}(?::[0-9]{2})?)?)/i);
                    if (dateMatch) {
                        const iso = normalizeToISO(dateMatch[1]);
                        if (iso) {
                            currentItem.date = iso;
                        } else {
                            // 不可解析则保留原样
                            currentItem.date = dateMatch[1];
                        }
                    }
                }
            });

            if (currentItem) {
                data.push(currentItem);
            }

            // 按编号倒序
            return data.sort((a, b) => b.number - a.number);
        }

        // ========== 工具: 将常见日期格式标准化为 ISO 字符串 ==========
        function normalizeToISO(input) {
            if (!input) return null;
            // 将 yyyy/mm/dd 或 yyyy.mm.dd 替换为 yyyy-mm-dd
            let s = input.trim().replace(/[./]/g, '-');
            // 若只有日期无时间，补 00:00:00
            if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) {
                s = s + ' 00:00:00';
            }
            // Safari 兼容: 将空格换为 'T'
            s = s.replace(' ', 'T');

            const d = new Date(s);
            if (isNaN(d.getTime())) return null;
            return d.toISOString();
        }

        // ========== 渲染知识列表 ==========
        function renderKnowledgeList() {
            const container = document.getElementById('knowledgeList');

            if (filteredData.length === 0) {
                if (currentSearchTerm) {
                    showEmptyState(`未找到包含 "${currentSearchTerm}" 的知识记录`);
                } else {
                    showEmptyState('暂无知识记录,快去 GitHub 提交你的第一条学习笔记吧!');
                }
                return;
            }

            container.innerHTML = '';
            filteredData.forEach((item, index) => {
                const itemEl = createKnowledgeItem(item, index);
                container.appendChild(itemEl);
            });
        }

        // ========== 创建知识项 ==========
        function createKnowledgeItem(item, index) {
            const div = document.createElement('div');
            div.className = 'knowledge-item';
            div.style.animationDelay = `${index * 0.1}s`;

            // 高亮处理内容
            let displayContent = item.content;
            if (currentSearchTerm) {
                displayContent = highlightText(item.content, currentSearchTerm);
            }

            // 计算展示日期: 优先 Markdown 提供的日期 (item.date), 其次使用 timestamp
            const displayDate = formatDateTime(item.date || item.timestamp);

            div.innerHTML = `
                <div class="knowledge-header">
                    <div class="knowledge-number">${item.number}</div>
                    <div class="knowledge-badges">
                        <span class="badge date">
                            <i class="fas fa-calendar-alt"></i> 日期: ${displayDate}
                        </span>
                        <span class="badge difficulty">
                            <i class="fas fa-chart-line"></i> 难度: ${item.difficulty}
                        </span>
                        <span class="badge importance">
                            <i class="fas fa-exclamation-circle"></i> 重要性: ${item.importance}
                        </span>
                        <span class="badge inspiration">
                            <i class="fas fa-lightbulb"></i> 启发值: ${item.inspiration}
                        </span>
                    </div>
                </div>
                <div class="knowledge-content">${displayContent}</div>
            `;
            return div;
        }

        // ========== 文本高亮函数 ==========
        function highlightText(text, searchTerm) {
            if (!searchTerm) return text;
            const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedTerm})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // ========== 日期格式化 ==========
        function formatDateTime(isoOrText) {
            if (!isoOrText) return '未知';
            // 如果是 ISO 字符串
            const d = new Date(isoOrText);
            if (!isNaN(d.getTime())) {
                return d.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
            }
            // 非日期则原样展示
            return isoOrText;
        }

        // ========== 更新统计信息 ==========
        function updateStatistics() {
            const totalCount = knowledgeData.length;
            if (totalCount === 0) {
                document.getElementById('totalCount').textContent = '0';
                document.getElementById('avgDifficulty').textContent = '0.0';
                document.getElementById('avgImportance').textContent = '0.0';
                document.getElementById('avgInspiration').textContent = '0.0';
                document.getElementById('lastUpdate').textContent = '暂无更新记录';
                return;
            }

            const avgDifficulty = (knowledgeData.reduce((sum, item) => sum + item.difficulty, 0) / totalCount).toFixed(1);
            const avgImportance = (knowledgeData.reduce((sum, item) => sum + item.importance, 0) / totalCount).toFixed(1);
            const avgInspiration = (knowledgeData.reduce((sum, item) => sum + item.inspiration, 0) / totalCount).toFixed(1);

            // 最近更新时间: 取所有 item 的 (item.date || item.timestamp) 最大值
            const latestISO = knowledgeData
                .map(i => i.date || i.timestamp)
                .filter(Boolean)
                .map(v => new Date(v))
                .filter(d => !isNaN(d.getTime()))
                .sort((a, b) => b - a)[0];

            animateNumber('totalCount', 0, totalCount, 1000);
            animateNumber('avgDifficulty', 0, parseFloat(avgDifficulty), 1200, 1);
            animateNumber('avgImportance', 0, parseFloat(avgImportance), 1400, 1);
            animateNumber('avgInspiration', 0, parseFloat(avgInspiration), 1600, 1);

            if (latestISO) {
                document.getElementById('lastUpdate').innerHTML = `最近更新: ${formatDateTime(latestISO.toISOString())}`;
            } else {
                document.getElementById('lastUpdate').textContent = '暂无更新记录';
            }
        }

        // ========== 数字动画 ==========
        function animateNumber(elementId, start, end, duration, decimals = 0) {
            const element = document.getElementById(elementId);
            const range = end - start;
            const increment = range / (duration / 16);
            let current = start;
            const timer = setInterval(() => {
                current += increment;
                if ((increment >= 0 && current >= end) || (increment < 0 && current <= end)) {
                    element.textContent = decimals > 0 ? end.toFixed(decimals) : end;
                    clearInterval(timer);
                } else {
                    element.textContent = decimals > 0 ? current.toFixed(decimals) : Math.floor(current);
                }
            }, 16);
        }

        // ========== 搜索功能 ==========
        function search() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            currentSearchTerm = searchTerm;
            if (!searchTerm) {
                filteredData = [...knowledgeData];
            } else {
                filteredData = knowledgeData.filter(item =>
                    item.content.toLowerCase().includes(searchTerm)
                );
            }
            // 重置排序状态
            resetSortButtons();
            renderKnowledgeList();
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });

        // 实时搜索(可选)
        document.getElementById('searchInput').addEventListener('input', (e) => {
            // 如果想要实时搜索,取消下面的注释
            // search();
        });

        // ========== 排序功能 ==========
        function toggleSort(type) {
            // 重置其他排序状态
            Object.keys(sortState).forEach(key => {
                if (key !== type) {
                    sortState[key] = null;
                }
            });

            // 切换当前排序状态
            if (sortState[type] === null) {
                sortState[type] = 'desc'; // 首次点击:降序(从高到低)
            } else if (sortState[type] === 'desc') {
                sortState[type] = 'asc';  // 第二次点击:升序(从低到高)
            } else {
                sortState[type] = null;   // 第三次点击:取消排序
            }

            // 执行排序
            if (sortState[type] === null) {
                filteredData = [...knowledgeData]; // 恢复原始顺序
            } else {
                const order = sortState[type] === 'desc' ? -1 : 1;
                filteredData.sort((a, b) => (b[type] - a[type]) * order);
            }

            // 更新按钮状态
            updateSortButtons(type);
            renderKnowledgeList();
        }

        // ========== 更新排序按钮显示 ==========
        function updateSortButtons(activeType) {
            ['difficulty', 'importance', 'inspiration'].forEach(type => {
                const btn = document.getElementById(`sort${capitalize(type)}Btn`);
                const indicator = document.getElementById(`${type}Indicator`);
                if (type === activeType && sortState[type] !== null) {
                    btn.classList.add('active');
                    indicator.innerHTML = sortState[type] === 'desc' ? '↓' : '↑';
                } else {
                    btn.classList.remove('active');
                    indicator.innerHTML = '';
                }
            });
        }

        // ========== 重置排序按钮 ==========
        function resetSortButtons() {
            Object.keys(sortState).forEach(key => {
                sortState[key] = null;
            });
            updateSortButtons(null);
        }

        // ========== 工具函数:首字母大写 ==========
        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // ========== 刷新数据 ==========
        function refreshData() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            currentSearchTerm = '';
            document.getElementById('searchInput').value = '';
            resetSortButtons();
            loadKnowledgeData();
        }

        // ========== 空状态 ==========
        function showEmptyState(message) {
            const container = document.getElementById('knowledgeList');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-book-open"></i>
                    <h3>暂无数据</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // ========== 主题切换 ==========
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // ========== 返回顶部 ==========
        const backToTopBtn = document.getElementById('backToTopBtn');
        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopBtn.style.display = 'flex';
            } else {
                backToTopBtn.style.display = 'none';
            }
        });
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ========== 阅读进度条 ==========
        const progressBar = document.querySelector('.reading-progress');
        window.addEventListener('scroll', () => {
            const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (window.pageYOffset / windowHeight) * 100;
            progressBar.style.width = scrolled + '%';
        });

        // ========== 页面加载 ==========
        window.addEventListener('load', loadKnowledgeData);
    </script>
</body>
</html>
