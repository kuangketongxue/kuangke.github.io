<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 基础Meta标签 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- SEO优化 -->
    <meta name="description" content="狂客·银河 - 探索无限星空，记录生活精彩瞬间">
    <meta name="keywords" content="狂客,银河,星空,朋友圈,宇宙,生活分享,成功日记">
    <meta name="author" content="狂客">
    <meta name="robots" content="index, follow">
    <!-- Open Graph / 社交媒体分享 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="狂客·银河 - 探索无限星空">
    <meta property="og:description" content="在浩瀚星空下，记录每一个闪光的瞬间">
    <meta property="og:site_name" content="狂客·银河">
    <!-- 网站图标 -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon.ico">
    <!-- 预连接外部资源 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <title>狂客·银河 - 探索无限星空</title>
    <!-- 样式表 -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <style>
        /* ==================== 重置和基础样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #000428;
            background: linear-gradient(to bottom, #000428, #004e92);
            min-height: 100vh;
            padding-top: 70px;
            position: relative;
            overflow-x: hidden;
        }

        /* 星空背景动画 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, white, transparent),
                radial-gradient(1px 1px at 50px 20px, white, transparent),
                radial-gradient(1px 1px at 80px 10px, white, transparent),
                radial-gradient(2px 2px at 130px 80px, white, transparent),
                radial-gradient(1px 1px at 110px 50px, white, transparent);
            background-size: 200px 200px;
            animation: stars 120s linear infinite;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 4, 40, 0.4) 50%, rgba(0, 4, 40, 0.8) 100%);
            z-index: -1;
        }

        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }

        /* 流星效果 */
        .meteor {
            position: fixed;
            top: 0;
            left: 0;
            width: 2px;
            height: 2px;
            background: white;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            animation: meteor 3s linear infinite;
            z-index: -1;
        }

        .meteor::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 2px;
            background: linear-gradient(to left, transparent, rgba(255, 255, 255, 0.8));
            transform: translateX(-100px);
        }

        @keyframes meteor {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(-500px, 500px);
                opacity: 0;
            }
        }

        /* ==================== 顶部导航栏星空主题 ==================== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(0, 4, 40, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 78, 146, 0.3);
        }

        [data-theme="light"] .header {
            background: rgba(255, 255, 255, 0.95);
            border-bottom-color: rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.2); }
        }

        [data-theme="light"] .logo {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .primary-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .primary-nav a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .primary-nav a::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3), transparent);
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        .primary-nav a:hover::before {
            width: 100%;
            height: 100%;
        }

        .primary-nav a:hover {
            background: rgba(102, 126, 234, 0.2);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        [data-theme="light"] .primary-nav a {
            color: #666;
        }

        [data-theme="light"] .primary-nav a:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .search-box input {
            padding: 10px 14px 10px 40px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            font-size: 14px;
            width: 220px;
            transition: all 0.3s ease;
            color: #fff;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3), 0 4px 20px rgba(102, 126, 234, 0.2);
            width: 280px;
            background: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] .search-box i {
            color: #999;
        }

        [data-theme="light"] .search-box input {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.1);
            color: #333;
        }

        [data-theme="light"] .search-box input::placeholder {
            color: #999;
        }

        .theme-toggle {
            padding: 10px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s ease;
            font-size: 16px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: rotate(180deg);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        [data-theme="light"] .theme-toggle {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.1);
            color: #666;
        }

        /* ==================== 星空主题功能按钮 ==================== */
        .function-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-button-base {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .nav-button-base::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
            z-index: 0;
        }

        .nav-button-base:hover::before {
            width: 120%;
            height: 120%;
        }

        .nav-button-base:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .nav-button-base:active {
            transform: translateY(-1px);
        }

        .nav-button-base span {
            position: relative;
            z-index: 1;
        }

        .button-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .nav-button-base:hover .button-icon {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1) rotate(10deg);
        }

        /* AI前沿按钮 - 紫色星云 */
        .ai-nav-button {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.6), rgba(118, 75, 162, 0.6));
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .ai-nav-button:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8));
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }

        /* 健康提醒按钮 - 绿色极光 */
        .health-nav-button {
            background: linear-gradient(135deg, rgba(0, 201, 167, 0.6), rgba(139, 92, 246, 0.6));
            border-color: rgba(0, 201, 167, 0.5);
            box-shadow: 0 4px 15px rgba(0, 201, 167, 0.3);
        }

        .health-nav-button:hover {
            background: linear-gradient(135deg, rgba(0, 201, 167, 0.8), rgba(139, 92, 246, 0.8));
            box-shadow: 0 8px 30px rgba(0, 201, 167, 0.5);
        }

        /* 美食聚餐按钮 - 橙色星系 */
        .meal-nav-button {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.6), rgba(255, 165, 0, 0.6));
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .meal-nav-button:hover {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.8), rgba(255, 165, 0, 0.8));
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.5);
        }

        /* 加密货币按钮 - 金色恒星 */
        .crypto-nav-button {
            background: linear-gradient(135deg, rgba(247, 147, 26, 0.6), rgba(255, 107, 53, 0.6));
            border-color: rgba(247, 147, 26, 0.5);
            box-shadow: 0 4px 15px rgba(247, 147, 26, 0.3);
        }

        .crypto-nav-button:hover {
            background: linear-gradient(135deg, rgba(247, 147, 26, 0.8), rgba(255, 107, 53, 0.8));
            box-shadow: 0 8px 30px rgba(247, 147, 26, 0.5);
        }

        /* ==================== 分类导航星空主题 ==================== */
        .category-nav {
            background: rgba(0, 4, 40, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
            padding: 20px 0;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .category-nav::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 150, 255, 0.5), transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        [data-theme="light"] .category-nav {
            background: rgba(255, 255, 255, 0.9);
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }

        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 150, 255, 0.5) transparent;
        }

        .category-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .category-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .category-scroll::-webkit-scrollbar-thumb {
            background: rgba(100, 150, 255, 0.5);
            border-radius: 2px;
        }

        .category-btn {
            padding: 10px 18px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.3), transparent);
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        .category-btn:hover::before {
            width: 100%;
            height: 100%;
        }

        .category-btn:hover {
            border-color: rgba(100, 150, 255, 0.6);
            color: #fff;
            background: rgba(100, 150, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.3);
        }

        .category-btn.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.6), rgba(118, 75, 162, 0.6));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        [data-theme="light"] .category-btn {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.1);
            color: #666;
        }

        [data-theme="light"] .category-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        /* ==================== 排序控件星空主题 ==================== */
        .sort-nav {
            background: rgba(0, 4, 40, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
            padding: 20px 0;
            position: sticky;
            top: 70px;
            z-index: 100;
        }

        [data-theme="light"] .sort-nav {
            background: rgba(255, 255, 255, 0.9);
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }

        .sort-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .sort-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
        }

        [data-theme="light"] .sort-label {
            color: #666;
        }

        .sort-select {
            padding: 10px 16px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 180px;
        }

        .sort-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        [data-theme="light"] .sort-select {
            background: white;
            border-color: rgba(0, 0, 0, 0.15);
            color: #333;
        }

        .view-options {
            display: flex;
            gap: 8px;
        }

        .view-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-btn:hover {
            border-color: rgba(100, 150, 255, 0.6);
            color: #fff;
            background: rgba(100, 150, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.3);
        }

        .view-btn.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.6), rgba(118, 75, 162, 0.6));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        [data-theme="light"] .view-btn {
            background: white;
            border-color: rgba(0, 0, 0, 0.15);
            color: #666;
        }

        [data-theme="light"] .view-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        /* ==================== 主要内容区域星空主题 ==================== */
        .main-content {
            padding: 40px 0;
            min-height: calc(100vh - 300px);
            position: relative;
        }

        /* 统计卡片 */
        .moments-stats {
            margin-bottom: 40px;
            position: relative;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .stat-card {
            background: rgba(0, 4, 40, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(100, 150, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.1), transparent);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0, 78, 146, 0.3);
            border-color: rgba(100, 150, 255, 0.4);
        }

        .stat-card.highlight {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-color: rgba(102, 126, 234, 0.4);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        [data-theme="light"] .stat-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.06);
        }

        [data-theme="light"] .stat-card.highlight {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-color: rgba(102, 126, 234, 0.2);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .stat-label {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        [data-theme="light"] .stat-label {
            color: #666;
        }

        /* 朋友圈网格 */
        .moments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .moment-card {
            background: rgba(0, 4, 40, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .moment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(100, 150, 255, 0.6), transparent);
            animation: scanCard 3s linear infinite;
        }

        @keyframes scanCard {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes fadeInUp {
            from {

            display: flex;
            align-items: center;
            gap: 10px;

            align-items: center;

            height: 40px;

            width: 100%;
            max-width: none;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 1200px) {
            .moments-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        @media (max-width: 992px) {
            .header-left {
                gap: 20px;
            }
            
            .primary-nav {
                display: none;
            }
            
            .controls {
                gap: 10px;
            }
            
            .nav-button-base span:not(.button-icon) {
                display: none;
            }
            
            .button-icon {
                margin-right: 0;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }
            
            body {
                padding-top: 70px;
            }
            
            .sort-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            
            .sort-group {
                justify-content: space-between;
            }
            
            .view-options {
                justify-content: center;
            }
            
            .moments-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .stat-cards {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .pagination-container {
                flex-direction: column;
                text-align: center;
            }
            
            .pagination-controls {
                order: 2;
            }
            
            .pagination-info {
                order: 1;
            }
            
            .pagination-settings {
                order: 3;
            }
        }

        @media (max-width: 576px) {

                gap: 6px;
            }
            
            .nav-button-base {
                padding: 8px 10px;
            }
            
            .button-icon {
                width: 18px;
                height: 18px;
            }
            
            .moment-card {
                padding: 20px;
            }
            
            .moment-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        /* ==================== 工具类 ==================== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ==================== 加载动画 ==================== */
        .skeleton {
            background: linear-gradient(

                rgba(100, 150, 255, 0.1) 25%,

            background-size: 200% 100%;

                #f0f0f0 25%,
                #e0e0e0 50%,
                #f0f0f0 75%
            );
        }

                        <div class="stat-number" id="highValueMoments" aria-live="polite">0</div>
                        <div class="stat-label">

            <!-- 朋友圈内容列表 -->
            <section
                id="momentsContainer"
                class="moments-grid"
                role="feed"
                aria-label="朋友圈内容列表"

            </section>

    <!-- ==================== JavaScript文件 ==================== -->
    <!-- 数据文件优先加载 -->
    <script src="data.js"></script>
    <!-- 主逻辑文件延迟加载 -->
    <script>
        // ==================== 排序、视图、分页相关全局变量 ====================
        let currentSortMethod = 'date-desc'; // 默认按日期降序
        let currentViewMode = 'grid'; // 默认网格视图
        let currentPage = 1;
        let currentFilteredMoments = [];

        // ==================== 主题切换功能 ====================
        function initThemeToggle() {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const icon = themeToggle.querySelector('i');
            
            // 从localStorage恢复主题设置
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                body.setAttribute('data-theme', 'light');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
            
            themeToggle.addEventListener('click', () => {
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                body.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                
                // 切换图标
                if (newTheme === 'light') {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            });
        }

        // ==================== 初始化功能 ====================
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化主题切换
            initThemeToggle();
            
            // 初始化事件监听器
            initializeSortControls();
            initializeViewControls();
            initPaginationControls();

            // 恢复用户的偏好设置
            restoreUserPreferences();

            // 初始化页面（等数据）
            setTimeout(() => {
                initializePage();
            }, 100);
        });

        function initializePage() {
            // 确保数据已加载
            if (typeof momentsData !== 'undefined' && Array.isArray(momentsData) && momentsData.length > 0) {
                window.momentsData = momentsData;
                sortAndRenderMoments();
                updateViewMode();
            } else {
                // 如果数据尚未加载，等待
                setTimeout(initializePage, 500);
            }
        }

        // ==================== 排序控件初始化 ====================
        function initializeSortControls() {
            const sortBySelect = document.getElementById('sortBy');
            if (sortBySelect) {
                sortBySelect.addEventListener('change', function(e) {
                    currentSortMethod = e.target.value;
                    sortAndRenderMoments();
                    updateSortUI();
                });
            }
        }

        // ==================== 视图控件初始化 ====================
        function initializeViewControls() {
            const gridViewBtn = document.getElementById('gridView');
            const listViewBtn = document.getElementById('listView');
            if (gridViewBtn && listViewBtn) {
                gridViewBtn.addEventListener('click', function() {
                    currentViewMode = 'grid';
                    updateViewMode();
                });
                listViewBtn.addEventListener('click', function() {
                    currentViewMode = 'list';
                    updateViewMode();
                });
            }
        }

        // ==================== 恢复用户偏好设置 ====================
        function restoreUserPreferences() {
            // 恢复排序偏好
            const savedSortMethod = localStorage.getItem('preferredSortMethod');
            if (savedSortMethod) {
                currentSortMethod = savedSortMethod;
                const sortBySelect = document.getElementById('sortBy');
                if (sortBySelect) {
                    sortBySelect.value = savedSortMethod;
                }
            }
            // 恢复视图偏好
            const savedViewMode = localStorage.getItem('preferredViewMode');
            if (savedViewMode) {
                currentViewMode = savedViewMode;
            }
        }

        // ==================== 视图模式更新 ====================
        function updateViewMode() {
            const momentsContainer = document.getElementById('momentsContainer');
            const gridViewBtn = document.getElementById('gridView');
            const listViewBtn = document.getElementById('listView');

            if (momentsContainer) {
                if (currentViewMode === 'list') {
                    momentsContainer.classList.add('list-view');
                    momentsContainer.classList.remove('moments-grid');
                    listViewBtn && listViewBtn.classList.add('active');
                    gridViewBtn && gridViewBtn.classList.remove('active');
                } else {
                    momentsContainer.classList.add('moments-grid');
                    momentsContainer.classList.remove('list-view');
                    gridViewBtn && gridViewBtn.classList.add('active');
                    listViewBtn && listViewBtn.classList.remove('active');
                }
            }
            // 保存视图模式偏好
            localStorage.setItem('preferredViewMode', currentViewMode);
        }

        // ==================== 排序功能 ====================
        function sortMoments(moments, sortMethod) {
            const sortedMoments = [...moments];
            switch (sortMethod) {
                case 'date-desc':
                    // 最新发布（日期降序）
                    sortedMoments.sort((a, b) => new Date(b.date) - new Date(a.date));
                    break;
                case 'date-asc':
                    // 最早发布（日期升序）
                    sortedMoments.sort((a, b) => new Date(a.date) - new Date(b.date));
                    break;
                case 'value-desc':
                    // 价值最高（价值降序）
                    sortedMoments.sort((a, b) => (b.value || 0) - (a.value || 0));
                    break;
                case 'value-asc':
                    // 价值最低（价值升序）
                    sortedMoments.sort((a, b) => (a.value || 0) - (b.value || 0));
                    break;
                default:
                    // 默认按日期降序
                    sortedMoments.sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            return sortedMoments;
        }

        // ==================== 排序并渲染朋友圈 ====================
        function sortAndRenderMoments() {
            // 获取当前筛选后的朋友圈数据
            let currentMoments = window.currentFilteredMoments || window.momentsData;

            // 如果没有筛选数据，使用全部数据
            if (!currentMoments || currentMoments.length === 0) {
                currentMoments = window.momentsData || [];
            }

            // 执行排序
            const sortedMoments = sortMoments(currentMoments, currentSortMethod);

            // 更新全局筛选数据
            window.currentFilteredMoments = sortedMoments;

            // 重置分页并重新渲染
            window.currentPage = 1;
            renderMoments();
            updatePagination();

            // 更新统计信息
            updateStats(sortedMoments);

            // 保存排序偏好
            localStorage.setItem('preferredSortMethod', currentSortMethod);

            // 添加排序动画效果
            animateSortChange();
        }

        // ==================== 更新排序UI ====================
        function updateSortUI() {
            const sortBySelect = document.getElementById('sortBy');
            if (sortBySelect) {
                sortBySelect.value = currentSortMethod;
            }
            const sortNav = document.querySelector('.sort-nav');
            if (sortNav) {
                sortNav.classList.add('sorting');
                setTimeout(() => {
                    sortNav.classList.remove('sorting');
                }, 300);
            }
        }

        // ==================== 排序动画效果 ====================
        function animateSortChange() {
            const momentsContainer = document.getElementById('momentsContainer');
            if (!momentsContainer) return;

            momentsContainer.style.opacity = '0.5';
            momentsContainer.style.transform = 'scale(0.98)';
            setTimeout(() => {
                momentsContainer.style.opacity = '1';
                momentsContainer.style.transform = 'scale(1)';
            }, 200);
        }

        // ==================== 渲染朋友圈 ====================
        function renderMoments() {
            const momentsContainer = document.getElementById('momentsContainer');
            if (!momentsContainer) return;

            // 使用已排序的筛选数据
            let momentsToRender = window.currentFilteredMoments || window.momentsData || [];

            // 分页处理
            const itemsPerPage = parseInt(document.getElementById('itemsPerPage')?.value || '12', 10);
            const startIndex = (window.currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageMoments = momentsToRender.slice(startIndex, endIndex);

            // 清空容器
            momentsContainer.innerHTML = '';
            // 加载状态
            momentsContainer.setAttribute('aria-busy', 'true');

            // 渲染朋友圈卡片
            pageMoments.forEach((moment, index) => {
                const card = createMomentCard(moment, startIndex + index);
                momentsContainer.appendChild(card);
                // 渐进显示动画
                setTimeout(() => {
                    card.classList.add('fade-in');
                }, index * 50);
            });

            // 移除加载状态
            setTimeout(() => {
                momentsContainer.setAttribute('aria-busy', 'false');
            }, pageMoments.length * 50);

            // 更新分页信息
            updatePaginationInfo();
        }

        // ==================== 创建朋友圈卡片 ====================
        function createMomentCard(moment, index) {
            const card = document.createElement('article');
            card.className = 'moment-card';
            card.setAttribute('role', 'article');
            card.setAttribute('aria-label', `朋友圈内容 ${index + 1}`);

            // 格式化日期（容错无效日期）
            const rawDate = new Date(moment.date);
            const hasValidDate = rawDate instanceof Date && !isNaN(rawDate);
            const formattedDate = hasValidDate ? formatDate(rawDate) : (moment.date || '未知时间');

            // 价值标签
            const valueLabel = moment.value ? `
                <span class="value-badge" style="background: ${getValueColor(moment.value)}">
                    <i class="fas fa-star" style="margin-right: 4px;"></i>价值 ${moment.value}
                </span>
            ` : '';

            card.innerHTML = `
                <div class="moment-header">
                    <div class="moment-meta">
                        <span class="moment-date">
                            <i class="far fa-clock" style="margin-right: 4px;"></i>${formattedDate}
                        </span>
                        <span class="moment-category">${moment.category || '未分类'}</span>
                        ${valueLabel}
                    </div>
                </div>
                <div class="moment-content ${moment.content && moment.content.length > 200 ? 'collapsed' : ''}">
                    <p>${moment.content || ''}</p>
                    ${moment.content && moment.content.length > 200 ? `
                        <button class="expand-toggle-btn" aria-expanded="false" type="button">
                            展开 <i class="fas fa-chevron-down toggle-icon" aria-hidden="true"></i>
                        </button>
                    `: ''}
                </div>
                ${moment.images && moment.images.length > 0 ? `
                    <div class="moment-images ${getImageClass(moment.images.length)}">
                        ${moment.images.map(img => `
                            <img src="${img}" alt="朋友圈图片" loading="lazy">
                        `).join('')}
                    </div>
                `: ''}
                <div class="moment-actions">
                    <button class="action-btn" aria-label="点赞">
                        <i class="far fa-heart"></i>
                        <span class="action-count">${moment.likes || 0}</span>
                    </button>
                    <button class="action-btn" aria-label="评论">
                        <i class="far fa-comment"></i>
                        <span class="action-count">${moment.comments || 0}</span>
                    </button>
                    <button class="action-btn" aria-label="分享">
                        <i class="fas fa-share"></i>
                    </button>
                </div>
            `;

            // 折叠/展开事件
            const toggleBtn = card.querySelector('.expand-toggle-btn');
            const contentBox = card.querySelector('.moment-content');
            if (toggleBtn && contentBox) {
                toggleBtn.addEventListener('click', () => {
                    const expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
                    if (expanded) {
                        contentBox.classList.add('collapsed');
                        contentBox.classList.remove('expanded');
                        toggleBtn.setAttribute('aria-expanded', 'false');
                        toggleBtn.innerHTML = `展开 <i class="fas fa-chevron-down toggle-icon" aria-hidden="true"></i>`;
                        toggleBtn.classList.remove('expanded');
                    } else {
                        contentBox.classList.remove('collapsed');
                        contentBox.classList.add('expanded');
                        toggleBtn.setAttribute('aria-expanded', 'true');
                        toggleBtn.innerHTML = `收起 <i class="fas fa-chevron-up toggle-icon" aria-hidden="true"></i>`;
                        toggleBtn.classList.add('expanded');
                    }
                });
            }

            return card;
        }

        // ==================== 辅助函数 ====================
        function formatDate(date) {
            const now = new Date();
            const diffTime = Math.abs(now - date);

            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;

            const diffDays = Math.floor(diffTime / day);
            if (diffDays === 0) {
                const diffHours = Math.floor(diffTime / hour);
                if (diffHours === 0) {
                    const diffMinutes = Math.floor(diffTime / minute);
                    return diffMinutes === 0 ? '刚刚' : `${diffMinutes}分钟前`;
                }
                return `${diffHours}小时前`;
            } else if (diffDays === 1) {
                return '昨天';
            } else if (diffDays < 7) {
                return `${diffDays}天前`;
            } else {
                return date.toLocaleDateString('zh-CN');
            }
        }

        function getImageClass(count) {
            if (count === 1) return 'single';
            if (count === 2) return 'double';
            return 'multiple';
        }

        function getValueColor(value) {
            if (value >= 8) return 'linear-gradient(135deg, #ff6b6b, #ff8e53)';
            if (value >= 6) return 'linear-gradient(135deg, #667eea, #764ba2)';
            if (value >= 4) return 'linear-gradient(135deg, #00c9a7, #8b5cf6)';
            return 'linear-gradient(135deg, #868e96, #495057)';
        }

        // ==================== 统计信息更新 ====================
        function updateStats(moments) {
            const totalMoments = moments.length;
            const highValueMoments = moments.filter(m => (m.value || 0) >= 8).length;
            const today = new Date().toISOString().split('T')[0];
            const todayMoments = moments.filter(m => m.date && String(m.date).startsWith(today)).length;

            // 更新DOM
            animateNumber('totalMoments', totalMoments);
            animateNumber('highValueMoments', highValueMoments);
            animateNumber('todayMoments', todayMoments);

            // 添加排序信息提示
            const statsSection = document.querySelector('.moments-stats');
            if (statsSection) {
                const sortInfo = getSortDescription(currentSortMethod);
                let hintElement = statsSection.querySelector('.sort-hint');
                if (!hintElement) {
                    hintElement = document.createElement('div');
                    hintElement.className = 'sort-hint';
                    statsSection.appendChild(hintElement);
                }
                hintElement.textContent = sortInfo;
            }
        }

        function getSortDescription(sortMethod) {
            const descriptions = {
                'date-desc': '✨ 按最新发布时间排序',
                'date-asc': '🕐 按最早发布时间排序',
                'value-desc': '⭐ 按内容价值从高到低排序',
                'value-asc': '💫 按内容价值从低到高排序'
            };
            return descriptions[sortMethod] || '✨ 按最新发布时间排序';
        }

        // ==================== 数字动画 ====================
        function animateNumber(elementId, targetValue) {
            const element = document.getElementById(elementId);
            if (!element) return;

            const currentValue = parseInt(element.textContent, 10) || 0;
            const steps = 20;
            const increment = (targetValue - currentValue) / steps;

            let current = currentValue;
            let step = 0;
            const timer = setInterval(() => {
                step++;
                current += increment;
                if (step >= steps) {
                    element.textContent = String(targetValue);
                    clearInterval(timer);
                } else {
                    element.textContent = String(Math.round(current));
                }
            }, 30);
        }

        // ==================== 分页功能（完整实现） ====================
        function initPaginationControls() {
            document.getElementById('firstPage')?.addEventListener('click', () => {
                window.currentPage = 1;
                renderMoments();
                updatePagination();
            });
            document.getElementById('prevPage')?.addEventListener('click', () => {
                window.currentPage = Math.max(1, (window.currentPage || 1) - 1);
                renderMoments();
                updatePagination();
            });
            document.getElementById('nextPage')?.addEventListener('click', () => {
                const perPage = parseInt(document.getElementById('itemsPerPage')?.value || '12', 10);
                const totalPages = Math.max(1, Math.ceil((window.currentFilteredMoments || []).length / perPage));
                window.currentPage = Math.min(totalPages, (window.currentPage || 1) + 1);
                renderMoments();
                updatePagination();
            });
            document.getElementById('lastPage')?.addEventListener('click', () => {
                const perPage = parseInt(document.getElementById('itemsPerPage')?.value || '12', 10);
                const totalPages = Math.max(1, Math.ceil((window.currentFilteredMoments || []).length / perPage));
                window.currentPage = totalPages;
                renderMoments();
                updatePagination();
            });
            document.getElementById('itemsPerPage')?.addEventListener('change', () => {
                window.currentPage = 1;
                renderMoments();
                updatePagination();
            });
        }

        function updatePagination() {
            const list = window.currentFilteredMoments || [];
            const perPageEl = document.getElementById('itemsPerPage');
            const perPage = parseInt(perPageEl?.value || '12', 10);
            const totalPages = Math.max(1, Math.ceil(list.length / perPage));

            // 纠正当前页范围
            window.currentPage = Math.min(Math.max(1, window.currentPage || 1), totalPages);

            // 更新分页按钮状态
            const firstPageBtn = document.getElementById('firstPage');
            const prevPageBtn = document.getElementById('prevPage');
            const nextPageBtn = document.getElementById('nextPage');
            const lastPageBtn = document.getElementById('lastPage');

            if (firstPageBtn) firstPageBtn.disabled = window.currentPage === 1;
            if (prevPageBtn) prevPageBtn.disabled = window.currentPage === 1;
            if (nextPageBtn) nextPageBtn.disabled = window.currentPage === totalPages;
            if (lastPageBtn) lastPageBtn.disabled = window.currentPage === totalPages;

            // 生成页码按钮
            const pageNumbers = document.getElementById('pageNumbers');
            if (pageNumbers) {
                pageNumbers.innerHTML = '';
                const maxButtons = 5;

                let start = Math.max(1, window.currentPage - Math.floor(maxButtons / 2));
                let end = Math.min(totalPages, start + maxButtons - 1);
                start = Math.max(1, end - maxButtons + 1);

                for (let i = start; i <= end; i++) {
                    const btn = document.createElement('button');
                    btn.className = `page-number ${i === window.currentPage ? 'active' : ''}`;
                    btn.textContent = String(i);
                    if (i === window.currentPage) {
                        btn.setAttribute('aria-current', 'page');
                    }
                    btn.addEventListener('click', () => {
                        window.currentPage = i;
                        renderMoments();
                        updatePagination();
                    });
                    pageNumbers.appendChild(btn);
                }
            }

            // 更新文本信息
            updatePaginationInfo();
        }

        function updatePaginationInfo() {
            const perPage = parseInt(document.getElementById('itemsPerPage')?.value || '12', 10);
            const list = window.currentFilteredMoments || [];
            const total = list.length;

            const start = total === 0 ? 0 : (window.currentPage - 1) * perPage + 1;
            const end = Math.min(total, window.currentPage * perPage);

            const startEl = document.getElementById('showingStart');
            const endEl = document.getElementById('showingEnd');
            const totalEl = document.getElementById('totalItems');

            if (startEl) startEl.textContent = String(start);
            if (endEl) endEl.textContent = String(end);
            if (totalEl) totalEl.textContent = String(total);
        }
    </script>
