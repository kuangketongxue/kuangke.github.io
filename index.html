    <!-- ==================== JavaScript - 优化加载 ==================== -->
    <script>
        // 内联关键JS - 立即执行初始化
        (function() {
            'use strict';
            
            // 性能优化：使用requestIdleCallback延迟非关键初始化
            const scheduleTask = window.requestIdleCallback || function(cb) { setTimeout(cb, 1); };
            
            // 全局状态管理
            const state = {
                currentSortMethod: 'date-desc',
                currentViewMode: 'grid',
                currentPage: 1,
                currentFilteredMoments: [],
                isLoading: false,
                userLikes: {},
                userBookmarks: {},
                backgroundOnlyMode: false,
                itemsPerPage: 12
            };
            
            // 性能优化：防抖函数
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }
            
            // 性能优化：节流函数
            function throttle(func, limit) {
                let inThrottle;
                return function(...args) {
                    if (!inThrottle) {
                        func.apply(this, args);
                        inThrottle = true;
                        setTimeout(() => inThrottle = false, limit);
                    }
                };
            }
            
            // DOM缓存
            const DOM = {};
            function cacheDOM() {
                DOM.momentsContainer = document.getElementById('momentsContainer');
                DOM.searchInput = document.getElementById('searchInput');
                DOM.sortBy = document.getElementById('sortBy');
                DOM.itemsPerPage = document.getElementById('itemsPerPage');
                DOM.gridView = document.getElementById('gridView');
                DOM.listView = document.getElementById('listView');
                DOM.themeToggle = document.getElementById('themeToggle');
                DOM.backgroundModeReturn = document.getElementById('backgroundModeReturn');
                DOM.categoryBtns = document.querySelectorAll('.category-btn');
                DOM.totalMoments = document.getElementById('totalMoments');
                DOM.highValueMoments = document.getElementById('highValueMoments');
                DOM.todayMoments = document.getElementById('todayMoments');
                DOM.sortHint = document.getElementById('sortHint');
            }
            
            // 数据加载检查
            function waitForData(callback, maxAttempts = 10) {
                let attempts = 0;
                const interval = setInterval(() => {
                    if (typeof window.momentsData !== 'undefined' && Array.isArray(window.momentsData)) {
                        clearInterval(interval);
                        callback();
                    } else if (++attempts >= maxAttempts) {
                        clearInterval(interval);
                        console.error('数据加载超时');
                    }
                }, 100);
            }
            
            // 初始化主题
            function initTheme() {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                document.body.setAttribute('data-theme', savedTheme);
                if (DOM.themeToggle) {
                    DOM.themeToggle.innerHTML = savedTheme === 'light' 
                        ? '<i class="fas fa-sun"></i>' 
                        : '<i class="fas fa-moon"></i>';
                }
            }
            
            // 恢复用户数据
            function restoreUserData() {
                try {
                    const savedData = localStorage.getItem('userData');
                    if (savedData) {
                        const userData = JSON.parse(savedData);
                        state.userLikes = userData.likes || {};
                        state.userBookmarks = userData.bookmarks || {};
                        if (userData.preferences) {
                            state.currentSortMethod = userData.preferences.sortMethod || 'date-desc';
                            state.currentViewMode = userData.preferences.viewMode || 'grid';
                        }
                    }
                } catch (error) {
                    console.error('恢复用户数据失败:', error);
                }
            }
            
            // 保存用户数据 - 使用防抖优化
            const saveUserData = debounce(() => {
                try {
                    const userData = {
                        likes: state.userLikes,
                        bookmarks: state.userBookmarks,
                        preferences: {
                            sortMethod: state.currentSortMethod,
                            viewMode: state.currentViewMode,
                            theme: document.body.getAttribute('data-theme')
                        }
                    };
                    localStorage.setItem('userData', JSON.stringify(userData));
                } catch (error) {
                    console.error('保存用户数据失败:', error);
                }
            }, 500);
            
            // 事件委托 - 性能优化
            function initEventDelegation() {
                // 朋友圈容器事件委托
                DOM.momentsContainer?.addEventListener('click', handleMomentClick);
                
                // 分类按钮事件委托
                document.querySelector('.category-scroll')?.addEventListener('click', handleCategoryClick);
            }
            
            // 处理朋友圈点击事件
            function handleMomentClick(e) {
                const target = e.target;
                
                // 点赞按钮
                const likeBtn = target.closest('.action-btn .fa-heart');
                if (likeBtn) {
                    e.preventDefault();
                    handleLike(likeBtn.closest('.action-btn'));
                    return;
                }
                
                // 展开/收起按钮
                const expandBtn = target.closest('.expand-toggle-btn');
                if (expandBtn) {
                    handleExpand(expandBtn);
                    return;
                }
                
                // 图片点击
                const img = target.closest('.moment-images img');
                if (img) {
                    handleImageClick(img);
                    return;
                }
            }
            
            // 处理点赞
            function handleLike(actionBtn) {
                const icon = actionBtn.querySelector('.fa-heart');
                const countSpan = actionBtn.querySelector('.action-count');
                const momentCard = actionBtn.closest('.moment-card');
                const momentId = momentCard.dataset.id;
                
                let count = parseInt(countSpan.textContent, 10) || 0;
                const isLiked = state.userLikes[momentId];
                
                if (isLiked) {
                    state.userLikes[momentId] = false;
                    icon.classList.remove('fas', 'liked');
                    icon.classList.add('far');
                    count--;
                    actionBtn.classList.remove('liked');
                } else {
                    state.userLikes[momentId] = true;
                    icon.classList.remove('far');
                    icon.classList.add('fas', 'liked');
                    count++;
                    actionBtn.classList.add('liked');
                    // 使用CSS动画代替JS动画
                    actionBtn.style.animation = 'likeAnimation 0.3s ease';
                    setTimeout(() => actionBtn.style.animation = '', 300);
                }
                
                countSpan.textContent = count;
                saveUserData();
            }
            
            // 处理展开/收起
            function handleExpand(btn) {
                const contentBox = btn.previousElementSibling;
                const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                const fullContent = contentBox.dataset.fullContent;
                const para = contentBox.querySelector('p');
                
                if (isExpanded) {
                    contentBox.classList.add('collapsed');
                    contentBox.classList.remove('expanded');
                    btn.setAttribute('aria-expanded', 'false');
                    btn.querySelector('.toggle-text').textContent = '展开全文';
                    btn.querySelector('.toggle-icon').className = 'fas fa-chevron-down toggle-icon';
                    para.textContent = fullContent.substring(0, 300) + '...';
                } else {
                    contentBox.classList.remove('collapsed');
                    contentBox.classList.add('expanded');
                    btn.setAttribute('aria-expanded', 'true');
                    btn.querySelector('.toggle-text').textContent = '收起';
                    btn.querySelector('.toggle-icon').className = 'fas fa-chevron-up toggle-icon';
                    para.textContent = decodeHtml(fullContent);
                }
            }
            
            // 处理分类点击
            function handleCategoryClick(e) {
                const btn = e.target.closest('.category-btn');
                if (!btn) return;
                
                const category = btn.dataset.category;
                
                // 更新UI
                DOM.categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // 筛选数据
                if (category === 'all') {
                    state.currentFilteredMoments = window.momentsData;
                } else {
                    state.currentFilteredMoments = window.momentsData.filter(m => m.category === category);
                }
                
                state.currentPage = 1;
                sortAndRenderMoments();
            }
            
            // 搜索功能 - 使用防抖
            const handleSearch = debounce((searchTerm) => {
                if (searchTerm.length >= 2) {
                    state.currentFilteredMoments = window.momentsData.filter(m =>
                        (m.content && m.content.toLowerCase().includes(searchTerm)) ||
                        (m.category && m.category.toLowerCase().includes(searchTerm))
                    );
                } else if (searchTerm.length === 0) {
                    const activeCategory = document.querySelector('.category-btn.active')?.dataset.category;
                    state.currentFilteredMoments = activeCategory === 'all' 
                        ? window.momentsData 
                        : window.momentsData.filter(m => m.category === activeCategory);
                }
                state.currentPage = 1;
                sortAndRenderMoments();
            }, 300);
            
            // 排序并渲染
            function sortAndRenderMoments() {
                const sorted = sortMoments(state.currentFilteredMoments, state.currentSortMethod);
                state.currentFilteredMoments = sorted;
                renderMoments();
                updateStats(sorted);
                updatePagination();
            }
            
            // 排序函数
            function sortMoments(moments, method) {
                const sorted = [...moments];
                switch (method) {
                    case 'date-desc':
                        return sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
                    case 'date-asc':
                        return sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
                    case 'value-desc':
                        return sorted.sort((a, b) => (b.value || 0) - (a.value || 0));
                    case 'value-asc':
                        return sorted.sort((a, b) => (a.value || 0) - (b.value || 0));
                    default:
                        return sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
                }
            }
            
            // 渲染朋友圈 - 使用DocumentFragment优化
            function renderMoments() {
                if (!DOM.momentsContainer) return;
                
                const startIndex = (state.currentPage - 1) * state.itemsPerPage;
                const endIndex = startIndex + state.itemsPerPage;
                const pageMoments = state.currentFilteredMoments.slice(startIndex, endIndex);
                
                // 清空容器
                DOM.momentsContainer.innerHTML = '';
                
                // 使用DocumentFragment批量插入
                const fragment = document.createDocumentFragment();
                pageMoments.forEach((moment, index) => {
                    const card = createMomentCard(moment, startIndex + index);
                    fragment.appendChild(card);
                });
                
                DOM.momentsContainer.appendChild(fragment);
                
                // 延迟执行动画
                requestAnimationFrame(() => {
                    const cards = DOM.momentsContainer.querySelectorAll('.moment-card');
                    cards.forEach((card, i) => {
                        setTimeout(() => card.classList.add('fade-in'), i * 30);
                    });
                });
            }
            
            // 创建朋友圈卡片 - 优化版
            function createMomentCard(moment, index) {
                const card = document.createElement('article');
                card.className = 'moment-card';
                card.dataset.id = moment.id || `moment-${index}`;
                
                const isLiked = state.userLikes[card.dataset.id];
                const date = new Date(moment.date);
                const formattedDate = isNaN(date) ? moment.date : formatDate(date);
                
                const content = moment.content || '';
                const shouldCollapse = content.length > 300;
                const previewContent = shouldCollapse ? content.substring(0, 300) + '...' : content;
                
                // 使用模板字符串构建HTML
                card.innerHTML = `
                    <div class="moment-header">
                        <div class="moment-meta">
                            <span class="moment-date">${formattedDate}</span>
                            <span class="moment-category">${moment.category || '未分类'}</span>
                            ${moment.value ? `<span class="value-badge" style="background:${getValueColor(moment.value)}">价值 ${moment.value}</span>` : ''}
                        </div>
                    </div>
                    <div class="moment-content ${shouldCollapse ? 'collapsed' : ''}" data-full-content="${escapeHtml(content)}">
                        <p>${escapeHtml(previewContent)}</p>
                    </div>
                    ${shouldCollapse ? `
                        <button class="expand-toggle-btn" aria-expanded="false" type="button" title="展开查看完整内容">
                            <span class="toggle-text">展开全文</span>
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </button>
                    ` : ''}
                    ${moment.images?.length ? `
                        <div class="moment-images ${getImageClass(moment.images.length)}">
                            ${moment.images.map((img, i) => `<img src="${img}" alt="朋友圈图片 ${i+1}" loading="lazy">`).join('')}
                        </div>
                    ` : ''}
                    <div class="moment-actions">
                        <div class="action-group">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" aria-label="点赞">
                                <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                                <span class="action-count">${moment.likes || 0}</span>
                            </button>
                            <button class="action-btn" aria-label="评论">
                                <i class="far fa-comment"></i>
                                <span class="action-count">${moment.comments || 0}</span>
                            </button>
                        </div>
                        <button class="share-btn" aria-label="分享">
                            <i class="fas fa-share-alt"></i>
                            <span>分享</span>
                        </button>
                    </div>
                `;
                
                return card;
            }
            
            // 辅助函数
            function formatDate(date) {
                const now = new Date();
                const diff = now - date;
                const minute = 60 * 1000;
                const hour = 60 * minute;
                const day = 24 * hour;
                
                if (diff < hour) return `${Math.floor(diff / minute)}分钟前`;
                if (diff < day) return `${Math.floor(diff / hour)}小时前`;
                if (diff < 2 * day) return '昨天';
                if (diff < 7 * day) return `${Math.floor(diff / day)}天前`;
                return date.toLocaleDateString('zh-CN');
            }
            
            function getValueColor(value) {
                if (value >= 9) return 'linear-gradient(135deg, #ff6b6b, #ff8e53)';
                if (value >= 7) return 'linear-gradient(135deg, #667eea, #764ba2)';
                if (value >= 5) return 'linear-gradient(135deg, #00c9a7, #8b5cf6)';
                if (value >= 3) return 'linear-gradient(135deg, #ffc107, #ff9800)';
                return 'linear-gradient(135deg, #868e96, #495057)';
            }
            
            function getImageClass(count) {
                if (count === 1) return 'single';
                if (count === 2) return 'double';
                return 'multiple';
            }
            
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            function decodeHtml(html) {
                const txt = document.createElement('textarea');
                txt.innerHTML = html;
                return txt.value;
            }
            
            // 更新统计 - 使用requestAnimationFrame优化
            function updateStats(moments) {
                const total = moments.length;
                const highValue = moments.filter(m => (m.value || 0) >= 9).length;
                const today = new Date().toISOString().split('T')[0];
                const todayCount = moments.filter(m => m.date?.startsWith(today)).length;
                
                animateNumber(DOM.totalMoments, total);
                animateNumber(DOM.highValueMoments, highValue);
                animateNumber(DOM.todayMoments, todayCount);
                
                if (DOM.sortHint) {
                    DOM.sortHint.textContent = getSortDescription(state.currentSortMethod);
                }
            }
            
            function animateNumber(element, target) {
                if (!element) return;
                const current = parseInt(element.textContent) || 0;
                const duration = 500;
                const start = Date.now();
                
                function update() {
                    const elapsed = Date.now() - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const value = Math.round(current + (target - current) * progress);
                    element.textContent = value;
                    
                    if (progress < 1) {
                        requestAnimationFrame(update);
                    }
                }
                
                requestAnimationFrame(update);
            }
            
            function getSortDescription(method) {
                const descriptions = {
                    'date-desc': '按最新发布时间排序',
                    'date-asc': '按最早发布时间排序',
                    'value-desc': '按内容价值从高到低排序',
                    'value-asc': '按内容价值从低到高排序'
                };
                return descriptions[method] || '按最新发布时间排序';
            }
            
            // 分页功能
            function updatePagination() {
                const total = state.currentFilteredMoments.length;
                const totalPages = Math.ceil(total / state.itemsPerPage) || 1;
                state.currentPage = Math.min(Math.max(1, state.currentPage), totalPages);
                
                // 更新按钮状态
                const firstPage = document.getElementById('firstPage');
                const prevPage = document.getElementById('prevPage');
                const nextPage = document.getElementById('nextPage');
                const lastPage = document.getElementById('lastPage');
                
                if (firstPage) firstPage.disabled = state.currentPage === 1;
                if (prevPage) prevPage.disabled = state.currentPage === 1;
                if (nextPage) nextPage.disabled = state.currentPage === totalPages;
                if (lastPage) lastPage.disabled = state.currentPage === totalPages;
                
                // 更新页码
                const pageNumbers = document.getElementById('pageNumbers');
                if (pageNumbers) {
                    pageNumbers.innerHTML = '';
                    const maxButtons = 5;
                    let start = Math.max(1, state.currentPage - 2);
                    let end = Math.min(totalPages, start + maxButtons - 1);
                    start = Math.max(1, end - maxButtons + 1);
                    
                    const fragment = document.createDocumentFragment();
                    for (let i = start; i <= end; i++) {
                        const btn = document.createElement('button');
                        btn.className = `page-number ${i === state.currentPage ? 'active' : ''}`;
                        btn.textContent = i;
                        btn.onclick = () => {
                            state.currentPage = i;
                            renderMoments();
                            updatePagination();
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        };
                        fragment.appendChild(btn);
                    }
                    pageNumbers.appendChild(fragment);
                }
                
                // 更新文本信息
                const start = total === 0 ? 0 : (state.currentPage - 1) * state.itemsPerPage + 1;
                const end = Math.min(total, state.currentPage * state.itemsPerPage);
                
                const startEl = document.getElementById('showingStart');
                const endEl = document.getElementById('showingEnd');
                const totalEl = document.getElementById('totalItems');
                
                if (startEl) startEl.textContent = start;
                if (endEl) endEl.textContent = end;
                if (totalEl) totalEl.textContent = total;
            }
            
            // 无限滚动 - 使用Intersection Observer
            function initInfiniteScroll() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && !state.isLoading) {
                            const totalPages = Math.ceil(state.currentFilteredMoments.length / state.itemsPerPage);
                            if (state.currentPage < totalPages) {
                                loadMore();
                            }
                        }
                    });
                }, { rootMargin: '100px' });
                
                const sentinel = document.getElementById('loadingIndicator');
                if (sentinel) observer.observe(sentinel);
            }
            
            function loadMore() {
                if (state.isLoading) return;
                state.isLoading = true;
                
                const indicator = document.getElementById('loadingIndicator');
                if (indicator) indicator.style.display = 'block';
                
                setTimeout(() => {
                    state.currentPage++;
                    const startIndex = (state.currentPage - 1) * state.itemsPerPage;
                    const endIndex = startIndex + state.itemsPerPage;
                    const newMoments = state.currentFilteredMoments.slice(startIndex, endIndex);
                    
                    const fragment = document.createDocumentFragment();
                    newMoments.forEach((moment, i) => {
                        const card = createMomentCard(moment, startIndex + i);
                        fragment.appendChild(card);
                    });
                    
                    DOM.momentsContainer.appendChild(fragment);
                    
                    if (indicator) indicator.style.display = 'none';
                    state.isLoading = false;
                    updatePagination();
                }, 500);
            }
            
            // 主初始化函数
            function init() {
                cacheDOM();
                initTheme();
                restoreUserData();
                
                waitForData(() => {
                    state.currentFilteredMoments = window.momentsData;
                    sortAndRenderMoments();
                    initEventDelegation();
                    
                    // 延迟初始化非关键功能
                    scheduleTask(() => {
                        initInfiniteScroll();
                        initControls();
                    });
                });
            }
            
            // 初始化控件
            function initControls() {
                // 排序
                DOM.sortBy?.addEventListener('change', (e) => {
                    state.currentSortMethod = e.target.value;
                    sortAndRenderMoments();
                    saveUserData();
                });
                
                // 搜索
                DOM.searchInput?.addEventListener('input', (e) => {
                    handleSearch(e.target.value.toLowerCase().trim());
                });
                
                // 每页数量
                DOM.itemsPerPage?.addEventListener('change', (e) => {
                    state.itemsPerPage = parseInt(e.target.value);
                    state.currentPage = 1;
                    renderMoments();
                    updatePagination();
                });
                
                // 视图切换
                DOM.gridView?.addEventListener('click', () => {
                    state.currentViewMode = 'grid';
                    updateViewMode();
                });
                
                DOM.listView?.addEventListener('click', () => {
                    state.currentViewMode = 'list';
                    updateViewMode();
                });
                
                // 主题切换
                DOM.themeToggle?.addEventListener('click', () => {
                    const current = document.body.getAttribute('data-theme');
                    const newTheme = current === 'dark' ? 'light' : 'dark';
                    document.body.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    DOM.themeToggle.innerHTML = newTheme === 'light' 
                        ? '<i class="fas fa-sun"></i>' 
                        : '<i class="fas fa-moon"></i>';
                });
                
                // 分页按钮
                document.getElementById('firstPage')?.addEventListener('click', () => {
                    state.currentPage = 1;
                    renderMoments();
                    updatePagination();
                });
                
                document.getElementById('prevPage')?.addEventListener('click', () => {
                    state.currentPage = Math.max(1, state.currentPage - 1);
                    renderMoments();
                    updatePagination();
                });
                
                document.getElementById('nextPage')?.addEventListener('click', () => {
                    const totalPages = Math.ceil(state.currentFilteredMoments.length / state.itemsPerPage);
                    state.currentPage = Math.min(totalPages, state.currentPage + 1);
                    renderMoments();
                    updatePagination();
                });
                
                document.getElementById('lastPage')?.addEventListener('click', () => {
                    state.currentPage = Math.ceil(state.currentFilteredMoments.length / state.itemsPerPage);
                    renderMoments();
                    updatePagination();
                });
                
                // 导出按钮
                document.getElementById('exportBtn')?.addEventListener('click', exportData);
            }
            
            function updateViewMode() {
                if (state.currentViewMode === 'list') {
                    DOM.momentsContainer?.classList.add('list-view');
                    DOM.listView?.classList.add('active');
                    DOM.gridView?.classList.remove('active');
                } else {
                    DOM.momentsContainer?.classList.remove('list-view');
                    DOM.gridView?.classList.add('active');
                    DOM.listView?.classList.remove('active');
                }
                saveUserData();
            }
            
            function exportData() {
                const data = {
                    exportDate: new Date().toISOString(),
                    totalItems: state.currentFilteredMoments.length,
                    moments: state.currentFilteredMoments
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `朋友圈数据_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }
            
            // 启动应用
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
            
            // 暴露全局接口
            window.MomentsApp = { state, renderMoments, updatePagination };
        })();
    </script>
    
    <!-- 外部数据文件异步加载 -->
    <script src="data.js" async></script>
    
    <!-- 添加CSS动画 -->
    <style>
        @keyframes likeAnimation {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        /* 其他样式从style.css加载 */
    </style>
</body>
