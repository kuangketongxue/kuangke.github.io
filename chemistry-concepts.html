    <style>
        /* 基础样式保持与原页面一致 */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', 'Arial', sans-serif;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        }

        /* 页面标题区域 */
        .chemistry-title {
            max-width: 1400px;
            margin: 100px auto 30px;
            text-align: center;
            padding: 40px 20px;
        }
        
        .chemistry-title h1 {
            font-size: 3.5em;
            background: linear-gradient(135deg, #fff 0%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        body.dark-mode .chemistry-title h1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .chemistry-title p {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.9);
            opacity: 0.9;
        }
        
        /* 控制面板 */
        .control-panel {
            position: fixed;
            top: 120px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        body.dark-mode .control-panel {
            background: rgba(45, 55, 72, 0.95);
            color: #fff;
        }
        
        .control-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        
        body.dark-mode .control-title {
            color: #fff;
        }
        
        .control-button {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 10px 15px;
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }
        
        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(48, 207, 208, 0.3);
        }
        
        /* 思维导图容器 */
        .mindmap-container {
            max-width: 1600px;
            margin: 30px auto;
            padding: 20px;
            height: 70vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        body.dark-mode .mindmap-container {
            background: rgba(45, 55, 72, 0.95);
        }
        
        #mindmap {
            width: 100%;
            height: 100%;
        }
        
        /* 节点样式 */
        .node {
            cursor: pointer;
        }
        
        .node circle {
            fill: #fff;
            stroke: #333;
            stroke-width: 2px;
            transition: all 0.3s ease;
        }
        
        body.dark-mode .node circle {
            fill: #2d3748;
            stroke: #fff;
        }
        
        .node.has-children circle {
            fill: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .node text {
            font-size: 12px;
            fill: #333;
            font-weight: 500;
            pointer-events: none;
        }
        
        body.dark-mode .node text {
            fill: #fff;
        }
        
        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 1.5px;
        }
        
        body.dark-mode .link {
            stroke: #666;
        }
        
        /* 概念详情弹窗 */
        .concept-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 15px;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        body.dark-mode .concept-tooltip {
            background: rgba(45, 55, 72, 0.98);
            border-color: #764ba2;
            color: #fff;
        }
        
        .concept-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .concept-definition {
            font-size: 0.95em;
            line-height: 1.6;
            color: #333;
        }
        
        body.dark-mode .concept-definition {
            color: #ddd;
        }
        
        .concept-formula {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        body.dark-mode .concept-formula {
            background: #1a202c;
        }
        
        /* 搜索框 */
        .search-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
        }
        
        .search-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }
        
        body.dark-mode .search-box {
            background: rgba(45, 55, 72, 0.95);
        }
        
        .search-box input {
            border: none;
            background: none;
            outline: none;
            font-size: 16px;
            width: 300px;
            color: #333;
        }
        
        body.dark-mode .search-box input {
            color: #fff;
        }
        
        .search-box i {
            color: #667eea;
            margin-right: 10px;
            font-size: 18px;
        }
        
        /* 缩放控制 */
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .zoom-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        /* 统计信息 */
        .stats-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }
        
        body.dark-mode .stats-panel {
            background: rgba(45, 55, 72, 0.95);
            color: #fff;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .stat-item i {
            color: #667eea;
            margin-right: 8px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .chemistry-title h1 {
                font-size: 2.5em;
            }
            
            .control-panel {
                position: relative;
                top: auto;
                right: auto;
                margin: 20px auto;
                max-width: 300px;
            }
            
            .search-box input {
                width: 200px;
            }
            
            .mindmap-container {
                height: 60vh;
                margin: 20px 10px;
            }
        }
        
        /* 加载动画 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .loading i {
            font-size: 48px;
            color: #667eea;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        // 化学概念数据结构
        const chemistryConcepts = {
            name: "化学",
            definition: "研究物质的组成、结构、性质、变化规律以及应用的科学",
            formula: "",
            children: [
                {
                    name: "基础概念",
                    definition: "化学学科的基本概念和术语",
                    children: [
                        {
                            name: "物质",
                            definition: "占据空间并具有质量的一切客观存在",
                            formula: "ρ = m/V",
                            children: [
                                {
                                    name: "纯净物",
                                    definition: "由同种分子组成的物质",
                                    children: [
                                        {
                                            name: "单质",
                                            definition: "由同一种元素组成的纯净物",
                                            formula: "元素符号表示",
                                            children: [
                                                {
                                                    name: "金属单质",
                                                    definition: "具有金属性的元素单质，如Fe、Cu、Al",
                                                    properties: "导电性、延展性、金属光泽"
                                                },
                                                {
                                                    name: "非金属单质",
                                                    definition: "不具有金属性的元素单质，如O₂、N₂、C",
                                                    properties: "不导电、脆性、无金属光泽"
                                                },
                                                {
                                                    name: "稀有气体",
                                                    definition: "元素周期表第18族元素",
                                                    properties: "化学性质稳定、外层电子满"
                                                }
                                            ]
                                        },
                                        {
                                            name: "化合物",
                                            definition: "由不同种元素组成的纯净物",
                                            formula: "化学式表示",
                                            children: [
                                                {
                                                    name: "有机化合物",
                                                    definition: "含碳化合物（除CO、CO₂、碳酸盐等）",
                                                    formula: "CₙH₂ₙ₊₂",
                                                    children: [
                                                        {
                                                            name: "烷烃",
                                                            definition: "饱和链烃，分子中只有C-C单键",
                                                            formula: "CₙH₂ₙ₊₂"
                                                        },
                                                        {
                                                            name: "烯烃",
                                                            definition: "不饱和链烃，分子中含C=C双键",
                                                            formula: "CₙH₂ₙ"
                                                        },
                                                        {
                                                            name: "炔烃",
                                                            definition: "不饱和链烃，分子中含C≡C三键",
                                                            formula: "CₙH₂ₙ₋₂"
                                                        },
                                                        {
                                                            name: "芳香烃",
                                                            definition: "含苯环结构的烃类",
                                                            formula: "C₆H₆"
                                                        }
                                                    ]
                                                },
                                                {
                                                    name: "无机化合物",
                                                    definition: "除有机化合物外的所有化合物",
                                                    children: [
                                                        {
                                                            name: "氧化物",
                                                            definition: "由氧和另一种元素组成的化合物",
                                                            formula: "AₓOᵧ"
                                                        },
                                                        {
                                                            name: "酸",
                                                            definition: "在水溶液中电离出的阳离子全部是H⁺的化合物",
                                                            formula: "HₙA"
                                                        },
                                                        {
                                                            name: "碱",
                                                            definition: "在水溶液中电离出的阴离子全部是OH⁻的化合物",
                                                            formula: "M(OH)ₙ"
                                                        },
                                                        {
                                                            name: "盐",
                                                            definition: "由金属离子（或铵根离子）和酸根离子组成的化合物",
                                                            formula: "MₙAₘ"
                                                        }
                                                    ]
                                                }
                                            ]
                                        }
                                    ]
                                },
                                {
                                    name: "混合物",
                                    definition: "由两种或多种物质混合而成的物质",
                                    children: [
                                        {
                                            name: "溶液",
                                            definition: "一种或多种物质分散在另一种物质中形成的均一混合物",
                                            formula: "溶质 + 溶剂 = 溶液",
                                            children: [
                                                {
                                                    name: "饱和溶液",
                                                    definition: "在一定温度和压力下，不能再溶解更多溶质的溶液"
                                                },
                                                {
                                                    name: "不饱和溶液",
                                                    definition: "还能继续溶解更多溶质的溶液"
                                                },
                                                {
                                                    name: "过饱和溶液",
                                                    definition: "溶解的溶质量超过饱和溶液的溶液"
                                                }
                                            ]
                                        },
                                        {
                                            name: "悬浊液",
                                            definition: "固体颗粒分散在液体中形成的不均匀混合物"
                                        },
                                        {
                                            name: "乳浊液",
                                            definition: "液体小滴分散在另一种液体中形成的不均匀混合物"
                                        },
                                        {
                                            name: "胶体",
                                            definition: "粒子大小在1-100nm之间的分散系",
                                            properties: "丁达尔效应、布朗运动"
                                        }
                                    ]
                                }
                            ]
                        },
                        {
                            name: "元素",
                            definition: "具有相同质子数的原子的总称",
                            formula: "元素符号表示",
                            children: [
                                {
                                    name: "元素周期表",
                                    definition: "按原子序数排列的元素表",
                                    children: [
                                        {
                                            name: "周期",
                                            definition: "元素周期表中的横行，表示电子层数相同",
                                            children: [
                                                { name: "短周期", definition: "第1-3周期，电子层数1-3" },
                                                { name: "长周期", definition: "第4-7周期，电子层数4-7" }
                                            ]
                                        },
                                        {
                                            name: "族",
                                            definition: "元素周期表中的纵列，表示最外层电子数相同",
                                            children: [
                                                { name: "主族", definition: "第IA-VIIA族" },
                                                { name: "副族", definition: "第IIIB-VIIB族和VIII族" },
                                                { name: "第零族", definition: "稀有气体元素" }
                                            ]
                                        },
                                        {
                                            name: "区域划分",
                                            definition: "根据电子层结构划分的元素区域",

                                                { name: "p区元素", definition: "IIIA-VIIA族和0族" },

                                                { name: "f区元素", definition: "镧系和锕系" }
                                            ]
                                        }
                                    ]
                                },
                                {
                                    name: "元素性质",
                                    definition: "元素固有的物理和化学特征",
                                    children: [
                                        {
                                            name: "原子半径",
                                            definition: "原子核到最外层电子的距离",
                                            formula: "rₐ",
                                            trends: "同周期递减，同族递增"
                                        },
                                        {
                                            name: "电负性",
                                            definition: "原子吸引电子的能力",
                                            formula: "χ (鲍林标度)",
                                            trends: "同周期递增，同族递减"
                                        },
                                        {
                                            name: "电离能",
                                            definition: "从气态原子中移去电子所需的能量",
                                            formula: "I₁, I₂, I₃...",
                                            trends: "同周期递增，同族递减"
                                        },
                                        {
                                            name: "电子亲和能",
                                            definition: "气态原子获得电子时释放的能量",
                                            formula: "EA"
                                        }
                                    ]
                                }
                            ]
                        }
                    ]
                },
                {
                    name: "原子结构与化学键",
                    definition: "原子的内部结构和原子间的相互作用",
                    children: [
                        {
                            name: "原子结构",
                            definition: "原子的组成和电子排布",
                            children: [
                                {
                                    name: "原子核",
                                    definition: "由质子和中子构成，位于原子中心",
                                    formula: "质量数 A = 质子数 Z + 中子数 N",
                                    children: [
                                        {
                                            name: "质子",
                                            definition: "带正电的粒子，决定元素种类",
                                            formula: "电荷 +1，质量 ≈ 1u"
                                        },

                        {

                                    examples: [

                                },
                                {
                                    name: "陶瓷材料",
                                    examples: [
                                        "传统陶瓷",
                                        "特种陶瓷",
                                        "玻璃材料"
                                    ]
                                },
                                {
                                    name: "高分子材料",
                                    examples: [
                                        "塑料",
                                        "橡胶",
                                        "纤维",
                                        "涂料"

                        }

                }
            ]
        };

        // 全局变量
        let svg, g, tree, root, currentZoom = 1;
        let margin = {top: 20, right: 90, bottom: 30, left: 90};
        let width, height;
        let i = 0;
        let duration = 750;
        
        // 初始化思维导图
        function initMindmap() {
            const container = document.getElementById('mindmap');
            const rect = container.getBoundingClientRect();
            width = rect.width - margin.right - margin.left;
            height = rect.height - margin.top - margin.bottom;
            
            // 创建SVG
            svg = d3.select("#mindmap")
                .append("svg")
                .attr("width", width + margin.right + margin.left)
                .attr("height", height + margin.top + margin.bottom);
            
            g = svg.append("g")
                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
            
            // 创建树布局
            tree = d3.tree().size([height, width]);
            
            // 处理数据
            root = d3.hierarchy(chemistryConcepts, d => d.children);
            root.x0 = height / 2;
            root.y0 = 0;
            
            // 初始折叠一些深层节点
            if (root.children) {
                root.children.forEach(collapse);
            }
            
            update(root);
            
            // 添加缩放功能
            const zoom = d3.zoom()
                .scaleExtent([0.1, 3])
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);
                    currentZoom = event.transform.k;
                });
            
            svg.call(zoom);
            
            // 隐藏加载动画
            document.getElementById('loading').style.display = 'none';
            
            // 更新统计信息
            updateStats();
        }
        
        // 折叠节点
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }
        
        // 展开节点
        function expand(d) {
            if (d._children) {
                d.children = d._children;
                d.children.forEach(expand);
                d._children = null;
            }
        }
        
        // 更新思维导图
        function update(source) {
            const treeData = tree(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);
            
            // 标准化深度
            nodes.forEach(d => { d.y = d.depth * 200; });
            
            // 节点处理
            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));
            
            // 进入新节点
            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => "translate(" + source.y0 + "," + source.x0 + ")")
                .on('click', click)
                .on('mouseover', showTooltip)
                .on('mouseout', hideTooltip);
            
            nodeEnter.append('circle')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "lightsteelblue" : "#fff");
            
            nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -13 : 13)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name)
                .style("fill-opacity", 1e-6);
            
            // 更新节点
            const nodeUpdate = nodeEnter.merge(node);
            
            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => "translate(" + d.y + "," + d.x + ")");
            
            nodeUpdate.select('circle')
                .attr('r', 8)
                .style("fill", d => d._children ? "lightsteelblue" : "#fff")
                .attr('cursor', 'pointer');
            
            nodeUpdate.select('text')
                .style("fill-opacity", 1);
            
            // 退出节点
            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => "translate(" + source.y + "," + source.x + ")")
                .remove();
            
            nodeExit.select('circle')
                .attr('r', 1e-6);
            
            nodeExit.select('text')
                .style('fill-opacity', 1e-6);
            
            // 连接线处理
            const link = g.selectAll('path.link')
                .data(links, d => d.id);
            
            // 进入新连接线
            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });
            
            // 更新连接线
            const linkUpdate = linkEnter.merge(link);
            
            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d, d.parent));
            
            // 退出连接线
            link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();
            
            // 存储旧位置
            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }
        
        // 创建曲线路径
        function diagonal(s, d) {
            const path = `M ${s.y} ${s.x}
                    C ${(s.y + d.y) / 2} ${s.x},
                      ${(s.y + d.y) / 2} ${d.x},
                      ${d.y} ${d.x}`;
            return path;
        }
        
        // 点击节点
        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
            updateStats();
        }
        
        // 显示工具提示
        function showTooltip(event, d) {
            const tooltip = document.getElementById('conceptTooltip');
            const title = document.getElementById('tooltipTitle');
            const definition = document.getElementById('tooltipDefinition');
            const formula = document.getElementById('tooltipFormula');
            
            title.textContent = d.data.name;
            definition.textContent = d.data.definition || '暂无定义';
            
            if (d.data.formula && d.data.formula !== '') {
                formula.textContent = '公式: ' + d.data.formula;
                formula.style.display = 'block';
            } else {
                formula.style.display = 'none';
            }
            
            tooltip.style.display = 'block';
            tooltip.style.left = (event.pageX + 10) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
        }
        
        // 隐藏工具提示
        function hideTooltip() {
            document.getElementById('conceptTooltip').style.display = 'none';
        }
        
        // 展开全部
        function expandAll() {
            expand(root);
            update(root);
            updateStats();
        }
        
        // 收起全部
        function collapseAll() {
            collapse(root);
            update(root);
            updateStats();
        }
        
        // 重置视图
        function resetView() {
            svg.transition()
                .duration(750)
                .call(
                    d3.zoom().transform,
                    d3.zoomIdentity.translate(margin.left, margin.top)
                );
        }
        
        // 放大
        function zoomIn() {
            svg.transition()
                .duration(300)
                .call(
                    d3.zoom().scaleBy,
                    1.3
                );
        }
        
        // 缩小
        function zoomOut() {
            svg.transition()
                .duration(300)
                .call(
                    d3.zoom().scaleBy,
                    0.7
                );
        }
        
        // 适应屏幕
        function fitToScreen() {
            const bounds = g.node().getBBox();
            const fullWidth = width + margin.right + margin.left;
            const fullHeight = height + margin.top + margin.bottom;
            const widthScale = fullWidth / bounds.width;
            const heightScale = fullHeight / bounds.height;
            const scale = 0.8 * Math.min(widthScale, heightScale);
            
            const translate = [
                fullWidth / 2 - scale * (bounds.x + bounds.width / 2),
                fullHeight / 2 - scale * (bounds.y + bounds.height / 2)
            ];
            
            svg.transition()
                .duration(750)
                .call(
                    d3.zoom().transform,
                    d3.zoomIdentity
                        .translate(translate[0], translate[1])
                        .scale(scale)
                );
        }
        
        // 导出数据
        function exportData() {
            const dataStr = JSON.stringify(chemistryConcepts, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'chemistry_concepts.json';
            link.click();
        }
        
        // 更新统计信息
        function updateStats() {
            const allNodes = root.descendants();
            const visibleNodes = allNodes.filter(d => !d._children && d.parent);
            
            document.getElementById('totalConcepts').textContent = allNodes.length;
            document.getElementById('visibleNodes').textContent = visibleNodes.length;
            
            // 计算最大深度
            let maxDepth = 0;
            allNodes.forEach(d => {
                if (d.depth > maxDepth) maxDepth = d.depth;
            });
            document.getElementById('totalLevels').textContent = maxDepth + 1;
        }
        
        // 搜索功能
        document.getElementById('conceptSearch').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            if (searchTerm === '') {
                update(root);
                return;
            }
            
            // 展开所有包含搜索词的节点
            function searchNode(node) {
                if (node.data.name.toLowerCase().includes(searchTerm)) {
                    // 展开到该节点的所有父节点
                    expandToRoot(node);
                }
                if (node.children) {
                    node.children.forEach(searchNode);
                }
                if (node._children) {
                    node._children.forEach(searchNode);
                }
            }
            
            function expandToRoot(node) {
                if (node.parent) {
                    if (node.parent._children) {
                        node.parent.children = node.parent._children;
                        node.parent._children = null;
                    }
                    expandToRoot(node.parent);
                }
            }
            
            searchNode(root);
            update(root);
            updateStats();
        });
        
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
        
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });
        
        // 窗口大小改变时重新初始化
        window.addEventListener('resize', () => {
            d3.select("#mindmap").selectAll("*").remove();
            initMindmap();
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                initMindmap();
            }, 500);
        });
    </script>
