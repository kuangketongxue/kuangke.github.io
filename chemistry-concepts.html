<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>化学的所有概念 - 狂客·银河</title>
    <link rel="stylesheet" href="style.css"><!-- 若无该文件不影响本页运行 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root{
            --brand-start:#667eea;
            --brand-end:#764ba2;
            --text:#2d3748;
            --muted:#718096;
            --bg:#f7fafc;
            --card:#ffffff;
            --dark-bg:#0f172a;
            --dark-card:#1f2937;
            --dark-text:#e5e7eb;
            --accent:#ff6b6b;
            --shadow:0 10px 30px rgba(0,0,0,0.12);
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
            color:var(--text);
            background: linear-gradient(135deg,#eef2f7 0%,#e8ecf4 100%);
        }
        body.dark-mode{
            color:var(--dark-text);
            background: radial-gradient(1200px 600px at 20% -10%,rgba(102,126,234,0.10),transparent),
                        radial-gradient(1000px 500px at 80% -10%,rgba(118,75,162,0.10),transparent),
                        #0b1220;
        }

        /* Header（复刻感） */
        .header{
            position: sticky; top:0; z-index:1000;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);
            border-bottom:1px solid rgba(102,126,234,0.15);
        }
        body.dark-mode .header{
            background: rgba(17,24,39,0.6);
            border-color: rgba(102,126,234,0.25);
        }
        .container{
            max-width:1200px; margin:0 auto; padding:14px 20px;
            display:flex; align-items:center; justify-content:space-between;
        }
        .header-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
        .logo{
            margin:0 10px 0 0;
            font-size:20px; font-weight:800; letter-spacing:1px;
            background: linear-gradient(135deg,var(--brand-start),var(--brand-end));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .nav-link{
            display:flex; align-items:center; gap:8px;
            padding:8px 14px; border-radius:10px; text-decoration:none;
            color:#334155; font-weight:600; font-size:14px;
            background: #ffffff; border:1px solid rgba(102,126,234,0.12);
            box-shadow: 0 6px 16px rgba(102,126,234,0.08);
            transition:.25s ease;
        }
        .nav-link:hover{ transform: translateY(-2px); box-shadow:0 10px 22px rgba(102,126,234,0.16)}
        body.dark-mode .nav-link{
            background:#111827; border-color:rgba(118,75,162,0.2); color:#e5e7eb;
        }
        .nav-link .fa{ color:#fff; width:22px; height:22px; border-radius:6px;
            display:flex; align-items:center; justify-content:center;
            background: linear-gradient(135deg,var(--brand-start),var(--brand-end));
            box-shadow: 0 6px 14px rgba(102,126,234,0.35);
        }
        .game-link{ background: linear-gradient(135deg,#ff6b6b 0%, #feca57 100%); color:#fff; border:none; box-shadow:0 6px 0 #c44569,0 6px 16px rgba(0,0,0,0.2)}
        .game-link:hover{ transform: translateY(2px); box-shadow:0 3px 0 #c44569,0 10px 20px rgba(0,0,0,0.2)}
        body.dark-mode .game-link{ box-shadow:0 6px 0 #ff4757,0 10px 22px rgba(0,0,0,0.35)}

        .controls{display:flex; align-items:center; gap:10px;}
        .theme-toggle{
            width:40px; height:40px; border-radius:12px; border:none; cursor:pointer;
            background: linear-gradient(135deg,var(--brand-start),var(--brand-end)); color:#fff;
            box-shadow: 0 10px 20px rgba(102,126,234,0.35);
            transition:.25s ease;
        }
        .theme-toggle:hover{ transform: translateY(-2px) }

        /* 页面标题区 */
        .hero{
            max-width:1200px; margin:70px auto 20px; padding:20px 20px 0;
            text-align:center;
        }
        .hero h1{
            font-size:2.6em; margin:0 0 10px;
            background: linear-gradient(135deg,var(--brand-start),var(--brand-end));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .hero p{ color:#64748b; margin:0 auto; max-width:720px }
        body.dark-mode .hero p{ color:#9aa3b2 }

        /* Mindmap 外层容器与工具栏 */
        .mindmap-shell{
            max-width:1200px; margin:16px auto 60px; padding:0 20px 40px;
        }
        .toolbar{
            display:flex; align-items:center; flex-wrap:wrap; gap:10px;
            justify-content:space-between; margin-bottom:14px;
        }
        .toolbar-left, .toolbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap}
        .search-box{
            display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px;
            background:#fff; border:1px solid rgba(102,126,234,0.14); min-width:280px;
            box-shadow: 0 6px 16px rgba(102,126,234,0.08);
        }
        .search-box input{
            outline:none; border:none; flex:1; font-size:14px; color:#334155; background:transparent;
        }
        .btn{
            display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; cursor:pointer;
            background: linear-gradient(135deg,#f5f7fa 0%, #e8ecf4 100%); color:#334155; border:1px solid rgba(102,126,234,0.14);
            box-shadow: 0 6px 16px rgba(102,126,234,0.08); font-weight:600; transition:.2s ease; user-select:none;
        }
        .btn:hover{ transform: translateY(-2px) }
        .btn.primary{ color:#fff; border:none; background:linear-gradient(135deg,var(--brand-start),var(--brand-end)) }
        .zoom-display{ font-weight:700; color:#334155 }
        body.dark-mode .search-box{ background:#0b1220; border-color:rgba(118,75,162,0.25) }
        body.dark-mode .search-box input{ color:#e5e7eb }
        body.dark-mode .btn{ background:#111827; color:#e5e7eb; border-color:rgba(118,75,162,0.25) }

        /* 思维导图树 */
        .map-viewport{
            position:relative; overflow:auto; height: calc(100vh - 260px);
            background: radial-gradient(900px 500px at 20% 0%,rgba(102,126,234,0.08),transparent),
                        radial-gradient(900px 600px at 80% 10%,rgba(118,75,162,0.10),transparent);
            border-radius:20px; border:1px solid rgba(102,126,234,0.14);
            box-shadow: var(--shadow);
        }
        body.dark-mode .map-viewport{
            background: radial-gradient(900px 500px at 20% 0%,rgba(102,126,234,0.12),transparent),
                        radial-gradient(900px 600px at 80% 10%,rgba(118,75,162,0.14),transparent);
            border-color: rgba(118,75,162,0.25)
        }
        .map-stage{ transform-origin: 0 0; padding:40px; width: max-content }
        /* 树结构（经典 UL/LI 画线法） */
        .tree{ position:relative; white-space:nowrap }
        .tree ul{
            padding-top: 16px; position: relative; padding-left: 28px; margin:0
        }
        .tree li{
            position: relative; list-style-type: none; padding: 14px 0 0 28px;
        }
        .tree li::before{
            content: ""; position: absolute; top:0; left:12px; border-left:2px solid rgba(102,126,234,0.25);
            height:100%; width:0;
        }
        .tree li::after{
            content: ""; position: absolute; top:24px; left:12px; width:28px; height:0;
            border-top:2px solid rgba(102,126,234,0.25);
        }
        .tree li:last-child::before{ height:24px }

        /* 节点卡片 */
        .node{
            position: relative; display:inline-flex; align-items:center; gap:10px;
            background: #fff; color:#1f2937; border-radius:14px; padding:12px 14px;
            border:1px solid rgba(102,126,234,0.18);
            box-shadow: 0 8px 22px rgba(102,126,234,0.12);
            max-width: 420px;
        }
        .node .dot{
            flex:0 0 auto; width:26px; height:26px; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center;
            background: linear-gradient(135deg,var(--brand-start),var(--brand-end));
            box-shadow: 0 6px 14px rgba(102,126,234,0.35);
            font-size:14px;
        }
        .node .title{ font-weight:700; font-size:14px; line-height:1.25 }
        .node .meta{ color:#64748b; font-size:12px }
        .node .actions{ margin-left:auto; display:flex; align-items:center; gap:8px }
        .chip{
            padding:4px 8px; border-radius:8px; font-size:12px; font-weight:700; color:#fff;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .toggle{
            width:32px; height:32px; border-radius:8px; border:none; cursor:pointer;
            background: linear-gradient(135deg,#f5f7fa 0%, #e8ecf4 100%); color:#334155;
            border:1px solid rgba(102,126,234,0.18)
        }
        .info{
            width:32px; height:32px; border-radius:8px; border:none; cursor:pointer; color:#fff;
            background: linear-gradient(135deg,#ff6b6b 0%, #ee5a24 100%);
            box-shadow: 0 6px 14px rgba(255,107,107,0.35);
        }
        body.dark-mode .node{
            background:#0b1220; color:#e5e7eb; border-color:rgba(118,75,162,0.25);
            box-shadow: 0 10px 22px rgba(0,0,0,0.35)
        }
        body.dark-mode .meta{ color:#9aa3b2 }
        body.dark-mode .toggle{ background:#111827; color:#e5e7eb; border-color:rgba(118,75,162,0.25) }

        /* 匹配高亮 */
        .highlight .title{
            background: linear-gradient(135deg,#ffe066 0%, #ff9f1a 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .hidden-branch{ display:none !important }

        /* 返回首页按钮 */
        .back-button {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--brand-start), var(--brand-end));
            color: white; border-radius: 50%; display:flex; align-items:center; justify-content:center;
            font-size: 22px; box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35); cursor: pointer;
            transition: all 0.3s ease; z-index: 1000; text-decoration: none;
        }
        .back-button:hover { transform: translateY(-4px) }

        /* 定义弹窗 */
        .modal{ display:none; position:fixed; inset:0; z-index:2000; background: rgba(0,0,0,0.65)}
        .modal-card{
            background:#fff; color:#1f2937; width: min(760px,92vw); max-height:80vh; overflow:auto;
            border-radius:18px; margin:6vh auto; padding:26px 26px 16px;
            box-shadow: 0 40px 60px rgba(0,0,0,0.35);
        }
        body.dark-mode .modal-card{ background:#111827; color:#e5e7eb }
        .modal-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px }
        .modal-title{ font-size:20px; font-weight:900; margin:0 }
        .modal-close{
            width:40px; height:40px; border-radius:12px; border:none; cursor:pointer;
            background: linear-gradient(135deg,#f5f7fa 0%, #e8ecf4 100%); color:#334155;
            border:1px solid rgba(102,126,234,0.18)
        }
        body.dark-mode .modal-close{ background:#0b1220; color:#e5e7eb; border-color:rgba(118,75,162,0.25) }
        .def-content{ margin-top:10px; color:#475569; line-height:1.7 }
        body.dark-mode .def-content{ color:#c5ceda }
        .def-meta{ margin-top:6px; font-size:12px; color:#64748b }
        body.dark-mode .def-meta{ color:#9aa3b2 }

        @media (max-width: 768px){
            .hero h1{ font-size:2.1em }
            .map-viewport{ height: calc(100vh - 280px) }
        }
    </style>
</head>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
                localStorage.setItem('theme','dark');
            } else {
                icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
                localStorage.setItem('theme','light');
            }
        });

        // 思维导图数据（覆盖高考化学满分所需的底层概念）
        // 结构：title, def, color, icon, children:[]
        const mindmapData = {
            title: "化学的所有概念", icon:"fa-atom", color:"#ff6b6b",
            def: "以粒子观与守恒观为底层框架，统摄化学计量、结构与性质、反应与能量、可持续与实验探究等核心素养。",
            children: [
                {
                    title:"计量与基本定律", icon:"fa-scale-balanced", color:"#4facfe",
                    def:"化学的数量语言；以摩尔为桥梁连接微观粒子与宏观测量，受守恒定律与定量规律约束。",
                    children:[
                        {title:"物质的量 n", def:"表示所含微粒数量的物理量，单位 mol；1 mol 含 6.02×10^23 个微粒。"},
                        {title:"摩尔 mol", def:"物质的量单位；数值上与阿伏加德罗常数对应的粒子数。"},
                        {title:"阿伏加德罗常数 N_A", def:"每 1 mol 物质所含微粒数，6.02×10^23 mol^-1（近似值）。"},
                        {title:"摩尔质量 M", def:"每 1 mol 物质的质量，单位 g·mol^-1，数值等于相对分子（原子）质量。"},
                        {title:"相对原子质量", def:"以 12C 的 1/12 为基准的无量纲相对值，反映平均原子质量。"},
                        {title:"相对分子质量", def:"分子中各原子相对原子质量之和（或式量）。"},
                        {title:"摩尔体积 V_m", def:"标准状况下任何气体的 1 mol 体积约为 22.4 L·mol^-1。"},
                        {title:"质量分数 ω", def:"溶质质量占溶液质量的分数（或百分数）。"},
                        {title:"物质的量浓度 c", def:"每升溶液中所含溶质的物质的量（mol·L^-1）。"},
                        {title:"气体摩尔体积（非标况）", def:"由状态方程定性判断体积随 T、p 变化，高中多作定性或等比推断。"},
                        {title:"质量守恒定律", def:"化学反应前后各元素总质量不变。"},
                        {title:"定比分（恒定组成）定律", def:"同一化合物中各元素质量比为确定不变的最简整数比。"},
                        {title:"倍比定律", def:"两元素形成不同化合物时，在固定一种元素质量下，另一元素质量之比为最简整数比。"},
                        {title:"能量守恒与转化", def:"反应过程中能量总量守恒，可在不同形式间转化（热、电、化学能）。"},
                    ]
                },
                {
                    title:"微观粒子与原子结构", icon:"fa-atom", color:"#30cfd0",
                    def:"原子—分子—离子是物质的微观构成；核外电子排布决定元素的化学性质。",
                    children:[
                        {title:"质子", def:"带 +1 电荷，位于原子核内，其数目等于核电荷数。"},
                        {title:"中子", def:"不带电，位于原子核内，贡献原子质量但不改变核电荷数。"},
                        {title:"电子", def:"带 -1 电荷，核外运动，参与化学键与反应。"},
                        {title:"核电荷数（Z）", def:"等于质子数，决定元素种类与周期表位置。"},
                        {title:"同位素", def:"同一元素的不同核素（质子数相同，中子数不同）。"},
                        {title:"相对原子质量（平均）", def:"按天然同位素丰度加权的平均值。"},
                        {title:"价电子", def:"最外层电子；决定元素的化学活性与成键能力。"},
                        {title:"电子层与能级", def:"核外电子按能量由低到高分层、分亚层有序排布。"},
                        {title:"基态排布", def:"电子占据最低能级的排布状态，高中常用简化写法。"},
                        {title:"离子", def:"原子或原子团得失电子形成的带电粒子（阳离子/阴离子）。"},
                        {title:"相对分子质量/式量", def:"分子或晶体化学式中原子相对原子质量之和。"},
                        {title:"经验式", def:"化合物中各元素原子个数最简整数比表示。"},
                        {title:"分子式", def:"化合物分子中各元素的实际原子个数表示。"},
                        {title:"结构式（高中）", def:"在满足价键数前提下的平面键连表示，用于理解有机官能团。"},
                    ]
                },
                {
                    title:"元素周期律与元素性质", icon:"fa-table", color:"#a18cd1",
                    def:"原子序数递增时，元素性质按周期性变化；同周期与同主族呈规律趋势。",
                    children:[
                        {title:"周期与族", def:"周期表横行为周期，纵列为族（高中关注主族）。"},
                        {title:"原子半径", def:"同周期自左向右减小，同族自上而下增大（一般规律）。"},
                        {title:"第一电离能", def:"同周期一般增大，同族自上而下减小。"},

        // 渲染树
        const treeRoot = document.getElementById('treeRoot');

        function renderNode(node, depth=0){
            const hasChildren = Array.isArray(node.children) && node.children.length > 0;
            const color = node.color || '#667eea';
            const icon = node.icon || 'fa-circle';
            const opened = depth <= 1; // 默认展开前两层

            const nodeId = 'n_' + Math.random().toString(36).slice(2);
            const defAttr = node.def ? node.def.replace(/"/g,'&quot;') : '';

            const nodeHtml = `
                <li data-node-id="${nodeId}" ${opened ? '' : 'data-collapsed="true"'} >
                    <div class="node" style="border-left:6px solid ${color}">
                        <div class="dot" style="background: linear-gradient(135deg, ${color}, ${color})">
                            <i class="fa ${icon}"></i>
                        </div>
                        <div>
                            <div class="title">${node.title}</div>
                            ${node.def ? `<div class="meta">${escapeHtml(shorten(node.def, 80))}</div>` : ``}
                        </div>
                        <div class="actions">
                            ${hasChildren ? `<button class="toggle" title="展开/折叠"><i class="fa ${opened ? 'fa-chevron-down' : 'fa-chevron-right'}"></i></button>` : ``}
                            ${node.def ? `<button class="info" title="查看定义" data-def="${defAttr}" data-title="${escapeHtml(node.title)}"><i class="fa fa-info"></i></button>` : ``}
                        </div>
                    </div>
                    ${hasChildren ? `
                        <ul class="children" style="${opened ? '' : 'display:none'}">
                            ${node.children.map(child => renderNode(child, depth+1)).join('')}
                        </ul>
                    ` : ``}
                </li>
            `;
            return nodeHtml;
        }

        function renderTree(data){
            treeRoot.innerHTML = `<ul class="root">${renderNode(data, 0)}</ul>`;
        }

        function shorten(text, len){
            if(!text) return '';
            return text.length > len ? text.slice(0,len) + '…' : text;
        }

        function escapeHtml(s){
            return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        renderTree(mindmapData);

        // 展开/折叠交互
        treeRoot.addEventListener('click', (e)=>{
            const t = e.target;
            const btn = t.closest('.toggle');
            if(btn){
                const li = btn.closest('li');
                const ul = li.querySelector(':scope > ul.children');
                if(!ul) return;
                const icon = btn.querySelector('i');
                const collapsed = ul.style.display === 'none';
                ul.style.display = collapsed ? '' : 'none';
                li.toggleAttribute('data-collapsed', !collapsed);
                icon.classList.toggle('fa-chevron-right', !collapsed);
                icon.classList.toggle('fa-chevron-down', collapsed);
            }
            const info = t.closest('.info');
            if(info){
                openDefModal(info.getAttribute('data-title') || '概念', info.getAttribute('data-def') || '', buildPath(info.closest('li')));
            }
        });

        // 构建路径（父链）
        function buildPath(li){
            const titles = [];
            let cur = li;
            while(cur){
                const title = cur.querySelector(':scope > .node .title');
                if(title) titles.push(title.textContent.trim());
                cur = cur.parentElement?.closest('li') || null;
            }
            return titles.reverse().join(' › ');
        }

        // 定义弹窗
        const modal = document.getElementById('defModal');
        const defTitle = document.getElementById('defTitle');
        const defContent = document.getElementById('defContent');
        const defMeta = document.getElementById('defMeta');
        const modalClose = document.getElementById('modalClose');

        function openDefModal(title, def, meta){
            defTitle.textContent = title;
            defContent.textContent = def;
            defMeta.textContent = meta ? '路径：' + meta : '';
            modal.style.display = 'block';
        }
        modalClose.addEventListener('click', ()=> modal.style.display='none');
        modal.addEventListener('click', (e)=>{ if(e.target === modal) modal.style.display='none' });

        // 搜索与高亮
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');

        function clearHighlights(){
            treeRoot.querySelectorAll('.highlight').forEach(n=> n.classList.remove('highlight'));
            treeRoot.querySelectorAll('.hidden-branch').forEach(n=> n.classList.remove('hidden-branch'));
        }

        function expandParents(li){
            let cur = li.parentElement?.closest('li');
            while(cur){
                const ul = cur.querySelector(':scope > ul.children');
                const toggleBtn = cur.querySelector(':scope > .node .toggle i');
                if(ul && ul.style.display === 'none'){
                    ul.style.display = '';
                    cur.removeAttribute('data-collapsed');
                    if(toggleBtn){ toggleBtn.classList.remove('fa-chevron-right'); toggleBtn.classList.add('fa-chevron-down'); }
                }
                cur = cur.parentElement?.closest('li');
            }
        }

        function searchTree(q){
            clearHighlights();
            if(!q){ return; }
            q = q.trim().toLowerCase();
            const lis = Array.from(treeRoot.querySelectorAll('li'));
            const matched = new Set();

            lis.forEach(li=>{
                const titleEl = li.querySelector(':scope > .node .title');
                const metaEl = li.querySelector(':scope > .node .meta');
                const text = ((titleEl?.textContent || '') + ' ' + (metaEl?.textContent || '')).toLowerCase();
                if(text.includes(q)){
                    const card = li.querySelector(':scope > .node');
                    card?.classList.add('highlight');
                    matched.add(li);
                    expandParents(li);
                }
            });

            // 隐藏不匹配分支：只保留匹配节点及其祖先、子孙
            if(matched.size){
                lis.forEach(li=>{
                    const keep = isAncestorOrDescendantOfMatched(li, matched);
                    if(!keep){ li.classList.add('hidden-branch'); }
                });
            }
        }

        function isAncestorOrDescendantOfMatched(li, matched){
            if(matched.has(li)) return true;
            // 祖先
            let cur = li.parentElement?.closest('li');
            while(cur){
                if(matched.has(cur)) return true;
                cur = cur.parentElement?.closest('li');
            }
            // 子孙
            for(const m of matched){
                let parent = m.parentElement?.closest('li');
                while(parent){
                    if(parent === li) return true;
                    parent = parent.parentElement?.closest('li');
                }
            }
            return false;
        }

        searchInput.addEventListener('input', (e)=> searchTree(e.target.value));
        clearSearch.addEventListener('click', ()=>{
            searchInput.value=''; clearHighlights();
        });

        // 展开/折叠全部
        document.getElementById('expandAll').addEventListener('click', ()=>{
            treeRoot.querySelectorAll('li').forEach(li=>{
                const ul = li.querySelector(':scope > ul.children');
                const icon = li.querySelector(':scope > .node .toggle i');
                if(ul){ ul.style.display=''; li.removeAttribute('data-collapsed'); }
                if(icon){ icon.classList.remove('fa-chevron-right'); icon.classList.add('fa-chevron-down'); }
            });
        });
        document.getElementById('collapseAll').addEventListener('click', ()=>{
            treeRoot.querySelectorAll('li').forEach((li, idx)=>{
                if(idx===0) return; // 根节点保留
                const ul = li.querySelector(':scope > ul.children');
                const icon = li.querySelector(':scope > .node .toggle i');
                if(ul){ ul.style.display='none'; li.setAttribute('data-collapsed','true'); }
                if(icon){ icon.classList.remove('fa-chevron-down'); icon.classList.add('fa-chevron-right'); }
            });
        });

        // 缩放与适配
        const stage = document.getElementById('stage');
        const viewport = document.getElementById('viewport');
        const zoomPercent = document.getElementById('zoomPercent');
        let scale = 1;

        function applyScale(){
            stage.style.transform = `scale(${scale})`;
            zoomPercent.textContent = Math.round(scale*100) + '%';
        }
        document.getElementById('zoomIn').addEventListener('click', ()=>{ scale = Math.min(2, scale+0.1); applyScale(); });
        document.getElementById('zoomOut').addEventListener('click', ()=>{ scale = Math.max(0.5, scale-0.1); applyScale(); });
        document.getElementById('fitView').addEventListener('click', ()=>{
            // 简易适配：根据当前内容宽度与视口宽度估算
            const contentWidth = stage.getBoundingClientRect().width / scale; // 真实宽度
            const vw = viewport.clientWidth - 80;
            const s = Math.max(0.5, Math.min(1.2, vw / contentWidth));
            scale = s; applyScale();
            viewport.scrollTo({left:0, top:0, behavior:'smooth'});
        });
        applyScale();

        // 打印导出（浏览器打印）
        document.getElementById('printMap').addEventListener('click', ()=> window.print());
    </script>
</body>
</html>
