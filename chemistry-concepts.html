                .append("svg")
                .attr("width", width + margin.right + margin.left)
                .attr("height", height + margin.top + margin.bottom);
            
            g = svg.append("g")
                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
            
            // 创建树布局
            tree = d3.tree().size([height, width]);
            
            // 处理数据
            root = d3.hierarchy(chemistryConcepts, d => d.children);
            root.x0 = height / 2;
            root.y0 = 0;
            
            // 初始折叠一些深层节点
            if (root.children) {
                root.children.forEach(collapse);
            }
            
            update(root);
            
            // 添加缩放功能
            const zoom = d3.zoom()
                .scaleExtent([0.1, 3])
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);
                    currentZoom = event.transform.k;
                });
            
            svg.call(zoom);
            
            // 隐藏加载动画
            document.getElementById('loading').style.display = 'none';
            
            // 更新统计信息
            updateStats();
        }
        
        // ==================== 节点操作函数 ====================
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }
        
        function expand(d) {
            if (d._children) {
                d.children = d._children;
                d.children.forEach(expand);
                d._children = null;
            }
        }
        
        // ==================== 更新思维导图 ====================
        function update(source) {
            const treeData = tree(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);
            
            // 标准化深度
            nodes.forEach(d => { d.y = d.depth * 200; });
            
            // 节点处理
            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));
            
            // 进入新节点
            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => "translate(" + source.y0 + "," + source.x0 + ")")
                .on('click', click)
                .on('mouseover', showTooltip)
                .on('mouseout', hideTooltip);
            
            nodeEnter.append('circle')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "lightsteelblue" : "#fff");
            
            nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -13 : 13)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name)
                .style("fill-opacity", 1e-6);
            
            // 更新节点
            const nodeUpdate = nodeEnter.merge(node);
            
            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => "translate(" + d.y + "," + d.x + ")");
            
            nodeUpdate.select('circle')
                .attr('r', 8)
                .style("fill", d => d._children ? "lightsteelblue" : "#fff")
                .attr('cursor', 'pointer');
            
            nodeUpdate.select('text')
                .style("fill-opacity", 1);
            
            // 退出节点
            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => "translate(" + source.y + "," + source.x + ")")
                .remove();
            
            nodeExit.select('circle')
                .attr('r', 1e-6);
            
            nodeExit.select('text')
                .style('fill-opacity', 1e-6);
            
            // 连接线处理
            const link = g.selectAll('path.link')
                .data(links, d => d.id);
            
            // 进入新连接线
            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });
            
            // 更新连接线
            const linkUpdate = linkEnter.merge(link);
            
            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d, d.parent));
            
            // 退出连接线
            link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();
            
            // 存储旧位置
            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }
        
        // ==================== 辅助函数 ====================
        function diagonal(s, d) {
            const path = `M ${s.y} ${s.x}
                    C ${(s.y + d.y) / 2} ${s.x},
                      ${(s.y + d.y) / 2} ${d.x},
                      ${d.y} ${d.x}`;
            return path;
        }
        
        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
            updateStats();
        }
        
        function showTooltip(event, d) {
            const tooltip = document.getElementById('conceptTooltip');
            const title = document.getElementById('tooltipTitle');
            const definition = document.getElementById('tooltipDefinition');
            const formula = document.getElementById('tooltipFormula');
            
            title.textContent = d.data.name;
            definition.textContent = d.data.definition || '暂无定义';
            
            if (d.data.formula && d.data.formula !== '') {
                formula.textContent = '公式: ' + d.data.formula;
                formula.style.display = 'block';
            } else {
                formula.style.display = 'none';
            }
            
            tooltip.style.display = 'block';
            tooltip.style.left = (event.pageX + 10) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
        }
        
        function hideTooltip() {
            document.getElementById('conceptTooltip').style.display = 'none';
        }
        
        // ==================== 控制函数 ====================
        function expandAll() {
            expand(root);
            update(root);
            updateStats();
        }
        
        function collapseAll() {
            collapse(root);
            update(root);
            updateStats();
        }
        
        function resetView() {
            svg.transition()
                .duration(750)
                .call(
                    d3.zoom().transform,
                    d3.zoomIdentity.translate(margin.left, margin.top)
                );
        }
        
        function zoomIn() {
            svg.transition()
                .duration(300)
                .call(
                    d3.zoom().scaleBy,
                    1.3
                );
        }
        
        function zoomOut() {
            svg.transition()
                .duration(300)
                .call(
                    d3.zoom().scaleBy,
                    0.7
                );
        }
        
        function fitToScreen() {
            const bounds = g.node().getBBox();
            const fullWidth = width + margin.right + margin.left;
            const fullHeight = height + margin.top + margin.bottom;
            const widthScale = fullWidth / bounds.width;
            const heightScale = fullHeight / bounds.height;
            const scale = 0.8 * Math.min(widthScale, heightScale);
            
            const translate = [
                fullWidth / 2 - scale * (bounds.x + bounds.width / 2),
                fullHeight / 2 - scale * (bounds.y + bounds.height / 2)
            ];
            
            svg.transition()
                .duration(750)
                .call(
                    d3.zoom().transform,
                    d3.zoomIdentity
                        .translate(translate[0], translate[1])
                        .scale(scale)
                );
        }
        
        function exportData() {
            const dataStr = JSON.stringify(chemistryConcepts, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'chemistry_concepts.json';
            link.click();
        }
        
        function updateStats() {
            const allNodes = root.descendants();
            const visibleNodes = allNodes.filter(d => !d._children && d.parent);
            
            document.getElementById('totalConcepts').textContent = allNodes.length;
            document.getElementById('visibleNodes').textContent = visibleNodes.length;
            
            // 计算最大深度
            let maxDepth = 0;
            allNodes.forEach(d => {
                if (d.depth > maxDepth) maxDepth = d.depth;
            });
            document.getElementById('totalLevels').textContent = maxDepth + 1;
        }
        
        // ==================== 搜索功能 ====================
        document.getElementById('conceptSearch').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            if (searchTerm === '') {
                update(root);
                return;
            }
            
            function searchNode(node) {
                if (node.data.name.toLowerCase().includes(searchTerm)) {
                    expandToRoot(node);
                }
                if (node.children) {
                    node.children.forEach(searchNode);
                }
                if (node._children) {
                    node._children.forEach(searchNode);
                }
            }
            
            function expandToRoot(node) {
                if (node.parent) {
                    if (node.parent._children) {
                        node.parent.children = node.parent._children;
                        node.parent._children = null;
                    }
                    expandToRoot(node.parent);
                }
            }
            
            searchNode(root);
            update(root);
            updateStats();
        });
        
        // ==================== 主题切换 ====================
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
        
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });
        
        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            d3.select("#mindmap").selectAll("*").remove();
            initMindmap();
        });
        
        // ==================== 页面初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                initMindmap();
            }, 500);
        });
    </script>
</body>
</html>
