    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #43e97b;
            --warning-color: #ffd700;
            --danger-color: #f56565;
            --dark-bg: #1a202c;
            --dark-card: #2d3748;
        }

        /* 化学概念页面专属样式 */
        .chemistry-container {
            max-width: 1400px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }

        /* 页面头部 */
        .page-header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .page-header h1 {
            font-size: 3em;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .page-header p {
            font-size: 1.2em;
            color: #666;
            opacity: 0.9;
        }

        body.dark-mode .page-header p {
            color: #aaa;
        }

        /* 搜索容器 */
        .search-container {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        body.dark-mode .search-input {
            background: var(--dark-card);
            color: #fff;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .search-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .search-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #searchResult {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            min-height: 20px;
        }

        body.dark-mode #searchResult {
            color: #aaa;
        }

        /* 控制面板 */
        .control-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .control-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .control-btn i, .control-btn span {
            position: relative;
            z-index: 1;
        }

        .control-btn i {
            margin-right: 8px;
        }

        /* 收藏统计 */
        .favorite-count {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: var(--warning-color);
            font-weight: 600;
        }

        body.dark-mode .favorite-count {
            background: var(--dark-card);
        }

        /* 缩放控制 */
        .zoom-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .zoom-control {
            background: var(--dark-card);
        }

        .zoom-btn {
            background: linear-gradient(135deg, var(--success-color) 0%, #38f9d7 100%);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2em;
            position: relative;
            overflow: hidden;
        }

        .zoom-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .zoom-btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .zoom-btn:hover {
            transform: scale(1.1);
        }

        .zoom-display {
            font-weight: 600;
            color: #333;
            min-width: 60px;
            text-align: center;
        }

        body.dark-mode .zoom-display {
            color: #fff;
        }

        /* 思维导图容器 */
        .mindmap-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: auto;
            position: relative;
            min-height: 800px;
        }

        body.dark-mode .mindmap-container {
            background: var(--dark-card);
        }

        .mindmap-wrapper {
            transform-origin: top left;
            transition: transform 0.3s ease;
        }

        /* 根节点 */
        .root-node {
            text-align: center;
            margin: 0 auto 60px;
            width: fit-content;
        }

        .root-bubble {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 30px 50px;
            border-radius: 50px;
            font-size: 2em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .root-bubble::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .root-bubble:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        /* 一级分支 */
        .level-1-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .level-1-node {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        body.dark-mode .level-1-node {
            background: linear-gradient(135deg, #3a4556 0%, var(--dark-card) 100%);
        }

        .level-1-node:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .level-1-title {
            font-size: 1.6em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        body.dark-mode .level-1-title {
            color: #fff;
        }

        .level-1-icon {
            font-size: 1.2em;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .collapse-icon {
            margin-left: auto;
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }

        .collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        /* 二级分支 */
        .level-2-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .collapsed .level-2-container {
            max-height: 0;
        }

        .level-2-node {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        body.dark-mode .level-2-node {
            background: var(--dark-bg);
        }

        .level-2-node:hover {
            transform: translateX(10px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.2);
        }

        .level-2-title {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .level-2-icon {
            font-size: 0.9em;
        }

        /* 三级内容 */
        .level-3-container {
            margin-top: 10px;
            padding-left: 20px;
            border-left: 3px solid var(--primary-color);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .level-2-node.expanded .level-3-container {
            max-height: 10000px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        /* 概念项 */
        .concept-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        body.dark-mode .concept-item {
            background: var(--dark-card);
        }

        .concept-item:hover {
            background: linear-gradient(135deg, #f093fb15 0%, #f5576c15 100%);
        }

        .concept-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .concept-name {
            font-weight: 600;
            color: #333;
            font-size: 1.05em;
        }

        body.dark-mode .concept-name {
            color: #fff;
        }

        .favorite-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
        }

        .favorite-btn:hover {
            color: var(--warning-color);
            transform: scale(1.2);
        }

        .concept-item.favorited .favorite-btn {
            color: var(--warning-color);
        }

        .concept-item.favorited .favorite-btn i::before {
            content: "\f005";
            font-weight: 900;
        }

        .concept-definition {
            color: #666;
            line-height: 1.8;
            font-size: 0.95em;
        }

        body.dark-mode .concept-definition {
            color: #aaa;
        }

        .concept-definition p {
            margin: 8px 0;
        }

        .concept-definition ul, .concept-definition ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .concept-definition li {
            margin: 4px 0;
        }

        .concept-definition code {
            background: rgba(102, 126, 234, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        /* 高亮效果 */
        .highlight {
            animation: highlightPulse 1s ease-in-out 3;
        }

        @keyframes highlightPulse {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 235, 59, 0.3); }
        }

        /* 返回按钮 */
        .back-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .back-button:hover::before {
            width: 150px;
            height: 150px;
        }

        .back-button:hover {
            transform: translateY(-5px) rotate(360deg);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .back-button i {
            position: relative;
            z-index: 1;
        }

        /* 返回顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--success-color) 0%, #38f9d7 100%);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.5);
        }

        /* 阅读进度条 */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            z-index: 10000;
            transition: width 0.2s ease;
            width: 0%;
        }

        /* 加载提示 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        body.dark-mode .loading-overlay {
            background: rgba(26, 32, 44, 0.9);
        }

        .loading-content {
            text-align: center;
            color: var(--primary-color);
        }

        .loading-content i {
            font-size: 3em;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-content p {
            margin-top: 20px;
            font-size: 1.2em;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .chemistry-container {
                max-width: 95%;
                padding: 30px 15px;
            }
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2em;
            }

            .page-header p {
                font-size: 1em;
            }

            .root-bubble {
                padding: 20px 30px;
                font-size: 1.5em;
            }

            .control-panel {
                flex-direction: column;
                gap: 10px;
            }

            .control-btn {
                padding: 10px 18px;
                font-size: 0.9em;
                width: 100%;
                max-width: 300px;
            }

            .level-1-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .mindmap-container {
                padding: 20px;
            }

            .level-1-title {
                font-size: 1.3em;
            }

            .level-2-title {
                font-size: 1.1em;
            }

            .back-button, .back-to-top {
                bottom: 20px;
                right: 20px;
            }

            .back-to-top {
                bottom: 80px;
            }
        }

        @media (max-width: 480px) {
            .chemistry-container {
                margin: 60px auto 40px;
                padding: 20px 10px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-input, .search-btn {
                width: 100%;
            }

            .zoom-control {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

    <!-- 返回按钮 -->
    <a href="ai.html" class="back-button" title="返回AI助手">
        <i class="fas fa-arrow-left"></i>
    </a>

    <script>
        // ========== 配置 ==========
        const MD_FILE_PATH = 'chemistry-concepts.md';

        // ========== 主要功能 ==========
        
        // 从MD文件加载并渲染内容
        async function loadChemistryConcepts() {
            try {
                const response = await fetch(MD_FILE_PATH);
                if (!response.ok) {
                    throw new Error('无法加载概念文件');
                }
                const markdown = await response.text();
                parseAndRenderConcepts(markdown);
                
                // 恢复收藏状态
                setTimeout(() => {
                    restoreFavorites();
                    updateFavoriteCount();
                }, 300);
                
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('conceptContainer').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3em; margin-bottom: 20px;"></i>
                        <p>加载概念数据失败,请检查 chemistry-concepts.md 文件是否存在</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">错误信息: ${error.message}</p>
                    </div>
                `;
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // 解析MD并渲染为HTML
        function parseAndRenderConcepts(markdown) {
            const container = document.getElementById('conceptContainer');
            const lines = markdown.split('\n');
            let html = '';
            let currentLevel1 = null;
            let currentLevel2 = null;
            let level1Id = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                // 一级标题 (## 标题)
                if (line.startsWith('## ')) {
                    if (currentLevel1) {
                        html += '</div></div></div>';
                    }
                    const titleMatch = line.match(/## (.+?) (.+)/);
                    if (titleMatch) {
                        const icon = titleMatch[1].trim();
                        const title = titleMatch[2].trim();
                        level1Id++;
                        html += `
                            <div class="level-1-node" id="level1-${level1Id}">
                                <div class="level-1-title" onclick="toggleLevel1(this)">
                                    <span class="level-1-icon">${icon}</span>
                                    ${title}
                                    <span class="collapse-icon"><i class="fas fa-chevron-down"></i></span>
                                </div>
                                <div class="level-2-container">
                        `;
                        currentLevel1 = true;
                        currentLevel2 = null;
                    }
                }
                // 二级标题 (### 标题)
                else if (line.startsWith('### ')) {
                    if (currentLevel2) {
                        html += '</div></div>';
                    }
                    const titleMatch = line.match(/### (.+?) (.+)/);
                    if (titleMatch) {
                        const icon = titleMatch[1].trim();
                        const title = titleMatch[2].trim();
                        html += `
                            <div class="level-2-node" onclick="toggleLevel2(this)">
                                <div class="level-2-title">
                                    <span class="level-2-icon">${icon}</span>
                                    ${title}
                                </div>
                                <div class="level-3-container">
                        `;
                        currentLevel2 = true;
                    }
                }
                // 概念项 (#### 或 - **)
                else if (line.startsWith('#### ') || line.match(/^- \*\*/)) {
                    let conceptName = '';
                    if (line.startsWith('#### ')) {
                        conceptName = line.replace('#### ', '').trim();
                    } else {
                        const match = line.match(/- \*\*(.+?)\*\*/);
                        if (match) conceptName = match[1].trim();
                    }
                    
                    if (conceptName) {
                        let definition = '';
                        i++;
                        while (i < lines.length) {
                            const defLine = lines[i].trim();
                            if (defLine.startsWith('#') || defLine.match(/^- \*\*/) || (defLine === '' && lines[i + 1]?.trim().startsWith('#'))) {
                                i--;
                                break;
                            }
                            if (defLine) {
                                definition += defLine + '\n';
                            }
                            i++;
                        }

                        const renderedDefinition = marked.parse(definition);
                        html += `
                            <div class="concept-item" data-concept="${conceptName}">
                                <div class="concept-header">
                                    <div class="concept-name">${conceptName}</div>
                                    <button class="favorite-btn" onclick="toggleFavorite(this.closest('.concept-item'))">
                                        <i class="far fa-star"></i>
                                    </button>
                                </div>
                                <div class="concept-definition">${renderedDefinition}</div>
                            </div>
                        `;
                    }
                }
            }

            if (currentLevel2) html += '</div></div>';
            if (currentLevel1) html += '</div></div>';

            container.innerHTML = html;
        }

        // ========== 缩放功能 ==========
        let currentZoom = 100;
        const wrapper = document.getElementById('mindmapWrapper');
        const zoomDisplay = document.getElementById('zoomDisplay');

        function zoomIn() {
            if (currentZoom < 200) {
                currentZoom += 10;
                updateZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 50) {
                currentZoom -= 10;
                updateZoom();
            }
        }

        function resetZoom() {
            currentZoom = 100;
            updateZoom();
        }

        function updateZoom() {
            wrapper.style.transform = `scale(${currentZoom / 100})`;
            zoomDisplay.textContent = currentZoom + '%';
        }

        // ========== 展开/收起功能 ==========
        function toggleLevel1(element) {
            const node = element.parentElement;
            node.classList.toggle('collapsed');
        }

        function toggleLevel2(element) {
            element.classList.toggle('expanded');
        }

        function expandAll() {
            document.querySelectorAll('.level-1-node').forEach(node => {
                node.classList.remove('collapsed');
            });
            document.querySelectorAll('.level-2-node').forEach(node => {
                node.classList.add('expanded');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.level-1-node').forEach(node => {
                node.classList.add('collapsed');
            });
            document.querySelectorAll('.level-2-node').forEach(node => {
                node.classList.remove('expanded');
            });
        }

        // ========== 搜索功能 ==========
        function enhancedSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const searchResult = document.getElementById('searchResult');
            
            // 移除之前的高亮
            document.querySelectorAll('.highlight').forEach(el => {
                el.classList.remove('highlight');
            });

            if (!searchTerm) {
                searchResult.textContent = '';
                return;
            }

            let matchCount = 0;
            const concepts = document.querySelectorAll('.concept-item');
            
            concepts.forEach(concept => {
                const name = concept.querySelector('.concept-name').textContent.toLowerCase();
                const definition = concept.querySelector('.concept-definition').textContent.toLowerCase();
                
                if (name.includes(searchTerm) || definition.includes(searchTerm)) {
                    matchCount++;
                    
                    // 展开所有父节点
                    let parent = concept.closest('.level-2-node');
                    if (parent) {
                        parent.classList.add('expanded');
                        let level1 = parent.closest('.level-1-node');
                        if (level1) {
                            level1.classList.remove('collapsed');
                        }
                    }
                    
                    // 高亮
                    concept.classList.add('highlight');
                }
            });

            // 显示搜索结果统计
            searchResult.textContent = matchCount > 0 ? `找到 ${matchCount} 个相关概念` : '未找到相关概念';
            searchResult.style.color = matchCount > 0 ? '#43e97b' : '#f56565';

            // 滚动到第一个结果
            if (matchCount > 0) {
                const firstMatch = document.querySelector('.highlight');
                if (firstMatch) {
                    setTimeout(() => {
                        firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                }
            }
        }

        // 实时搜索
        document.getElementById('searchInput').addEventListener('input', enhancedSearch);

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enhancedSearch();
            }
        });

        // ========== 收藏功能 ==========
        function toggleFavorite(conceptElement) {
            const conceptName = conceptElement.getAttribute('data-concept');
            let favorites = JSON.parse(localStorage.getItem('chemistryFavorites')) || [];
            
            if (favorites.includes(conceptName)) {
                favorites = favorites.filter(name => name !== conceptName);
                conceptElement.classList.remove('favorited');
            } else {
                favorites.push(conceptName);
                conceptElement.classList.add('favorited');
            }
            
            localStorage.setItem('chemistryFavorites', JSON.stringify(favorites));
            updateFavoriteCount();
        }

        function updateFavoriteCount() {
            const favorites = JSON.parse(localStorage.getItem('chemistryFavorites')) || [];
            const countElement = document.getElementById('favoriteCount');
            if (countElement) {
                countElement.textContent = favorites.length;
            }
        }

        function restoreFavorites() {
            const favorites = JSON.parse(localStorage.getItem('chemistryFavorites')) || [];
            document.querySelectorAll('.concept-item').forEach(item => {
                const name = item.getAttribute('data-concept');
                if (favorites.includes(name)) {
                    item.classList.add('favorited');
                }
            });
        }

        // ========== 主题切换 ==========
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';

        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // ========== 返回顶部功能 ==========
        const backToTopBtn = document.createElement('button');
        backToTopBtn.className = 'back-to-top';
        backToTopBtn.innerHTML = '<i class="fas fa-arrow-up"></i>';
        backToTopBtn.style.display = 'none';
        document.body.appendChild(backToTopBtn);

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopBtn.style.display = 'flex';
            } else {
                backToTopBtn.style.display = 'none';
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // ========== 阅读进度条 ==========
        const progressBar = document.querySelector('.reading-progress');

        window.addEventListener('scroll', () => {
            const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (window.pageYOffset / windowHeight) * 100;
            progressBar.style.width = scrolled + '%';
        });

        // ========== 页面加载 ==========
        window.addEventListener('load', () => {
            loadChemistryConcepts();
        });
    </script>
</body>
</html>
