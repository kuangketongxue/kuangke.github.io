    <style>

        .header .container { max-width: 1200px; margin: 0 auto; padding: 14px 20px; display:flex; align-items:center; justify-content: space-between; }
        .header-left { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
        .logo { margin:0; font-size: 20px; background: var(--grad-1); -webkit-background-clip:text; -webkit-text-fill-color: transparent; }

        /* 顶部链接按钮（沿用原站风格） */
        .success-link,.breakthrough-link,.sky-link,.exam-link,.video-link,.game-link{
            display:flex; align-items:center; text-decoration:none; padding:8px 14px; border-radius:10px; transition: all .2s ease; gap:8px;

        .tool-btn{
            border:none; cursor:pointer; color:#fff; padding:10px 14px; border-radius: 10px;
            box-shadow:0 6px 18px rgba(102,126,234,0.35); transition: all .2s ease; background: var(--grad-1);
        }
        .tool-btn:hover{ transform: translateY(-2px); box-shadow:0 10px 24px rgba(102,126,234,0.45); }
        .tool-btn.secondary{ background: linear-gradient(135deg,#43e97b 0%, #38f9d7 100%); box-shadow:0 6px 18px rgba(67,233,123,0.35); }
        .tool-btn.warn{ background: linear-gradient(135deg,#ff6b6b 0%, #ee5a24 100%); box-shadow:0 6px 18px rgba(255,107,107,0.35); }

        .tool-split{ flex:1 1 auto; }
        .search-box{
            display:flex; align-items:center; gap:8px; background: rgba(255,255,255,0.8);
            border: 1px solid rgba(0,0,0,0.05); border-radius: 10px; padding: 8px 10px;
        }

            border:none; outline:none; background:transparent; width:240px; color:#333;

        body.dark-mode .search-box{ background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.08); }
        body.dark-mode .search-input{ color:#fff; }

        /* 思维导图画布 */
        .map-canvas{
            position: relative; width: 100%; height: 72vh; min-height: 560px; background: #ffffff;
            border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
            overflow: hidden;

        body.dark-mode .map-canvas{ background: #111527; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }

        /* 工具提示与侧栏 */
        .node-tooltip{
            position: absolute; pointer-events: none; z-index: 10; max-width: 360px;
            background: rgba(255,255,255,0.95); color: #333; border-radius: 12px; padding: 10px 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18); border: 1px solid rgba(0,0,0,0.05);
            display:none;
        }
        body.dark-mode .node-tooltip{ background: rgba(45,55,72,0.96); color:#fff; border-color: rgba(255,255,255,0.08); }

        .detail-panel{
            margin-top: 12px; background: rgba(255,255,255,0.75); border-radius: 14px; padding: 14px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        body.dark-mode .detail-panel{ background: rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.08); }
        .detail-title{ font-weight:700; margin-bottom:6px; }
        .detail-body{ color: var(--text-2); }
        body.dark-mode .detail-body{ color:#bbb; }

        /* 节点样式 */
        .node circle{ cursor: pointer; }
        .node text{ font-size: 12px; user-select: none; }
        .node text.label{ fill:#222; }
        body.dark-mode .node text.label{ fill:#f1f1f1; }
        .node .hit{ fill: transparent; cursor: pointer; }
        .link{ fill: none; stroke-width: 1.6px; }
        .link.base{ stroke: rgba(102,126,234,0.28); }
        body.dark-mode .link.base{ stroke: rgba(148,163,255,0.25); }
        .link.hl{ stroke: #ffb142; stroke-width: 2.2px; }

        /* 返回主页悬浮按钮（保持一致） */
        .back-button {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--grad-1); color:#fff; border-radius:50%;
            display:flex; align-items:center; justify-content:center; font-size:24px;
            box-shadow: 0 6px 20px rgba(102,126,234,0.4); cursor:pointer; transition: all .3s ease; z-index: 1000; text-decoration: none;
        }
        .back-button:hover{ transform: translateY(-5px); box-shadow: 0 8px 25px rgba(102,126,234,0.5); }

        /* 响应式 */
        @media (max-width: 768px) {
            .chem-title h1{ font-size: 2.1em; }
            .map-canvas{ height: 70vh; }
            .search-input{ width: 160px; }
        }

    <script>
        // 主题切换（继承站点逻辑）
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.replace('fa-moon','fa-sun');
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.replace('fa-moon','fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.replace('fa-sun','fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // =============== 化学思维导图数据 ===============
        // 说明：
        // - 以“第一性原理→高考核心”为主线，覆盖高考化学知识体系；
        // - 每个节点包含 name（名称）和可选 definition（定义），children 为子概念；
        // - 您可后续继续在相应分支增删节点，结构会自动渲染。
        const chemMindMap = {
            name: "化学的所有概念",
            definition: "以微观粒子与相互作用为本原，研究物质的组成、结构、性质及变化规律的科学。",
            children: [
                {
                    name: "物质与分类",
                    definition: "按组成与均一性将客体划分为纯净物和混合物；纯净物含固定化学式，混合物组分比可变。",
                    children: [
                        {
                            name: "物质",
                            definition: "具有一定质量和体积、能够占据空间的一切客观存在。",
                            children: [
                                { name: "纯净物", definition: "只含一种化学纯物质的样品，具有确定的化学式与性质。" ,
                                  children: [
                                      { name: "元素", definition: "具有相同核电荷数的一类原子的总称。化学变化中不能再分为更简单的物质。"},
                                      { name: "化合物", definition: "由两种或两种以上元素组成的纯净物，具有确定的组成比例与结构。"}
                                  ]
                                },
                                { name: "混合物", definition: "由两种或两种以上纯净物机械混合而成，组分比例可变，性质受组分影响。"}
                            ]
                        },
                        {
                            name: "变化类型",
                            definition: "从是否生成新物质区分物理变化与化学变化。",
                            children: [
                                { name: "物理变化", definition: "不生成新物质的变化，如状态、形态改变。" },
                                { name: "化学变化", definition: "生成新物质的变化，涉及化学键断裂与生成。" }
                            ]
                        },
                        {
                            name: "溶液与浓度",
                            definition: "溶质分散在溶剂中形成均相体系，常用浓度表示组成。",
                            children: [
                                { name: "溶质", definition: "被溶解的物质。" },
                                { name: "溶剂", definition: "起溶解作用并占多数的组分。" },
                                { name: "溶解度", definition: "在一定温度下，达到饱和时每100 g 溶剂所溶解溶质的质量。" },
                                { name: "质量分数 w", definition: "溶质质量与溶液质量之比，通常以百分数表示。" },
                                { name: "物质的量浓度 c", definition: "每升溶液所含溶质的物质的量（mol·L⁻¹）。" }
                            ]
                        }
                    ]
                },
                {
                    name: "原子结构与元素周期律",
                    definition: "原子的核电荷与核外电子排布决定微观结构；元素性质随周期与族呈规律变化。",
                    children: [
                        {
                            name: "原子",
                            definition: "由带正电的原子核与核外电子构成的中性微粒。",
                            children: [
                                { name: "核电荷数 Z", definition: "原子核所带正电荷数，等于核内质子数与核外电子数（中性原子）。" },
                                { name: "同位素", definition: "核电荷数相同而中子数不同的一组原子。" },
                                { name: "相对原子质量", definition: "以 12C 的质量的 1/12 为基准的原子平均质量（无量纲）。" },
                                { name: "电子排布", definition: "电子按能量由低到高占据轨道形成排布，如1s²2s²2p⁶…" },
                                { name: "价电子", definition: "参与化学反应、决定化学性质的最外层电子。"}
                            ]
                        },
                        {
                            name: "元素周期表",
                            definition: "按核电荷数递增排列，元素性质呈周期性变化的图表。",
                            children: [
                                { name: "周期", definition: "电子层数相同的横行。" },
                                { name: "族", definition: "最外层电子数相近、性质相近的纵列。" },
                                { name: "周期律", definition: "随 Z 增大，原子半径、电离能、电负性等呈周期变化。" },
                                { name: "金属性/非金属性", definition: "元素失电子/得电子倾向的强弱特征。" },
                                { name: "氧化数", definition: "用以表示元素在化合物或离子中得失电子数目的书写习惯。"}
                            ]
                        }
                    ]
                },
                {
                    name: "化学键与物质结构",
                    definition: "微粒间通过电子转移、共享或金属键合形成化学键及多种聚集状态，决定物质性质。",
                    children: [
                        {
                            name: "化学键",
                            definition: "使原子结合成分子或晶体的强相互作用。",
                            children: [
                                { name: "离子键", definition: "金属与非金属间通过电子转移形成阳/阴离子并由静电作用结合。" },
                                { name: "共价键", definition: "原子通过共享电子对形成的定向键；可分极性键与非极性键。" },
                                { name: "金属键", definition: "金属阳离子与离域电子之间的作用，解释延展性与导电性。" }
                            ]
                        },
                        {
                            name: "分子极性与作用力",
                            definition: "键极性与空间构型共同决定分子极性；分子间作用力影响熔/沸点等宏观性质。",
                            children: [
                                { name: "键极性", definition: "由成键原子电负性差异引起的电荷偏移。" },
                                { name: "分子极性", definition: "分子内电荷中心不重合导致的整体偶极矩。" },
                                { name: "氢键", definition: "H 与强电负性原子间的特殊作用力，显著提高沸点与粘度。" },
                                { name: "范德华力", definition: "瞬时偶极与诱导偶极引起的弱作用力。"}
                            ]
                        },
                        {
                            name: "晶体类型与性质",
                            definition: "微粒几何重复排列形成的固体；不同键型决定不同性质。",
                            children: [
                                { name: "离子晶体", definition: "阴阳离子构成，硬而脆、熔点高，熔融或水溶液能导电。" },
                                { name: "分子晶体", definition: "分子为结构单元，分子间作用力为主，熔点低，多为绝缘体。" },
                                { name: "原子晶体", definition: "共价键贯通全晶体，如金刚石、SiO₂，硬度大、熔点高。" },
                                { name: "金属晶体", definition: "金属阳离子与自由电子海，导电导热性优良。"}
                            ]
                        }
                    ]
                },
                {
                    name: "化学反应与能量",
                    definition: "反应本质为化学键断裂/生成与能量交换，守恒规律与热化学支配能量变化。",
                    children: [
                        { name: "化学方程式", definition: "用化学式与系数表示反应的定量表达，应遵循质量与电荷守恒。" },
                        { name: "反应类型", definition: "化合、分解、置换、复分解、氧化还原等类型。" },
                        { name: "反应热/焓变 ΔH", definition: "在规定条件下反应放出或吸收的热量；放热 ΔH<0，吸热 ΔH>0。" },
                        { name: "盖斯定律", definition: "反应焓变与途径无关，只与初末状态有关，可进行焓的代数加和。"}
                    ]
                },
                {
                    name: "反应速率与化学平衡",
                    definition: "速率描述单位时间内反应进程；平衡为可逆反应正逆速率相等的动态状态。",
                    children: [
                        { name: "反应速率", definition: "单位时间内反应物浓度的减少或生成物浓度的增加。" },
                        { name: "影响因素", definition: "浓度、温度、催化剂、接触面积等影响速率。" },
                        { name: "化学平衡", definition: "可逆反应在一定条件下正逆反应速率相等、宏观性质稳定的状态。" },
                        { name: "平衡常数 K", definition: "恒温下由平衡浓度比确定的常数，反映平衡位置。" },
                        { name: "勒夏特列原理", definition: "条件改变时，平衡将向抵消该改变的方向移动。"}
                    ]
                },
                {
                    name: "电化学与离子反应",
                    definition: "溶液中离子电离与迁移规律；氧化还原与电能/化学能的相互转化。",
                    children: [
                        {
                            name: "电解质与电离",
                            definition: "在水溶液或熔融状态下能导电的物质；电离生成离子。",
                            children: [
                                { name: "强电解质", definition: "在水中几乎完全电离（如强酸、强碱、可溶性盐）。" },
                                { name: "弱电解质", definition: "在水中部分电离（如弱酸、弱碱）。" },
                                { name: "电离方程式", definition: "用离子形式表示电解质电离过程的式子。" },
                                { name: "离子方程式", definition: "剔除未参与反应的旁观离子，保留实质反应粒子的方程式。" }
                            ]
                        },
                        {
                            name: "氧化还原反应",
                            definition: "伴随电子得失的反应；得电子为还原，失电子为氧化。",
                            children: [
                                { name: "氧化剂/还原剂", definition: "使他物氧化/还原且自身发生相反变化的物质。" },
                                { name: "电子守恒法", definition: "以电子转移守恒配平氧化还原反应的常用方法。"}
                            ]
                        },
                        {
                            name: "原电池与电解",
                            definition: "化学能与电能的转化装置与过程。",
                            children: [
                                { name: "原电池", definition: "自发氧化还原反应将化学能转化为电能的装置，阳极氧化、阴极还原。" },
                                { name: "电极反应式", definition: "分别表示阳极与阴极的半反应。" },
                                { name: "电解", definition: "外电源供能驱动非自发反应发生的过程。" }
                            ]
                        },
                        {
                            name: "水的电离与 pH",
                            definition: "水自电离生成 H⁺ 与 OH⁻；pH=−lg[H⁺] 表征溶液酸碱性。",
                            children: [
                                { name: "中性/酸性/碱性", definition: "[H⁺]=[OH⁻]/[H⁺]＞[OH⁻]/[H⁺]＜[OH⁻]。" },
                                { name: "盐类水解", definition: "某些盐的离子与水反应导致溶液呈酸或碱性。"}
                            ]
                        }
                    ]
                },
                {
                    name: "物质的量与化学计量",
                    definition: "以摩尔为桥梁实现微粒世界与宏观测量的转换，是化学计算的核心。",
                    children: [
                        { name: "物质的量 n", definition: "表示微粒多少的物理量，单位为摩尔（mol）。" },
                        { name: "阿伏加德罗常数 N_A", definition: "1 mol 任意微粒所含的基本微粒数（6.02×10²³·mol⁻¹）。" },
                        { name: "摩尔质量 M", definition: "每 mol 物质的质量（g·mol⁻¹）。" },
                        { name: "气体摩尔体积 V_m", definition: "同温同压下每 mol 气体所占体积（STP约22.4 L·mol⁻¹）。" },
                        { name: "守恒关系", definition: "质量守恒、电荷守恒、元素守恒、电子守恒。" },
                        { name: "计量计算", definition: "基于化学方程式量的关系进行的定量推算。"}
                    ]
                },
                {
                    name: "有机化学基础与高分子",
                    definition: "以碳为骨架的化合物及其反应规律；官能团决定性质与反应类型。",
                    children: [
                        {
                            name: "烃与衍生物",
                            definition: "只含 C、H 的烃与官能团取代后的化合物。",
                            children: [
                                { name: "烷烃（CnH2n+2）", definition: "饱和烃，特征反应为取代；构象与异构常见。" },
                                { name: "烯烃（CnH2n）", definition: "含C=C双键，易加成与加聚。" },
                                { name: "炔烃（CnH2n-2）", definition: "含C≡C三键，易加成。" },
                                { name: "芳香烃（如苯）", definition: "芳香性体系，典型反应为亲电取代。"},
                                { name: "卤代烃", definition: "烃基上的 H 被卤素取代，易发生取代/消去。" },
                                { name: "醇", definition: "含羟基（–OH），可发生氧化、酯化、脱水。" },
                                { name: "醛/酮", definition: "含 –CHO/羰基，醛具还原性（银镜/斐林）。" },
                                { name: "羧酸", definition: "含 –COOH，酸性，能与醇酯化生成酯。" },
                                { name: "酯", definition: "由酸与醇缩合并脱水形成，可水解。"}
                            ]
                        },
                        {
                            name: "同分异构与命名",
                            definition: "不同结构但组成相同称同分异构；系统命名遵循碳链主干与取代基定位规则。",
                            children: [
                                { name: "结构异构", definition: "碳骨架异构、官能团位置异构等。" },
                                { name: "几何/光学异构", definition: "因双键或手性中心导致的空间构型差异。" }
                            ]
                        },
                        {
                            name: "高分子与材料",
                            definition: "由大量小分子经聚合形成的大分子物质。",
                            children: [
                                { name: "加聚反应", definition: "不生成小分子，如乙烯 → 聚乙烯（PE）。" },
                                { name: "缩聚反应", definition: "生成小分子（如水/氨），如己二酸+己二胺→尼龙。" },
                                { name: "常见聚合物", definition: "PE、PP、PVC、PET、PA、PS等，广泛用于材料领域。"}
                            ]
                        }
                    ]
                },
                {
                    name: "无机化学元素及化合物",
                    definition: "常见主族/过渡元素的单质性质与重要化合物的制备与用途。",
                    children: [
                        {
                            name: "金属元素",
                            definition: "具有良好导电导热性与延展性的元素。",
                            children: [
                                { name: "Na 与化合物", definition: "活泼金属，与水反应放氢；NaOH 强碱；NaCl 常见盐。" },
                                { name: "Mg/Al 与化合物", definition: "两性氧化物/氢氧化物特征；铝热反应；Al 有致密氧化膜。" },
                                { name: "Fe 与化合物", definition: "铁的化合价+2/+3；Fe₂O₃/Fe₃O₄；防锈与合金。" },
                                { name: "Cu 与化合物", definition: "导电性好；CuO/Cu(OH)₂；与稀酸反应特征。"}
                            ]
                        },
                        {
                            name: "非金属元素",
                            definition: "得电子倾向较强，形成酸性氧化物与非金属氢化物等。",
                            children: [
                                { name: "H/O 与化合物", definition: "H₂、H₂O、H₂O₂；水的极性与氢键；过氧化物性质。" },
                                { name: "C 与化合物", definition: "C的同素异形体；CO/CO₂；碳酸盐与热分解。" },
                                { name: "N 与化合物", definition: "NH₃碱性与易溶性；HNO₃强氧化性；NO/NO₂转化。" },
                                { name: "S 与化合物", definition: "SO₂/SO₃；H₂SO₄强酸性与脱水性；接触法制酸原理。" },
                                { name: "Cl 与化合物", definition: "HCl 强酸；Cl₂氧化性；漂白与消毒。" },
                                { name: "Si 与化合物", definition: "SiO₂与硅酸盐；玻璃与陶瓷材料。"}
                            ]
                        }
                    ]
                },
                {
                    name: "实验与安全·数据处理",
                    definition: "规范的实验操作、安全防护与数据处理是获取可靠结论的保障。",
                    children: [
                        {
                            name: "常用操作",
                            definition: "加热、冷凝、蒸馏、萃取、过滤、洗涤、干燥与结晶等。",
                            children: [
                                { name: "仪器识别与连接", definition: "试管、烧瓶、冷凝管、滴定管、分液漏斗、干燥器等。" },
                                { name: "气体制备与检验", definition: "H₂、O₂、CO₂、NH₃等的制备与性质验证。" },
                                { name: "滴定分析", definition: "标准溶液、指示剂、读数方法与体积校正。"}
                            ]
                        },
                        {
                            name: "安全与环保",
                            definition: "穿戴防护、远离火源、规范标识、废液分类回收与中和处理。",
                            children: [
                                { name: "实验风险控制", definition: "腐蚀性、可燃性、毒性与强氧化性的风险识别与隔离。" },
                                { name: "有效数字与误差", definition: "读数规范，系统误差/偶然误差与不确定度估计。"}
                            ]
                        }
                    ]
                },
                {
                    name: "化学思想与方法",
                    definition: "模型建构、等级守恒、控制变量、定量推理与结构—性质关系等一般科学方法。",
                    children: [
                        { name: "结构—性质—应用", definition: "由微观结构推断宏观性质，并指导材料与工艺应用。" },
                        { name: "守恒与平衡思维", definition: "质量/电荷/元素/电子守恒与平衡移动规律贯穿解题。" },
                        { name: "控制变量法", definition: "研究多因素影响时，保持除一个变量外的其余变量不变。" },
                        { name: "图像与表格法", definition: "利用图像、表格归纳规律并提取定量关系。"}
                    ]
                }
            ]
        };

        // =============== 导图渲染 ===============
        const container = document.getElementById('mindmap');
        const tooltip = document.createElement('div');
        tooltip.className = 'node-tooltip';
        container.appendChild(tooltip);

        const detailTitle = document.getElementById('detailTitle');
        const detailBody  = document.getElementById('detailBody');

        const width  = container.clientWidth;
        const height = container.clientHeight;

        const svg = d3.select(container).append('svg')
            .attr('width', width).attr('height', height)
            .style('cursor','grab');

        const gZoom = svg.append('g');     // 缩放容器
        const gLink = gZoom.append('g').attr('class','links');
        const gNode = gZoom.append('g').attr('class','nodes');

        // 颜色映射：按第一层子类赋色
        const palette = d3.schemeSet2.concat(d3.schemeSet3);
        const categoryColor = new Map();

        // 径向树布局
        const radius = Math.min(width, height) / 2 - 30;
        const tree = d3.tree().size([2 * Math.PI, radius]);

        // 数据层级化
        const root = d3.hierarchy(chemMindMap);
        root.x0 = Math.PI; root.y0 = 0;

        // 默认折叠到第2层
        root.children?.forEach(collapseDeep);
        expandLevel(root, 2); // 展开前2层

        // 为第一层类别贴上颜色
        (root.children||[]).forEach((c, i) => categoryColor.set(c.data.name, palette[i % palette.length]));

        function collapseDeep(node){
            if(node.children){
                node._children = node.children;
                node._children.forEach(collapseDeep);
                node.children = null;
            }
        }
        function expand(node){
            if(node._children){ node.children = node._children; node._children = null; }
        }
        function expandAll(node){
            expand(node);
            (node.children||[]).forEach(expandAll);
        }
        function collapseToLevel(node, depth){
            if(node.depth >= depth && node.children){
                node._children = node.children; node.children = null;
            }
            (node.children||node._children||[]).forEach(n => collapseToLevel(n, depth));
        }
        function expandLevel(node, depth){
            if(node.depth < depth){ expand(node); (node.children||[]).forEach(n => expandLevel(n, depth)); }
        }

        // 坐标转换（极坐标 -> 笛卡尔）
        function project(x, y){
            const angle = x - Math.PI / 2;
            return [Math.cos(angle) * y, Math.sin(angle) * y];
        }

        // 缩放
        const zoom = d3.zoom().scaleExtent([0.3, 3]).on('zoom', (event) => {
            gZoom.attr('transform', event.transform);
        });
        svg.call(zoom);

        // 更新图
        function update(source) {
            const rootLayout = tree(root);

            const nodes = rootLayout.descendants();
            const links = rootLayout.links();

            // Links
            const link = gLink.selectAll('path.link').data(links, d => d.target.data.name + '-' + d.target.depth);

            link.join(
                enter => enter.append('path')
                    .attr('class', 'link base')
                    .attr('d', d3.linkRadial()
                        .angle(d => d.x)
                        .radius(d => d.y)
                    )
                    .attr('opacity', 0)
                    .transition().duration(350)
                    .attr('opacity', 1),
                update => update,
                exit => exit.transition().duration(250).attr('opacity',0).remove()
            );

            // Nodes
            const node = gNode.selectAll('g.node').data(nodes, d => d.data.name + '-' + d.depth);

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr('transform', d => {
                    const [x, y] = project(source.x0 ?? d.x, source.y0 ?? d.y);
                    return `translate(${x},${y})`;
                })
                .on('click', (_, d) => {
                    if (d.children) { d._children = d.children; d.children = null; }
                    else { d.children = d._children; d._children = null; }
                    update(d);
                })
                .on('mouseenter', (event, d) => {
                    const def = d.data.definition || '（暂无定义）';
                    tooltip.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${d.data.name}</div><div style="font-size:13px;line-height:1.5">${def}</div>`;
                    tooltip.style.display = 'block';
                })
                .on('mousemove', (event) => {
                    const pad = 14;
                    tooltip.style.left = (event.offsetX + pad) + 'px';
                    tooltip.style.top  = (event.offsetY + pad) + 'px';
                })
                .on('mouseleave', () => {
                    tooltip.style.display = 'none';
                })
                .on('contextmenu', (event, d) => {
                    event.preventDefault();
                    // 右键：更新侧栏详情
                    detailTitle.textContent = d.data.name;
                    detailBody.textContent  = d.data.definition || '（暂无定义）';
                });

            // 节点圈
            nodeEnter.append('circle')
                .attr('r', 0)
                .attr('fill', d => {
                    if(d.depth === 0) return '#764ba2';
                    if(d.depth === 1) return categoryColor.get(d.data.name) || '#667eea';
                    const p = d.ancestors().find(a=>a.depth===1);
                    return p ? (categoryColor.get(p.data.name) || '#667eea') : '#667eea';
                })
                .attr('stroke', 'white').attr('stroke-width', 1.2)
                .transition().duration(350).attr('r', 5.2);

            // 放大点击热区，提升可点性
            nodeEnter.append('circle')
                .attr('class','hit')
                .attr('r', 16);

            // 文本标签
            nodeEnter.append('text')
                .attr('class','label')
                .attr('dy','0.31em')
                .attr('x', d => d.x < Math.PI === !d.children ? 8 : -8)
                .attr('text-anchor', d => d.x < Math.PI === !d.children ? 'start' : 'end')
                .attr('transform', d => `rotate(${(d.x * 180/Math.PI) - 90}) translate(${d.children ? -6 : 6},0) rotate(${d.x >= Math.PI ? 180 : 0})`)
                .text(d => d.data.name)
                .attr('opacity', 0)
                .transition().duration(300).attr('opacity', 1);

            // 更新位置
            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition().duration(350)
                .attr('transform', d => {
                    const [x, y] = project(d.x, d.y);
                    return `translate(${x},${y})`;
                });

            // 记录旧位置
            nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });

            // 高亮保留（若搜索）
            refreshHighlights();
        }

        update(root);

        // 适配视窗
        function fitToScreen() {
            const bounds = gZoom.node().getBBox();
            const fullWidth = container.clientWidth;
            const fullHeight = container.clientHeight;
            const midX = bounds.x + bounds.width / 2;
            const midY = bounds.y + bounds.height / 2;

            if (bounds.width === 0 || bounds.height === 0) return;

            const scale = 0.86 / Math.max(bounds.width / fullWidth, bounds.height / fullHeight);
            const transform = d3.zoomIdentity.translate(fullWidth/2, fullHeight/2).scale(scale).translate(-midX, -midY);

            svg.transition().duration(480).call(zoom.transform, transform);
        }

        // 展开/折叠控制
        document.getElementById('expandAllBtn').addEventListener('click', () => { expandAll(root); update(root); setTimeout(fitToScreen, 40); });
        document.getElementById('collapseAllBtn').addEventListener('click', () => { collapseToLevel(root, 1); expandLevel(root, 1); update(root); setTimeout(fitToScreen, 40); });
        document.getElementById('fitBtn').addEventListener('click', fitToScreen);

        // 初始自适应
        setTimeout(fitToScreen, 60);
        window.addEventListener('resize', () => {
            // 简易响应处理：重设 SVG 尺寸并适配
            svg.attr('width', container.clientWidth).attr('height', container.clientHeight);
            setTimeout(fitToScreen, 60);
        });

        // 搜索高亮
        const searchInput = document.getElementById('searchInput');
        const searchBtn   = document.getElementById('searchBtn');
        const clearBtn    = document.getElementById('clearSearchBtn');
        let highlightNames = new Set();

        function clearHighlights(){
            highlightNames.clear();
            refreshHighlights();
        }
        function refreshHighlights(){
            // 链接高亮：如果其目标或源在高亮路径上则加亮
            const hlSet = new Set();
            if (highlightNames.size > 0){
                root.each(node => {
                    if (highlightNames.has(node.data.name)) {
                        node.ancestors().forEach(a => hlSet.add(a));
                        node.descendants().forEach(d => hlSet.add(d));
                    }
                });
            }
            gLink.selectAll('path.link')
                .attr('class', d => hlSet.has(d.source) && hlSet.has(d.target) ? 'link hl' : 'link base');

            gNode.selectAll('g.node').select('circle')
                .attr('stroke-width', d => highlightNames.has(d.data.name) ? 3 : 1.2)
                .attr('stroke', d => highlightNames.has(d.data.name) ? '#ffb142' : '#fff');
        }

        function ensureVisible(name){
            // 展开至包含该名称的节点
            let target = null;
            root.each(d => { if (d.data.name.toLowerCase() === name.toLowerCase()) target = d; });
            if (!target) return;

            // 逐层展开
            target.ancestors().forEach(a => {
                if (a._children){ a.children = a._children; a._children = null; }
            });
            update(target);

            // 平移至视野中心
            const [x, y] = project(target.x, target.y);
            const pt = d3.zoomTransform(svg.node()).apply([x, y]);
            const fullW = container.clientWidth, fullH = container.clientHeight;
            const t = d3.zoomTransform(svg.node());
            const desired = d3.zoomIdentity.translate(fullW/2 - (pt[0]-t.x), fullH/2 - (pt[1]-t.y)).scale(t.k);
            svg.transition().duration(480).call(zoom.transform, desired);
        }

        function doSearch(){
            const kw = (searchInput.value || '').trim().toLowerCase();
            clearHighlights();
            if (!kw) { return refreshHighlights(); }

            const hits = [];
            root.each(d => {
                const name = d.data.name?.toLowerCase() || '';
                const def  = d.data.definition?.toLowerCase() || '';
                if (name.includes(kw) || def.includes(kw)) hits.push(d);
            });
            if (hits.length === 0){
                detailTitle.textContent = '搜索结果';
                detailBody.textContent  = '未找到匹配项，请尝试其他关键词。';
                return;
            }
            hits.slice(0, 24).forEach(h => highlightNames.add(h.data.name));
            refreshHighlights();
            ensureVisible(hits[0].data.name);

            detailTitle.textContent = '搜索结果';
            detailBody.innerHTML = `共定位到 ${hits.length} 个相关概念，已高亮前 ${Math.min(24,hits.length)} 项。`;
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });
        clearBtn.addEventListener('click', ()=>{ searchInput.value=''; clearHighlights(); });

        // 初始详情
        detailTitle.textContent = chemMindMap.name;
        detailBody.textContent  = chemMindMap.definition;
    </script>
</body>
</html>
