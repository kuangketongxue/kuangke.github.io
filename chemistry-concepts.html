<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- SEO优化 -->
    <title>弄潮先锋营 - 前沿知识库 | 狂客空间</title>
    <meta name="description" content="弄潮先锋营 - 前沿知识点检索与学习平台">
    <meta name="keywords" content="知识库,检索,学习,前沿技术">
    <meta name="author" content="狂客">
    <meta name="robots" content="index, follow">
    <!-- 主题颜色 -->
    <meta name="theme-color" content="#000000">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <!-- 字体预加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Noto+Sans+SC:wght@100;200;300;400;500;600;700;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==================== CSS变量系统 ==================== */
        :root {
            /* 主题色 - 根据背景图片调整的暖金色系统 */
            --primary-gold: #E8B44C;
            --primary-gold-light: #F4D084;
            --primary-gold-dark: #C89A3C;
            --accent-gold: #FFF4D9;
            --shimmer-gold: #FFFAED;
            --warm-copper: #CD8B3C;
            --deep-bronze: #9A6F3E;
            /* 背景色 - 适配图片的深色调 */
            --bg-primary: #000000;
            --bg-secondary: #0F0F0F;
            --bg-tertiary: #1A1A1A;
            --bg-card: rgba(20, 25, 30, 0.88);
            --bg-card-hover: rgba(30, 35, 40, 0.94);
            --bg-overlay: rgba(15, 20, 25, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.03);
            /* 文字颜色 - 提升对比度 */
            --text-primary: #FFFFFF;
            --text-secondary: #E8E8E8;
            --text-tertiary: #C5C5C5;
            --text-muted: #8A8A8A;
            --text-gold: #E8B44C;
            --text-gold-light: #F4D084;
            --text-warm: #FFE6C7;
            /* 边框 - 暖色调边框 */
            --border-gold: rgba(232, 180, 76, 0.35);
            --border-gold-strong: rgba(232, 180, 76, 0.65);
            --border-warm: rgba(255, 230, 199, 0.15);
            --border-copper: rgba(205, 139, 60, 0.40);
            /* 阴影系统 - 增强深度 */
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.50);
            --shadow-medium: 0 8px 32px rgba(0, 0, 0, 0.60);
            --shadow-strong: 0 12px 48px rgba(0, 0, 0, 0.70);
            --shadow-gold: 0 4px 32px rgba(232, 180, 76, 0.25);
            --shadow-gold-strong: 0 8px 48px rgba(232, 180, 76, 0.40);
            --shadow-warm: 0 8px 32px rgba(255, 200, 100, 0.20);
            --text-shadow-subtle: 0 2px 8px rgba(0, 0, 0, 0.70);
            --text-shadow: 0 3px 16px rgba(0, 0, 0, 0.90);
            --text-shadow-strong: 0 4px 20px rgba(0, 0, 0, 1);
            --text-glow: 0 0 20px rgba(232, 180, 76, 0.30);
            /* 动画 */
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            /* 间距系统 */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 40px;
            --spacing-xl: 64px;
            --spacing-2xl: 96px;
            --spacing-3xl: 128px;
            /* 圆角 */
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            /* 字体 */
            --font-serif: 'Noto Serif SC', 'Georgia', 'Times New Roman', serif;
            --font-sans: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Noto Serif SC', serif;
            /* 字体大小 */
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            --text-4xl: 2.25rem;
            --text-5xl: 3rem;
            --text-6xl: 3.75rem;
            /* 字重 */
            --font-thin: 200;
            --font-light: 300;
            --font-normal: 400;
            --font-medium: 500;
            --font-semibold: 600;
            --font-bold: 700;
            --font-black: 900;
            /* 行高 */
            --leading-tight: 1.25;
            --leading-snug: 1.375;
            --leading-normal: 1.6;
            --leading-relaxed: 1.75;
            --leading-loose: 2;
        }
        /* ==================== 基础重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: var(--leading-normal);
            overflow-x: hidden;
            font-weight: var(--font-normal);
            letter-spacing: 0.01em;
        }
        /* ==================== 背景图片区域 - 优化叠加效果 ==================== */
        .hero-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: high-quality;
            -ms-interpolation-mode: bicubic;
            background:
                linear-gradient(180deg,
                    rgba(0, 0, 0, 0.45) 0%,
                    rgba(10, 15, 20, 0.60) 30%,
                    rgba(15, 20, 25, 0.70) 60%,
                    rgba(0, 0, 0, 0.80) 100%),
                linear-gradient(135deg,
                    rgba(232, 180, 76, 0.08) 0%,
                    transparent 40%,
                    rgba(205, 139, 60, 0.06) 100%),
                url('image/646319e1a90b5935aee2d99bf472021f.png');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 1;
            transform: translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            filter: contrast(1.15) brightness(0.85) saturate(1.10);
            -webkit-filter: contrast(1.15) brightness(0.85) saturate(1.10);
        }
        .hero-background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.01) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(255, 255, 255, 0.01) 3px
                );
            opacity: 0.3;
            pointer-events: none;
        }
        @media
            (-webkit-min-device-pixel-ratio: 2),
            (min-resolution: 192dpi) {
            .hero-background {
                background-image:
                    linear-gradient(180deg,
                        rgba(0, 0, 0, 0.45) 0%,
                        rgba(10, 15, 20, 0.60) 30%,
                        rgba(15, 20, 25, 0.70) 60%,
                        rgba(0, 0, 0, 0.80) 100%),
                    linear-gradient(135deg,
                        rgba(232, 180, 76, 0.08) 0%,
                        transparent 40%,
                        rgba(205, 139, 60, 0.06) 100%),
                    url('image/646319e1a90b5935aee2d99bf472021f.png');
            }
        }
        /* ==================== 顶部声明条 ==================== */
        .top-notice {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 20, 25, 0.92);
            border-bottom: 1px solid var(--border-gold);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            z-index: 100;
            padding: 14px 24px;
            text-align: center;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.40);
        }
        .notice-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .notice-text {
            color: var(--text-warm);
            font-weight: var(--font-medium);
            text-shadow: var(--text-shadow-subtle);
            letter-spacing: 0.05em;
        }
        .notice-close {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--text-gold);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--font-light);
        }
        .notice-close:hover {
            background: rgba(232, 180, 76, 0.25);
            border-color: var(--border-gold-strong);
            transform: rotate(90deg) scale(1.1);
            box-shadow: var(--shadow-gold);
        }
        .notice-hidden {
            display: none;
        }
        /* ==================== 主容器 ==================== */
        .main-wrapper {
            position: relative;
            z-index: 1;
            padding-top: 56px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }
        /* ==================== 页头 ==================== */
        .site-header {
            text-align: center;
            padding: var(--spacing-2xl) var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-warm);
            box-shadow: var(--shadow-strong);
            position: relative;
            overflow: hidden;
        }
        .site-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--primary-gold) 50%,
                transparent 100%);
            opacity: 0.6;
        }
        .site-title {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: var(--font-black);
            color: var(--primary-gold);
            letter-spacing: 0.08em;
            margin-bottom: var(--spacing-md);
            background: linear-gradient(135deg,
                #FFF4D9 0%,
                #E8B44C 20%,
                #FFFAED 40%,
                #F4D084 60%,
                #E8B44C 80%,
                #C89A3C 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 20px rgba(232, 180, 76, 0.50));
            animation: shimmer 5s ease-in-out infinite;
            line-height: var(--leading-tight);
            text-shadow: var(--text-glow);
        }
        @keyframes shimmer {
            0%, 100% {
                background-position: 0% center;
                filter: drop-shadow(0 4px 20px rgba(232, 180, 76, 0.50));
            }
            50% {
                background-position: 100% center;
                filter: drop-shadow(0 6px 28px rgba(244, 208, 132, 0.65));
            }
        }
        .site-subtitle {
            font-size: var(--text-xl);
            color: var(--text-warm);
            font-weight: var(--font-light);
            letter-spacing: 0.25em;
            text-shadow: var(--text-shadow);
            text-transform: uppercase;
            opacity: 0.95;
        }
        /* ==================== 优化后的返回链接按钮 ==================== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-warm);
            text-decoration: none;
            font-size: var(--text-base);
            margin-bottom: var(--spacing-lg);
            transition: var(--transition);
            text-shadow: var(--text-shadow-subtle);
            padding: 12px 28px;
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.15) 0%,
                rgba(232, 180, 76, 0.10) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 2px solid var(--border-gold);
            font-weight: var(--font-semibold);
            letter-spacing: 0.05em;
            box-shadow: var(--shadow-gold);
            position: relative;
            overflow: hidden;
        }
        .back-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        .back-link:hover::before {
            width: 300px;
            height: 300px;
        }
        .back-link:hover {
            color: var(--shimmer-gold);
            transform: translateX(-8px);
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.28) 0%,
                rgba(232, 180, 76, 0.18) 100%);
            border-color: var(--primary-gold-light);
            box-shadow: 0 8px 40px rgba(232, 180, 76, 0.50);
        }
        /* ==================== 统计面板 ==================== */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            text-align: center;
            transition: var(--transition);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-medium);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
            transition: var(--transition-slow);
        }
        .stat-card:hover {
            border-color: var(--border-gold-strong);
            background: var(--bg-card-hover);
            transform: translateY(-6px);
            box-shadow: var(--shadow-gold-strong);
        }
        .stat-card:hover::before {
            left: 100%;
        }
        .stat-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-sm);
            filter: drop-shadow(0 4px 12px rgba(232, 180, 76, 0.40));
        }
        .stat-value {
            font-family: var(--font-display);
            font-size: var(--text-5xl);
            font-weight: var(--font-bold);
            color: var(--primary-gold-light);
            margin-bottom: var(--spacing-sm);
            text-shadow: var(--text-shadow), var(--text-glow);
            line-height: var(--leading-tight);
            letter-spacing: 0.02em;
        }
        .stat-label {
            font-size: var(--text-base);
            color: var(--text-secondary);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-medium);
            letter-spacing: 0.05em;
        }
        .stat-date {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-top: var(--spacing-sm);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-light);
        }
        /* ==================== 搜索区域 ==================== */
        .search-section {
            margin-bottom: var(--spacing-2xl);
        }
        .search-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .search-box {
            position: relative;
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .search-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-lg);
            padding: 20px 28px;
            color: var(--text-primary);
            font-size: var(--text-lg);
            font-family: var(--font-sans);
            transition: var(--transition);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-normal);
            letter-spacing: 0.02em;
            box-shadow: var(--shadow-soft);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--border-gold-strong);
            background: var(--bg-card-hover);
            box-shadow: 0 0 0 3px rgba(232, 180, 76, 0.20), var(--shadow-gold);
        }
        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: var(--font-light);
            letter-spacing: 0.03em;
        }
        .search-btn {
            background: linear-gradient(135deg,
                var(--primary-gold-light) 0%,
                var(--primary-gold) 50%,
                var(--warm-copper) 100%);
            color: #1A1A1A;
            border: none;
            border-radius: var(--radius-lg);
            padding: 20px 40px;
            font-size: var(--text-lg);
            font-weight: var(--font-bold);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.08em;
            box-shadow: var(--shadow-gold);
            position: relative;
            overflow: hidden;
        }
        .search-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent);
            transition: var(--transition-slow);
        }
        .search-btn:hover::before {
            left: 100%;
        }
        .search-btn:hover {
            background: linear-gradient(135deg,
                var(--shimmer-gold) 0%,
                var(--primary-gold-light) 50%,
                var(--primary-gold) 100%);
            transform: translateY(-3px);
            box-shadow: var(--shadow-gold-strong);
        }
        .search-btn:active {
            transform: translateY(-1px);
        }
        .search-stats {
            text-align: center;
            color: var(--text-tertiary);
            font-size: var(--text-base);
            margin-bottom: var(--spacing-md);
            padding: 12px 24px;
            background: rgba(232, 180, 76, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-light);
            letter-spacing: 0.05em;
            border: 1px solid var(--border-warm);
        }
        .search-stats span {
            color: var(--text-gold-light);
            font-weight: var(--font-semibold);
            text-shadow: var(--text-glow);
        }
        /* ==================== 工具栏 ==================== */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-md);
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-warm);
            box-shadow: var(--shadow-soft);
        }
        .sort-controls {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
        }
        .sort-label {
            color: var(--text-secondary);
            font-size: var(--text-base);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-medium);
            letter-spacing: 0.05em;
        }
        .sort-btn {
            background: rgba(232, 180, 76, 0.08);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius);
            padding: 10px 20px;
            color: var(--text-secondary);
            font-size: var(--text-base);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-medium);
            letter-spacing: 0.03em;
        }
        .sort-btn:hover {
            border-color: var(--border-gold);
            color: var(--text-gold-light);
            background: rgba(232, 180, 76, 0.15);
        }
        .sort-btn.active {
            background: rgba(232, 180, 76, 0.28);
            border-color: var(--primary-gold);
            color: var(--primary-gold-light);
            font-weight: var(--font-semibold);
            box-shadow: var(--shadow-gold);
        }
        /* ==================== 分类过滤 ==================== */
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            justify-content: center;
            margin-bottom: var(--spacing-2xl);
            padding: var(--spacing-lg);
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-warm);
            box-shadow: var(--shadow-soft);
        }
        /* ==================== 优化后的过滤按钮样式 ==================== */
        .filter-btn {
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.10) 0%,
                rgba(232, 180, 76, 0.05) 100%);
            border: 2px solid var(--border-warm);
            border-radius: 25px;
            padding: 12px 28px;
            color: var(--text-secondary);
            font-size: var(--text-base);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-semibold);
            letter-spacing: 0.06em;
            position: relative;
            overflow: hidden;
        }
        .filter-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(232, 180, 76, 0.4), transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .filter-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        .filter-btn:hover {
            border-color: var(--border-gold);
            color: var(--text-gold-light);
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.20) 0%,
                rgba(232, 180, 76, 0.12) 100%);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(232, 180, 76, 0.35);
        }
        .filter-btn.active {
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.38) 0%,
                rgba(232, 180, 76, 0.28) 100%);
            border-color: var(--primary-gold);
            color: var(--shimmer-gold);
            font-weight: var(--font-bold);
            box-shadow: 0 6px 35px rgba(232, 180, 76, 0.50),
                        inset 0 1px 3px rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
        }
        /* ==================== 启发值筛选 ==================== */
        .inspiration-filter {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
        }
        .inspiration-label {
            color: var(--text-secondary);
            font-size: var(--text-base);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-medium);
            letter-spacing: 0.05em;
        }
        /* ==================== 优化后的启发值按钮样式 ==================== */
        .inspiration-btn {
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.10) 0%,
                rgba(232, 180, 76, 0.05) 100%);
            border: 2px solid var(--border-warm);
            border-radius: 20px;
            padding: 10px 20px;
            color: var(--text-secondary);
            font-size: var(--text-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-semibold);
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }
        .inspiration-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3), transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }
        .inspiration-btn:hover::before {
            width: 250px;
            height: 250px;
        }
        .inspiration-btn:hover {
            border-color: var(--border-gold);
            color: var(--text-gold-light);
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.18) 0%,
                rgba(232, 180, 76, 0.10) 100%);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 25px rgba(232, 180, 76, 0.30);
        }
        .inspiration-btn.active {
            background: linear-gradient(135deg,
                rgba(232, 180, 76, 0.35) 0%,
                rgba(232, 180, 76, 0.25) 100%);
            border-color: var(--primary-gold);
            color: var(--shimmer-gold);
            font-weight: var(--font-bold);
            box-shadow: 0 4px 30px rgba(232, 180, 76, 0.45),
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
        }
        /* ==================== 知识点列表 ==================== */
        .knowledge-list {
            display: grid;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-3xl);
        }
        .knowledge-item {
            background: var(--bg-card);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            box-shadow: var(--shadow-soft);
        }
        .knowledge-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--primary-gold) 50%,
                transparent 100%);
            opacity: 0;
            transition: var(--transition-slow);
        }
        .knowledge-item:hover {
            border-color: var(--border-gold-strong);
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-gold-strong);
        }
        .knowledge-item:hover::before {
            opacity: 1;
        }
        .knowledge-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
            gap: var(--spacing-md);
        }
        .knowledge-title {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            font-weight: var(--font-semibold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
            flex: 1;
            text-shadow: var(--text-shadow-subtle);
            line-height: var(--leading-snug);
            letter-spacing: 0.02em;
        }
        .knowledge-badges {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
        }
        .knowledge-category {
            display: inline-block;
            background: rgba(232, 180, 76, 0.25);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius);
            padding: 6px 16px;
            font-size: var(--text-sm);
            color: var(--text-gold-light);
            font-weight: var(--font-semibold);
            white-space: nowrap;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-shadow: var(--text-shadow-subtle);
            letter-spacing: 0.05em;
        }
        /* ==================== 启发值星级 ==================== */
        .inspiration-rating {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .star {
            color: var(--primary-gold-light);
            font-size: var(--text-base);
            filter: drop-shadow(0 2px 6px rgba(232, 180, 76, 0.70));
        }
        .star.empty {
            color: var(--text-muted);
            opacity: 0.25;
        }
        .knowledge-content {
            color: var(--text-secondary);
            font-size: var(--text-lg);
            line-height: var(--leading-relaxed);
            margin-bottom: var(--spacing-md);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-light);
            letter-spacing: 0.02em;
        }
        .knowledge-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            align-items: center;
        }
        .knowledge-tag {
            background: rgba(232, 180, 76, 0.10);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius);
            padding: 6px 14px;
            font-size: var(--text-sm);
            color: var(--text-tertiary);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-normal);
            letter-spacing: 0.03em;
            transition: var(--transition-fast);
        }
        .knowledge-tag:hover {
            border-color: var(--border-gold);
            color: var(--text-gold-light);
            background: rgba(232, 180, 76, 0.18);
        }
        .knowledge-date {
            color: var(--text-muted);
            font-size: var(--text-sm);
            margin-left: auto;
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-light);
            letter-spacing: 0.03em;
        }
        /* ==================== 空状态 ==================== */
        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl) 0;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-warm);
            box-shadow: var(--shadow-soft);
        }
        .empty-icon {
            font-size: 5rem;
            margin-bottom: var(--spacing-lg);
            opacity: 0.25;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.8));
        }
        .empty-text {
            color: var(--text-muted);
            font-size: var(--text-xl);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-light);
            letter-spacing: 0.05em;
        }
        /* ==================== 加载状态 ==================== */
        .loading {
            text-align: center;
            padding: var(--spacing-2xl) 0;
        }
        .loading-spinner {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-warm);
            border-top-color: var(--primary-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* ==================== 页脚 ==================== */
        .site-footer {
            border-top: 1px solid var(--border-warm);
            padding: var(--spacing-2xl) 0;
            text-align: center;
            margin-top: var(--spacing-3xl);
            background: var(--bg-card);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-strong);
        }
        .footer-title {
            font-family: var(--font-display);
            font-size: var(--text-3xl);
            color: var(--primary-gold-light);
            margin-bottom: var(--spacing-lg);
            font-weight: var(--font-semibold);
            text-shadow: var(--text-shadow), var(--text-glow);
            letter-spacing: 0.08em;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        .social-link {
            width: 56px;
            height: 56px;
            border: 1px solid var(--border-warm);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--text-2xl);
            transition: var(--transition);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(232, 180, 76, 0.08);
        }
        .social-link:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold-light);
            transform: translateY(-6px) scale(1.05);
            background: rgba(232, 180, 76, 0.20);
            box-shadow: var(--shadow-gold);
        }
        .copyright {
            color: var(--text-muted);
            font-size: var(--text-base);
            font-weight: var(--font-light);
            text-shadow: var(--text-shadow-subtle);
            letter-spacing: 0.05em;
        }
        /* ==================== 高亮显示 ==================== */
        .highlight {
            background: rgba(232, 180, 76, 0.35);
            color: var(--shimmer-gold);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            text-shadow: var(--text-shadow-subtle);
            font-weight: var(--font-semibold);
            box-shadow: 0 0 12px rgba(232, 180, 76, 0.25);
        }
        /* ==================== 返回顶部按钮 ==================== */
        .back-to-top {
            position: fixed;
            right: 40px;
            bottom: 40px;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg,
                var(--primary-gold-light) 0%,
                var(--primary-gold) 50%,
                var(--warm-copper) 100%);
            border: none;
            border-radius: 50%;
            color: #1A1A1A;
            font-size: var(--text-3xl);
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all var(--transition);
            box-shadow: var(--shadow-gold-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--font-black);
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-to-top:hover {
            background: linear-gradient(135deg,
                var(--shimmer-gold) 0%,
                var(--primary-gold-light) 50%,
                var(--primary-gold) 100%);
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 12px 56px rgba(232, 180, 76, 0.50);
        }
        .back-to-top:active {
            transform: translateY(-4px) scale(1.02);
        }
        /* ==================== 新增：右下角返回按钮（与返回顶部并排）==================== */
        .back-button {
            position: fixed;
            right: 120px;
            bottom: 40px;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg,
                rgba(100, 150, 255, 0.9) 0%,
                rgba(80, 120, 220, 0.9) 50%,
                rgba(60, 100, 200, 0.9) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #FFFFFF;
            font-size: var(--text-2xl);
            cursor: pointer;
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all var(--transition);
            box-shadow: 0 8px 32px rgba(80, 120, 220, 0.40);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--font-bold);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .back-button.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-button:hover {
            background: linear-gradient(135deg,
                rgba(120, 170, 255, 1) 0%,
                rgba(100, 150, 240, 1) 50%,
                rgba(80, 120, 220, 1) 100%);
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 12px 48px rgba(100, 150, 255, 0.60);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .back-button:active {
            transform: translateY(-4px) scale(1.02);
        }
        /* ==================== 移动端响应式优化 ==================== */
        @media (max-width: 768px) {
            :root {
                --spacing-xl: 48px;
                --spacing-2xl: 64px;
                --spacing-3xl: 80px;
            }
            .hero-background {
                background-attachment: scroll;
                background-size: cover;
                background-position: center center;
            }
            .container {
                padding: 0 20px;
            }
            .site-header {
                padding: var(--spacing-xl) var(--spacing-md);
            }
            .site-title {
                font-size: clamp(2rem, 8vw, 3rem);
                letter-spacing: 0.05em;
            }
            .site-subtitle {
                font-size: var(--text-base);
                letter-spacing: 0.15em;
            }
            .search-box {
                flex-direction: column;
                gap: var(--spacing-sm);
            }
            .search-btn {
                width: 100%;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: var(--spacing-md);
            }
            .sort-controls,
            .inspiration-filter {
                justify-content: center;
                flex-wrap: wrap;
            }
            .filter-section {
                gap: var(--spacing-sm);
                padding: var(--spacing-md);
            }
            .filter-btn {
                padding: 10px 20px;
                font-size: var(--text-sm);
            }
            .knowledge-header {
                flex-direction: column;
                gap: var(--spacing-sm);
            }
            .knowledge-badges {
                width: 100%;
                justify-content: space-between;
            }
            .knowledge-title {
                font-size: var(--text-xl);
            }
            .knowledge-content {
                font-size: var(--text-base);
            }
            .knowledge-date {
                margin-left: 0;
            }
            .back-to-top {
                right: 20px;
                bottom: 90px;
                width: 56px;
                height: 56px;
                font-size: var(--text-2xl);
            }
            .back-button {
                right: 20px;
                bottom: 20px;
                width: 56px;
                height: 56px;
                font-size: var(--text-xl);
            }
            .social-link {
                width: 48px;
                height: 48px;
                font-size: var(--text-xl);
            }
        }
        /* ==================== 滚动条美化 ==================== */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg,
                var(--primary-gold-light) 0%,
                var(--primary-gold) 50%,
                var(--warm-copper) 100%);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg,
                var(--shimmer-gold) 0%,
                var(--primary-gold-light) 50%,
                var(--primary-gold) 100%);
        }
        /* ==================== 选中文本样式 ==================== */
        ::selection {
            background: rgba(232, 180, 76, 0.40);
            color: var(--text-primary);
            text-shadow: var(--text-shadow-subtle);
        }
        ::-moz-selection {
            background: rgba(232, 180, 76, 0.40);
            color: var(--text-primary);
            text-shadow: var(--text-shadow-subtle);
        }
        /* ==================== 平滑进入动画 ==================== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .site-header,
        .stats-panel,
        .search-section,
        .toolbar,
        .filter-section,
        .knowledge-item {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        .stats-panel { animation-delay: 0.1s; }
        .search-section { animation-delay: 0.2s; }
        .toolbar { animation-delay: 0.3s; }
        .filter-section { animation-delay: 0.4s; }
    </style>
</head>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部">
        ↑

        ←
    </button>
    <script>
        'use strict';
        // ==================== 知识库管理类 ====================
        class KnowledgeBase {
            constructor() {
                this.data = [];
                this.filteredData = [];
                this.currentCategory = 'all';
                this.currentSort = 'date';
                this.currentStarFilter = 'all';
                this.searchQuery = '';
                // DOM 元素
                this.searchInput = document.getElementById('searchInput');
                this.searchBtn = document.getElementById('searchBtn');
                this.filterSection = document.getElementById('filterSection');
                this.knowledgeList = document.getElementById('knowledgeList');
                this.searchStats = document.getElementById('searchStats');
                this.totalCount = document.getElementById('totalCount');
                // 统计面板元素
                this.totalKnowledge = document.getElementById('totalKnowledge');
                this.avgInspiration = document.getElementById('avgInspiration');
                this.lastUpdate = document.getElementById('lastUpdate');
                this.lastUpdateFull = document.getElementById('lastUpdateFull');
                this.init();
            }
            async init() {
                await this.loadData();
                this.setupEventListeners();
                this.renderFilters();
                this.updateStats();
                this.renderList();
            }
            // 加载数据
            async loadData() {
                try {
                    const response = await fetch('knowledge-data.json');
                    if (!response.ok) {
                        throw new Error('数据加载失败');
                    }
                    this.data = await response.json();
                    this.filteredData = [...this.data];
                    this.totalCount.textContent = this.data.length;
                } catch (error) {
                    console.error('加载数据失败:', error);
                    this.showError('数据加载失败,请刷新页面重试');
                }
            }
            // 更新统计信息
            updateStats() {
                // 知识点总数
                this.totalKnowledge.textContent = this.data.length;
                // 计算平均启发值
                if (this.data.length > 0) {
                    const totalInspiration = this.data.reduce((sum, item) => {
                        return sum + (item.inspiration || 0);
                    }, 0);
                    const average = (totalInspiration / this.data.length).toFixed(1);
                    this.avgInspiration.textContent = average;
                } else {
                    this.avgInspiration.textContent = '0';
                }
                // 最新更新时间
                const dates = this.data
                    .map(item => item.date)
                    .filter(Boolean)
                    .sort((a, b) => new Date(b) - new Date(a));
                if (dates.length > 0) {
                    const latestDate = new Date(dates[0]);
                    this.lastUpdate.textContent = this.formatShortDate(latestDate);
                    this.lastUpdateFull.textContent = this.formatFullDate(latestDate);
                } else {
                    this.lastUpdate.textContent = '-';
                    this.lastUpdateFull.textContent = '暂无更新记录';
                }
            }
            // 格式化短日期
            formatShortDate(date) {
                const now = new Date();
                const diff = now - date;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                if (days === 0) return '今天';
                if (days === 1) return '昨天';
                if (days < 7) return `${days}天前`;
                if (days < 30) return `${Math.floor(days / 7)}周前`;
                if (days < 365) return `${Math.floor(days / 30)}月前`;
                return `${Math.floor(days / 365)}年前`;
            }
            // 格式化完整日期
            formatFullDate(date) {
                return date.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }
            // 设置事件监听
            setupEventListeners() {
                // 搜索按钮
                this.searchBtn.addEventListener('click', () => this.handleSearch());
                // 回车搜索
                this.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.handleSearch();
                    }
                });
                // 实时搜索(输入延迟)
                let searchTimeout;
                this.searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        this.searchQuery = e.target.value.trim();
                        this.filterAndRender();
                    }, 300);
                });
                // 排序按钮
                document.querySelectorAll('.sort-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.currentSort = e.target.dataset.sort;
                        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.filterAndRender();
                    });
                });
                // 启发值筛选按钮
                document.querySelectorAll('.inspiration-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.currentStarFilter = e.target.dataset.stars;
                        document.querySelectorAll('.inspiration-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.filterAndRender();
                    });
                });
            }
            // 处理搜索
            handleSearch() {
                this.searchQuery = this.searchInput.value.trim();
                this.filterAndRender();
            }
            // 渲染分类过滤按钮
            renderFilters() {
                const categories = new Set(['all']);
                this.data.forEach(item => {
                    if (item.category) {
                        categories.add(item.category);
                    }
                });
                const categoryNames = {
                    'all': '全部',
                    'ai': 'AI技术',
                    'programming': '编程开发',
                    'design': '设计创意',
                    'business': '商业思维',
                    'learning': '学习方法',
                    'tool': '工具应用',
                    'other': '其他'
                };
                this.filterSection.innerHTML = Array.from(categories).map(cat => `
                    <button
                        class="filter-btn ${cat === this.currentCategory ? 'active' : ''}"
                        data-category="${cat}"
                    >
                        ${categoryNames[cat] || cat}
                    </button>
                `).join('');
                // 绑定分类点击事件
                this.filterSection.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.currentCategory = e.target.dataset.category;
                        this.filterAndRender();
                        // 更新按钮状态
                        this.filterSection.querySelectorAll('.filter-btn').forEach(b => {
                            b.classList.remove('active');
                        });
                        e.target.classList.add('active');
                    });
                });
            }
            // 过滤并渲染
            filterAndRender() {
                this.filteredData = this.data.filter(item => {
                    // 分类过滤
                    const categoryMatch = this.currentCategory === 'all' ||
                                        item.category === this.currentCategory;
                    // 启发值过滤
                    let starMatch = true;
                    if (this.currentStarFilter !== 'all') {
                        const minStars = parseInt(this.currentStarFilter);
                        const itemStars = item.inspiration || 0;
                        starMatch = itemStars >= minStars;
                    }
                    // 搜索过滤
                    if (!this.searchQuery) {
                        return categoryMatch && starMatch;
                    }
                    const query = this.searchQuery.toLowerCase();
                    const titleMatch = item.title.toLowerCase().includes(query);
                    const contentMatch = item.content.toLowerCase().includes(query);
                    const tagsMatch = item.tags && item.tags.some(tag =>
                        tag.toLowerCase().includes(query)
                    );
                    return categoryMatch && starMatch && (titleMatch || contentMatch || tagsMatch);
                });
                // 排序
                this.sortData();
                this.renderList();
            }
            // 排序数据
            sortData() {
                if (this.currentSort === 'date') {
                    this.filteredData.sort((a, b) => {
                        const dateA = new Date(a.date || '1970-01-01');
                        const dateB = new Date(b.date || '1970-01-01');
                        return dateB - dateA;
                    });
                } else if (this.currentSort === 'inspiration') {
                    this.filteredData.sort((a, b) => {
                        const insA = a.inspiration || 0;
                        const insB = b.inspiration || 0;
                        return insB - insA;
                    });
                }
            }
            // 渲染知识点列表
            renderList() {
                if (this.filteredData.length === 0) {
                    this.showEmpty();
                    return;
                }
                this.knowledgeList.innerHTML = this.filteredData.map(item => {
                    const highlightedTitle = this.highlightText(item.title);
                    const highlightedContent = this.highlightText(item.content);
                    const stars = this.renderStars(item.inspiration || 0);
                    return `
                        <article class="knowledge-item">
                            <div class="knowledge-header">
                                <h3 class="knowledge-title">${highlightedTitle}</h3>
                                <div class="knowledge-badges">
                                    <span class="knowledge-category">${this.getCategoryName(item.category)}</span>
                                    ${stars}
                                </div>
                            </div>
                            <div class="knowledge-content">${highlightedContent}</div>
                            <div class="knowledge-meta">
                                ${item.tags ? item.tags.map(tag =>
                                    `<span class="knowledge-tag">${tag}</span>`
                                ).join('') : ''}
                                ${item.date ? `<span class="knowledge-date">${this.formatFullDate(new Date(item.date))}</span>` : ''}
                            </div>
                        </article>
                    `;
                }).join('');
                // 更新统计信息
                const resultText = this.searchQuery || this.currentStarFilter !== 'all' || this.currentCategory !== 'all' ?
                    `找到 <span>${this.filteredData.length}</span> 个相关结果` :
                    `共收录 <span>${this.data.length}</span> 个知识点`;
                this.searchStats.innerHTML = resultText;
            }
            // 渲染星级
            renderStars(count) {
                if (count === 0) return '';
                const maxStars = 5;
                let starsHtml = '<div class="inspiration-rating">';
                for (let i = 1; i <= maxStars; i++) {
                    starsHtml += `<span class="star ${i <= count ? '' : 'empty'}">★</span>`;
                }
                starsHtml += '</div>';
                return starsHtml;
            }
            // 高亮文本
            highlightText(text) {
                if (!this.searchQuery) return text;
                const regex = new RegExp(`(${this.searchQuery})`, 'gi');
                return text.replace(regex, '<span class="highlight">$1</span>');
            }
            // 获取分类名称
            getCategoryName(category) {
                const names = {
                    'ai': 'AI技术',
                    'programming': '编程开发',
                    'design': '设计创意',
                    'business': '商业思维',
                    'learning': '学习方法',
                    'tool': '工具应用',
                    'other': '其他'
                };
                return names[category] || category;
            }
            // 显示空状态
            showEmpty() {
                this.knowledgeList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p class="empty-text">
                            ${this.searchQuery ? '未找到相关知识点' : '暂无知识点'}
                        </p>
                    </div>
                `;
            }
            // 显示错误
            showError(message) {
                this.knowledgeList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p class="empty-text">${message}</p>
                    </div>
                `;
            }
        }
        // ==================== 顶部声明管理 ====================
        class NoticeManager {
            constructor() {
                this.notice = document.getElementById('topNotice');
                this.closeBtn = document.getElementById('noticeClose');
                this.init();
            }
            init() {
                if (!this.notice || !this.closeBtn) return;
                if (localStorage.getItem('knowledgeNoticeClose') === 'true') {
                    this.hide();
                    return;
                }
                this.closeBtn.addEventListener('click', () => this.close());
                setTimeout(() => this.close(), 10000);
            }
            close() {
                localStorage.setItem('knowledgeNoticeClose', 'true');
                this.hide();
            }
            hide() {
                if (this.notice) {
                    this.notice.classList.add('notice-hidden');
                    document.querySelector('.main-wrapper').style.paddingTop = '0';
                }
            }
        }
        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            new NoticeManager();
            new KnowledgeBase();
            // 返回顶部按钮
            const backToTopBtn = document.getElementById('backToTop');
            const backButton = document.getElementById('backButton');
            
            // 监听滚动事件
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    if (window.pageYOffset > 300) {
                        backToTopBtn.classList.add('visible');
                        backButton.classList.add('visible');
                    } else {
                        backToTopBtn.classList.remove('visible');
                        backButton.classList.remove('visible');
                    }
                }, 100);
            });
            // 点击返回顶部
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            // 点击返回上一页
            backButton.addEventListener('click', () => {
                // 优先使用浏览器历史记录返回
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    // 如果没有历史记录,跳转到首页
                    window.location.href = 'index.html';
                }
            });
            // 平滑滚动
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });
    </script>
