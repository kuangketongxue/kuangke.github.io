    <style>

            max-width: 1400px;
            margin: 80px auto 60px;
            padding: 40px 20px;
        }

        .page-header {

            margin-bottom: 15px;

        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .page-header p {
            font-size: 1.2em;
            color: #666;
            opacity: 0.9;
        }

        body.dark-mode .page-header p {
            color: #aaa;
        }

        /* 控制面板 */

            display: flex;
            justify-content: center;

            gap: 15px;
            margin-bottom: 40px;

        }

        .control-btn {

            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {

            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .control-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .control-btn i {
            margin-right: 8px;
            position: relative;
            z-index: 1;
        }

        .control-btn span {
            position: relative;
            z-index: 1;
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .zoom-control {
            background: #2d3748;
        }

        .zoom-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2em;
            position: relative;
            overflow: hidden;
        }

        .zoom-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .zoom-btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .zoom-btn:hover {
            transform: scale(1.1);
        }

        .zoom-display {
            font-weight: 600;
            color: #333;
            min-width: 60px;
            text-align: center;
        }

        body.dark-mode .zoom-display {
            color: #fff;
        }

        /* 思维导图容器 */
        .mindmap-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: auto;
            position: relative;
            min-height: 800px;
        }

        body.dark-mode .mindmap-container {
            background: #2d3748;
        }

        .mindmap-wrapper {
            transform-origin: top left;
            transition: transform 0.3s ease;
        }

        /* 根节点 */
        .root-node {
            text-align: center;
            margin: 0 auto 60px;
            width: fit-content;
        }

        .root-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 50px;
            border-radius: 50px;
            font-size: 2em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .root-bubble::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .root-bubble:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        /* 一级分支 */
        .level-1-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .level-1-node {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        body.dark-mode .level-1-node {
            background: linear-gradient(135deg, #3a4556 0%, #2d3748 100%);
        }

        .level-1-node:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .level-1-title {
            font-size: 1.6em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        body.dark-mode .level-1-title {
            color: #fff;
        }

        .level-1-icon {
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .collapse-icon {
            margin-left: auto;
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }

        .collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        /* 二级分支 */
        .level-2-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .collapsed .level-2-container {
            max-height: 0;
        }

        .level-2-node {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        body.dark-mode .level-2-node {
            background: #1a202c;
        }

        .level-2-node:hover {
            transform: translateX(10px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.2);
        }

        .level-2-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .level-2-icon {
            font-size: 0.9em;
        }

        /* 三级内容(概念定义) */

            margin-top: 10px;
            padding-left: 20px;
            border-left: 3px solid #667eea;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .level-2-node.expanded .level-3-container {
            max-height: 10000px;
            padding-top: 10px;
            padding-bottom: 10px;

        .concept-definition {

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            border: none;
            padding: 15px 30px;

        .search-btn::before {

            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;

        .search-btn:hover::before {

        .search-btn:hover {

        }

            position: relative;

        }

        /* 返回按钮 */
        .back-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;

            font-size: 24px;

            z-index: 1000;
            text-decoration: none;

            overflow: hidden;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;

            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .back-button:hover::before {
            width: 150px;
            height: 150px;
        }

        .back-button:hover {
            transform: translateY(-5px) rotate(360deg);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .back-button i {
            position: relative;
            z-index: 1;
        }

        /* 加载提示 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        body.dark-mode .loading-overlay {
            background: rgba(45, 55, 72, 0.9);
        }

        .loading-content {
            text-align: center;
            color: #667eea;
        }

        .loading-content i {
            font-size: 3em;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-content p {
            margin-top: 20px;
            font-size: 1.2em;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2em;
            }

            .level-1-container {
                grid-template-columns: 1fr;

            }

            .mindmap-container {
                padding: 20px;
            }

            .control-panel {
                flex-direction: column;
            }
        }

        /* 高亮效果 */
        .highlight {
            animation: highlightPulse 1s ease-in-out 3;
        }

        @keyframes highlightPulse {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 235, 59, 0.3); }
        }
    </style>
</head>

                </div>

                <!-- 一级分支容器 - 将由JavaScript动态生成 -->

    <script>
        // Markdown文件路径
        const MD_FILE_PATH = 'chemistry-concepts.md';

        // 从MD文件加载并渲染内容
        async function loadChemistryConcepts() {
            try {
                const response = await fetch(MD_FILE_PATH);
                if (!response.ok) {
                    throw new Error('无法加载概念文件');
                }
                const markdown = await response.text();
                parseAndRenderConcepts(markdown);
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('conceptContainer').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3em; margin-bottom: 20px;"></i>
                        <p>加载概念数据失败,请检查 chemistry-concepts.md 文件是否存在</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">错误信息: ${error.message}</p>
                    </div>
                `;
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // 解析MD并渲染为HTML
        function parseAndRenderConcepts(markdown) {
            const container = document.getElementById('conceptContainer');
            const lines = markdown.split('\n');
            let html = '';
            let currentLevel1 = null;
            let currentLevel2 = null;
            let level1Id = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                // 一级标题 (## 标题)
                if (line.startsWith('## ')) {
                    if (currentLevel1) {
                        html += '</div></div></div>'; // 关闭前一个一级节点
                    }
                    const titleMatch = line.match(/## (.+?) - (.+)/);
                    if (titleMatch) {
                        const icon = titleMatch[1].trim();
                        const title = titleMatch[2].trim();
                        level1Id++;
                        html += `
                            <div class="level-1-node" id="level1-${level1Id}">
                                <div class="level-1-title" onclick="toggleLevel1(this)">
                                    <span class="level-1-icon">${icon}</span>
                                    ${title}
                                    <span class="collapse-icon"><i class="fas fa-chevron-down"></i></span>
                                </div>
                                <div class="level-2-container">
                        `;
                        currentLevel1 = true;
                        currentLevel2 = null;
                    }
                }
                // 二级标题 (### 标题)
                else if (line.startsWith('### ')) {
                    if (currentLevel2) {
                        html += '</div></div>'; // 关闭前一个二级节点
                    }
                    const titleMatch = line.match(/### (.+?) (.+)/);
                    if (titleMatch) {
                        const icon = titleMatch[1].trim();
                        const title = titleMatch[2].trim();
                        html += `
                            <div class="level-2-node" onclick="toggleLevel2(this)">
                                <div class="level-2-title">
                                    <span class="level-2-icon">${icon}</span>
                                    ${title}
                                </div>
                                <div class="level-3-container">
                        `;
                        currentLevel2 = true;
                    }
                }
                // 概念项 (#### 概念名)
                else if (line.startsWith('#### ')) {
                    const conceptName = line.replace('#### ', '').trim();
                    let definition = '';
                    // 读取定义内容直到遇到下一个标题或空行
                    i++;
                    while (i < lines.length) {
                        const defLine = lines[i].trim();
                        if (defLine.startsWith('#') || (defLine === '' && lines[i + 1]?.trim().startsWith('#'))) {
                            i--;
                            break;
                        }
                        if (defLine) {
                            definition += defLine + '\n';
                        }
                        i++;
                    }
                    // 使用marked.js渲染markdown
                    const renderedDefinition = marked.parse(definition);
                    html += `
                        <div class="concept-item">
                            <div class="concept-name">${conceptName}</div>
                            <div class="concept-definition">${renderedDefinition}</div>
                        </div>
                    `;
                }
            }

            // 关闭最后的节点
            if (currentLevel2) {
                html += '</div></div>';
            }
            if (currentLevel1) {
                html += '</div></div>';
            }

            container.innerHTML = html;
        }

        // 缩放功能
        let currentZoom = 100;
        const wrapper = document.getElementById('mindmapWrapper');
        const zoomDisplay = document.getElementById('zoomDisplay');

        function zoomIn() {
            if (currentZoom < 200) {
                currentZoom += 10;
                updateZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 50) {
                currentZoom -= 10;
                updateZoom();
            }
        }

        function resetZoom() {
            currentZoom = 100;
            updateZoom();
        }

        function updateZoom() {
            wrapper.style.transform = `scale(${currentZoom / 100})`;
            zoomDisplay.textContent = currentZoom + '%';
        }

        // 展开/收起一级节点
        function toggleLevel1(element) {
            const node = element.parentElement;
            node.classList.toggle('collapsed');
        }

        // 展开/收起二级节点
        function toggleLevel2(element) {
            element.classList.toggle('expanded');
        }

        // 全部展开
        function expandAll() {
            document.querySelectorAll('.level-1-node').forEach(node => {
                node.classList.remove('collapsed');
            });
            document.querySelectorAll('.level-2-node').forEach(node => {
                node.classList.add('expanded');
            });
        }

        // 全部收起
        function collapseAll() {
            document.querySelectorAll('.level-1-node').forEach(node => {
                node.classList.add('collapsed');
            });
            document.querySelectorAll('.level-2-node').forEach(node => {
                node.classList.remove('expanded');
            });
        }

        // 搜索功能
        function searchConcept() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!searchTerm) {
                alert('请输入搜索内容');
                return;
            }

            // 移除之前的高亮
            document.querySelectorAll('.highlight').forEach(el => {
                el.classList.remove('highlight');
            });

            let found = false;
            let firstMatch = null;

            const concepts = document.querySelectorAll('.concept-item');
            concepts.forEach(concept => {
                const name = concept.querySelector('.concept-name').textContent.toLowerCase();
                const definition = concept.querySelector('.concept-definition').textContent.toLowerCase();

                if (name.includes(searchTerm) || definition.includes(searchTerm)) {
                    found = true;
                    // 展开所有父节点
                    let parent = concept.closest('.level-2-node');
                    if (parent) {
                        parent.classList.add('expanded');
                        let level1 = parent.closest('.level-1-node');
                        if (level1) {
                            level1.classList.remove('collapsed');
                        }
                    }

                    // 高亮
                    concept.classList.add('highlight');

                    // 记录第一个匹配项
                    if (!firstMatch) {
                        firstMatch = concept;
                    }
                }
            });

            if (found && firstMatch) {
                firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                alert('未找到相关概念');
            }
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchConcept();
            }
        });

        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // 页面加载时加载概念
        window.addEventListener('load', () => {
            loadChemistryConcepts();
        });
    </script>
</body>
</html>
