      --primary-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-grad: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);

      --brand-1: #667eea;
      --brand-2: #764ba2;
      --accent: #43e97b;
      --accent-2: #38f9d7;
      --chip-bg: rgba(102, 126, 234, 0.1);

    html, body {
      margin: 0;
      padding: 0;
      background: #f7f8fc;
      color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;

      background: #0f172a;

    }

    /* 顶部导航（与原站布局相似，若有 style.css 将自动融合） */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(102, 126, 234, 0.15);
    }
    body.dark-mode .header {
      background: rgba(17, 24, 39, 0.75);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .header .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 10px 0 0;
      letter-spacing: 1px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: var(--primary-grad);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .theme-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(102, 126, 234, 0.45);
    }

    /* 顶部链接（延续原站风格的彩色胶囊） */
    .success-link, .breakthrough-link, .sky-link, .exam-link, .video-link, .game-link, .home-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.5);
      background: #ffffff;
      box-shadow: 0 6px 16px var(--shadow-1);
      transition: all 0.2s ease;
    }
    body.dark-mode .success-link, body.dark-mode .breakthrough-link,
    body.dark-mode .sky-link, body.dark-mode .exam-link,
    body.dark-mode .video-link, body.dark-mode .game-link, body.dark-mode .home-link {
      background: #1f2937;
      border-color: rgba(255,255,255,0.06);
    }
    .success-link:hover, .breakthrough-link:hover, .sky-link:hover, .exam-link:hover, .video-link:hover, .game-link:hover, .home-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px var(--shadow-2);
    }
    .success-icon, .breakthrough-icon, .sky-icon, .exam-icon, .video-icon, .game-icon, .home-icon {
      margin-right: 8px;
      color: white;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      font-size: 14px;
    }
    .success-icon { background: linear-gradient(135deg, #06beb6, #48b1bf); }
    .sky-icon { background: linear-gradient(135deg, #f7971e, #ffd200); }
    .exam-icon { background: linear-gradient(135deg, #84fab0, #8fd3f4); }
    .video-icon { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
    .home-icon { background: linear-gradient(135deg, #667eea, #764ba2); }
    .success-text, .breakthrough-text, .sky-text, .exam-text, .video-text, .game-text, .home-text {

      font-weight: 600;
      font-size: 14px;

    body.dark-mode .success-text, body.dark-mode .breakthrough-text,
    body.dark-mode .sky-text, body.dark-mode .exam-text,
    body.dark-mode .video-text, body.dark-mode .game-text, body.dark-mode .home-text {
      color: #e5e7eb;
    }
    /* 自学突围、游戏 链接的专属样式沿用您原页 */

      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
      border: none;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);

    .breakthrough-text { color: #fff; font-weight: 700; }
    .game-link {
      background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);

      box-shadow: 0 4px 0 #c44569, 0 4px 10px rgba(0,0,0,0.2);

    body.dark-mode .game-link {

      box-shadow: 0 4px 0 #ff4757, 0 4px 10px rgba(0,0,0,0.4);
    }

    /* 页面标题区 */
    .map-container {
      max-width: 1200px;
      margin: 80px auto 60px;
      padding: 0 20px 30px;
    }

      text-align: center;
      margin-bottom: 24px;
    }
    .matrix-title h1 {
      font-size: 2.6em;
      margin: 0 0 12px;
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

    }
    .matrix-title p {
      margin: 0 auto;
      color: var(--text-2);
      opacity: 0.85;
      font-size: 1.05em;
      max-width: 780px;
    }
    body.dark-mode .matrix-title p { color: #a3a3a3; }

    /* 操作条 */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px auto;
      max-width: 1200px;
      flex-wrap: wrap;

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tool-card {
      background: var(--card-grad);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 8px 26px var(--shadow-1);
      display: flex;
      align-items: center;
      gap: 10px;

    body.dark-mode .tool-card {

      box-shadow: 0 8px 28px rgba(0,0,0,0.45);

    .chip {
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--chip-bg);
      color: #334155;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn {

      border-radius: 10px;

      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(102,126,234,.45); }
    .btn.secondary {
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      box-shadow: 0 10px 24px rgba(67, 233, 123, 0.35);
    }
    .btn.light {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      color: #374151;
      box-shadow: 0 10px 24px rgba(168, 237, 234, 0.4);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search input {
      height: 40px;
      width: 260px;
      border: 1px solid rgba(102,126,234,0.2);
      border-radius: 10px;
      outline: none;
      padding: 0 12px;
      background: #fff;
      color: var(--text-1);

    body.dark-mode .search input {
      background: #1f2937;
      color: #e5e7eb;
      border-color: rgba(255,255,255,0.06);
    }

    /* 思维导图画布容器 */
    .mindmap-wrap {
      position: relative;
      background: radial-gradient(1200px 600px at 50% -200px, rgba(102, 126, 234, 0.15), transparent 60%) ,

      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      height: 72vh;
      min-height: 560px;
    }
    body.dark-mode .mindmap-wrap {
      background: radial-gradient(1200px 600px at 50% -200px, rgba(102, 126, 234, 0.15), transparent 60%) ,
                  radial-gradient(800px 600px at 120% 20%, rgba(118, 75, 162, 0.18), transparent 60%),
                  #0b1220;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    svg {
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      cursor: grab;
    }
    svg:active { cursor: grabbing; }

    /* 节点样式 */
    .node circle {
      fill: #ffffff;
      stroke: rgba(102,126,234,0.9);
      stroke-width: 2;
      filter: drop-shadow(0 4px 10px rgba(102, 126, 234, 0.25));
      transition: transform .15s ease;
    }
    body.dark-mode .node circle { fill: #1f2937; stroke: #7c93ff; }
    .node:hover circle { transform: scale(1.06); }
    .node text {
      font-size: 12px;
      font-weight: 700;
      fill: #334155;
      paint-order: stroke;
      stroke: rgba(255,255,255,0.7);
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    body.dark-mode .node text { fill: #e2e8f0; stroke: rgba(0,0,0,0.45); }

    .link {
      fill: none;
      stroke: rgba(102, 126, 234, 0.35);
      stroke-width: 1.8px;
    }
    body.dark-mode .link { stroke: rgba(124, 147, 255, 0.45); }

    .node.highlight circle {
      stroke: #22c55e !important;
      stroke-width: 3;
      filter: drop-shadow(0 6px 16px rgba(34, 197, 94, 0.45));
    }
    .node.root circle {
      fill: url(#rootGrad);
      stroke: transparent;
    }

    /* 信息模态框 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.6);
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      width: 92%;
      max-width: 720px;
      margin: 6% auto;
      padding: 28px 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      animation: slideUp .25s ease;
      position: relative;
    }
    body.dark-mode .modal-content { background: #111827; color: #e5e7eb; }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .close-modal {
      position: absolute;
      right: 18px;
      top: 12px;
      font-size: 26px;
      color: #a3a3a3;
      cursor: pointer;
    }
    .close-modal:hover { color: #667eea; }
    .modal h2 {
      margin: 4px 0 6px;
      font-size: 22px;
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .def-text {
      color: #374151;
      line-height: 1.8;
      font-size: 15px;
    }
    body.dark-mode .def-text { color: #d1d5db; }
    .def-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tag {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(102, 126, 234, 0.12);
      color: #334155;
      font-weight: 700;
    }
    body.dark-mode .tag { color: #e5e7eb; }

    /* 返回按钮（回首页） */
    .back-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background: var(--primary-grad);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      z-index: 1100;
      text-decoration: none;
    }
    .back-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.6);
    }

    /* 导入 JSON 的小抽屉 */
    .import-panel {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 110px;
      width: 360px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      padding: 14px;
      z-index: 1500;
    }
    body.dark-mode .import-panel { background: #111827; }
    .import-panel h3 {
      margin: 6px 0 10px;
      font-size: 16px;
      color: #334155;
    }
    body.dark-mode .import-panel h3 { color: #e5e7eb; }
    .import-panel textarea {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      border: 1px solid rgba(102,126,234,0.25);
      background: #fff;
      color: #111827;
      padding: 10px;
    }
    body.dark-mode .import-panel textarea {
      background: #0b1220;
      color: #e5e7eb;
      border-color: rgba(255,255,255,0.08);
    }
    .import-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .matrix-title h1 { font-size: 2.1em; }
      .toolbar { justify-content: center; }
      .mindmap-wrap { height: 68vh; min-height: 520px; }
      .search input { width: 200px; }
      .import-panel { width: calc(100% - 40px); right: 20px; }
    }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  <script>
    // 主题切换（与原站一致）
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') {
      body.classList.add('dark-mode');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
        localStorage.setItem('theme', 'dark');
      } else {
        icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
        localStorage.setItem('theme', 'light');
      }
    });

    // 核心数据：高考化学满分所需的“底层概念 + 拓展”
    // 说明：
    // - 每个节点：name, definition（定义/要点）, tags（可选）, children（子概念）
    // - 已尽量从第一性原理组织（结构->键->能与变->速与衡->酸碱->电化学->溶液->无机->有机->分析->实验）

            { name: "气体制备与收集", definition: "排水/向上/向下排空气；干燥/净化。", tags:["技巧"] },
            { name: "过滤/蒸馏/萃取/结晶/干燥", definition: "分离纯化的核心流程与注意事项。", tags:["分离"] },
            { name: "滴定操作与指示剂", definition: "洗涤/标定/读数/终点判断。", tags:["滴定"] },
            { name: "安全与废液处理", definition: "防腐蚀/防氧化/防燃爆与分类回收。", tags:["安全"] }
          ]
        },
        {
          name: "化学与社会（拓展）",
          definition: "工业流程与环境议题：从哈柏法到接触法，从酸雨到碳中和。",
          tags:["应用","拓展"],
          children: [
            { name: "哈柏法", definition: "N2+3H2 ⇌ 2NH3，铁系催化剂，高温高压。", tags:["平衡","工业"] },
            { name: "接触法", definition: "SO2→SO3（V2O5 催化），制硫酸。", tags:["工业"] },
            { name: "电解铝", definition: "冰晶石-氧化铝熔盐电解，阳极效应与能耗。", tags:["工业"] },
            { name: "索尔维制碱", definition: "氨碱法制Na2CO3。", tags:["工业"] },
            { name: "环境化学", definition: "酸雨/温室气体/光化学烟雾与治理。", tags:["环保"] }
          ]
        }
      ]
    };

    // 画布与布局
    const svg = d3.select("#mindmapSvg");
    const g = d3.select("#mindmapG");
    const wrap = document.getElementById("mindmapWrap");

    // 缩放/平移
    const zoom = d3.zoom().scaleExtent([0.25, 2.5]).on("zoom", (ev) => {
      g.attr("transform", ev.transform);
    });
    svg.call(zoom);

    // 尺寸与树布局（径向）
    function getSize() {
      const rect = wrap.getBoundingClientRect();
      return { w: rect.width, h: rect.height };
    }
    let { w, h } = getSize();
    const radius = Math.min(w, h) / 2 - 40;
    let tree = d3.tree().size([2 * Math.PI, radius]);

    // 根数据与折叠初始化
    let root = d3.hierarchy(chemMindMap);
    root.x0 = 0;
    root.y0 = 0;
    root.children?.forEach(collapseAll);

    function collapseAll(d) {
      if (d.children) {
        d._children = d.children;
        d._children.forEach(collapseAll);
        d.children = null;
      }
    }

    // 渲染函数
    function update(source) {
      // 重新计算布局
      tree = d3.tree().size([2 * Math.PI, Math.min(getSize().w, getSize().h) / 2 - 50]);
      const nodes = tree(root);
      const links = nodes.links();

      // 极坐标->笛卡尔
      function project(x, y) {
        const angle = x - Math.PI / 2;
        return [Math.cos(angle) * y, Math.sin(angle) * y];
      }

      // LINKS
      const link = g.selectAll("path.link").data(links, d => d.target.data.name + "_" + d.target.depth);
      link.join(
        enter => enter.append("path")
          .attr("class", "link")
          .attr("d", d => {
            const [sx, sy] = project(source.x0 ?? source.x, source.y0 ?? source.y);
            return d3.linkRadial().angle(() => source.x0 ?? source.x).radius(() => source.y0 ?? source.y)({ source: { x: source.x0 ?? source.x, y: source.y0 ?? source.y }, target: { x: source.x0 ?? source.x, y: source.y0 ?? source.y } });
          })
          .transition().duration(350)
          .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y)),
        update => update.transition().duration(350)
          .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y)),
        exit => exit.transition().duration(250)
          .attr("d", d => {
            return d3.linkRadial().angle(() => source.x).radius(() => source.y)({
              source: { x: source.x, y: source.y },
              target: { x: source.x, y: source.y }
            });
          }).remove()
      );

      // NODES
      const node = g.selectAll("g.node").data(nodes.descendants(), d => d.data.name + "_" + d.depth);
      const nodeEnter = node.enter().append("g")
        .attr("class", d => "node" + (d.depth === 0 ? " root" : ""))
        .attr("transform", d => {
          const [x, y] = project(source.x0 ?? source.x, source.y0 ?? source.y);
          return `translate(${x},${y})`;
        })
        .on("click", (_, d) => {
          // 展开/折叠
          if (d.children) { d._children = d.children; d.children = null; }
          else { d.children = d._children; d._children = null; }
          update(d);
          // 定位并打开定义
          centerOnNode(d, 1.0);
          openDef(d);
        });

      nodeEnter.append("circle")
        .attr("r", d => d.depth === 0 ? 14 : 8);

      nodeEnter.append("text")
        .attr("dy", "0.31em")
        .attr("x", d => (d.x < Math.PI === !d.children) ? 12 : -12)
        .attr("text-anchor", d => (d.x < Math.PI === !d.children) ? "start" : "end")
        .attr("transform", d => (d.x >= Math.PI ? "rotate(180)" : null))
        .text(d => d.data.name);

      const nodeUpdate = nodeEnter.merge(node);
      nodeUpdate.transition().duration(350)
        .attr("transform", d => {
          const [x, y] = project(d.x, d.y);
          return `translate(${x},${y})`;
        });
      nodeUpdate.select("circle").attr("r", d => d.depth === 0 ? 14 : 8);

      node.exit().transition().duration(250)
        .attr("transform", d => {
          const [x, y] = project(source.x, source.y);
          return `translate(${x},${y})`;
        })
        .remove();

      // 保存旧位置
      nodes.each(d => { d.x0 = d.x; d.y0 = d.y; });
    }

    // 初渲染
    update(root);
    // 初始视图：略微缩放并居中
    centerOnNode(root, 0.9);

    // 居中与适配
    const btnCenter = document.getElementById('btnCenter');
    const btnFit = document.getElementById('btnFit');
    btnCenter.addEventListener('click', () => centerOnNode(root, 0.9));
    btnFit.addEventListener('click', fitToView);

    function centerOnNode(d, scale = 1.0) {
      const { w, h } = getSize();
      const [x, y] = polarToCartesian(d.x, d.y);
      svg.transition().duration(350).call(
        zoom.transform,
        d3.zoomIdentity.translate(w / 2, h / 2).scale(scale).translate(-x, -y)
      );
    }
    function polarToCartesian(x, y) {
      const angle = x - Math.PI / 2;
      return [Math.cos(angle) * y, Math.sin(angle) * y];
    }
    function fitToView() {
      const bbox = g.node().getBBox();
      const { w, h } = getSize();
      const scale = Math.max(0.25, Math.min(2.2, 0.9 / Math.max(bbox.width / w, bbox.height / h)));
      const tx = -bbox.x * scale + (w - bbox.width * scale) / 2;
      const ty = -bbox.y * scale + (h - bbox.height * scale) / 2;
      svg.transition().duration(380).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }

    // 窗口尺寸变化时重算并适配
    window.addEventListener('resize', () => {
      update(root);
      fitToView();
    });

    // 定义模态框
    const defModal = document.getElementById('defModal');
    const closeDefModal = document.getElementById('closeDefModal');
    function openDef(d) {
      const title = document.getElementById('defTitle');
      const body = document.getElementById('defBody');
      const meta = document.getElementById('defMeta');
      title.textContent = d.data.name;
      body.textContent = d.data.definition || '（暂无定义，请在导入数据中补充此概念的定义）';
      meta.innerHTML = '';
      (d.data.tags || []).forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = t;
        meta.appendChild(span);
      });
      defModal.style.display = 'block';
    }
    function closeModal() { defModal.style.display = 'none'; }
    closeDefModal.onclick = closeModal;
    window.addEventListener('click', (e) => {
      if (e.target === defModal) closeModal();
    });

    // 搜索与高亮
    const input = document.getElementById('searchInput');
    const btnSearch = document.getElementById('btnSearch');
    const btnClear = document.getElementById('btnClear');

    btnSearch.addEventListener('click', () => doSearch(input.value.trim()));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(input.value.trim()); });
    btnClear.addEventListener('click', () => clearHighlight());

    function doSearch(q) {
      clearHighlight();
      if (!q) return;

      // 先找最匹配的一个（全词>包含）
      const all = root.descendants();
      let best = null;

      const exact = all.filter(d => d.data.name === q);
      if (exact.length) best = exact[0];
      else {
        const inc = all.filter(d => d.data.name.includes(q));
        if (inc.length) best = inc[0];
      }

      if (!best) {
        alert('未找到相关概念：' + q);
        return;
      }

      // 展开路径
      let p = best;
      const toOpen = [];
      while (p.parent) {
        if (p.parent._children) {
          p.parent.children = p.parent._children;
          p.parent._children = null;
        }
        toOpen.push(p.parent);
        p = p.parent;
      }
      update(best);

      // 高亮并定位
      highlightNode(best);
      centerOnNode(best, 1.2);
      openDef(best);
    }

    function highlightNode(d) {
      g.selectAll("g.node")
        .filter(n => n === d)
        .classed("highlight", true);
    }

    function clearHighlight() {
      g.selectAll("g.node").classed("highlight", false);
    }

    // 导入/追加 JSON 面板
    const importPanel = document.getElementById('importPanel');
    const btnImportToggle = document.getElementById('btnImportToggle');
    const btnCloseImport = document.getElementById('btnCloseImport');
    const btnAppend = document.getElementById('btnAppend');
    const btnReplace = document.getElementById('btnReplace');
    const importTextarea = document.getElementById('importTextarea');

    btnImportToggle.addEventListener('click', () => {
      importPanel.style.display = (importPanel.style.display === 'block') ? 'none' : 'block';
    });
    btnCloseImport.addEventListener('click', () => importPanel.style.display = 'none');

    btnAppend.addEventListener('click', () => {
      try {
        const json = JSON.parse(importTextarea.value);
        const toAppend = Array.isArray(json) ? json : [json];
        if (!root.data.children) root.data.children = [];
        root.data.children.push(...toAppend);
        root = d3.hierarchy(root.data);
        update(root);
        fitToView();
        alert('追加成功！');
      } catch (e) {
        alert('JSON 解析失败：' + e.message);
      }
    });

    btnReplace.addEventListener('click', () => {
      if (!confirm('确定要用导入的 JSON 替换整个图吗？此操作不可撤销。')) return;
      try {
        const json = JSON.parse(importTextarea.value);
        root = d3.hierarchy(json);
        root.x0 = 0; root.y0 = 0;
        update(root);
        fitToView();
        alert('替换成功！');
      } catch (e) {
        alert('JSON 解析失败：' + e.message);
      }
    });
  </script>
</body>
</html>
