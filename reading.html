<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狂客·星空 - 书摘精选</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com;">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== 全局样式 ========== */
        * {
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        
        @media (max-width: 768px) {
            html {
                font-size: 14px;
            }
        }
        
        body[data-page="reading"] {
            background: url("images/reading-bg.jpg") center/cover no-repeat fixed;
            color: #f5f7ff;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        body[data-page="reading"]::before,
        body[data-page="reading"]::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }
        
        body[data-page="reading"]::before {
            background: linear-gradient(135deg, rgba(25, 51, 120, 0.45), rgba(15, 18, 60, 0.65));
            mix-blend-mode: screen;
        }
        
        body[data-page="reading"]::after {
            background:
                radial-gradient(circle at 20% 15%, rgba(120, 160, 255, 0.27), transparent 55%),
                radial-gradient(circle at 78% 10%, rgba(255, 150, 255, 0.2), transparent 60%),
                rgba(6, 10, 42, 0.35);
        }

        /* ========== 关键词高亮样式 ========== */
        .search-highlight {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.4), rgba(255, 152, 0, 0.5));
            color: #fff;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
            animation: highlightPulse 2s ease-in-out infinite;
        }

        body.light-mode .search-highlight {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.6), rgba(255, 152, 0, 0.7));
            color: #1a1a1a;
        }

        @keyframes highlightPulse {
            0%, 100% {
                box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
            }
            50% {
                box-shadow: 0 2px 12px rgba(255, 193, 7, 0.6);
            }
        }

        /* ========== 头部样式 ========== */
        .reading-header {
            background: rgba(10, 15, 40, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .reading-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        
        .reading-header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            flex: 1;
            min-width: 250px;
        }
        
        .reading-return {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1.4rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.45);
            color: #f4f7ff;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            box-shadow: 0 10px 22px rgba(99, 102, 241, 0.28);
            white-space: nowrap;
        }
        
        body.light-mode .reading-return {
            background: rgba(99, 102, 241, 0.08);
            color: var(--accent-hover);
            box-shadow: none;
        }
        
        .reading-return:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 16px 32px rgba(99, 102, 241, 0.35);
        }
        
        .reading-title-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .reading-title-group .logo {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.05em;
        }
        
        .reading-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            margin: 0;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* ========== 周复盘按钮样式 ========== */
        .weekly-review-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.9), rgba(249, 115, 22, 0.85));
            border: 1px solid rgba(236, 72, 153, 0.45);
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            box-shadow: 0 10px 22px rgba(236, 72, 153, 0.28);
            white-space: nowrap;
            font-weight: 500;
            cursor: pointer;
        }
        
        body.light-mode .weekly-review-btn {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.95), rgba(249, 115, 22, 0.9));
            box-shadow: 0 8px 18px rgba(236, 72, 153, 0.25);
        }
        
        .weekly-review-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(236, 72, 153, 0.35);
            background: linear-gradient(135deg, rgba(236, 72, 153, 1), rgba(249, 115, 22, 0.98));
        }
        
        .weekly-review-btn i {
            font-size: 1.1rem;
        }

        /* ========== 思维导图按钮样式 ========== */
        .mindmap-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.9), rgba(56, 189, 248, 0.85));
            border: 1px solid rgba(139, 92, 246, 0.45);
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            box-shadow: 0 10px 22px rgba(99, 102, 241, 0.28);
            white-space: nowrap;
            font-weight: 500;
        }
        
        body.light-mode .mindmap-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.95), rgba(56, 189, 248, 0.9));
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.25);
        }
        
        .mindmap-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(99, 102, 241, 0.35);
            background: linear-gradient(135deg, rgba(139, 92, 246, 1), rgba(56, 189, 248, 0.98));
        }
        
        .mindmap-btn i {
            font-size: 1.1rem;
        }

        /* ========== 主内容区域 ========== */
        .reading-main {
            padding: 3rem 1.5rem 5rem;
        }
        
        .reading-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ========== 周复盘模态框 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 自定义滚动条 */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .modal-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            transform: rotate(90deg);
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(249, 115, 22, 0.2));
            color: #ec4899;
            font-size: 1.8rem;
        }
        
        .modal-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }
        
        .review-section {
            margin-bottom: 2rem;
        }
        
        .review-section h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }
        
        .review-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .review-stat-card {
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .review-stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.2);
        }
        
        .review-stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            display: block;
            margin-bottom: 0.3rem;
        }
        
        .review-stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .review-score {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(249, 115, 22, 0.1));
            border-radius: 16px;
            margin: 1.5rem 0;
            position: relative;
            overflow: hidden;
        }

        .review-score::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 70%);
            animation: scoreShine 3s ease-in-out infinite;
        }

        @keyframes scoreShine {
            0%, 100% {
                transform: translate(0, 0);
                opacity: 0;
            }
            50% {
                transform: translate(25%, 25%);
                opacity: 1;
            }
        }
        
        .review-score-number {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ec4899, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }
        
        .review-score-label {
            font-size: 1rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        /* ========== 趋势图表样式 ========== */
        .review-trend {
            margin: 1.5rem 0;
            padding: 1.5rem;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
        }

        .trend-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 120px;
            gap: 0.5rem;
            margin: 1rem 0;
            padding-top: 30px;
        }

        .trend-bar {
            flex: 1;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.8), rgba(56, 189, 248, 0.3));
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: all 0.3s ease;
            min-height: 5px;
        }

        .trend-bar:hover {
            background: linear-gradient(180deg, rgba(56, 189, 248, 1), rgba(56, 189, 248, 0.5));
            transform: translateY(-3px);
        }

        .trend-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .trend-bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: 600;
        }
        
        .review-suggestions {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .review-suggestions ul {
            margin: 0;
            padding-left: 1.5rem;
            color: var(--text-primary);
            line-height: 1.8;
        }
        
        .review-suggestions li {
            margin-bottom: 0.8rem;
            position: relative;
        }

        .review-suggestions li::marker {
            color: var(--accent-color);
        }
        
        .review-books-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        
        .review-book-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .review-book-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }
        
        .review-book-name {
            color: var(--accent-color);
            font-weight: 600;
        }
        
        .review-book-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ========== 书摘精选区域 ========== */
        .reading-digest {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            animation: fadeIn 0.6s ease-out;
            z-index: 1;
        }
        
        .reading-digest::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.15), transparent 55%);
            opacity: 0.6;
            pointer-events: none;
            border-radius: 24px;
        }
        
        .reading-digest::after {
            content: "";
            position: absolute;
            top: -100px;
            right: -60px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.2), transparent 70%);
            filter: blur(50px);
            animation: float 16s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(25px) rotate(6deg);
            }
        }
        
        .reading-digest-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        /* ========== 优化后的星星图标样式 ========== */
        .digest-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), transparent 50%),
                linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%);
            box-shadow:
                0 0 0 4px rgba(255, 193, 7, 0.2),
                0 0 20px rgba(255, 193, 7, 0.6),
                0 15px 35px rgba(255, 152, 0, 0.4),
                inset 0 -8px 20px rgba(255, 140, 0, 0.3);
            color: #fff;
            font-size: 2rem;
            animation: starGlow 3s ease-in-out infinite, starFloat 4s ease-in-out infinite;
            position: relative;
            overflow: visible;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .digest-icon::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3), transparent 60%);
            filter: blur(15px);
            animation: pulseGlow 2s ease-in-out infinite;
            z-index: -1;
        }
        
        .digest-icon::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent 70%);
            filter: blur(4px);
            animation: sparkle 2.5s ease-in-out infinite;
        }
        
        .digest-icon i {
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            animation: starRotate 8s linear infinite;
        }
        
        .digest-icon:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow:
                0 0 0 6px rgba(255, 193, 7, 0.3),
                0 0 30px rgba(255, 193, 7, 0.8),
                0 20px 45px rgba(255, 152, 0, 0.5),
                inset 0 -10px 25px rgba(255, 140, 0, 0.4);
        }
        
        .digest-icon:hover i {
            animation: starRotate 2s linear infinite;
        }
        
        @keyframes starGlow {
            0%, 100% {
                box-shadow:
                    0 0 0 4px rgba(255, 193, 7, 0.2),
                    0 0 20px rgba(255, 193, 7, 0.6),
                    0 15px 35px rgba(255, 152, 0, 0.4),
                    inset 0 -8px 20px rgba(255, 140, 0, 0.3);
            }
            50% {
                box-shadow:
                    0 0 0 6px rgba(255, 193, 7, 0.3),
                    0 0 35px rgba(255, 193, 7, 0.8),
                    0 18px 40px rgba(255, 152, 0, 0.5),
                    inset 0 -10px 25px rgba(255, 140, 0, 0.4);
            }
        }
        
        @keyframes starFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-8px) rotate(3deg);
            }
            75% {
                transform: translateY(-5px) rotate(-3deg);
            }
        }
        
        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.1);
            }
        }
        
        @keyframes sparkle {
            0%, 100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }
        
        @keyframes starRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        .reading-digest-header > div {
            flex: 1;
            min-width: 280px;
        }
        
        .reading-digest-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.05em;
            margin: 0 0 0.5rem 0;
        }
        
        .reading-digest-header p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin: 0;
        }
        
        .bookcase-btn {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        
        .bookcase-btn:hover {
            border-bottom-color: var(--accent-color);
        }

        /* ========== 书摘统计信息 ========== */
        .digest-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(255, 193, 7, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(255, 193, 7, 0.25);
        }
        
        .digest-stat {
            text-align: center;
            padding: 0.5rem 0;
        }
        
        .digest-stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 193, 7, 0.95);
            display: block;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }
        
        .digest-stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* ========== 搜索栏 ========== */
        .digest-search {
            margin: 1.5rem 0 0;
            display: flex;

    <script>
        // ========== 全局变量 ==========
        let digestData = [];
        let currentDigestData = [];
        let sortOrder = 'default';
        let currentSearchTerm = '';
        
        // 分页相关
        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let totalPages = 1;

        // ========== 数据加载 ==========
        async function loadDigestData() {
            try {
                const response = await fetch('data/digests.json');
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                digestData = await response.json();
                console.log(`✅ 成功加载 ${digestData.length} 条书摘数据`);
            } catch (error) {
                console.error('❌ 加载失败:', error);
                showLoadingError();
            }
        }

        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', async function() {
            document.body.setAttribute('data-page', 'reading');
            initializeTheme();
            
            // 显示骨架屏
            showSkeletonScreen();
            
            await loadDigestData();
            
            if (digestData.length > 0) {
                currentDigestData = [...digestData];
                calculatePagination();
                renderDigestTable();
                updateDigestStats();
            }
            
            bindSearchEvents();
            bindSortEvents();
            bindPaginationEvents();
            bindModalEvents();
            initBackToTop();
        });

        // ========== 骨架屏 ==========
        function showSkeletonScreen() {
            const tableBody = document.querySelector('.reading-digest-table');
            if (!tableBody) return;
            
            const headerRow = tableBody.querySelector('.digest-row--head');
            const headerClone = headerRow ? headerRow.cloneNode(true) : null;
            
            tableBody.innerHTML = '';
            if (headerClone) {
                tableBody.appendChild(headerClone);
            }
            
            // 添加3个骨架行
            for (let i = 0; i < 3; i++) {
                const skeletonRow = document.createElement('div');
                skeletonRow.className = 'skeleton-row';
                skeletonRow.innerHTML = `
                    <div><div class="skeleton-text skeleton-text--short"></div></div>
                    <div>
                        <div class="skeleton-text skeleton-text--long"></div>
                        <div class="skeleton-text skeleton-text--long"></div>
                    </div>
                    <div><div class="skeleton-text skeleton-text--short"></div></div>
                    <div><div class="skeleton-text skeleton-text--short"></div></div>
                `;
                tableBody.appendChild(skeletonRow);
            }
        }

        // ========== 主题管理 ==========
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.classList.toggle('light-mode', savedTheme === 'light');
            updateThemeIcon(savedTheme);
        }
        
        function updateThemeIcon(theme) {
            const themeIcon = document.querySelector('#themeToggle i');
            if (themeIcon) {
                themeIcon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }
        
        document.getElementById('themeToggle')?.addEventListener('click', function() {
            const isLight = document.body.classList.toggle('light-mode');
            const newTheme = isLight ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // ========== 分页计算 ==========
        function calculatePagination() {
            totalPages = Math.ceil(currentDigestData.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) {
                currentPage = totalPages || 1;
            }
        }

        // ========== 获取当前页数据 ==========
        function getCurrentPageData() {
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            return currentDigestData.slice(start, end);
        }

        // ========== 渲染分页器 ==========
        function renderPagination() {
            const pageNumbersContainer = document.getElementById('pageNumbers');
            const paginationInfo = document.getElementById('paginationInfo');
            const firstPageBtn = document.getElementById('firstPage');
            const prevPageBtn = document.getElementById('prevPage');
            const nextPageBtn = document.getElementById('nextPage');
            const lastPageBtn = document.getElementById('lastPage');
            
            // 更新按钮状态
            firstPageBtn.disabled = currentPage === 1;
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages;
            lastPageBtn.disabled = currentPage === totalPages;
            
            // 更新页码信息
            paginationInfo.textContent = `第 ${currentPage} 页,共 ${totalPages} 页 (总计 ${currentDigestData.length} 条)`;
            
            // 渲染页码按钮
            pageNumbersContainer.innerHTML = '';
            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            
            if (endPage - startPage + 1 < maxButtons) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }
            
            // 第一页 + 省略号
            if (startPage > 1) {
                const btn = createPageButton(1);
                pageNumbersContainer.appendChild(btn);
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'pagination-ellipsis';
                    ellipsis.textContent = '...';
                    pageNumbersContainer.appendChild(ellipsis);
                }
            }
            
            // 中间页码
            for (let i = startPage; i <= endPage; i++) {
                const btn = createPageButton(i);
                pageNumbersContainer.appendChild(btn);
            }
            
            // 省略号 + 最后一页
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'pagination-ellipsis';
                    ellipsis.textContent = '...';
                    pageNumbersContainer.appendChild(ellipsis);
                }
                const btn = createPageButton(totalPages);
                pageNumbersContainer.appendChild(btn);
            }
        }

        // ========== 创建页码按钮 ==========
        function createPageButton(pageNum) {
            const btn = document.createElement('button');
            btn.className = 'pagination-btn';
            btn.textContent = pageNum;
            btn.setAttribute('aria-label', `第${pageNum}页`);
            
            if (pageNum === currentPage) {
                btn.classList.add('active');
            }
            
            btn.addEventListener('click', () => {
                currentPage = pageNum;
                renderDigestTable();
                renderPagination();
                scrollToTop();
            });
            
            return btn;
        }

        // ========== 绑定分页事件 ==========
        function bindPaginationEvents() {
            document.getElementById('firstPage')?.addEventListener('click', () => {
                currentPage = 1;
                renderDigestTable();
                renderPagination();
                scrollToTop();
            });
            
            document.getElementById('prevPage')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderDigestTable();
                    renderPagination();
                    scrollToTop();
                }
            });
            
            document.getElementById('nextPage')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderDigestTable();
                    renderPagination();
                    scrollToTop();
                }
            });
            
            document.getElementById('lastPage')?.addEventListener('click', () => {
                currentPage = totalPages;
                renderDigestTable();
                renderPagination();
                scrollToTop();
            });
        }

        // ========== 滚动到表格顶部 ==========
        function scrollToTop() {
            const tableTop = document.querySelector('.reading-digest-table');
            if (tableTop) {
                tableTop.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ========== 关键词高亮函数 ==========
        function highlightText(text, searchTerm) {
            if (!searchTerm) return escapeHtml(text);
            
            const terms = searchTerm.toLowerCase().split(/\s+/).filter(t => t.length > 0);
            let result = escapeHtml(text);
            
            terms.forEach(term => {
                const regex = new RegExp(`(${escapeRegex(term)})`, 'gi');
                result = result.replace(regex, '<span class="search-highlight">$1</span>');
            });
            
            return result;
        }

        // ========== 转义正则表达式特殊字符 ==========
        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // ========== 评分徽章 ==========
        function createRatingBadge(rating) {
            if (!rating || rating === 0) {
                return '<div class="rating-badge rating-empty">-</div>';
            }
            const ratingClass = `rating-value-${rating}`;
            return `<div class="rating-badge ${ratingClass}">${rating}</div>`;
        }

        // ========== 渲染书摘表格 ==========
        function renderDigestTable() {
            const tableBody = document.querySelector('.reading-digest-table');
            if (!tableBody) {
                console.error('❌ 未找到表格容器');
                return;
            }
            
            const headerRow = tableBody.querySelector('.digest-row--head');
            const headerClone = headerRow ? headerRow.cloneNode(true) : null;
            
            tableBody.innerHTML = '';
            if (headerClone) {
                tableBody.appendChild(headerClone);
            }
            
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = '<div class="loading-spinner"></div>正在加载书摘数据...';
            tableBody.appendChild(loadingDiv);
            
            setTimeout(() => {
                if (loadingDiv.parentNode === tableBody) {
                    tableBody.removeChild(loadingDiv);
                }
                
                const pageData = getCurrentPageData();
                
                if (pageData.length === 0) {
                    const emptyRow = document.createElement('div');
                    emptyRow.className = 'digest-row';
                    emptyRow.style.cssText = 'text-align: center; padding: 3rem 1.5rem; grid-column: 1/-1;';
                    emptyRow.innerHTML = `
                        <div class="digest-col" style="color: var(--text-secondary);">
                            😢 没有找到匹配的书摘内容
                        </div>
                    `;
                    tableBody.appendChild(emptyRow);
                } else {
                    pageData.forEach(digest => {
                        const row = document.createElement('div');
                        row.className = 'digest-row';
                        row.setAttribute('role', 'row');
                        
                        row.innerHTML = `
                            <div class="digest-col digest-col--book" role="cell" data-label="📖 书名">
                                ${highlightText(digest.book, currentSearchTerm)}
                            </div>
                            <div class="digest-col digest-col--content" role="cell" data-label="📝 摘录">
                                ${highlightText(digest.content, currentSearchTerm)}
                            </div>
                            <div class="digest-col digest-col--date" role="cell" data-label="📅 日期">
                                ${escapeHtml(digest.date)}
                            </div>
                            <div class="digest-col digest-col--rating" role="cell" data-label="⭐ 启发值">
                                ${createRatingBadge(digest.rating)}
                            </div>
                        `;
                        
                        tableBody.appendChild(row);
                    });
                }
                
                renderPagination();
            }, 300);
        }

        // ========== HTML转义 ==========
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 加载错误提示 ==========
        function showLoadingError() {
            const tableBody = document.querySelector('.reading-digest-table');
            if (!tableBody) return;
            
            const errorRow = document.createElement('div');
            errorRow.className = 'digest-row';
            errorRow.style.cssText = 'text-align: center; padding: 3rem 1.5rem; grid-column: 1/-1;';
            errorRow.innerHTML = `
                <div class="digest-col" style="color: var(--text-secondary);">
                    ❌ 数据加载失败,请刷新页面重试
                </div>
            `;
            tableBody.appendChild(errorRow);
        }

        // ========== 更新统计信息 ==========
        function updateDigestStats() {
            document.getElementById('totalDigests').textContent = currentDigestData.length;
            
            const uniqueBooks = [...new Set(currentDigestData.map(d => d.book))];
            document.getElementById('uniqueBooks').textContent = uniqueBooks.length;
            
            const validRatings = currentDigestData.filter(d => d.rating && d.rating > 0);
            const avgRating = validRatings.length > 0
                ? (validRatings.reduce((sum, d) => sum + d.rating, 0) / validRatings.length).toFixed(1)
                : '0.0';
            document.getElementById('avgInspiration').textContent = avgRating;
            
            const highInspiration = currentDigestData.filter(d => d.rating && d.rating >= 7).length;
            document.getElementById('highInspiration').textContent = highInspiration;
        }

        // ========== 搜索功能 ==========
        function bindSearchEvents() {
            const searchInput = document.getElementById('digestSearchInput');
            const searchButton = document.getElementById('digestSearchButton');
            const resetButton = document.getElementById('digestSearchReset');
            
            const performSearch = () => {
                const searchTerm = searchInput.value.trim().toLowerCase();
                currentSearchTerm = searchInput.value.trim(); // 保存原始搜索词用于高亮
                
                currentDigestData = searchTerm === ''
                    ? [...digestData]
                    : digestData.filter(digest =>
                        digest.book.toLowerCase().includes(searchTerm) ||
                        digest.content.toLowerCase().includes(searchTerm)
                    );
                
                currentPage = 1;
                applyCurrentSort();
                calculatePagination();
                renderDigestTable();
                updateDigestStats();
            };
            
            searchButton?.addEventListener('click', performSearch);
            
            searchInput?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
            
            resetButton?.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchTerm = '';
                currentDigestData = [...digestData];
                sortOrder = 'default';
                currentPage = 1;
                calculatePagination();
                renderDigestTable();
                updateDigestStats();
                updateSortButton();
            });
            
            // 实时搜索(防抖)
            let searchTimeout;
            searchInput?.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(performSearch, 500);
            });
        }

        // ========== 排序功能 ==========
        function bindSortEvents() {
            const sortButton = document.getElementById('digestSortToggle');
            
            sortButton?.addEventListener('click', () => {
                const orders = ['default', 'rating-desc', 'rating-asc', 'date-desc', 'date-asc'];
                const currentIndex = orders.indexOf(sortOrder);
                sortOrder = orders[(currentIndex + 1) % orders.length];
                
                currentPage = 1;
                applyCurrentSort();
                calculatePagination();
                renderDigestTable();
                updateSortButton();
            });
        }
        
        function applyCurrentSort() {
            switch (sortOrder) {
                case 'rating-desc':
                    currentDigestData.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    break;
                case 'rating-asc':
                    currentDigestData.sort((a, b) => (a.rating || 0) - (b.rating || 0));
                    break;
                case 'date-desc':
                    currentDigestData.sort((a, b) => new Date(b.date) - new Date(a.date));
                    break;
                case 'date-asc':
                    currentDigestData.sort((a, b) => new Date(a.date) - new Date(b.date));
                    break;
                default:
                    // 恢复原始顺序
                    currentDigestData.sort((a, b) => digestData.indexOf(a) - digestData.indexOf(b));
            }
        }
        
        function updateSortButton() {
            const sortButton = document.getElementById('digestSortToggle');
            if (!sortButton) return;
            
            const icon = sortButton.querySelector('i');
            const text = sortButton.querySelector('span');
            
            const labels = {
                'default': { icon: 'fas fa-sort-numeric-down', text: '排序' },
                'rating-desc': { icon: 'fas fa-sort-numeric-down', text: '启发值↓' },
                'rating-asc': { icon: 'fas fa-sort-numeric-up', text: '启发值↑' },
                'date-desc': { icon: 'fas fa-calendar-alt', text: '日期↓' },
                'date-asc': { icon: 'fas fa-calendar', text: '日期↑' }
            };
            
            const label = labels[sortOrder] || labels['default'];
            icon.className = label.icon;
            text.textContent = label.text;
        }

        // ========== 周复盘功能 ==========
        function bindModalEvents() {
            const modal = document.getElementById('weeklyReviewModal');
            const openBtn = document.getElementById('weeklyReviewBtn');
            const closeBtn = document.getElementById('modalClose');
            
            openBtn?.addEventListener('click', () => {
                generateWeeklyReview();
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
            
            closeBtn?.addEventListener('click', () => {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            });
            
            modal?.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        }

        // ========== 生成周复盘 ==========
        function generateWeeklyReview() {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            
            // 筛选本周数据
            const weeklyData = digestData.filter(digest => {
                const digestDate = new Date(digest.date);
                return digestDate >= weekAgo && digestDate <= now;
            });
            
            // 基础统计
            document.getElementById('weeklyDigests').textContent = weeklyData.length;
            
            const weeklyBooks = [...new Set(weeklyData.map(d => d.book))];
            document.getElementById('weeklyBooks').textContent = weeklyBooks.length;
            
            const validRatings = weeklyData.filter(d => d.rating && d.rating > 0);
            const avgRating = validRatings.length > 0
                ? (validRatings.reduce((sum, d) => sum + d.rating, 0) / validRatings.length).toFixed(1)
                : '0.0';
            document.getElementById('weeklyAvgRating').textContent = avgRating;
            
            const highQuality = weeklyData.filter(d => d.rating >= 7).length;
            document.getElementById('weeklyHighQuality').textContent = highQuality;
            
            // 生成每日趋势图
            generateTrendChart(weeklyData);
            
            // 计算综合评分 (更科学的算法)
            let score = 0;
            
            // 1. 数量分 (0-35分) - 考虑递减效应
            const countScore = Math.min(weeklyData.length * 2.5, 35);
            score += countScore;
            
            // 2. 质量分 (0-35分) - 基于平均启发值
            const qualityScore = parseFloat(avgRating) * 3.5;
            score += qualityScore;
            
            // 3. 高质量占比分 (0-20分)
            const qualityRatio = weeklyData.length > 0 ? (highQuality / weeklyData.length) : 0;
            const ratioScore = qualityRatio * 20;
            score += ratioScore;
            
            // 4. 多样性分 (0-10分) - 基于书籍种类
            const diversityScore = Math.min(weeklyBooks.length * 2, 10);
            score += diversityScore;
            
            score = Math.min(Math.round(score), 100);
            document.getElementById('weeklyScore').textContent = score;
            
            // 热读书籍
            const bookCounts = {};
            weeklyData.forEach(d => {
                bookCounts[d.book] = (bookCounts[d.book] || 0) + 1;
            });
            
            const topBooks = Object.entries(bookCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
            
            const booksListHtml = topBooks.length > 0
                ? topBooks.map(([book, count]) => `
                    <div class="review-book-item">
                        <span class="review-book-name">${escapeHtml(book)}</span>
                        <span class="review-book-count">${count} 条摘录</span>
                    </div>
                `).join('')
                : '<div class="review-book-item"><span class="review-book-name">本周暂无书摘</span></div>';
            
            document.getElementById('weeklyBooksList').innerHTML = booksListHtml;
            
            // 生成建议
            const suggestions = generateSuggestions(weeklyData.length, avgRating, qualityRatio, weeklyBooks.length, score);
            const suggestionsHtml = suggestions.map(s => `<li>${s}</li>`).join('');
            document.getElementById('weeklySuggestions').innerHTML = suggestionsHtml;
        }

        // ========== 生成趋势图表（增强调试版）==========
        function generateTrendChart(weeklyData) {
            const chartContainer = document.getElementById('trendChart');
            if (!chartContainer) {
                console.error('❌ 找不到趋势图容器');
                return;
            }
            
            console.log('=== 开始生成趋势图 ===');
            console.log(`本周数据条数: ${weeklyData.length}`);
            
            // 按日期统计
            const dailyCounts = {};
            const now = new Date();
            
            // 格式化日期为 YYYY-MM-DD
            function formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            
            // 初始化最近7天
            const dateLabels = [];
            console.log('📅 初始化最近7天:');
            for (let i = 6; i >= 0; i--) {
                const date = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
                const dateStr = formatDate(date);
                dailyCounts[dateStr] = 0;
                dateLabels.push({
                    date: dateStr,
                    dayOfWeek: date.getDay(),
                    dateObj: date
                });
                console.log(`  ${dateStr} (${['周日', '周一', '周二', '周三', '周四', '周五', '周六'][date.getDay()]})`);
            }
            
            // 统计实际数据
            console.log('\n📊 开始匹配书摘数据:');
            if (weeklyData.length === 0) {
                console.warn('⚠️ 本周没有书摘数据');
            } else {
                // 显示前3条数据样本
                console.log('数据样本 (前3条):');
                weeklyData.slice(0, 3).forEach((digest, index) => {
                    console.log(`  [${index + 1}] 日期: "${digest.date}", 书名: "${digest.book}"`);
                });
                
                console.log('\n开始统计...');
                weeklyData.forEach((digest, index) => {
                    const digestDate = digest.date;
                    
                    if (dailyCounts.hasOwnProperty(digestDate)) {
                        dailyCounts[digestDate]++;
                        console.log(`✅ [${index + 1}/${weeklyData.length}] ${digestDate} → 计数: ${dailyCounts[digestDate]}`);
                    } else {
                        console.log(`❌ [${index + 1}/${weeklyData.length}] ${digestDate} → 不在统计范围内`);
                    }
                });
            }
            
            console.log('\n📈 最终统计结果:');
            Object.entries(dailyCounts).forEach(([date, count]) => {
                const dayName = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dateLabels.find(d => d.date === date).dayOfWeek];
                console.log(`  ${date} (${dayName}): ${count} 条`);
            });
            
            // 找出最大值用于比例计算
            const maxCount = Math.max(...Object.values(dailyCounts), 1);
            console.log(`\n📊 最大值: ${maxCount}`);
            
            // 生成图表HTML
            const chartHtml = dateLabels.map(({ date, dayOfWeek }) => {
                const count = dailyCounts[date];
                const height = count > 0 ? (count / maxCount) * 100 : 10;
                const dayLabel = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dayOfWeek];
                
                return `
                    <div class="trend-bar" style="height: ${height}%" title="${date}: ${count}条书摘">
                        ${count > 0 ? `<span class="trend-bar-value">${count}</span>` : ''}
                        <span class="trend-bar-label">${dayLabel}</span>
                    </div>
                `;
            }).join('');
            
            chartContainer.innerHTML = chartHtml;
            console.log('✅ 趋势图生成完成\n=== 结束 ===\n');
        }

        // ========== 生成阅读建议 ==========
        function generateSuggestions(count, avgRating, qualityRatio, booksCount, score) {
            const suggestions = [];
            
            // 基于综合评分的总体评价
            if (score >= 80) {
                suggestions.push('🎉 本周表现优异!阅读质量和数量都很出色,继续保持这个节奏');
            } else if (score >= 60) {
                suggestions.push('👍 本周阅读表现良好,在保持现有水平的基础上可以适当提升');
            } else if (score >= 40) {
                suggestions.push('📚 本周阅读有所积累,但还有较大提升空间');
            } else if (score > 0) {
                suggestions.push('💪 建议增加阅读时间,养成每天记录书摘的习惯');
            }
            
            // 基于数量的建议
            if (count === 0) {
                suggestions.push('📖 本周尚未记录书摘,建议开始阅读并摘录有启发的内容');
            } else if (count < 3) {
                suggestions.push('📈 本周书摘数量较少,建议增加阅读时间,目标每天至少记录1-2条');
            } else if (count >= 15 && count < 25) {
                suggestions.push('✨ 书摘数量适中,保持这个稳定的阅读节奏');
            } else if (count >= 25) {
                suggestions.push('🔥 本周书摘数量充沛!在保持数量的同时,也要注重深度思考');
            }
            
            // 基于平均启发值的建议
            const avgRatingNum = parseFloat(avgRating);
            if (avgRatingNum >= 8) {
                suggestions.push('⭐ 平均启发值极高!这些精华内容值得定期复习和实践应用');
            } else if (avgRatingNum >= 6.5) {
                suggestions.push('💡 整体内容质量优秀,可以尝试整理成读书笔记或思维导图');
            } else if (avgRatingNum >= 5 && avgRatingNum < 6.5) {
                suggestions.push('🎯 平均启发值中等,可以更有选择性地摘录最触动你的内容');
            } else if (avgRatingNum > 0 && avgRatingNum < 5) {
                suggestions.push('🤔 平均启发值偏低,建议选择更符合当前需求和兴趣的书籍');
            }
            
            // 基于质量占比的建议
            if (qualityRatio >= 0.7) {
                suggestions.push('🌟 高质量摘录占比达到70%以上,说明你的筛选标准很高');
            } else if (qualityRatio >= 0.4 && qualityRatio < 0.7) {
                suggestions.push('📊 高质量摘录占比适中,可以更有针对性地摘录最有价值的内容');
            } else if (qualityRatio > 0 && qualityRatio < 0.4) {
                suggestions.push('🔍 建议提高摘录标准,只记录那些真正触动你或有实用价值的内容');
            }
            
            // 基于书籍多样性的建议
            if (booksCount === 1 && count >= 8) {
                suggestions.push('📕 本周专注于单本书籍深度阅读,适合系统学习;也可尝试其他领域拓展视野');
            } else if (booksCount >= 2 && booksCount <= 3) {
                suggestions.push('📚 涉猎2-3本书籍,深度与广度兼顾,是很好的阅读结构');
            } else if (booksCount >= 4) {
                suggestions.push('🌈 涉猎多本书籍,知识面广泛;可选择1-2本进行重点深读');
            }
            
            // 周末特殊建议
            const now = new Date();
            const dayOfWeek = now.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                suggestions.push('☕ 周末时光,可以整理本周书摘,尝试输出一篇读书笔记或心得');
            }
            
            // 实践建议
            if (count >= 10 && qualityRatio >= 0.5) {
                suggestions.push('🚀 建议从本周摘录中选择1-2个观点尝试实践应用,知行合一');
            }
            
            // 复习建议
            if (avgRatingNum >= 7 && count >= 5) {
                suggestions.push('🔄 这周收获的精华内容值得周末复习一遍,加深记忆和理解');
            }
            
            return suggestions;
        }

        // ========== 返回顶部 ==========
        function initBackToTop() {
            const backToTopButton = document.getElementById('backToTop');
            if (!backToTopButton) return;
            
            window.addEventListener('scroll', () => {
                backToTopButton.classList.toggle('visible', window.pageYOffset > 300);
            });
            
            backToTopButton.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    </script>
