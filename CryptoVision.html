<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoVision Pro - 基于GitHub数据的加密分析</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root{
            --primary-color:#667eea;
            --secondary-color:#764ba2;
            --success-color:#10b981;
            --danger-color:#ef4444;
            --warning-color:#f59e0b;
            --dark-bg:#0f172a;
            --card-bg:#1e293b;
            --text-primary:#f1f5f9;
            --text-secondary:#94a3b8;
            --border-color:#334155;
        }
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
            background:
                linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.85)),
                url('images/1b2f1ee2a9dba66e20cd0e210ba09e28.png') no-repeat center center fixed;
            background-size:cover;
            background-blend-mode:overlay;
            color:var(--text-primary);
            min-height:100vh; overflow-x:hidden;
        }
        header{
            background:rgba(30,41,59,0.95);
            backdrop-filter:blur(10px);
            border-bottom:1px solid var(--border-color);
            padding:1rem 2rem; position:sticky; top:0; z-index:1000;
        }
        .header-container{
            max-width:1400px; margin:0 auto;
            display:flex; justify-content:space-between; align-items:center;
        }
        .logo{
            display:flex; align-items:center; gap:.75rem;
            font-size:1.5rem; font-weight:bold;
            background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .reading-return{ color:var(--text-secondary); text-decoration:none; margin-right:.75rem; }
        .reading-return:hover{ color:var(--text-primary); }
        .nav-right{ display:flex; align-items:center; gap:1rem; }
        .connection-status{
            display:flex; align-items:center; gap:.5rem;
            padding:.25rem .75rem; background:var(--dark-bg);
            border-radius:20px; font-size:.75rem;
        }
        .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--warning-color); }
        .status-dot.ok{ background:var(--success-color); animation:pulse 2s infinite; }
        .status-dot.err{ background:var(--danger-color); }
        @keyframes pulse { 0%{opacity:1} 50%{opacity:.5} 100%{opacity:1} }

        .main-container{ max-width:1400px; margin:2rem auto; padding:0 2rem; }

        .market-overview{
            display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:1.25rem; margin-bottom:1.5rem;
        }
        .market-card{
            background:var(--card-bg); border:1px solid var(--border-color);
            border-radius:12px; padding:1rem 1.25rem; position:relative; overflow:hidden;
            transition:transform .3s, box-shadow .3s;
        }
        .market-card::before{
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg,var(--primary-color),var(--secondary-color));
        }
        .market-card:hover{ transform:translateY(-5px); box-shadow:0 10px 30px rgba(102,126,234,0.2); }
        .coin-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; }
        .coin-info{ display:flex; align-items:center; gap:.75rem; }
        .coin-icon{
            width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#fff;
        }
        .coin-price{ font-size:1.5rem; font-weight:700; margin:.25rem 0 .5rem; }
        .price-change{
            display:inline-flex; align-items:center; gap:.25rem;
            padding:.25rem .6rem; border-radius:16px; font-size:.85rem; font-weight:600;
        }
        .price-change.up{ background:rgba(16,185,129,.1); color:var(--success-color); }
        .price-change.down{ background:rgba(239,68,68,.1); color:var(--danger-color); }

        .panel{ background:var(--card-bg); border:1px solid var(--border-color); border-radius:12px; padding:1.25rem; }
        .grid-2{ display:grid; grid-template-columns:2fr 1fr; gap:1.25rem; margin-bottom:1.25rem; }
        .grid-2-bottom{ display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
        .panel-title{ font-size:1.1rem; font-weight:700; display:flex; gap:.5rem; align-items:center; margin-bottom:1rem; }

        .controls{ display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-bottom:.75rem; }
        .select, .btn{
            border:1px solid var(--border-color); background:var(--dark-bg); color:var(--text-primary);
            border-radius:8px; padding:.5rem .75rem; font-size:.95rem; cursor:pointer;
        }
        .btn{ color:var(--text-secondary); }
        .btn.active{ border-color:var(--primary-color); color:#fff; background:var(--primary-color); }

        .indicators{ display:grid; grid-template-columns:repeat(4,1fr); gap:.75rem; }
        .ind-item{ background:var(--dark-bg); border:1px solid var(--border-color); border-radius:8px; padding:.75rem; }
        .ind-label{ color:var(--text-secondary); font-size:.8rem; margin-bottom:.2rem; }
        .ind-value{ font-weight:700; }
        .signals .signal{
            display:flex; gap:.75rem; align-items:flex-start; padding:.75rem; border-left:3px solid; border-radius:8px;
            background:var(--dark-bg); margin-bottom:.6rem;
        }
        .signal.buy{ border-color:var(--success-color); }
        .signal.sell{ border-color:var(--danger-color); }
        .signal.neutral{ border-color:var(--warning-color); }
        .signal .title{ font-weight:700; margin-bottom:.25rem; }
        .signal .desc{ color:var(--text-secondary); font-size:.9rem; }

        .toast{
            position:fixed; bottom:20px; right:20px; z-index:1001;
            background:var(--card-bg); border-left:4px solid var(--primary-color);
            color:var(--text-primary); padding:1rem 1.25rem; border-radius:8px;
            transform:translateX(400px); transition:transform .3s ease; display:flex; align-items:center; gap:.5rem;
        }
        .toast.show{ transform:translateX(0); }
        .toast.success{ border-left-color:var(--success-color); }
        .toast.error{ border-left-color:var(--danger-color); }
        .toast.warning{ border-left-color:var(--warning-color); }

        .data-source-info{
            position:fixed; bottom:20px; left:20px; background:rgba(30,41,59,0.9);
            color:var(--text-secondary); padding:.5rem .75rem; border-radius:8px; font-size:.75rem; z-index:1000;
        }

        .api-status{
            position:fixed; top:80px; right:20px; background:var(--card-bg);
            border:1px solid var(--border-color); border-radius:8px; padding:1rem; max-width:300px; display:none; z-index:1000;
        }
        .api-status.show{ display:block; }
        .api-status .title{ color:var(--warning-color); font-weight:700; margin-bottom:.5rem; }
        .api-status .msg{ color:var(--text-secondary); font-size:.9rem; margin-bottom:.75rem; }
        .api-status .action{ background:var(--primary-color); color:#fff; border:none; border-radius:8px; padding:.5rem .75rem; cursor:pointer; }

        .social-footer{ background:var(--card-bg); border-top:1px solid var(--border-color); padding:2rem 0; margin-top:2rem; }
        .container{ max-width:1400px; margin:0 auto; padding:0 2rem; text-align:center; }
        .social-links{ display:flex; justify-content:center; gap:1.25rem; margin-bottom:1rem; }
        .social-link{ display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:var(--dark-bg); color:var(--text-secondary); }
        .social-link:hover{ color:var(--primary-color); transform:translateY(-3px); }

        @media (max-width:1200px){ .grid-2{ grid-template-columns:1fr; } }
        @media (max-width:768px){
            .market-overview{ grid-template-columns:1fr; }
            .indicators{ grid-template-columns:1fr 1fr; }
            .grid-2-bottom{ grid-template-columns:1fr; }
        }
        ::-webkit-scrollbar{ width:8px; height:8px; }
        ::-webkit-scrollbar-track{ background:var(--dark-bg); }
        ::-webkit-scrollbar-thumb{ background:var(--border-color); border-radius:4px; }
        ::-webkit-scrollbar-thumb:hover{ background:var(--text-secondary); }
    </style>
</head>

    <script>
        // ========== 使用说明 ==========
        // 1) 在GitHub仓库中维护每日数据JSON，并使用Raw链接替换 DATA_SOURCE_URL。
        // 2) 推荐JSON结构（示例）：
        // {
        //   "updatedAt":"2025-10-31T00:00:00Z",
        //   "meta":{
        //     "symbols":{
        //       "BTCUSDT":{"symbol":"BTC","name":"Bitcoin","color":"#f7931a"},
        //       "ETHUSDT":{"symbol":"ETH","name":"Ethereum","color":"#627eea"}
        //     }
        //   },
        //   "pairs":{
        //     "BTCUSDT":[
        //       {"date":"2025-10-01","open":43000,"high":44000,"low":42500,"close":43880,"volume":123456789,"marketCap":850000000000},
        //       {"date":"2025-10-02","open":43880,"high":44500,"low":43050,"close":44120,"volume":113456789,"marketCap":855000000000}
        //     ],
        //     "ETHUSDT":[
        //       {"date":"2025-10-01","open":2250,"high":2320,"low":2210,"close":2298,"volume":34567890,"marketCap":280000000000}
        //     ]
        //   }
        // }

        // ========== 配置 ==========
        const DATA_SOURCE_URL = 'https://raw.githubusercontent.com/<your-username>/<your-repo>/main/data/market-data.json'; // 替换为你的Raw地址
        const DEFAULT_COLORS = {
            BTCUSDT: '#f7931a',
            ETHUSDT: '#627eea',
            BNBUSDT: '#f3ba2f',
            SOLUSDT: '#00d4aa',
            ADAUSDT: '#0033ad',
            XRPUSDT: '#23292f',
            DOGEUSDT: '#c2a633',
            DOTUSDT: '#e6007a'
        };

        // ========== 全局状态 ==========
        let rawData = null;               // 原始JSON
        let pairs = {};                   // 标准化后的数据 {pair:[{t,o,h,l,c,v,mc}]}
        let meta = { symbols:{} };        // 元信息
        let currentPair = null;
        let rangeDays = 90;
        let priceChart = null;
        let volumeChart = null;

        // ========== 工具 ==========
        function showToast(msg, type='success'){
            const el = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const txt = document.getElementById('toastMsg');
            txt.textContent = msg;
            el.className = 'toast ' + type + ' show';
            if(type==='success') icon.className='fas fa-check-circle';
            if(type==='error') icon.className='fas fa-exclamation-circle';
            if(type==='warning') icon.className='fas fa-exclamation-triangle';
            setTimeout(()=>el.classList.remove('show'), 2800);
        }
        function setConn(ok, text){
            document.getElementById('connDot').className = 'status-dot ' + (ok ? 'ok':'err');
            document.getElementById('connText').textContent = text;
        }
        function fmtNum(n, d=2){
            if(n===undefined || n===null || isNaN(n)) return '-';
            return Number(n).toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
        }
        function last(arr, n=1){ return arr.slice(-n)[0]; }
        function toMs(dateStr){ return new Date(dateStr+'T00:00:00Z').getTime(); }

        // 指标计算
        function SMA(values, period){
            if(values.length < period) return null;
            const slice = values.slice(-period);
            const sum = slice.reduce((a,b)=>a+b,0);
            return sum/period;
        }
        function EMA(values, period){
            if(values.length < period) return null;
            const k = 2/(period+1);
            let ema = values[0];
            for(let i=1;i<values.length;i++){
                ema = values[i]*k + ema*(1-k);
            }
            return ema;
        }
        function RSI(values, period=14){
            if(values.length < period+1) return null;
            let gains=0, losses=0;
            for(let i=values.length-period;i<values.length;i++){
                const diff = values[i]-values[i-1];
                if(diff>0) gains+=diff; else losses-=diff;
            }
            const avgGain = gains/period;
            const avgLoss = losses/period || 1e-9;
            const rs = avgGain/avgLoss;
            return 100 - 100/(1+rs);
        }
        function MACD(values){
            if(values.length < 26) return {macd:null, signal:null, hist:null};
            // 为可重复使用，计算完整EMA序列
            const emaSeq = (vals, p)=>{
                const k = 2/(p+1);
                let out = [vals[0]];
                for(let i=1;i<vals.length;i++){
                    out.push(vals[i]*k + out[i-1]*(1-k));
                }
                return out;
            };
            const ema12 = emaSeq(values,12);
            const ema26 = emaSeq(values,26);
            let macdLine = values.map((_,i)=>(ema12[i]!==undefined && ema26[i]!==undefined)? ema12[i]-ema26[i] : null);
            macdLine = macdLine.filter(v=>v!==null);
            const signalLine = emaSeq(macdLine,9);
            const macd = last(macdLine);
            const signal = last(signalLine);
            const hist = macd - signal;
            return {macd, signal, hist};
        }

        // ========== 数据加载 ==========
        async function loadFromGitHub(){
            const apiBox = document.getElementById('apiStatus');
            try{
                setConn(false, '从GitHub加载数据...');
                apiBox.classList.remove('show');
                const resp = await fetch(DATA_SOURCE_URL, { cache:'no-cache' });
                if(!resp.ok) throw new Error('HTTP '+resp.status);
                rawData = await resp.json();
                normalizeData(rawData);
                setConn(true, '已连接GitHub');
                document.getElementById('dataSourceText').textContent = `数据来源: GitHub JSON | 最近更新: ${rawData.updatedAt || '未知'}`;
                showToast('数据加载成功','success');
            }catch(err){
                console.error('加载失败:', err);
                setConn(false, '加载失败');
                document.getElementById('apiMsg').textContent = '无法从GitHub加载数据，请检查Raw链接是否正确、仓库是否公开、JSON是否有效。';
                apiBox.classList.add('show');
                showToast('加载失败，请检查数据源','error');
                throw err;
            }
        }

        function normalizeData(data){
            pairs = {};
            meta = data.meta || {symbols:{}};
            const p = data.pairs || {};
            Object.keys(p).forEach(key=>{
                const arr = (p[key]||[]).slice().sort((a,b)=> toMs(a.date)-toMs(b.date));
                pairs[key] = arr.map(d=>({
                    t: toMs(d.date),
                    o: +d.open, h: +d.high, l: +d.low, c: +d.close,
                    v: +d.volume || 0,
                    mc: +d.marketCap || 0,
                    date: d.date
                }));
            });
        }

        // ========== UI渲染 ==========
        function renderPairSelect(){
            const sel = document.getElementById('pairSelect');
            sel.innerHTML = '';
            const keys = Object.keys(pairs).sort();
            keys.forEach(k=>{
                const info = meta.symbols?.[k] || {};
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = `${info.symbol || k.replace('USDT','')} / USDT`;
                sel.appendChild(opt);
            });
            if(!currentPair) currentPair = keys[0] || null;
            if(currentPair) sel.value = currentPair;
            sel.onchange = ()=>{
                currentPair = sel.value;
                refreshAll();
                showToast(`已切换到 ${getName(currentPair)}`,'success');
            };
        }

        function getColor(pair){ return (meta.symbols?.[pair]?.color) || DEFAULT_COLORS[pair] || '#667eea'; }
        function getSymbol(pair){ return (meta.symbols?.[pair]?.symbol) || pair; }
        function getName(pair){ return `${getSymbol(pair)}/USDT`; }

        function renderMarketOverview(){
            const container = document.getElementById('marketOverview');
            container.innerHTML = '';
            // 选前4名（按最新市值或成交量排序）
            const cards = Object.keys(pairs).map(k=>{
                const arr = pairs[k];
                const lastBar = last(arr);
                const prevBar = arr.length>1 ? arr[arr.length-2] : lastBar;
                const change = lastBar && prevBar ? ((lastBar.c - prevBar.c)/prevBar.c)*100 : 0;
                return {
                    key:k, last:lastBar, prev:prevBar, change,
                    score: lastBar?.mc || lastBar?.v || 0
                };
            }).sort((a,b)=> (b.score - a.score)).slice(0,4);

            cards.forEach(item=>{
                const k = item.key;
                const info = meta.symbols?.[k] || {};
                const color = getColor(k);
                const isUp = item.change >= 0;
                const el = document.createElement('div');
                el.className = 'market-card';
                el.innerHTML = `
                    <div class="coin-header">
                        <div class="coin-info">
                            <div class="coin-icon" style="background:${color};">${(info.symbol || k).replace('USDT','').slice(0,3)}</div>
                            <div>
                                <div style="font-weight:600;">${info.name || getSymbol(k)}</div>
                                <div style="font-size:.8rem; color:var(--text-secondary);">${getName(k)}</div>
                            </div>
                        </div>
                        <button class="btn" onclick="quickSwitch('${k}')">查看</button>
                    </div>
                    <div class="coin-price">$${fmtNum(item.last?.c, 2)}</div>
                    <span class="price-change ${isUp?'up':'down'}">
                        <i class="fas fa-arrow-${isUp?'up':'down'}"></i>
                        ${isUp?'+':''}${fmtNum(item.change,2)}%
                    </span>
                    <div style="margin-top:.75rem; display:flex; justify-content:space-between; font-size:.9rem;">
                        <span>24H最高: $${fmtNum(item.last?.h,2)}</span>
                        <span>24H最低: $${fmtNum(item.last?.l,2)}</span>
                    </div>
                    <div style="margin-top:.4rem; display:flex; justify-content:space-between; font-size:.9rem;">
                        <span>24H成交量: $${fmtNum(item.last?.v/1e6,1)}M</span>
                        <span>市值: $${fmtNum(item.last?.mc/1e9,1)}B</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function quickSwitch(k){
            currentPair = k;
            document.getElementById('pairSelect').value = k;
            refreshAll();
            showToast(`已切换到 ${getName(k)}`,'success');
        }

        function getRangedData(arr){
            if(rangeDays==='all') return arr;
            const cutoff = Date.now() - rangeDays*24*60*60*1000;
            return arr.filter(d=> d.t >= cutoff);
        }

        function renderCharts(){
            if(!currentPair || !pairs[currentPair] || pairs[currentPair].length===0) return;
            const all = pairs[currentPair];
            const data = getRangedData(all);
            const color = getColor(currentPair);

            const candle = data.map(d=>({ x:d.t, y:[d.o, d.h, d.l, d.c].map(v=>+v.toFixed(2)) }));
            const volumes = data.map(d=>({ x:d.t, y: d.v }));

            const priceOptions = {
                series: [{ name:'价格', type:'candlestick', data: candle }],
                chart: {
                    type:'candlestick', height:420, background:'transparent',
                    toolbar:{ show:true, tools:{ download:true, selection:true, zoom:true, zoomin:true, zoomout:true, pan:true, reset:true } }
                },
                theme:{ mode:'dark' },
                plotOptions:{ candlestick:{ colors:{ upward:'#10b981', downward:'#ef4444' } } },
                xaxis:{ type:'datetime', labels:{ style:{ colors:'#94a3b8' } } },
                yaxis:{ labels:{ style:{ colors:'#94a3b8' } } },
                grid:{ borderColor:'#334155', strokeDashArray:4 },
                tooltip:{ theme:'dark' }
            };

            const volOptions = {
                series:[{ name:'成交量', data:volumes }],
                chart:{ type:'bar', height:300, background:'transparent', toolbar:{ show:false } },
                theme:{ mode:'dark' },
                plotOptions:{ bar:{ borderRadius:4 } },
                colors:[color],
                xaxis:{ type:'datetime', labels:{ style:{ colors:'#94a3b8' } } },
                yaxis:{ labels:{ style:{ colors:'#94a3b8' } } },
                grid:{ borderColor:'#334155', strokeDashArray:4 },
                tooltip:{ theme:'dark' }
            };

            if(priceChart){ priceChart.destroy(); }
            priceChart = new ApexCharts(document.querySelector('#priceChart'), priceOptions);
            priceChart.render();

            if(volumeChart){ volumeChart.destroy(); }
            volumeChart = new ApexCharts(document.querySelector('#volumeChart'), volOptions);
            volumeChart.render();

            document.getElementById('chartTitle').textContent = `${getName(currentPair)} K线图`;
        }

        function renderIndicatorsAndSignals(){
            if(!currentPair || !pairs[currentPair] || pairs[currentPair].length===0) return;
            const all = pairs[currentPair];
            const data = getRangedData(all);
            const closes = data.map(d=>d.c);

            const ma7 = SMA(closes, 7);
            const ma25 = SMA(closes, 25);
            const rsi = RSI(closes, 14);
            const { macd, signal, hist } = MACD(closes);

            document.getElementById('ma7').textContent = ma7 ? ('$'+fmtNum(ma7,2)) : '-';
            document.getElementById('ma25').textContent = ma25 ? ('$'+fmtNum(ma25,2)) : '-';
            document.getElementById('rsi').textContent = rsi ? fmtNum(rsi,1) : '-';
            document.getElementById('macd').textContent = macd!==null ? (macd>=0? '+'+fmtNum(macd,2):fmtNum(macd,2)) : '-';

            // 生成信号（基于最近两天交叉/阈值）
            const signalsBox = document.getElementById('signals');
            signalsBox.innerHTML = '';
            const recent = all.slice(-30); // 近30天内寻找事件
            const rc = recent.map(d=>d.c);
            const evts = [];

            // MA交叉
            if(rc.length>=26){
                const ma7_seq = rc.map((_,i)=> i<6? null : SMA(rc.slice(0,i+1),7));
                const ma25_seq = rc.map((_,i)=> i<24? null : SMA(rc.slice(0,i+1),25));
                for(let i=1;i<rc.length;i++){
                    const a1=ma7_seq[i-1], b1=ma25_seq[i-1];
                    const a2=ma7_seq[i],   b2=ma25_seq[i];
                    if(a1!==null && b1!==null && a2!==null && b2!==null){
                        if(a1<=b1 && a2>b2) evts.push({type:'buy', title:'MA金叉', desc:'短期均线上穿长期均线，趋势转强'});
                        if(a1>=b1 && a2<b2) evts.push({type:'sell', title:'MA死叉', desc:'短期均线下穿长期均线，趋势转弱'});
                    }
                }
            }
            // RSI阈值
            if(rsi!==null){
                if(rsi<30) evts.push({type:'buy', title:'RSI超卖', desc:'RSI<30，可能出现反弹'});
                if(rsi>70) evts.push({type:'sell', title:'RSI超买', desc:'RSI>70，注意回调风险'});
            }
            // MACD交叉
            if(rc.length>=26){
                // 粗略生成MACD序列判断交叉
                const macdSeq = [];
                for(let i=0;i<rc.length;i++){
                    const partial = rc.slice(0,i+1);
                    const m = MACD(partial);
                    macdSeq.push(m);
                }
                for(let i=1;i<macdSeq.length;i++){
                    const p1=macdSeq[i-1], p2=macdSeq[i];
                    if(p1.macd!==null && p1.signal!==null && p2.macd!==null && p2.signal!==null){
                        if(p1.macd<=p1.signal && p2.macd>p2.signal) evts.push({type:'buy', title:'MACD金叉', desc:'MACD线上穿信号线'});
                        if(p1.macd>=p1.signal && p2.macd<p2.signal) evts.push({type:'sell', title:'MACD死叉', desc:'MACD线下穿信号线'});
                    }
                }
            }

            // 只展示最近3条
            evts.slice(-3).reverse().forEach(e=>{
                const node = document.createElement('div');
                node.className = `signal ${e.type}`;
                node.innerHTML = `
                    <div class="icon" style="color: var(--${e.type==='buy'?'success':e.type==='sell'?'danger':'warning'}-color); font-size:1.25rem;"><i class="fas ${e.type==='buy'?'fa-arrow-trend-up':e.type==='sell'?'fa-arrow-trend-down':'fa-minus'}"></i></div>
                    <div class="content">
                        <div class="title">${e.title}</div>
                        <div class="desc">${e.desc}</div>
                    </div>
                `;
                signalsBox.appendChild(node);
            });

            renderActivities(evts);
        }

        function renderActivities(evts){
            const box = document.getElementById('activityFeed');
            box.innerHTML = '';
            const lastBar = last(pairs[currentPair]||[]);
            const items = [];
            if(lastBar){
                const prev = pairs[currentPair].length>1 ? pairs[currentPair][pairs[currentPair].length-2] : lastBar;
                const chg = prev && prev.c ? ((lastBar.c - prev.c)/prev.c)*100 : 0;
                items.push({icon:'fa-arrow-up', color:'success', title:`${getSymbol(currentPair)} 收盘价`, sub:`$${fmtNum(lastBar.c,2)} · ${lastBar.date}`});
                items.push({icon: chg>=0?'fa-arrow-trend-up':'fa-arrow-trend-down', color: chg>=0?'success':'danger', title:`日变动`, sub:`${chg>=0?'+':''}${fmtNum(chg,2)}%`});
                items.push({icon:'fa-chart-column', color:'primary', title:'成交量', sub:`$${fmtNum(lastBar.v/1e6,2)}M`});
            }
            const map = evts.slice(-2).reverse().map(e=>({
                icon: e.type==='buy'?'fa-circle-up':'fa-circle-down',
                color: e.type==='buy'?'success':'danger',
                title: e.title, sub: e.desc
            }));
            [...items, ...map].forEach(a=>{
                const row = document.createElement('div');
                row.className = 'activity-item';
                row.style = 'display:flex;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--border-color);';
                row.innerHTML = `
                    <div class="activity-icon" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(102,126,234,0.2);color:var(--${a.color}-color);">
                        <i class="fas ${a.icon}"></i>
                    </div>
                    <div class="activity-content" style="flex:1;">
                        <div class="activity-title" style="font-size:.95rem;margin-bottom:.15rem;">${a.title}</div>
                        <div class="activity-subtitle" style="font-size:.82rem;color:var(--text-secondary);">${a.sub}</div>
                    </div>
                `;
                box.appendChild(row);
            });
        }

        function wireTimeButtons(){
            const wrap = document.getElementById('timeButtons');
            wrap.querySelectorAll('button').forEach(btn=>{
                btn.onclick = ()=>{
                    wrap.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
                    btn.classList.add('active');
                    const r = btn.getAttribute('data-range');
                    rangeDays = (r==='all') ? 'all' : parseInt(r,10);
                    refreshAll();
                };
            });
        }

        function refreshAll(){
            renderMarketOverview();
            renderCharts();
            renderIndicatorsAndSignals();
        }

        async function reloadData(){
            try{
                await loadFromGitHub();
                renderPairSelect();
                refreshAll();
            }catch(_){}
        }

        // 启动
        document.addEventListener('DOMContentLoaded', async ()=>{
            wireTimeButtons();
            try{
                await loadFromGitHub();
                renderPairSelect();
                refreshAll();
            }catch(_){}
        });
    </script>
</body>
</html>
