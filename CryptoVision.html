<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoVision Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入优质字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        :root {
            /* 主色调 - 奢华渐变 */
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-gold: #f59e0b;
            --accent-silver: #94a3b8;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            
            /* 背景色系 */
            --dark-bg: #0a0e1a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-hover-bg: rgba(51, 65, 85, 0.95);
            
            /* 文字色系 */
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            
            /* 边框和分隔 */
            --border-color: rgba(148, 163, 184, 0.15);
            --border-highlight: rgba(102, 126, 234, 0.3);
            
            /* 阴影系统 */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.12);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.16);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.24);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.32);
            --shadow-glow: 0 0 32px rgba(102, 126, 234, 0.2);
            
            /* 间距系统 */
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            
            /* 圆角 */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            /* 字体 */
            --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
        }
        
        body {
            font-family: var(--font-sans);
            font-weight: 400;
            font-size: 15px;
            line-height: 1.7;
            letter-spacing: -0.01em;
            background: 
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.08) 0%, transparent 50%),
                linear-gradient(180deg, #0a0e1a 0%, #1e293b 100%),
                url('images/1b2f1ee2a9dba66e20cd0e210ba09e28.png') no-repeat center center fixed;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Header 导航栏 */
        header {
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-lg) var(--spacing-xl);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }
        
        .header-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
        
        .reading-return {
            color: var(--text-secondary);
            text-decoration: none;
            margin-right: var(--spacing-md);
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .reading-return:hover {
            color: var(--primary-color);
            transform: translateX(-4px);
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }
        
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: var(--radius-lg);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            box-shadow: var(--shadow-md), var(--shadow-glow);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: var(--shadow-lg), 0 0 40px rgba(102, 126, 234, 0.5);
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: 0.5rem 1.25rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--warning-color);
            box-shadow: 0 0 12px currentColor;
            transition: all 0.3s ease;
        }
        
        .status-dot.ok {
            background: var(--success-color);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-dot.err {
            background: var(--danger-color);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        
        /* 主容器 */
        .main-container {
            max-width: 1600px;
            margin: var(--spacing-2xl) auto;
            padding: 0 var(--spacing-xl);
        }
        
        /* 市场概览卡片 */
        .market-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
        }
        
        .market-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }
        
        .market-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-gold));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .market-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: radial-gradient(circle at top right, rgba(102, 126, 234, 0.05), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .market-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            border-color: var(--border-highlight);
            background: var(--card-hover-bg);
        }
        
        .market-card:hover::before,
        .market-card:hover::after {
            opacity: 1;
        }
        
        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .coin-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .coin-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            box-shadow: var(--shadow-md), 0 0 20px currentColor;
            transition: all 0.3s ease;
        }
        
        .market-card:hover .coin-icon {
            transform: rotate(360deg) scale(1.1);
        }
        
        .coin-info > div {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }
        
        .coin-info > div div:last-child {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-tertiary);
            margin-top: 0.25rem;
        }
        
        .coin-price {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: var(--spacing-sm) 0;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .price-change {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
        }
        
        .price-change.up {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            color: var(--success-color);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }
        
        .price-change.down {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
            color: var(--danger-color);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }
        
        .market-card > div:last-child,
        .market-card > div:nth-last-child(2) {
            margin-top: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }
        
        /* 面板样式 */
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        
        .panel:hover {
            border-color: var(--border-highlight);
            box-shadow: var(--shadow-md);
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .grid-2-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }
        
        .panel-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            margin-bottom: var(--spacing-lg);
            color: var(--text-primary);
        }
        
        .panel-title i {
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        
        /* 控制按钮 */
        .controls {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: var(--spacing-lg);
        }
        
        .select, .btn {
            border: 1.5px solid var(--border-color);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .select {
            font-family: var(--font-sans);
        }
        
        .btn {
            color: var(--text-secondary);
        }
        
        .btn:hover {
            border-color: var(--primary-color);
            background: rgba(102, 126, 234, 0.1);
            color: var(--primary-color);
            transform: translateY(-2px);
        }
        
        .btn.active {
            border-color: var(--primary-color);
            color: #fff;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: var(--shadow-md), 0 0 20px rgba(102, 126, 234, 0.3);
            font-weight: 600;
        }
        
        /* 指标卡片 */
        .indicators {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-md);
        }
        
        .ind-item {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: var(--spacing-md);
            transition: all 0.3s ease;
        }
        
        .ind-item:hover {
            background: rgba(102, 126, 234, 0.08);
            border-color: var(--border-highlight);
            transform: translateY(-2px);
        }
        
        .ind-label {
            color: var(--text-tertiary);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        
        .ind-value {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }
        
        /* 信号卡片 */
        .signals .signal {
            display: flex;
            gap: var(--spacing-md);
            align-items: flex-start;
            padding: var(--spacing-md);
            border-left: 3px solid;
            border-radius: var(--radius-sm);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
            margin-bottom: var(--spacing-sm);
            transition: all 0.3s ease;
        }
        
        .signal:hover {
            transform: translateX(4px);
            background: rgba(15, 23, 42, 0.7);
        }
        
        .signal.buy {
            border-color: var(--success-color);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }
        
        .signal.sell {
            border-color: var(--danger-color);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
        }
        
        .signal.neutral {
            border-color: var(--warning-color);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.1);
        }
        
        .signal .title {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.01em;
            margin-bottom: 0.35rem;
        }
        
        .signal .desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        /* Toast 通知 */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1001;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-left: 4px solid var(--primary-color);
            color: var(--text-primary);
            padding: var(--spacing-lg) var(--spacing-xl);
            border-radius: var(--radius-md);
            transform: translateX(500px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            box-shadow: var(--shadow-xl);
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.success {
            border-left-color: var(--success-color);
        }
        
        .toast.error {
            border-left-color: var(--danger-color);
        }
        
        .toast.warning {
            border-left-color: var(--warning-color);
        }
        
        /* 数据源信息 */
        .data-source-info {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(10, 14, 26, 0.9);
            backdrop-filter: blur(16px);
            color: var(--text-tertiary);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            z-index: 1000;
            border: 1px solid var(--border-color);
        }
        
        /* API状态 */
        .api-status {
            position: fixed;
            top: 100px;
            right: 30px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-xl);
            max-width: 350px;
            display: none;
            z-index: 1000;
            box-shadow: var(--shadow-xl);
        }
        
        .api-status.show {
            display: block;
        }
        
        .api-status .title {
            color: var(--warning-color);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: var(--spacing-md);
            letter-spacing: -0.01em;
        }
        
        .api-status .msg {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: var(--spacing-lg);
        }
        
        .api-status .action {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }
        
        .api-status .action:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        /* Footer */
        .social-footer {
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            padding: var(--spacing-2xl) 0;
            margin-top: var(--spacing-2xl);
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 var(--spacing-xl);
            text-align: center;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.2rem;
        }
        
        .social-link:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-6px) rotate(5deg);
            box-shadow: var(--shadow-lg), 0 0 30px rgba(102, 126, 234, 0.3);
        }
        
        .copyright {
            color: var(--text-tertiary);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            
            header {
                padding: var(--spacing-md) var(--spacing-lg);
            }
            
            .logo {
                font-size: 1.4rem;
            }
            
            .main-container {
                padding: 0 var(--spacing-md);
            }
            
            .market-overview {
                grid-template-columns: 1fr;
            }
            
            .indicators {
                grid-template-columns: 1fr 1fr;
            }
            
            .grid-2-bottom {
                grid-template-columns: 1fr;
            }
            
            .nav-right {
                flex-wrap: wrap;
                gap: var(--spacing-sm);
            }
            
            .nav-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
            
            .coin-price {
                font-size: 1.6rem;
            }
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--secondary-color), var(--primary-color));
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        
        /* 选中文本样式 */
        ::selection {
            background: rgba(102, 126, 234, 0.3);
            color: var(--text-primary);
        }
        
        ::-moz-selection {
            background: rgba(102, 126, 234, 0.3);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <!-- Header（增加投资文章按钮） -->
    <header>
        <div class="header-container">

    <script>
        const DATA_SOURCE_URL = 'https://raw.githubusercontent.com/kuangketongxue/kuangke.github.io/refs/heads/main/crypto.json';
        const DEFAULT_COLORS = {
            BTCUSDT: '#f7931a',
            ETHUSDT: '#627eea',
            BNBUSDT: '#f3ba2f',
            SOLUSDT: '#00d4aa',
            ADAUSDT: '#0033ad',
            XRPUSDT: '#23292f',
            DOGEUSDT: '#c2a633',
            DOTUSDT: '#e6007a'
        };
        let rawData = null;
        let pairs = {};
        let meta = { symbols:{} };
        let currentPair = null;
        let rangeDays = 90;
        let priceChart = null;
        let volumeChart = null;
        function showToast(msg, type='success'){
            const el = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const txt = document.getElementById('toastMsg');
            txt.textContent = msg;
            el.className = 'toast ' + type + ' show';
            if(type==='success') icon.className='fas fa-check-circle';
            if(type==='error') icon.className='fas fa-exclamation-circle';
            if(type==='warning') icon.className='fas fa-exclamation-triangle';
            setTimeout(()=>el.classList.remove('show'), 2800);
        }
        function setConn(ok, text){
            document.getElementById('connDot').className = 'status-dot ' + (ok ? 'ok':'err');
            document.getElementById('connText').textContent = text;
        }
        function fmtNum(n, d=2){
            if(n===undefined || n===null || isNaN(n)) return '-';
            return Number(n).toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
        }
        function last(arr, n=1){ return arr.slice(-n)[0]; }
        function toMs(dateStr){ return new Date(dateStr+'T00:00:00Z').getTime(); }
        function SMA(values, period){
            if(values.length < period) return null;
            const slice = values.slice(-period);
            const sum = slice.reduce((a,b)=>a+b,0);
            return sum/period;
        }
        function EMA(values, period){
            if(values.length < period) return null;
            const k = 2/(period+1);
            let ema = values[0];
            for(let i=1;i<values.length;i++){
                ema = values[i]*k + ema*(1-k);
            }
            return ema;
        }
        function RSI(values, period=14){
            if(values.length < period+1) return null;
            let gains=0, losses=0;
            for(let i=values.length-period;i<values.length;i++){
                const diff = values[i]-values[i-1];
                if(diff>0) gains+=diff; else losses-=diff;
            }
            const avgGain = gains/period;
            const avgLoss = losses/period || 1e-9;
            const rs = avgGain/avgLoss;
            return 100 - 100/(1+rs);
        }
        function MACD(values){
            if(values.length < 26) return {macd:null, signal:null, hist:null};
            const emaSeq = (vals, p)=>{
                const k = 2/(p+1);
                let out = [vals[0]];
                for(let i=1;i<vals.length;i++){
                    out.push(vals[i]*k + out[i-1]*(1-k));
                }
                return out;
            };
            const ema12 = emaSeq(values,12);
            const ema26 = emaSeq(values,26);
            let macdLine = values.map((_,i)=>(ema12[i]!==undefined && ema26[i]!==undefined)? ema12[i]-ema26[i] : null);
            macdLine = macdLine.filter(v=>v!==null);
            const signalLine = emaSeq(macdLine,9);
            const macd = last(macdLine);
            const signal = last(signalLine);
            const hist = macd - signal;
            return {macd, signal, hist};
        }
        async function loadFromGitHub(){
            const apiBox = document.getElementById('apiStatus');
            try{
                setConn(false, '从GitHub加载数据...');
                apiBox.classList.remove('show');
                const resp = await fetch(DATA_SOURCE_URL, { cache:'no-cache' });
                if(!resp.ok) throw new Error('HTTP '+resp.status);
                rawData = await resp.json();
                normalizeData(rawData);
                setConn(true, '已连接GitHub');
                document.getElementById('dataSourceText').textContent = `数据来源: GitHub JSON | 最近更新: ${rawData.updatedAt || '未知'}`;
                showToast('数据加载成功','success');
            }catch(err){
                console.error('加载失败:', err);
                setConn(false, '加载失败');
                document.getElementById('apiMsg').textContent = '无法从GitHub加载数据，请检查Raw链接是否正确、仓库是否公开、JSON是否有效。';
                apiBox.classList.add('show');
                showToast('加载失败，请检查数据源','error');
                throw err;
            }
        }
        function normalizeData(data){
            pairs = {};
            meta = data.meta || {symbols:{}};
            const p = data.pairs || {};
            Object.keys(p).forEach(key=>{
                const arr = (p[key]||[]).slice().sort((a,b)=> toMs(a.date)-toMs(b.date));
                pairs[key] = arr.map(d=>({
                    t: toMs(d.date),
                    o: +d.open, h: +d.high, l: +d.low, c: +d.close,
                    v: +d.volume || 0,
                    mc: +d.marketCap || 0,
                    date: d.date
                }));
            });
        }
        function renderPairSelect(){
            const sel = document.getElementById('pairSelect');
            sel.innerHTML = '';
            const keys = Object.keys(pairs).sort();
            keys.forEach(k=>{
                const info = meta.symbols?.[k] || {};
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = `${info.symbol || k.replace('USDT','')} / USDT`;
                sel.appendChild(opt);
            });
            if(!currentPair) currentPair = keys[0] || null;
            if(currentPair) sel.value = currentPair;
            sel.onchange = ()=>{
                currentPair = sel.value;
                refreshAll();
                showToast(`已切换到 ${getName(currentPair)}`,'success');
            };
        }
        function getColor(pair){ return (meta.symbols?.[pair]?.color) || DEFAULT_COLORS[pair] || '#667eea'; }
        function getSymbol(pair){ return (meta.symbols?.[pair]?.symbol) || pair; }
        function getName(pair){ return `${getSymbol(pair)}/USDT`; }
        function renderMarketOverview(){
            const container = document.getElementById('marketOverview');
            container.innerHTML = '';
            const cards = Object.keys(pairs).map(k=>{
                const arr = pairs[k];
                const lastBar = last(arr);
                const prevBar = arr.length>1 ? arr[arr.length-2] : lastBar;
                const change = lastBar && prevBar ? ((lastBar.c - prevBar.c)/prevBar.c)*100 : 0;
                return {
                    key:k, last:lastBar, prev:prevBar, change,
                    score: lastBar?.mc || lastBar?.v || 0
                };
            }).sort((a,b)=> (b.score - a.score)).slice(0,4);
            cards.forEach(item=>{
                const k = item.key;
                const info = meta.symbols?.[k] || {};
                const color = getColor(k);
                const isUp = item.change >= 0;
                const el = document.createElement('div');
                el.className = 'market-card';
                el.innerHTML = `
                    <div class="coin-header">
                        <div class="coin-info">
                            <div class="coin-icon" style="background:${color};">${(info.symbol || k).replace('USDT','').slice(0,3)}</div>
                            <div>
                                <div style="font-weight:600;">${info.name || getSymbol(k)}</div>
                                <div style="font-size:.8rem; color:var(--text-secondary);">${getName(k)}</div>
                            </div>
                        </div>
                        <button class="btn" onclick="quickSwitch('${k}')">查看</button>
                    </div>
                    <div class="coin-price">$${fmtNum(item.last?.c, 2)}</div>
                    <span class="price-change ${isUp?'up':'down'}">
                        <i class="fas fa-arrow-${isUp?'up':'down'}"></i>
                        ${isUp?'+':''}${fmtNum(item.change,2)}%
                    </span>
                    <div style="margin-top:.75rem; display:flex; justify-content:space-between; font-size:.9rem;">
                        <span>24H最高: $${fmtNum(item.last?.h,2)}</span>
                        <span>24H最低: $${fmtNum(item.last?.l,2)}</span>
                    </div>
                    <div style="margin-top:.4rem; display:flex; justify-content:space-between; font-size:.9rem;">
                        <span>24H成交量: $${fmtNum(item.last?.v/1e6,1)}M</span>
                        <span>市值: $${fmtNum(item.last?.mc/1e9,1)}B</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }
        function quickSwitch(k){
            currentPair = k;
            document.getElementById('pairSelect').value = k;
            refreshAll();
            showToast(`已切换到 ${getName(k)}`,'success');
        }
        function getRangedData(arr){
            if(rangeDays==='all') return arr;
            const cutoff = Date.now() - rangeDays*24*60*60*1000;
            return arr.filter(d=> d.t >= cutoff);
        }
        function renderCharts(){
            if(!currentPair || !pairs[currentPair] || pairs[currentPair].length===0) return;
            const all = pairs[currentPair];
            const data = getRangedData(all);
            const color = getColor(currentPair);
            const candle = data.map(d=>({ x:d.t, y:[d.o, d.h, d.l, d.c].map(v=>+v.toFixed(2)) }));
            const volumes = data.map(d=>({ x:d.t, y: d.v }));
            const priceOptions = {
                series: [{ name:'价格', type:'candlestick', data: candle }],
                chart: {
                    type:'candlestick', height:420, background:'transparent',
                    toolbar:{ show:true, tools:{ download:true, selection:true, zoom:true, zoomin:true, zoomout:true, pan:true, reset:true } }
                },
                theme:{ mode:'dark' },
                plotOptions:{ candlestick:{ colors:{ upward:'#10b981', downward:'#ef4444' } } },
                xaxis:{ type:'datetime', labels:{ style:{ colors:'#94a3b8' } } },
                yaxis:{ labels:{ style:{ colors:'#94a3b8' } } },
                grid:{ borderColor:'#334155', strokeDashArray:4 },
                tooltip:{ theme:'dark' }
            };
            const volOptions = {
                series:[{ name:'成交量', data:volumes }],
                chart:{ type:'bar', height:300, background:'transparent', toolbar:{ show:false } },
                theme:{ mode:'dark' },
                plotOptions:{ bar:{ borderRadius:4 } },
                colors:[color],
                xaxis:{ type:'datetime', labels:{ style:{ colors:'#94a3b8' } } },
                yaxis:{ labels:{ style:{ colors:'#94a3b8' } } },
                grid:{ borderColor:'#334155', strokeDashArray:4 },
                tooltip:{ theme:'dark' }
            };
            if(priceChart){ priceChart.destroy(); }
            priceChart = new ApexCharts(document.querySelector('#priceChart'), priceOptions);
            priceChart.render();
            if(volumeChart){ volumeChart.destroy(); }
            volumeChart = new ApexCharts(document.querySelector('#volumeChart'), volOptions);
            volumeChart.render();
            document.getElementById('chartTitle').textContent = `${getName(currentPair)} K线图`;
        }
        function renderIndicatorsAndSignals(){
            if(!currentPair || !pairs[currentPair] || pairs[currentPair].length===0) return;
            const all = pairs[currentPair];
            const data = getRangedData(all);
            const closes = data.map(d=>d.c);
            const ma7 = SMA(closes, 7);
            const ma25 = SMA(closes, 25);
            const rsi = RSI(closes, 14);
            const { macd, signal, hist } = MACD(closes);
            document.getElementById('ma7').textContent = ma7 ? ('$'+fmtNum(ma7,2)) : '-';
            document.getElementById('ma25').textContent = ma25 ? ('$'+fmtNum(ma25,2)) : '-';
            document.getElementById('rsi').textContent = rsi ? fmtNum(rsi,1) : '-';
            document.getElementById('macd').textContent = macd!==null ? (macd>=0? '+'+fmtNum(macd,2):fmtNum(macd,2)) : '-';
            const signalsBox = document.getElementById('signals');
            signalsBox.innerHTML = '';
            const recent = all.slice(-30);
            const rc = recent.map(d=>d.c);
            const evts = [];
            if(rc.length>=26){
                const ma7_seq = rc.map((_,i)=> i<6? null : SMA(rc.slice(0,i+1),7));
                const ma25_seq = rc.map((_,i)=> i<24? null : SMA(rc.slice(0,i+1),25));
                for(let i=1;i<rc.length;i++){
                    const a1=ma7_seq[i-1], b1=ma25_seq[i-1];
                    const a2=ma7_seq[i],   b2=ma25_seq[i];
                    if(a1!==null && b1!==null && a2!==null && b2!==null){
                        if(a1<=b1 && a2>b2) evts.push({type:'buy', title:'MA金叉', desc:'短期均线上穿长期均线，趋势转强'});
                        if(a1>=b1 && a2<b2) evts.push({type:'sell', title:'MA死叉', desc:'短期均线下穿长期均线，趋势转弱'});
                    }
                }
            }
            if(rsi!==null){
                if(rsi<30) evts.push({type:'buy', title:'RSI超卖', desc:'RSI<30，可能出现反弹'});
                if(rsi>70) evts.push({type:'sell', title:'RSI超买', desc:'RSI>70，注意回调风险'});
            }
            if(rc.length>=26){
                const macdSeq = [];
                for(let i=0;i<rc.length;i++){
                    const partial = rc.slice(0,i+1);
                    const m = MACD(partial);
                    macdSeq.push(m);
                }
                for(let i=1;i<macdSeq.length;i++){
                    const p1=macdSeq[i-1], p2=macdSeq[i];
                    if(p1.macd!==null && p1.signal!==null && p2.macd!==null && p2.signal!==null){
                        if(p1.macd<=p1.signal && p2.macd>p2.signal) evts.push({type:'buy', title:'MACD金叉', desc:'MACD线上穿信号线'});
                        if(p1.macd>=p1.signal && p2.macd<p2.signal) evts.push({type:'sell', title:'MACD死叉', desc:'MACD线下穿信号线'});
                    }
                }
            }
            evts.slice(-3).reverse().forEach(e=>{
                const node = document.createElement('div');
                node.className = `signal ${e.type}`;
                node.innerHTML = `
                    <div class="icon" style="color: var(--${e.type==='buy'?'success':e.type==='sell'?'danger':'warning'}-color); font-size:1.25rem;"><i class="fas ${e.type==='buy'?'fa-arrow-trend-up':e.type==='sell'?'fa-arrow-trend-down':'fa-minus'}"></i></div>
                    <div class="content">
                        <div class="title">${e.title}</div>
                        <div class="desc">${e.desc}</div>
                    </div>
                `;
                signalsBox.appendChild(node);
            });
            renderActivities(evts);
        }
        function renderActivities(evts){
            const box = document.getElementById('activityFeed');
            box.innerHTML = '';
            const lastBar = last(pairs[currentPair]||[]);
            const items = [];
            if(lastBar){
                const prev = pairs[currentPair].length>1 ? pairs[currentPair][pairs[currentPair].length-2] : lastBar;
                const chg = prev && prev.c ? ((lastBar.c - prev.c)/prev.c)*100 : 0;
                items.push({icon:'fa-arrow-up', color:'success', title:`${getSymbol(currentPair)} 收盘价`, sub:`$${fmtNum(lastBar.c,2)} · ${lastBar.date}`});
                items.push({icon: chg>=0?'fa-arrow-trend-up':'fa-arrow-trend-down', color: chg>=0?'success':'danger', title:'日变动', sub:`${chg>=0?'+':''}${fmtNum(chg,2)}%`});
                items.push({icon:'fa-chart-column', color:'primary', title:'成交量', sub:`$${fmtNum(lastBar.v/1e6,2)}M`});
            }
            const map = evts.slice(-2).reverse().map(e=>({
                icon: e.type==='buy'?'fa-circle-up':'fa-circle-down',
                color: e.type==='buy'?'success':'danger',
                title: e.title, sub: e.desc
            }));
            [...items, ...map].forEach(a=>{
                const row = document.createElement('div');
                row.className = 'activity-item';
                row.style = 'display:flex;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--border-color);';
                row.innerHTML = `
                    <div class="activity-icon" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(102,126,234,0.2);color:var(--${a.color}-color);">
                        <i class="fas ${a.icon}"></i>
                    </div>
                    <div class="activity-content" style="flex:1;">
                        <div class="activity-title" style="font-size:.95rem;margin-bottom:.15rem;">${a.title}</div>
                        <div class="activity-subtitle" style="font-size:.82rem;color:var(--text-secondary);">${a.sub}</div>
                    </div>
                `;
                box.appendChild(row);
            });
        }
        function wireTimeButtons(){
            const wrap = document.getElementById('timeButtons');
            wrap.querySelectorAll('button').forEach(btn=>{
                btn.onclick = ()=>{
                    wrap.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
                    btn.classList.add('active');
                    const r = btn.getAttribute('data-range');
                    rangeDays = (r==='all') ? 'all' : parseInt(r,10);
                    refreshAll();
                };
            });
        }
        function refreshAll(){
            renderMarketOverview();
            renderCharts();
            renderIndicatorsAndSignals();
        }
        async function reloadData(){
            try{
                await loadFromGitHub();
                renderPairSelect();
                refreshAll();
            }catch(_){}
        }
        document.addEventListener('DOMContentLoaded', async ()=>{
            wireTimeButtons();
            try{
                await loadFromGitHub();
                renderPairSelect();
                refreshAll();
            }catch(_){}
        });
    </script>
