<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoVision Pro - 实时加密货币交易分析系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background:
                linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.85)),
                url('images/1b2f1ee2a9dba66e20cd0e210ba09e28.png') no-repeat center center fixed;
            background-size: cover;
            background-blend-mode: overlay;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Header Styles */
        header {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-item {
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s;
            position: relative;
        }
        .nav-item:hover {
            color: var(--text-primary);
        }
        .nav-item.active {
            color: var(--primary-color);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -1.5rem;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-color);
        }
        /* Connection Status */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: var(--dark-bg);
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success-color);
            animation: pulse 2s infinite;
        }
        .status-dot.disconnected {
            background: var(--danger-color);
            animation: none;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        /* Market Overview Section */
        .market-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .market-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .market-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }
        .market-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .coin-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .coin-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .coin-price {
            font-size: 1.75rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .price-change {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .price-change.positive {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }
        .price-change.negative {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
        }
        /* Trading Section */
        .trading-section {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .order-panel, .chart-container, .info-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }
        .panel-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .tab-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--dark-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--dark-bg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .input-addon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .btn-primary {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-buy {
            background: var(--success-color);
            color: white;
        }
        .btn-buy:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-sell {
            background: var(--danger-color);
            color: white;
        }
        .btn-sell:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }
        /* Chart Controls */
        .chart-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .time-selector {
            display: flex;
            gap: 0.25rem;
        }
        .time-btn {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-color);
            background: var(--dark-bg);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.875rem;
        }
        .time-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .time-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        /* Order Book */
        .order-book {
            margin-bottom: 1.5rem;
        }
        .book-table {
            width: 100%;
        }
        .book-table th {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-align: right;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .book-table td {
            padding: 0.25rem 0;
            text-align: right;
            font-size: 0.875rem;
        }
        .book-row {
            position: relative;
            transition: background 0.3s;
        }
        .book-row:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        .sell-orders {
            color: var(--danger-color);
        }
        .buy-orders {
            color: var(--success-color);
        }
        /* Technical Indicators */
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        .indicator-item {
            padding: 0.75rem;
            background: var(--dark-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .indicator-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }
        .indicator-value {
            font-size: 1rem;
            font-weight: 600;
        }
        /* Trading Signals */
        .signals-container {
            margin-top: 1.5rem;
        }
        .signal-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--dark-bg);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border-left: 3px solid;
            transition: transform 0.3s;
        }
        .signal-item:hover {
            transform: translateX(5px);
        }
        .signal-buy {
            border-color: var(--success-color);
        }
        .signal-sell {
            border-color: var(--danger-color);
        }
        .signal-neutral {
            border-color: var(--warning-color);
        }
        .signal-icon {
            font-size: 1.5rem;
        }
        .signal-content {
            flex: 1;
        }
        .signal-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .signal-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .signal-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        /* Activity Feed */
        .activity-feed {
            max-height: 400px;
            overflow-y: auto;
        }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        .activity-item:hover {
            background: var(--dark-bg);
        }
        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }
        .activity-content {
            flex: 1;
        }
        .activity-title {
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }
        .activity-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        /* Loading Animation */
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Responsive Design */
        @media (max-width: 1200px) {
            .trading-section {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .market-overview {
                grid-template-columns: 1fr;
            }
            .nav-menu {
                display: none;
            }
            .indicators-grid {
                grid-template-columns: 1fr;
            }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
        /* Tooltip */
        .tooltip {
            position: relative;
            cursor: help;
        }
        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark-bg);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            border: 1px solid var(--border-color);
            z-index: 1000;
        }
        .tooltip:hover::after {
            opacity: 1;
        }
        /* Footer Styles */
        .social-footer {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 2rem 0;
            margin-top: 3rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            text-align: center;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--dark-bg);
            color: var(--text-secondary);
            transition: all 0.3s;
        }
        .social-link:hover {
            color: var(--primary-color);
            transform: translateY(-3px);
        }
        .copyright {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1001;
            border-left: 4px solid var(--primary-color);
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.success {
            border-left-color: var(--success-color);
        }
        .toast.error {
            border-left-color: var(--danger-color);
        }
        .toast.warning {
            border-left-color: var(--warning-color);
        }
        .data-source-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <a class="reading-return" href="index.html" aria-label="返回首页">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                    <span>退回到"狂客·银河"</span>
                </a>
                CryptoVision Pro
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" onclick="switchNav('market')">市场</div>
                <div class="nav-item" onclick="switchNav('trading')">交易</div>
                <div class="nav-item" onclick="switchNav('futures')">合约</div>
                <div class="nav-item" onclick="switchNav('finance')">理财</div>
                <div class="nav-item" onclick="switchNav('api')">API</div>
                <div class="nav-item tooltip" data-tooltip="通知中心" onclick="showNotifications()">
                    <i class="fas fa-bell"></i>
                </div>
                <div class="nav-item tooltip" data-tooltip="用户中心" onclick="showUserCenter()">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="connection-status">
                    <div class="status-dot" id="connectionStatus"></div>
                    <span id="connectionText">连接中...</span>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Market Overview -->
        <section class="market-overview" id="marketOverview">
            <!-- Market cards will be dynamically generated -->
        </section>

        <!-- Trading Section -->
        <section class="trading-section">
            <!-- Order Panel -->
            <div class="order-panel">
                <h3 class="panel-title">
                    <i class="fas fa-exchange-alt"></i>
                    交易面板
                </h3>
                
                <div class="tab-buttons">
                    <button class="tab-btn" id="buyTab" onclick="switchTab('buy')">买入</button>
                    <button class="tab-btn active" id="sellTab" onclick="switchTab('sell')">卖出</button>
                </div>
                
                <div class="input-group">
                    <label>交易对</label>
                    <select id="tradingPair" onchange="changeTradingPair()">
                        <option value="bitcoin">BTC/USDT</option>
                        <option value="ethereum">ETH/USDT</option>
                        <option value="binancecoin">BNB/USDT</option>
                        <option value="solana">SOL/USDT</option>
                        <option value="cardano">ADA/USDT</option>
                        <option value="ripple">XRP/USDT</option>
                        <option value="dogecoin">DOGE/USDT</option>
                        <option value="polkadot">DOT/USDT</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>订单类型</label>
                    <select id="orderType" onchange="togglePriceInput()">
                        <option value="limit">限价单</option>
                        <option value="market">市价单</option>
                    </select>
                </div>
                
                <div class="input-group" id="priceInputGroup">
                    <label>价格 (USDT)</label>
                    <div class="input-wrapper">
                        <input type="number" id="price" step="0.01" oninput="calculateTotal()">
                        <span class="input-addon">USDT</span>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>数量</label>
                    <div class="input-wrapper">
                        <input type="number" id="amount" value="0.001" step="0.0001" oninput="calculateTotal()">
                        <span class="input-addon" id="amountUnit">BTC</span>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>总额 (USDT)</label>
                    <div class="input-wrapper">
                        <input type="number" id="total" readonly>
                        <span class="input-addon">USDT</span>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1rem;">
                    <button class="time-btn" onclick="setPercentage(25)">25%</button>
                    <button class="time-btn" onclick="setPercentage(50)">50%</button>
                    <button class="time-btn" onclick="setPercentage(75)">75%</button>
                    <button class="time-btn" onclick="setPercentage(100)">100%</button>
                </div>
                
                <button class="btn-primary btn-sell" id="tradeBtn" onclick="executeTrade()">
                    卖出 BTC
                </button>
                
                <div style="margin-top: 1.5rem; padding: 1rem; background: var(--dark-bg); border-radius: 8px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color: var(--text-secondary);">可用余额</span>
                        <span id="availableBalance">加载中...</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color: var(--text-secondary);">冻结资产</span>
                        <span id="frozenBalance">0.0000</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--text-secondary);">总资产</span>
                        <span id="totalBalance">加载中...</span>
                    </div>
                </div>
            </div>

            <!-- Chart Container -->
            <div class="chart-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 class="panel-title" style="margin: 0;">
                        <i class="fas fa-chart-candlestick"></i>
                        <span id="chartTitle">BTC/USDT</span> K线图
                    </h3>
                    <div class="chart-controls">
                        <div class="time-selector">
                            <button class="time-btn" onclick="changeTimeframe('1m')">1分</button>
                            <button class="time-btn" onclick="changeTimeframe('5m')">5分</button>
                            <button class="time-btn" onclick="changeTimeframe('15m')">15分</button>
                            <button class="time-btn" onclick="changeTimeframe('1h')">1小时</button>
                            <button class="time-btn active" onclick="changeTimeframe('1d')">1天</button>
                            <button class="time-btn" onclick="changeTimeframe('1w')">1周</button>
                        </div>
                    </div>
                </div>
                <div id="priceChart" style="height: 400px;"></div>
                
                <!-- Technical Indicators -->
                <div class="indicators-grid">
                    <div class="indicator-item">
                        <div class="indicator-label">MA(7)</div>
                        <div class="indicator-value" style="color: var(--primary-color);" id="ma7">加载中...</div>
                    </div>
                    <div class="indicator-item">
                        <div class="indicator-label">MA(25)</div>
                        <div class="indicator-value" style="color: var(--warning-color);" id="ma25">加载中...</div>
                    </div>
                    <div class="indicator-item">
                        <div class="indicator-label">RSI(14)</div>
                        <div class="indicator-value" style="color: var(--success-color);" id="rsi">加载中...</div>
                    </div>
                    <div class="indicator-item">
                        <div class="indicator-label">MACD</div>
                        <div class="indicator-value" style="color: var(--primary-color);" id="macd">加载中...</div>
                    </div>
                </div>
            </div>

            <!-- Info Panel -->
            <div class="info-panel">
                <!-- Order Book -->
                <div class="order-book">

            const sellOrders = [];
            const buyOrders = [];
            
            // 生成卖单

                const price = currentPrice + (i * currentPrice * 0.001);
                const amount = Math.random() * 2 + 0.1;
                sellOrders.push({
                    price: price.toFixed(2),
                    amount: amount.toFixed(4),
                    total: (price * amount).toFixed(2)
                });
            }
            
            // 生成买单
            for (let i = 1; i <= 5; i++) {
                const price = currentPrice - (i * currentPrice * 0.001);
                const amount = Math.random() * 2 + 0.1;
                buyOrders.push({
                    price: price.toFixed(2),
                    amount: amount.toFixed(4),
                    total: (price * amount).toFixed(2)

            // 渲染卖单

        // 更新技术指标
        function updateTechnicalIndicators() {
            if (!realTimeData[currentTradingPair]) return;
            
            const prices = realTimeData[currentTradingPair].prices.map(p => p[1]);
            const currentPrice = prices[prices.length - 1];
            
            // 计算MA(7)
            const ma7 = calculateMA(prices, 7);
            document.getElementById('ma7').textContent = `$${ma7.toFixed(2)}`;
            
            // 计算MA(25)
            const ma25 = calculateMA(prices, 25);
            document.getElementById('ma25').textContent = `$${ma25.toFixed(2)}`;
            
            // 计算RSI(14)
            const rsi = calculateRSI(prices, 14);
            document.getElementById('rsi').textContent = rsi.toFixed(1);
            
            // 计算MACD
            const macd = calculateMACD(prices);
            document.getElementById('macd').textContent = macd >= 0 ? `+${macd.toFixed(2)}` : macd.toFixed(2);
        }
        
        // 计算移动平均线
        function calculateMA(prices, period) {
            if (prices.length < period) return 0;
            const sum = prices.slice(-period).reduce((a, b) => a + b, 0);
            return sum / period;
        }
        
        // 计算RSI
        function calculateRSI(prices, period) {
            if (prices.length < period + 1) return 50;
            
            let gains = 0;
            let losses = 0;
            
            for (let i = prices.length - period; i < prices.length; i++) {
                const change = prices[i] - prices[i - 1];
                if (change > 0) {
                    gains += change;
                } else {
                    losses -= change;
                }
            }
            
            const avgGain = gains / period;
            const avgLoss = losses / period;
            const rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }
        
        // 计算MACD
        function calculateMACD(prices) {
            if (prices.length < 26) return 0;
            
            const ema12 = calculateEMA(prices, 12);
            const ema26 = calculateEMA(prices, 26);
            return ema12 - ema26;
        }
        
        // 计算EMA
        function calculateEMA(prices, period) {
            if (prices.length < period) return prices[prices.length - 1];
            
            const multiplier = 2 / (period + 1);
            let ema = prices[0];
            
            for (let i = 1; i < prices.length; i++) {
                ema = (prices[i] - ema) * multiplier + ema;
            }
            
            return ema;
        }

            }
        }
        
        // 切换交易标签
        function switchTab(tab) {
            const buyTab = document.getElementById('buyTab');
            const sellTab = document.getElementById('sellTab');
            const tradeBtn = document.getElementById('tradeBtn');
            
            currentTradeType = tab;
            
            if (tab === 'buy') {
                buyTab.classList.add('active');
                sellTab.classList.remove('active');
                tradeBtn.textContent = `买入 ${currentTradingPairSymbol}`;
                tradeBtn.className = 'btn-primary btn-buy';
            } else {
                sellTab.classList.add('active');
                buyTab.classList.remove('active');
                tradeBtn.textContent = `卖出 ${currentTradingPairSymbol}`;
                tradeBtn.className = 'btn-primary btn-sell';
            }
        }
        
        // 切换价格输入
        function togglePriceInput() {
            const orderType = document.getElementById('orderType').value;
            const priceInputGroup = document.getElementById('priceInputGroup');
            
            if (orderType === 'market') {
                priceInputGroup.style.display = 'none';
                document.getElementById('price').value = '市价';
            } else {
                priceInputGroup.style.display = 'block';
                const coinData = cryptoData[currentTradingPair];
                if (coinData) {
                    document.getElementById('price').value = coinData.price.toFixed(2);
                }
            }
            
            calculateTotal();
        }
        
        // 切换交易对
        async function changeTradingPair() {
            const select = document.getElementById('tradingPair');
            currentTradingPair = select.value;
            
            try {
                await loadTradingPairData(currentTradingPair);
                showToast(`已切换到 ${CRYPTO_CONFIG[currentTradingPair].symbol}/USDT`, 'success');
            } catch (error) {
                console.error('切换交易对失败:', error);
                showToast('切换交易对失败', 'error');
            }
        }
        
        // 计算总额
        function calculateTotal() {
            const orderType = document.getElementById('orderType').value;
            
            if (orderType === 'market') {
                document.getElementById('total').value = '市价';
                return;
            }
            
            const price = parseFloat(document.getElementById('price').value) || 0;
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            document.getElementById('total').value = (price * amount).toFixed(2);
        }
        
        // 设置百分比
        function setPercentage(percent) {
            const balance = parseFloat(document.getElementById('availableBalance').textContent) || 0;
            const amount = (balance * percent / 100).toFixed(4);
            document.getElementById('amount').value = amount;
            calculateTotal();
        }
        
        // 切换时间框架
        function changeTimeframe(timeframe) {
            currentTimeframe = timeframe;
            
            const buttons = document.querySelectorAll('.time-selector .time-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 重新加载图表数据
            loadTradingPairData(currentTradingPair);
        }
        
        // 执行交易
        function executeTrade() {
            const orderType = document.getElementById('orderType').value;
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const balance = parseFloat(document.getElementById('availableBalance').textContent) || 0;
            
            if (amount <= 0) {
                showToast('请输入有效的交易数量', 'error');
                return;
            }
            
            if (currentTradeType === 'sell' && amount > balance) {
                showToast('余额不足', 'error');
                return;
            }
            
            // 模拟交易执行
            const price = orderType === 'market' ? 
                cryptoData[currentTradingPair].price : 
                parseFloat(document.getElementById('price').value);
            
            const total = price * amount;
            
            // 更新余额
            const newBalance = currentTradeType === 'sell' ? balance - amount : balance + amount;
            document.getElementById('availableBalance').textContent = `${newBalance.toFixed(4)} ${currentTradingPairSymbol}`;
            document.getElementById('totalBalance').textContent = `${newBalance.toFixed(4)} ${currentTradingPairSymbol}`;
            
            // 显示成功消息
            showToast(`${currentTradeType === 'buy' ? '买入' : '卖出'}订单已提交: ${amount} ${currentTradingPairSymbol} @ $${price.toFixed(2)}`, 'success');
            
            // 重置表单
            document.getElementById('amount').value = '0.001';
            calculateTotal();
            
            // 添加到活动动态
            addActivityToFeed(currentTradeType, amount, price);
        }
        
        // 添加活动到动态
        function addActivityToFeed(type, amount, price) {
            const container = document.getElementById('activityFeed');
            const newActivity = document.createElement('div');
            newActivity.className = 'activity-item';
            newActivity.innerHTML = `
                <div class="activity-icon" style="background: rgba(102, 126, 234, 0.2); color: var(--${type === 'buy' ? 'success' : 'danger'}-color);">
                    <i class="fas fa-arrow-${type === 'buy' ? 'up' : 'down'}"></i>
                </div>
                <div class="activity-content">
                    <div class="activity-title">${type === 'buy' ? '买入' : '卖出'} ${currentTradingPairSymbol}</div>
                    <div class="activity-subtitle">${amount} ${currentTradingPairSymbol} @ $${price.toFixed(2)} · 刚刚</div>
                </div>
            `;
            
            container.insertBefore(newActivity, container.firstChild);
            
            // 保持最多5条记录
            while (container.children.length > 5) {
                container.removeChild(container.lastChild);
            }
        }
        
        // 切换导航
        function switchNav(section) {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            
            showToast(`切换到${section === 'market' ? '市场' : section === 'trading' ? '交易' : section === 'futures' ? '合约' : section === 'finance' ? '理财' : 'API'}页面`, 'success');
        }
        
        // 显示通知
        function showNotifications() {
            showToast('您有新的市场动态', 'success');
        }
        
        // 显示用户中心
        function showUserCenter() {
            showToast('用户中心功能开发中', 'warning');
        }
        
        // 更新连接状态
        function updateConnectionStatus(status, text) {
            const statusDot = document.getElementById('connectionStatus');
            const statusText = document.getElementById('connectionText');
            
            statusDot.className = 'status-dot';
            if (status === 'disconnected') {
                statusDot.classList.add('disconnected');
            }
            
            statusText.textContent = text;
        }
        
        // 显示Toast通知
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMessage.textContent = message;
            
            toast.className = 'toast';
            if (type === 'success') {
                toast.classList.add('success');
                toastIcon.className = 'fas fa-check-circle';
            } else if (type === 'error') {
                toast.classList.add('error');
                toastIcon.className = 'fas fa-exclamation-circle';
            } else if (type === 'warning') {
                toast.classList.add('warning');
                toastIcon.className = 'fas fa-exclamation-triangle';
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            updateIntervals.forEach(interval => clearInterval(interval));
        });
    </script>
</body>
</html>
